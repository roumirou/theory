  MATCH('Match each process state with its meaning.', [['New', 'The process is being created'], ['Running', 'Instructions are being executed'], ['Waiting', 'Waiting for some event to occur'], ['Ready', 'Waiting to be assigned to a processor'], ['Terminated', 'The process has finished execution']]),
  MATCH('Match each part of a process in memory with what it holds.', [['Text section', 'The program code'], ['Stack', 'Function parameters, return addresses, local variables'], ['Data section', 'Global variables'], ['Heap', 'Memory dynamically allocated during run time'], ['Program counter + registers', 'Current activity']]),
  MATCH('Match each scheduler with its job.', [['Short-term scheduler', 'Selects the next process to run and allocates the CPU'], ['Long-term scheduler', 'Selects which processes are brought into the ready queue'], ['Medium-term scheduler', 'Swaps processes out to disk and back in']]),
  MATCH('Match each system call with what it does.', [['fork()', 'Creates a new process'], ['exec()', 'Replaces the memory space with a new program'], ['exit()', 'The process asks the OS to delete it'], ['wait()', 'Parent waits for a child to terminate'], ['abort()', 'Parent terminates a child']]),
  ORD('Put the life of a typical process that does one I/O in order.', ['new: the process is being created', 'admitted to ready', 'dispatched: running', 'asks for I/O: waiting', 'I/O completes: back to ready', 'dispatched again: running', 'exit: terminated']),
  ORD('Put the steps of a Remote Procedure Call in order.', ['The client calls the procedure as if it were local', 'The client-side stub locates the server and marshals the parameters', 'The message is sent to the server (port)', 'The server-side stub unpacks the marshalled parameters', 'The procedure is performed on the server']),

  NUM('A program calls <code>fork()</code> <b>three times</b> in a row (no if-statements). How many processes exist in total, including the original?', 8, 'Each fork() doubles the number of processes: 1 → 2 → 4 → 8. In general <b>2ⁿ</b> processes for n forks.'),
  NUM('A program calls <code>fork()</code> <b>four times</b> in a row. How many <b>new</b> (child) processes are created?', 15, 'Total = 2⁴ = 16 processes; new ones = 16 − 1 = <b>15</b> (2ⁿ − 1).'),
  NUM('<pre class="mono pre">fork();\nfork();\nprintf("hello\\n");</pre>How many times is "hello" printed?', 4, '2 forks → 2² = 4 processes, and each prints once.'),

  DEF('process', 'A <b>program in execution</b>. It is an <b>active</b> entity in memory, with its text section (code), current activity (program counter, registers), stack, data section and heap.', ['Program in execution', 'Active entity in memory', 'Parts: text, PC/registers, stack, data, heap']),
  DEF('Process Control Block (PCB)', 'The structure where the OS stores <b>all information associated with each process</b>: process state, program counter, CPU registers, CPU-scheduling information, memory-management information, accounting information, I/O status information.', ['Stores information about each process', 'At least 4 fields (state, PC, registers, scheduling, memory, accounting, I/O)']),
  DEF('context switch', 'When the CPU switches to another process, the system <b>saves the state of the old process</b> and <b>loads the saved state of the new process</b>. The context is in the PCB. It is <b>overhead</b>: no useful work is done while switching.', ['Save old process state', 'Load new process state (from PCB)', 'Overhead']),
  DEF('zombie process', 'A process that has <b>terminated</b> but whose parent has <b>not (yet) invoked wait()</b>.', ['Terminated', 'Parent did not call wait()']),
  DEF('orphan process', 'A process whose <b>parent terminated without invoking wait()</b>.', ['Parent terminated', 'Without calling wait()']),
  DEF('socket', 'An <b>endpoint for communication</b>: the concatenation of an <b>IP address and a port number</b>, e.g. 161.25.19.8:1625. Communication is between a pair of sockets.', ['Endpoint for communication', 'IP address + port', 'Example or pair of sockets']),
  DEF('Remote Procedure Call (RPC)', 'Abstracts <b>procedure calls between processes on networked systems</b>. Uses ports for service differentiation. A client <b>stub</b> locates the server and <b>marshals</b> the parameters; the server stub unpacks them and performs the procedure.', ['Procedure call across a network', 'Client stub marshals parameters', 'Server stub unpacks and runs the procedure']),
  DEF('pipe', 'A <b>conduit allowing two processes to communicate</b>. Ordinary pipes are unidirectional and need a parent-child relationship; named pipes are bidirectional and need no relationship.', ['Conduit between two processes', 'Ordinary vs named']),
  DEF('degree of multiprogramming', 'The <b>number of processes in memory</b>. It is controlled by the <b>long-term scheduler</b>; the medium-term scheduler can decrease it by swapping.', ['Number of processes in memory', 'Controlled by long-term scheduler']),
  W('List', 'List the <b>five process states</b>.', 'New, running, waiting, ready, terminated.', ['New', 'Running', 'Waiting', 'Ready', 'Terminated']),
  W('List', 'List the contents of the <b>PCB</b>.', 'Process state; program counter; CPU registers; CPU-scheduling information (priorities, queue pointers); memory-management information; accounting information; I/O status information.', ['Process state + program counter', 'CPU registers', 'CPU-scheduling info', 'Memory-management info', 'Accounting + I/O status info']),
  W('List', 'List the <b>three scheduling queues</b>.', '<b>Job queue</b>: all processes in the system. <b>Ready queue</b>: processes in main memory, ready and waiting to execute. <b>Device queues</b>: processes waiting for an I/O device.', ['Job queue', 'Ready queue', 'Device queues']),
  W('List', 'Give the <b>reasons</b> a parent may terminate a child (abort()).', 'The child has <b>exceeded its allocated resources</b>; the <b>task</b> assigned to the child is <b>no longer required</b>; the <b>parent is exiting</b> and the OS does not allow a child to continue if its parent terminates.', ['Exceeded resources', 'Task no longer required', 'Parent exiting']),
  W('List', 'List the <b>reasons for cooperating processes</b>.', 'Information sharing, computation speedup, modularity.', ['Information sharing', 'Computation speedup', 'Modularity']),
  W('List', 'List the <b>three types of processes</b> in Google Chrome.', '<b>Browser</b> process (UI, disk and network I/O); <b>Renderer</b> process (renders pages, HTML, JavaScript; one per website; sandboxed); <b>Plug-in</b> process (one per plug-in type).', ['Browser', 'Renderer', 'Plug-in']),
  W('List', 'What are the <b>resource-sharing</b> options and the <b>execution</b> options when a parent creates a child?', 'Resource sharing: parent and children share <b>all</b> resources; children share a <b>subset</b>; they share <b>no</b> resources.<br>Execution: parent and children execute <b>concurrently</b>; or parent <b>waits</b> until the children terminate.', ['Share all / subset / none', 'Concurrently / parent waits']),
  W('Explain', 'Explain what happens in UNIX with <b>fork()</b> and <b>exec()</b>.', 'fork() creates a <b>new process</b> that is a <b>duplicate</b> of the parent (same program and data). exec() is used after fork() to <b>replace the process\'s memory space with a new program</b>. The parent can call wait() to wait for the child.', ['fork creates a duplicate child', 'exec replaces memory with a new program', 'Parent may wait()']),
  W('Explain', 'What issues must be considered when designing pipes?', 'Is communication <b>unidirectional or bidirectional</b>? For two-way, is it <b>half or full duplex</b>? Must there be a <b>relationship (parent-child)</b>? Can pipes be used <b>over a network</b>?', ['Uni- or bidirectional', 'Half or full duplex', 'Parent-child relationship needed?', 'Over a network?']),
  W('Explain', 'Draw (or describe) the <b>process state diagram</b> with its transitions.', 'new → <b>admitted</b> → ready → <b>scheduler dispatch</b> → running.<br>running → <b>interrupt</b> → ready.<br>running → <b>I/O or event wait</b> → waiting → <b>I/O or event completion</b> → ready.<br>running → <b>exit</b> → terminated.', ['new → ready (admitted)', 'ready → running (dispatch)', 'running → ready (interrupt)', 'running → waiting → ready (I/O)', 'running → terminated (exit)']),

  DIFF('program', 'process', [['Nature', '<b>Passive</b> entity', '<b>Active</b> entity'], ['Where', 'Stored on disk (executable file)', 'Executing in memory'], ['Becomes', 'Becomes a process when loaded into memory', '—'], ['Count', 'One program …', '… can be several processes']]),

  DIFF('I/O-bound process', 'CPU-bound process', [['Spends more time', 'Doing I/O', 'Doing computations'], ['CPU bursts', 'Many short bursts', 'Few very long bursts']]),
  DIFF('shared memory', 'message passing', [['How', 'Processes share an area of memory', 'send(message) / receive(message)'], ['Control', 'User processes, not the OS', 'The OS (messages moved by the OS)'], ['Main issue', 'Synchronizing access to the shared memory', 'Establishing a communication link'], ['Shared variables', 'Yes', 'No']]),
  DIFF('ordinary pipes', 'named pipes', [['Direction', 'Unidirectional', 'Bidirectional'], ['Relationship', 'Parent-child required', 'No relationship needed'], ['Access', 'Not from outside the creating process', 'Several processes can use it'], ['Power', 'Simpler', 'More powerful']]),

  DIFF('independent process', 'cooperating process', [['Effect', 'Cannot affect or be affected by other processes', 'Can affect or be affected'], ['Needs IPC', 'No', 'Yes']]),
  DIFF('TCP (connection-oriented) sockets', 'UDP (connectionless) sockets', [['Connection', 'Connection is established first', 'No connection'], ['Type', 'Connection-oriented', 'Connectionless'], ['Multicast', '—', 'Multicast socket class can send to many recipients']])
]};

LECT.l4 = { ln: 'L4', title: 'Week 4', name: 'Threads and Concurrency', covers: 'multicore programming challenges, data vs task parallelism, concurrency vs parallelism, what a thread is, benefits, user vs kernel threads, many-to-one / one-to-one / many-to-many, thread libraries, Pthreads, joining, cancellation',
items: [
  M('A thread is also called a ___.', ['Heavyweight process', 'Lightweight process', 'Zombie', 'Kernel'], 1),
  M('A thread is the fundamental unit of ___.', ['Memory allocation', 'CPU utilization', 'File storage', 'I/O'], 1),
  M('Which one does a thread NOT share with other threads of the same process?', ['Code section', 'Data section', 'Open files', 'Stack'], 3),
  M('A thread comprises a thread ID, a program counter, a register set and a ___.', ['Heap', 'Stack', 'Data section', 'File table'], 1),
  M('Which is cheaper?', ['Process creation', 'Thread creation', 'Both are the same', 'Neither'], 1),
  M('Distributing subsets of the same data across cores, with the same operation on each, is ___.', ['Task parallelism', 'Data parallelism', 'Concurrency', 'Multiprogramming'], 1),
  M('Distributing tasks across cores, each core performing a unique operation, is ___.', ['Data parallelism', 'Task parallelism', 'Time sharing', 'Swapping'], 1),
  M('Supporting more than one task making progress on a single core is ___.', ['Parallelism', 'Concurrency', 'Clustering', 'Multicore'], 1),
  M('Performing more than one task simultaneously requires ___.', ['A single core', 'Multiple cores (parallelism)', 'A pipe', 'A semaphore'], 1),
  M('Which is NOT a challenge of multicore programming?', ['Dividing activities', 'Balance', 'Data splitting', 'Booting'], 3),
  M('"Continued execution of a program if part of it is blocked" is the ___ benefit of threads.', ['Responsiveness', 'Resource sharing', 'Economy', 'Scalability'], 0),
  M('"Threads may run in parallel on different processors" is the ___ benefit.', ['Economy', 'Scalability', 'Responsiveness', 'Protection'], 1),
  M('"Thread creation is cheaper than process creation" is the ___ benefit.', ['Economy', 'Scalability', 'Resource sharing', 'Responsiveness'], 0),
  M('User threads are managed by ___.', ['The kernel', 'A user-level threads library', 'The bootstrap', 'The hardware'], 1),
  M('Which is NOT one of the three primary thread libraries?', ['POSIX Pthreads', 'Windows threads', 'Java threads', 'Dalvik threads'], 3),
  M('In the many-to-one model, ___.', ['One thread blocking causes all to block', 'Each user thread has its own kernel thread', 'There is no kernel thread', 'Threads always run in parallel'], 0),
  M('Solaris Green Threads and GNU Portable Threads use the ___ model.', ['One-to-one', 'Many-to-one', 'Many-to-many', 'Two-level'], 1),
  M('Windows and Linux use the ___ model.', ['Many-to-one', 'One-to-one', 'Many-to-many', 'One-to-many'], 1),
  M('In the one-to-one model, creating a user-level thread ___.', ['Creates nothing in the kernel', 'Creates a kernel thread', 'Creates a process', 'Blocks all threads'], 1),
  M('Which model allows the OS to create a sufficient number of kernel threads?', ['Many-to-one', 'One-to-one', 'Many-to-many', 'None'], 2),
  M('Windows with the ThreadFiber package uses the ___ model.', ['Many-to-many', 'One-to-one', 'Many-to-one', 'Layered'], 0),
  M('Pthreads is a ___ standard.', ['Windows', 'POSIX (IEEE 1003.1c)', 'Java', 'ISO C'], 1),
  M('To wait for several threads, Pthreads uses ___ inside a for loop.', ['pthread_create()', 'pthread_join()', 'pthread_cancel()', 'fork()'], 1),

  M('Oracle SPARC T4 has 8 cores and 8 hardware threads per core, so it has ___ hardware threads.', ['16', '64', '8', '32'], 1),
  M('In the many-to-one model, multiple threads may NOT run in parallel on a multicore system because ___.', ['They share a stack', 'Only one may be in the kernel at a time', 'They have no PC', 'Pthreads forbids it'], 1),

  T('A thread has its own program counter, registers and stack.', true),
  T('Threads of the same process share code, data and open files.', true),
  T('Process creation is lightweight while thread creation is heavyweight.', false, 'Process creation is <b>heavy-weight</b>; thread creation is <b>light-weight</b>.'),
  T('A traditional process has a single thread of control.', true),
  T('Kernels are generally single-threaded.', false, 'Kernels are generally <b>multithreaded</b>.'),
  T('Most modern applications are multithreaded.', true),

  T('A race condition exists when access to shared data is not controlled.', true),

  T('Mutual exclusion means that if Pi is in its critical section, no other process can be in its critical section.', true),

  C('A ___ condition exists when access to shared data is not controlled.', ['race']),
  C('Each process must ask permission to enter the critical section in the ___ section, then follows it with the ___ section.', [['entry'], ['exit']]),
  C('The three requirements of a solution to the critical-section problem are mutual exclusion, ___ and bounded ___.', [['progress'], ['waiting']]),
  C('Atomic means non-___.', ['interruptible']),
  C('A mutex lock that busy-waits is called a ___.', ['spinlock', 'spin lock']),
  C('A semaphore is accessed through two atomic operations: ___() and ___().', [['wait', 'P'], ['signal', 'V']]),
  C('A ___ semaphore can range only between 0 and 1.', ['binary']),
  C('Indefinite blocking is called ___.', ['starvation']),
  C('Priority inversion is solved via the priority-___ protocol.', ['inheritance']),

  MATCH('Match each term with its meaning.', [['Race condition', 'Uncontrolled access to shared data corrupts it'], ['Critical section', 'Code segment that changes shared data'], ['Deadlock', 'Processes wait forever for each other'], ['Starvation', 'A process is never removed from the semaphore queue'], ['Priority inversion', 'Low-priority process holds a lock a high-priority one needs'], ['Spinlock', 'Lock that uses busy waiting']]),
  MATCH('Match each critical-section requirement with its meaning.', [['Mutual exclusion', 'Only one process in its critical section at a time'], ['Progress', 'Choosing the next to enter cannot be postponed indefinitely'], ['Bounded waiting', 'A limit on how many times others enter before a requesting process']]),
  ORD('Put the general structure of process Pi in order.', ['entry section', 'critical section', 'exit section', 'remainder section']),

  NUM('Initially counter = 5. The producer does counter++ and the consumer does counter−− with this interleaving:<br>S0 producer: register1 = counter<br>S1 producer: register1 = register1 + 1<br>S2 consumer: register2 = counter<br>S3 consumer: register2 = register2 − 1<br>S4 producer: counter = register1<br>S5 consumer: counter = register2<br>What is the final value of counter?', 4, 'register1 = 6, register2 = 4. S4 writes 6, then S5 overwrites with <b>4</b>. The correct result is 5: this is a <b>race condition</b>.'),
  NUM('Same as the slide (counter = 5), but the last two steps are swapped: the consumer writes counter = register2 first, then the producer writes counter = register1. Final value of counter?', 6, 'Consumer writes 4, then producer overwrites with <b>6</b>. Wrong again (should be 5).'),
  NUM('Initially counter = 5. The producer finishes counter++ completely, then the consumer does counter−− completely. Final value?', 5, 'No interleaving inside the operations: 5 + 1 − 1 = <b>5</b>. That is why the code must be a critical section.'),
  NUM('A counting semaphore S is initialized to 3. Five processes call wait(S) one after another (nobody calls signal). How many processes are stuck busy-waiting?', 2, 'The first three wait() calls succeed (S: 3 → 2 → 1 → 0). The 4th and 5th find S ≤ 0 and busy-wait: <b>2</b> processes.'),
  NUM('A semaphore S = 2. The operations are, in order: wait, wait, signal, wait, signal, signal. What is the final value of S?', 2, 'wait (2→1), wait (1→0), signal (0→1), wait (1→0), signal (0→1), signal (1→2). Final value <b>2</b>. Shortcut: 2 − 3 waits + 3 signals = 2.'),

  DEF('race condition', 'A situation where <b>several processes access and manipulate shared data concurrently</b> and access is <b>not controlled</b>, so the result depends on the order of execution, possibly resulting in <b>corrupt data</b>.', ['Concurrent access to shared data', 'Not controlled', 'Result depends on order / corrupt data']),
  DEF('critical section', 'A <b>segment of code</b> in which a process may be <b>changing common variables</b>, updating a table, writing a file, etc. When one process is in its critical section, <b>no other may be in its critical section</b>.', ['Code that changes shared data', 'Only one process at a time']),
  DEF('critical-section problem', 'To <b>design a protocol</b> that processes use to cooperate: each process asks permission in the <b>entry section</b>, then the <b>critical section</b>, <b>exit section</b> and <b>remainder section</b>.', ['Design a protocol', 'Entry / critical / exit / remainder']),
  DEF('mutex lock', 'The simplest software tool for the critical-section problem: a process must <b>acquire()</b> the lock before entering the critical section and <b>release()</b> it when it exits. A <b>Boolean</b> variable shows if the lock is available. The calls must be <b>atomic</b>.', ['acquire() before, release() after', 'Boolean available', 'Atomic calls']),
  DEF('spinlock', 'A mutex lock that uses <b>busy waiting</b>: the process loops ("spins") while the lock is not available.', ['Mutex lock', 'Busy waiting']),
  DEF('semaphore', 'An <b>integer variable S</b> accessed only through two <b>atomic</b> operations, <b>wait()</b> (P) and <b>signal()</b> (V). A more sophisticated synchronization tool than mutex locks.', ['Integer variable', 'Only wait() and signal()', 'Atomic']),
  DEF('deadlock', '<b>Two or more processes are waiting indefinitely</b> for an event that can be caused <b>only by one of the waiting processes</b>.', ['Two or more processes wait forever', 'Event caused only by one of them']),

  DEF('atomic operation', 'An operation that is <b>non-interruptible</b>: it runs completely as one unit.', ['Non-interruptible']),
  W('List', 'List and explain the <b>three requirements</b> of a solution to the critical-section problem.', '1. <b>Mutual exclusion</b>: if Pi is in its critical section, no other process can be in its critical section.<br>2. <b>Progress</b>: if no process is in its critical section and some wish to enter, the selection of the next cannot be postponed indefinitely.<br>3. <b>Bounded waiting</b>: a bound exists on the number of times others enter after a process has requested and before it is granted.', ['Mutual exclusion + meaning', 'Progress + meaning', 'Bounded waiting + meaning']),
  W('Explain', 'Explain why <code>counter++</code> and <code>counter--</code> can produce a wrong result.', 'Each is <b>three machine instructions</b>: register = counter; register = register ± 1; counter = register. If the producer and consumer <b>interleave</b> these instructions, one update can <b>overwrite</b> the other. Example: counter = 5 can end at 4 or 6 instead of 5. This is a <b>race condition</b>.', ['Three instructions each', 'Interleaving', 'One update overwrites the other', 'Race condition (example 4 or 6)']),
  W('Write code', 'Write the definitions of <b>wait(S)</b> and <b>signal(S)</b>.', '<pre class="mono pre">wait(S) {\n  while (S <= 0)\n    ; // busy wait\n  S--;\n}\n\nsignal(S) {\n  S++;\n}</pre>', ['wait: loop while S ≤ 0', 'wait: then S--', 'signal: S++']),
  W('Write code', 'Write <b>acquire()</b> and <b>release()</b> of a mutex lock, and the structure that uses them.', '<pre class="mono pre">acquire() {\n  while (!available)\n    ; /* busy wait */\n  available = false;\n}\nrelease() {\n  available = true;\n}\ndo {\n  acquire lock\n    critical section\n  release lock\n    remainder section\n} while (true);</pre>', ['acquire: busy wait while not available, then false', 'release: available = true', 'Structure: acquire, CS, release, remainder']),
  W('Write code', 'P1 has statement S1 and P2 has statement S2. Use a semaphore so that <b>S2 runs only after S1</b>.', 'Semaphore <b>synch = 0</b>.<br>P1: <code>S1; signal(synch);</code><br>P2: <code>wait(synch); S2;</code><br>P2 waits until P1 signals after S1.', ['synch initialized to 0', 'P1: S1 then signal', 'P2: wait then S2']),
  W('Explain', 'Show how two semaphores S and Q (both = 1) can cause a <b>deadlock</b> between P0 and P1.', 'P0: wait(S); wait(Q); … signal(S); signal(Q);<br>P1: wait(Q); wait(S); … signal(Q); signal(S);<br>If P0 does wait(S) and P1 does wait(Q), then P0 waits for Q (held by P1) and P1 waits for S (held by P0): both wait forever = <b>deadlock</b>.', ['Opposite order of wait', 'P0 holds S, P1 holds Q', 'Each waits for the other forever']),
  W('Explain', 'Explain the two approaches to handling critical sections in the OS kernel.', '<b>Preemptive kernel</b>: allows preemption of a process running in kernel mode. <b>Non-preemptive kernel</b>: the process runs until it exits kernel mode, blocks, or voluntarily yields the CPU; it is essentially <b>free of race conditions</b> in kernel mode.', ['Preemptive: can preempt in kernel mode', 'Non-preemptive: runs until exit/block/yield', 'Non-preemptive is free of race conditions in kernel']),
  W('Explain', 'What is the <b>disadvantage</b> of the mutex lock as presented, and why is semaphore implementation still acceptable?', 'It requires <b>busy waiting</b> (spinlock), which wastes CPU cycles. In the semaphore implementation, wait/signal themselves become a critical section, but the <b>implementation code is short</b>, so there is <b>little busy waiting</b> if the critical section is rarely occupied. It is not good when applications spend a long time in critical sections.', ['Busy waiting wastes CPU', 'Implementation code is short', 'Little busy waiting if rarely occupied']),

  DIFF('mutex lock', 'semaphore', [['Variable', 'Boolean (available or not)', 'Integer S'], ['Operations', 'acquire() and release()', 'wait() and signal()'], ['Power', 'Simplest tool', 'More sophisticated'], ['Values', 'Locked / unlocked', 'Counting: any value; binary: 0 or 1']]),
  DIFF('counting semaphore', 'binary semaphore', [['Range', 'Unrestricted domain', 'Only 0 and 1'], ['Same as', '—', 'A mutex lock'], ['Use', 'Count available resources', 'Mutual exclusion']]),
  DIFF('deadlock', 'starvation', [['Meaning', 'Two or more processes wait forever for each other', 'A process waits indefinitely (indefinite blocking)'], ['Who', 'A group waiting on each other', 'One process never served'], ['Example', 'P0 holds S waits Q; P1 holds Q waits S', 'Never removed from the semaphore queue']]),

const SLIDES_N = {}; Object.values(SLIDES).forEach(a => a.forEach(([d, n]) => SLIDES_N[d] = n));
const slideEl = (s, eager) => { const b = slideBg(s.d, s.k); const el = h('div', { class: 'simg', role: 'img', 'aria-label': `Slide ${s.k}` }); el.style.backgroundSize = b.size; el.style.backgroundPosition = b.pos; el.dataset.bg = b.url; if (eager) el.style.backgroundImage = `url("${b.url}")`; return el; };
let slideIO = null;
const lazyBg = el => { if (el.style.backgroundImage) return; if (!('IntersectionObserver' in window)) { el.style.backgroundImage = `url("${el.dataset.bg}")`; return; } if (!slideIO) slideIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.style.backgroundImage = `url("${e.target.dataset.bg}")`; slideIO.unobserve(e.target); } }), { rootMargin: '600px 0px' }); slideIO.observe(el); };
function slideViewer(list, start) {
  let i = start; const cap = h('span', { class: 'svcap' }); const holder = h('div', { class: 'svimgwrap' });
  const box = h('div', { class: 'svbox' }, holder);
  let zoom = false; const setZ = z => { zoom = z; ov.classList.toggle('zoomed', z); bz.textContent = z ? '−' : '+'; };
  const show = () => { const s = list[i]; holder.innerHTML = ''; const el = slideEl(s, true); el.onclick = () => setZ(!zoom); holder.append(el); cap.textContent = s.label; setZ(false); box.scrollTo(0, 0); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); document.body.style.overflow = ''; };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight' && i < list.length - 1) { i++; show(); } if (e.key === 'ArrowLeft' && i > 0) { i--; show(); } };
  const bz = h('button', { class: 'svb', type: 'button', onclick: () => setZ(!zoom) }, '+');
  const ov = h('div', { class: 'slideview', role: 'dialog', 'aria-label': 'Slide' },
    h('div', { class: 'svbar' }, h('button', { class: 'svb', type: 'button', onclick: () => { if (i > 0) { i--; show(); } } }, '‹'), cap, h('button', { class: 'svb', type: 'button', onclick: () => { if (i < list.length - 1) { i++; show(); } } }, '›'), bz, h('button', { class: 'svb', type: 'button', onclick: close }, '✕')), box);
  let sx = null; box.addEventListener('touchstart', e => { sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  box.addEventListener('touchend', e => { if (sx == null || zoom) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) { if (dx < 0 && i < list.length - 1) i++; else if (dx > 0 && i > 0) i--; show(); } sx = null; });

/* ===== Operating Systems · slide notes (Lectures 1–2) ===== */
const WHY = {};
const N = t => [['', t]];
WHY['o1-004'] = N('Grades: assignments 10%, quiz 1 5%, quiz 2 5%, project report 10%, practical exam 10%, <b>midterm 20%</b>, final 40%.');
WHY['o1-011'] = N('Goals of Lecture 1: how a computer system is organized, the main parts of an OS and how it works, the types of computing environments, and open-source OSes.');
WHY['o1-012'] = N('A computer system has <b>4 components</b>: hardware (CPU, memory, I/O = the basic resources), the operating system (controls and coordinates the hardware among programs and users), application programs (solve the users\' problems: browsers, compilers, games…), and users (people, machines, other computers).');
WHY['o1-013'] = N('The layers picture: users on top → application programs → operating system → hardware at the bottom. The OS sits <b>between</b> the programs and the hardware.');
WHY['o1-014'] = N('Definition to memorize: an OS is a program that acts as an <b>intermediary between the user and the computer hardware</b>.');
WHY['o1-015'] = N('Two views of the OS: <b>resource allocator</b> (manages all resources and decides between conflicting requests fairly and efficiently) and <b>control program</b> (controls the execution of programs to prevent errors and improper use). The <b>kernel</b> = "the one program running at all times".');
WHY['o1-016'] = N('Three goals: execute user programs, make the computer <b>convenient</b> to use, use the hardware <b>efficiently</b>.');
WHY['o1-017'] = N('OS services: program execution, process management, file management, memory management, file I/O, error detection & handling, security & protection.');
WHY['o1-018'] = N('Organization: one or more CPUs and device controllers connected by a <b>common bus</b> to shared memory. CPUs and devices run concurrently and compete for memory cycles.');
WHY['o1-019'] = N('What the OS does depends on the point of view: a user wants convenience and performance; a shared mainframe must keep all users happy (resource utilization); handheld devices care about battery; embedded systems may have almost no user interface.');
WHY['o1-020'] = N('Startup: the <b>bootstrap program</b> runs at power-up or reboot. It is stored in <b>ROM or EPROM</b> (firmware), initializes the system and <b>loads the OS kernel</b> and starts it.');
WHY['o1-021'] = N('I/O and CPU work at the same time. Each <b>device controller</b> handles one device type and has a <b>local buffer</b>. The CPU moves data between main memory and these buffers; the I/O itself is between the device and the controller\'s buffer. When done, the controller tells the CPU with an <b>interrupt</b>.');
WHY['o1-022'] = N('An OS is <b>interrupt driven</b>. Hardware interrupt = a device signals the CPU. Software interrupt = <b>trap / exception</b>: a software error (division by zero), a request for an OS service (system call), or other process problems (infinite loop…).');
WHY['o1-023'] = N('Multiprocessor (parallel) systems — 3 advantages: <b>increased throughput</b>, <b>economy of scale</b>, <b>increased reliability</b> (graceful degradation / fault tolerance). Two types: <b>asymmetric</b> (each processor has a specific task, one boss) and <b>symmetric</b> (every processor does all tasks).');
WHY['o1-024'] = N('SMP picture: several CPUs, each with its own registers and cache, sharing one main memory.');
WHY['o1-025'] = N('Multicore = several cores on <b>one chip</b> (faster communication, less power) vs multi-chip = separate processor chips.');
WHY['o1-026'] = N('Clustered systems: <b>several complete systems</b> working together, usually sharing storage (SAN), for <b>high availability</b>. Asymmetric clustering: one machine in <b>hot-standby</b> mode watches the others. Symmetric: all run applications and monitor each other. Also used for high-performance computing (parallelization).');
WHY['o1-027'] = N('<b>Multiprogramming</b> (batch): keep several jobs in memory so that when one waits for I/O, the CPU switches to another ⇒ the CPU is never idle. <b>Timesharing (multitasking)</b>: switch so fast that users can interact with each running job (response time &lt; 1 s), each user has at least one process in memory.');
WHY['o1-028'] = N('Traditional computing: stand-alone machines, but now almost everything is connected (portals, network computers, mobile devices, firewalls at home).');
WHY['o1-029'] = N('Mobile: smartphones and tablets add features like GPS and gyroscope (new apps like augmented reality) and use wireless (IEEE 802.11) or cellular networks. Leading OSes: Apple iOS and Google Android.');
WHY['o1-030'] = N('Distributed computing: separate (maybe different) systems networked together, mostly with TCP/IP. Network sizes: <b>PAN</b> (personal) &lt; <b>LAN</b> (local) &lt; <b>MAN</b> (metropolitan) &lt; <b>WAN</b> (wide). A network OS lets systems exchange messages.');
WHY['o1-031'] = N('Client-server: servers answer requests from clients. <b>Compute server</b>: an interface to request services (e.g. database). <b>File server</b>: an interface to store and retrieve files.');
WHY['o1-032'] = N('Peer-to-peer: <b>no distinction</b> between clients and servers; every node is a peer and can act as client, server or both. A node joins the network and registers its service, or broadcasts requests (discovery protocol). Examples: Napster, Gnutella, VoIP like Skype.');
WHY['o1-033'] = N('Virtualization: run an OS (guest) inside another OS (host) using a <b>VMM</b> (virtual machine manager). Uses: several OSes on one laptop, developing and testing for many OSes, running many servers on one machine in data centers.');
WHY['o1-034'] = N('Picture: without virtualization one kernel on the hardware; with it, the VMM sits on the hardware and several virtual machines, each with its own kernel, run on top.');
WHY['o1-035'] = N('Cloud computing delivers computing, storage and apps <b>as a service</b> over the network; it is built on virtualization. Types: public, private, hybrid. Models: <b>SaaS</b> (software, e.g. a word processor online), <b>PaaS</b> (platform, e.g. a database), <b>IaaS</b> (infrastructure, e.g. storage/servers).');
WHY['o1-036'] = N('A cloud = normal OSes + VMMs + cloud management tools, plus security (firewalls) and load balancers that spread the traffic.');
WHY['o1-037'] = N('Real-time embedded systems are the most common computers (cars, appliances…). A <b>real-time OS</b> has well-defined, fixed time constraints: processing <b>must</b> finish within the deadline, or the system fails.');
WHY['o1-038'] = N('Open source: the OS is available as <b>source code</b>, not only as binary. It goes against DRM/copy protection; started by the Free Software Foundation (copyleft, GPL). Examples: GNU/Linux, BSD UNIX (incl. the core of Mac OS X), Solaris.');
WHY['o2-003'] = N('Goals of Lecture 2: the services of the OS, the user interfaces, system calls, and the ways an OS can be structured.');
WHY['o2-004'] = N('Services that help the <b>user</b>: user interface (CLI, GUI, touch, batch), program execution (load, run, end normally or abnormally), I/O operations…');
WHY['o2-005'] = N('…file-system manipulation (read, write, create, delete, search, permissions), communications (between processes, by <b>shared memory</b> or <b>message passing</b>), error detection (in CPU, memory, I/O devices or programs).');
WHY['o2-006'] = N('Services that keep the <b>system</b> efficient: resource allocation, accounting (who uses how much), protection (control access) and security (authentication, defend against outside attacks).');
WHY['o2-007'] = N('Overview picture: user interfaces → system calls → services (program execution, I/O, file systems, communication, resource allocation, accounting, error detection, protection & security) → hardware.');
WHY['o2-008'] = N('CLI (command interpreter, the <b>shell</b>): you type commands. It fetches a command and runs it. Commands are either <b>built in</b> or just <b>names of programs</b> (then adding a command = adding a program).');
WHY['o2-009'] = N('GUI: desktop metaphor with icons, mouse, keyboard and monitor; clicks on objects cause actions. Invented at Xerox PARC. Many systems offer both CLI and GUI.');
WHY['o2-010'] = N('Touchscreen: no mouse, so gestures, a virtual keyboard and voice commands.');
WHY['o2-012'] = N('<b>System call</b> = the interface to the OS services. Usually written in C/C++, and programs use them through an <b>API</b> rather than directly. The 3 common APIs: <b>Win32 API</b> (Windows), <b>POSIX API</b> (UNIX, Linux, Mac OS X), <b>Java API</b> (JVM).');
WHY['o2-013'] = N('Example API: the read() function: its return value, name and parameters (file descriptor, buffer, number of bytes).');
WHY['o2-014'] = N('Each system call has a <b>number</b>; the system-call interface keeps a <b>table indexed by these numbers</b>, calls the right kernel routine and returns its status. The programmer does not need to know how it is implemented.');
WHY['o2-015'] = N('Picture: user program calls open() → system-call interface (user mode → kernel mode) → table lookup → implementation of open() in the kernel → return.');
WHY['o2-016'] = N('Three ways to pass parameters to the OS: (1) in <b>registers</b> (simplest, limited number); (2) in a <b>block/table in memory</b> and pass its address in a register (Linux, Solaris); (3) <b>push them on the stack</b> and the OS pops them. Block and stack methods have no limit on the number of parameters.');
WHY['o2-018'] = N('6 types of system calls (learn the list): <b>process control</b>, <b>file management</b>, <b>device management</b>, <b>information maintenance</b>, <b>communications</b>, <b>protection</b>. Process control: create/terminate, load/execute, attributes, wait, allocate/free memory, dump memory on error, debugging, locks.');
WHY['o2-019'] = N('File management: create/delete, open/close, read/write/reposition, attributes. Device management: request/release, read/write, attributes, attach/detach.');
WHY['o2-020'] = N('Information maintenance: time/date, system data, attributes. Communications: create/delete connection, send/receive messages (message passing) or create/access shared memory, transfer status, attach remote devices.');
WHY['o2-021'] = N('Protection: control access to resources, get/set permissions, allow/deny user access.');
WHY['o2-022'] = N('Same calls, different names: e.g. Windows CreateProcess() = UNIX fork(); ReadFile() = read(); CreatePipe() = pipe().');
WHY['o2-023'] = N('printf() is a <b>library call</b> (standard C library) that itself calls the write() <b>system call</b>.');
WHY['o2-024'] = N('System programs = a convenient environment for developing and running programs: file manipulation, status information, programming-language support (compilers, assemblers), program loading and execution, communications, background services, application programs. Most users see the OS through system programs, not system calls.');
WHY['o2-025'] = N('Design: start with goals — <b>user goals</b> (convenient, easy, reliable, safe, fast) and <b>system goals</b> (easy to design, implement, maintain; flexible, reliable, efficient). Key principle: separate <b>policy</b> (what will be done) from <b>mechanism</b> (how to do it). Early OSes in assembly, now mostly C/C++ (a mix).');
WHY['o2-026'] = N('Structures: simple (MS-DOS), more complex (UNIX), layered, microkernel (Mach), modules, hybrid.');
WHY['o2-027'] = N('MS-DOS: most functionality in the least space; <b>not divided into modules</b>; interfaces and levels not well separated (applications could access hardware directly).');
WHY['o2-028'] = N('Original UNIX: two parts — <b>system programs</b> and the <b>kernel</b> (everything below the system-call interface and above the hardware). A <b>monolithic</b> kernel: a lot of functionality in one level.');
WHY['o2-029'] = N('Layered approach: layer 0 = hardware, layer N = user interface; each layer uses only the layers below it. + easy to build and debug; − hard to define the layers, slower.');
WHY['o2-030'] = N('Microkernel: move as much as possible from the kernel into <b>user space</b>; modules communicate by <b>message passing</b> (example: Mach; Mac OS X Darwin is partly based on it). Benefits: easier to extend, easier to port, more reliable and secure (less code in kernel mode). Cost: performance overhead of user-to-kernel communication.');
WHY['o2-031'] = N('Loadable kernel modules (Linux, Solaris): an object-oriented approach; each core component is separate, talks over known interfaces, and can be loaded as needed. Like layers but more flexible.');
WHY['o2-032'] = N('Most modern OSes are <b>hybrid</b>: e.g. Linux and Solaris = monolithic kernel + loadable modules; Windows mostly monolithic + microkernel parts for subsystems.');
WHY['o2-033'] = N('Mac OS X: layered GUI (Aqua) and application environments (Cocoa, Java…) on top of a kernel environment that combines the Mach microkernel and BSD UNIX parts, plus I/O kit and kernel extensions.');
WHY['o2-034'] = N('iOS: Apple\'s mobile OS based on Mac OS X: Cocoa Touch (API), media services, core services (cloud, databases), core OS.');
WHY['o2-035'] = N('Android: by Google, open source, based on the <b>Linux kernel</b> (+ power management), with a runtime (core libraries + Dalvik virtual machine) and libraries such as webkit and SQLite.');
WHY['o2-036'] = N('Debugging = finding and fixing bugs. The OS writes <b>log files</b>; an application failure can produce a <b>core dump</b> (the process memory); an OS failure produces a <b>crash dump</b> (the kernel memory).');
WHY['o2-037'] = N('Performance tuning: the OS must provide ways to measure and display its behavior, e.g. the Windows Task Manager.');
/* ===== Operating Systems · slide notes (Lectures 3–4) ===== */
WHY['o3-003'] = N('Goals of Lecture 3: what a process is, its scheduling, creation and termination, and how processes communicate (shared memory, message passing, sockets, RPC, pipes).');
WHY['o3-004'] = N('<b>Program</b> = passive (an executable file on disk). <b>Process</b> = active (a program in execution, in memory). A program becomes a process when it is loaded into memory. One program can be several processes (e.g. several users running the same program).');
WHY['o3-005'] = N('Chrome is <b>multiprocess</b>: a <b>browser</b> process (user interface, disk and network I/O), a <b>renderer</b> process for each website (runs in a sandbox, so a crash in one page does not kill the others), and <b>plug-in</b> processes.');
WHY['o3-006'] = N('A process in memory has 4 parts: <b>text</b> (the code), <b>data</b> (global variables), <b>heap</b> (memory allocated at run time), <b>stack</b> (temporary data: function parameters, return addresses, local variables). Plus the current activity: program counter and registers. The heap and stack grow toward each other.');
WHY['o3-007'] = N('5 states: <b>new</b> (being created), <b>running</b> (executing), <b>waiting</b> (waiting for an event, e.g. I/O), <b>ready</b> (waiting to be given a CPU), <b>terminated</b> (finished).');
WHY['o3-008'] = N('The arrows (exam diagram): new –admitted→ ready –scheduler dispatch→ running; running –interrupt→ ready; running –I/O or event wait→ waiting –I/O or event completion→ ready; running –exit→ terminated. Note: waiting goes back to <b>ready</b>, never directly to running.');
WHY['o3-009'] = N('The <b>PCB</b> (process control block) holds everything about a process: state, program counter, CPU registers, CPU-scheduling info (priority, queue pointers), memory-management info, accounting info (CPU used, time limits), I/O status (open files, devices).');
WHY['o3-010'] = N('<b>Context switch</b>: when the CPU moves to another process, the OS saves the state of the old process in its PCB and loads the saved state of the new one. It is <b>pure overhead</b> (no useful work is done during it); its time depends on the hardware.');
WHY['o3-011'] = N('Picture: P0 runs → interrupt/system call → save state into PCB0 → reload state from PCB1 → P1 runs … and back. The CPU is idle during the save/reload.');
WHY['o3-012'] = N('Process scheduling: the scheduler picks the next process for the CPU. Queues: <b>job queue</b> (all processes), <b>ready queue</b> (in memory, ready to run), <b>device queues</b> (waiting for an I/O device). Processes move between them.');
WHY['o3-013'] = N('Queueing diagram: ready queue → CPU → (I/O request → I/O queue), (time slice expired → back to ready), (fork a child → wait), (wait for an interrupt) → back to the ready queue.');
WHY['o3-014'] = N('<b>Short-term</b> (CPU) scheduler: picks the next process to run; invoked very often (milliseconds), so it must be fast. <b>Long-term</b> (job) scheduler: picks which processes enter the ready queue; invoked rarely (seconds/minutes); controls the <b>degree of multiprogramming</b>. Processes are <b>I/O-bound</b> (many short CPU bursts) or <b>CPU-bound</b> (few long bursts); the long-term scheduler aims for a good mix.');
WHY['o3-015'] = N('<b>Medium-term</b> scheduler: reduces the degree of multiprogramming by <b>swapping</b> a process out of memory to disk, and later back in to continue.');
WHY['o3-016'] = N('Processes run concurrently and are created and deleted dynamically, so the OS must provide process creation and termination. A process can create new processes (parent → children → a tree).');
WHY['o3-017'] = N('Each process has a <b>pid</b> (process identifier, an integer, unique). Resource sharing options: parent and children share all resources, some, or none. Execution options: they run concurrently, or the parent waits until the children terminate.');
WHY['o3-018'] = N('Address space: the child is a <b>duplicate</b> of the parent, or it gets a <b>new program</b> loaded. UNIX: <b>fork()</b> creates a new process (copy of the parent); <b>exec()</b> replaces the process\'s memory with a new program.');
WHY['o3-019'] = N('The C program: fork() returns <b>0 in the child</b> and the child\'s pid (&gt; 0) in the parent (&lt; 0 = error). The child calls execlp("/bin/ls") to run ls; the parent calls wait() until the child finishes, then prints "Child Complete".');
WHY['o3-020'] = N('In Linux all processes form a tree with <b>systemd (or init, pid 1)</b> at the root.');
WHY['o3-021'] = N('Normal termination: the process runs its last statement and calls <b>exit()</b>; its status is returned to the parent via <b>wait()</b>; the OS deallocates its resources. A parent can kill a child with <b>abort()</b>: the child exceeded its resources, the task is no longer needed, or the parent is exiting.');
WHY['o3-022'] = N('<b>Cascading termination</b>: some OSes do not allow a child to live after its parent ends, so all children (grandchildren…) are terminated. <b>Zombie</b> = a child that finished but the parent has not called wait() yet. <b>Orphan</b> = the parent ended without calling wait().');
WHY['o3-023'] = N('<b>Independent</b> process: cannot affect or be affected by others. <b>Cooperating</b>: can affect or be affected (shares data). Reasons for cooperation: information sharing, computation speedup, modularity, convenience. Cooperating processes need <b>IPC</b>: shared memory or message passing.');
WHY['o3-024'] = N('(a) Message passing: messages go through the kernel. (b) Shared memory: both processes access a common memory region directly.');
WHY['o3-025'] = N('Shared memory: a common memory area; the communication is controlled by the <b>user processes, not the OS</b>. The main issue is <b>synchronization</b> (they must not access the shared data at the same time incorrectly). Fast (no kernel calls after setup).');
WHY['o3-026'] = N('Message passing: processes communicate <b>without shared variables</b>, using two operations: <b>send(message)</b> and <b>receive(message)</b>. They first establish a communication link. Easier for small amounts of data and for distributed systems, but slower (kernel involved).');
WHY['o3-027'] = N('<b>Socket</b> = an endpoint for communication = <b>IP address + port</b>, e.g. 161.25.19.8:1625. Communication is between a pair of sockets. Ports below 1024 are "well known" (standard services). 127.0.0.1 = loopback (the same machine).');
WHY['o3-028'] = N('Picture: host X (146.86.5.20:1625) talks to a web server (161.25.19.8:80).');
WHY['o3-029'] = N('Three socket types: <b>connection-oriented (TCP)</b>, <b>connectionless (UDP)</b>, and <b>multicast</b> (data sent to many recipients).');
WHY['o3-030'] = N('<b>RPC</b> (remote procedure call): calling a procedure on another machine as if it were local. The client-side <b>stub</b> is a proxy: it locates the server and <b>marshals</b> (packs) the parameters; the server-side stub unpacks them and runs the procedure.');
WHY['o3-031'] = N('A <b>pipe</b> is a conduit between two processes. Design questions: unidirectional or bidirectional? Half- or full-duplex? Must there be a relationship (parent–child)? Can it be used over a network?');
WHY['o3-032'] = N('<b>Ordinary pipes</b>: created by a parent to talk to its child; cannot be accessed from outside the creating process; <b>unidirectional</b> (producer writes to the write end, consumer reads from the read end). Windows calls them anonymous pipes.');
WHY['o3-033'] = N('<b>Named pipes</b>: more powerful: <b>no parent–child relationship needed</b>, <b>bidirectional</b>, several processes can use them, and they continue to exist after the processes finish. (UNIX: FIFOs; Windows: also full-duplex and across machines.)');
WHY['o4-003'] = N('Goals of Lecture 4: concurrency vs parallelism, what a thread is, user vs kernel threads, multithreading models, Pthreads.');
WHY['o4-004'] = N('Multicore programming challenges (5): <b>dividing activities</b>, <b>balance</b>, <b>data splitting</b>, <b>data dependency</b>, <b>testing and debugging</b>.');
WHY['o4-005'] = N('<b>Data parallelism</b>: the same operation on different subsets of the data on each core (e.g. sum half an array on each core). <b>Task parallelism</b>: different tasks (operations) on each core.');
WHY['o4-006'] = N('<b>Concurrency</b>: more than one task makes progress (even on one core, by switching). <b>Parallelism</b>: more than one task runs <b>at the same time</b> (needs several cores). Parallelism ⇒ concurrency, but concurrency does not need parallelism.');
WHY['o4-007'] = N('Structured (one sequence of steps) vs modular programming (independent parts that can run as separate threads).');
WHY['o4-008'] = N('A <b>thread</b> = a flow of execution through the process code, with its <b>own program counter, registers and stack</b>. Threads of the same process <b>share</b> the code, data and open files.');
WHY['o4-009'] = N('Thread = the basic unit of CPU utilization. Creating a process is <b>heavy-weight</b>, creating a thread is <b>light-weight</b>. A traditional process has one thread; a multithreaded process does several things at once.');
WHY['o4-010'] = N('Picture: single-threaded process = one set of registers, stack and PC. Multithreaded = shared code, data and files, but each thread has its own registers, stack and PC.');
WHY['o4-011'] = N('Example: a word processor with threads to update the display, fetch data, check spelling and answer a network request. A web server creates a thread per client request.');
WHY['o4-012'] = N('4 benefits (learn them): <b>responsiveness</b> (the program continues if one part is blocked), <b>resource sharing</b> (threads share the process\'s memory easily), <b>economy</b> (cheaper to create and switch than processes), <b>scalability</b> (threads can run in parallel on multicore).');
WHY['o4-013'] = N('<b>User threads</b>: managed by a user-level library (POSIX Pthreads, Windows threads, Java threads). <b>Kernel threads</b>: supported and managed by the OS kernel (Windows, Solaris, Linux, Mac OS X).');
WHY['o4-014'] = N('Picture: user threads in user space are mapped onto kernel threads in kernel space.');
WHY['o4-015'] = N('Three ways to map user threads to kernel threads: many-to-one, one-to-one, many-to-many.');
WHY['o4-016'] = N('<b>Many-to-one</b>: many user threads → one kernel thread. If one thread blocks, <b>all block</b>; they cannot run in parallel on multicore (only one can be in the kernel at a time). Few systems use it (e.g. Solaris green threads).');
WHY['o4-017'] = N('<b>One-to-one</b>: every user thread → its own kernel thread. More concurrency (one blocking does not block the others; parallel on multicore). Cost: creating a user thread creates a kernel thread (limit on the number). Used by Windows, Linux, Solaris 9+.');
WHY['o4-018'] = N('<b>Many-to-many</b>: many user threads → many (equal or fewer) kernel threads; the OS creates enough kernel threads. Combines the advantages of both. Examples: Solaris before 9, Windows ThreadFiber.');
WHY['o4-019'] = N('A thread library gives the programmer an API to create and manage threads. Implemented either <b>entirely in user space</b> or as a <b>kernel-level library</b> supported by the OS.');
WHY['o4-020'] = N('<b>Pthreads</b> = the POSIX standard API (IEEE 1003.1c) for thread creation and synchronization. It is a <b>specification</b> (behavior), not an implementation; common in UNIX systems (Linux, Mac OS X); can be user- or kernel-level.');
WHY['o4-021'] = N('Example: pthread_create() starts a thread running a function; pthread_join() waits for it to finish.');
WHY['o4-022'] = N('Joining 10 threads: keep the thread ids in an array and call pthread_join() on each in a loop.');
WHY['o4-023'] = N('<b>Thread cancellation</b> = terminating a thread before it finishes (e.g. pthread_cancel()); the target thread may be cancelled immediately (asynchronous) or at safe points (deferred).');
/* ===== Operating Systems · slide notes (Lectures 5–6) ===== */
WHY['o5-003'] = N('Goals of Lecture 5: CPU scheduling (the basis of multiprogramming), the algorithms, the criteria to compare them, multiprocessor scheduling.');
WHY['o5-004'] = N('With one CPU and many processes, someone must decide which process runs next: that is CPU scheduling.');
WHY['o5-005'] = N('Multiprogramming gives maximum CPU utilization. A process alternates <b>CPU bursts</b> (computing) and <b>I/O bursts</b> (waiting for I/O): the CPU–I/O burst cycle.');
WHY['o5-006'] = N('The histogram: most CPU bursts are <b>short</b>, few are long. I/O-bound programs have many short bursts; CPU-bound programs have a few long ones.');
WHY['o5-007'] = N('The short-term scheduler picks from the ready queue. Scheduling decisions happen when a process: 1) running → waiting, 2) running → ready, 3) waiting → ready, 4) terminates. Only 1 and 4 ⇒ <b>nonpreemptive</b>; otherwise <b>preemptive</b> (a running process can be taken off the CPU; needs care with shared data).');
WHY['o5-008'] = N('The <b>dispatcher</b> gives the CPU to the chosen process: switch context, switch to user mode, jump to the right place in the program. <b>Dispatch latency</b> = the time to stop one process and start another.');
WHY['o5-009'] = N('Criteria: <b>CPU utilization</b> (busy %), <b>throughput</b> (processes finished per time unit), <b>turnaround time</b> (submission → completion), <b>waiting time</b> (time spent in the ready queue), <b>response time</b> (request → first response).');
WHY['o5-010'] = N('Goal: <b>maximize</b> CPU utilization and throughput; <b>minimize</b> turnaround, waiting and response times. Formulas: turnaround = finish − arrival; waiting = turnaround − burst.');
WHY['o5-011'] = N('FCFS in order P1(24), P2(3), P3(3): Gantt 0–24–27–30. Waiting: P1 = 0, P2 = 24, P3 = 27 ⇒ average (0 + 24 + 27)/3 = <b>17</b>.');
WHY['o5-012'] = N('Same processes in the order P2, P3, P1: Gantt 0–3–6–30, waiting P1 = 6, P2 = 0, P3 = 3 ⇒ average <b>3</b>. The difference is the <b>convoy effect</b>: short processes stuck behind a long one. FCFS is nonpreemptive.');
WHY['o5-013'] = N('<b>SJF</b>: run the process with the <b>shortest next CPU burst</b>. It is <b>optimal</b> (minimum average waiting time). Problem: we cannot know the next burst length exactly (we predict it from past bursts). Preemptive version = SRTF (shortest remaining time first).');
WHY['o5-014'] = N('SJF chart: P4(3) 0–3, P1(6) 3–9, P3(7) 9–16, P2(8) 16–24. Waiting: P1 = 3, P2 = 16, P3 = 9, P4 = 0 ⇒ average (3 + 16 + 9 + 0)/4 = <b>7</b>. (The slide computes as if all arrive at time 0; in the exam use the arrival times you are given.)');
WHY['o5-015'] = N('<b>Priority</b>: the CPU goes to the highest priority (<b>smallest number = highest</b>). Preemptive or not. SJF is priority scheduling with priority = predicted burst. Problem: <b>starvation</b> (low-priority processes may never run). Solution: <b>aging</b> (increase the priority of processes that wait a long time).');
WHY['o5-016'] = N('Order by priority: P2(1) 0–1, P5(2) 1–6, P1(3) 6–16, P3(4) 16–18, P4(5) 18–19. Waiting: P1 6, P2 0, P3 16, P4 18, P5 1 ⇒ 41/5 = <b>8.2 ms</b>.');
WHY['o5-017'] = N('<b>Round Robin</b>: each process gets a small <b>time quantum q</b> (10–100 ms), then it is preempted and goes to the end of the ready queue. With n processes, no process waits more than (n − 1)q. q large ⇒ becomes FCFS; q small ⇒ too many context switches.');
WHY['o5-018'] = N('q = 4: P1 0–4, P2 4–7, P3 7–10, then P1 10–14, 14–18 … to 30. Waiting: P1 = 6, P2 = 4, P3 = 7 ⇒ 17/3 ≈ 5.66. RR has higher average turnaround than SJF but <b>better response</b>. q must be large compared with the context-switch time (q ≈ 10–100 ms, switch &lt; 10 µs).');
WHY['o5-019'] = N('A process of 10 time units: q = 12 ⇒ 0 context switches, q = 6 ⇒ 1, q = 1 ⇒ 9. The smaller the quantum, the more switches (overhead).');
WHY['o5-020'] = N('<b>Multilevel queue</b>: the ready queue is split into several queues (e.g. foreground/interactive with RR, background/batch with FCFS). A process stays <b>permanently</b> in its queue. Between queues: fixed priority (risk of starvation) or time slices (e.g. 80% foreground, 20% background).');
WHY['o5-021'] = N('Example with 4 queues by priority: real-time, system, interactive, batch. A lower queue runs only if all higher ones are empty.');
WHY['o5-022'] = N('<b>Multilevel feedback queue</b>: a process <b>can move</b> between queues (this is how <b>aging</b> is implemented). Defined by: number of queues, the algorithm of each queue, when to upgrade a process, when to demote it, and which queue a new process enters.');
WHY['o5-023'] = N('Example: Q0 = RR q 8 ms, Q1 = RR q 16 ms, Q2 = FCFS. A new job enters Q0; if it does not finish in 8 ms it moves to Q1; if it still does not finish after 16 more ms it moves to Q2. Short jobs finish fast; long CPU-bound jobs sink to the bottom.');
WHY['o6-003'] = N('Goals of Lecture 6: process synchronization, the critical-section problem, and software and hardware solutions.');
WHY['o6-004'] = N('Many threads share data while running concurrently or in parallel. A <b>race condition</b> happens when several processes access and change shared data at the same time and the result depends on the <b>order</b> in which they run.');
WHY['o6-005'] = N('A process can be interrupted at any point, so concurrent access to shared data may make it <b>inconsistent</b>. We need mechanisms that make cooperating processes run in an orderly way. Example: producer–consumer with a shared counter.');
WHY['o6-006'] = N('Producer: waits while the buffer is full (counter == BUFFER_SIZE), puts the item in buffer[in], moves in forward (circular, % BUFFER_SIZE) and does <b>counter++</b>.');
WHY['o6-007'] = N('Consumer: waits while the buffer is empty (counter == 0), takes buffer[out], moves out forward and does <b>counter--</b>.');
WHY['o6-008'] = N('counter++ is really 3 machine steps (load, add, store), and so is counter--. With counter = 5, if the steps interleave (producer loads 5 → 6, consumer loads 5 → 4, producer stores 6, consumer stores 4), the result is <b>4 (or 6)</b> instead of the correct 5. That is a race condition.');
WHY['o6-009'] = N('<b>Critical section</b> = the part of the code where a process changes shared data (variables, tables, files). Rule: when one process is in its critical section, <b>no other</b> may be in its own. The problem: design a protocol for this.');
WHY['o6-010'] = N('General structure: <b>entry section</b> (ask permission) → <b>critical section</b> → <b>exit section</b> (release) → <b>remainder section</b>.');
WHY['o6-011'] = N('A correct solution must satisfy 3 conditions: <b>mutual exclusion</b> (only one in the critical section), <b>progress</b> (if nobody is inside, the choice of who enters next cannot be postponed forever, and only processes that want to enter take part), <b>bounded waiting</b> (a limit on how many times others can enter before a waiting process gets its turn ⇒ no starvation).');
WHY['o6-012'] = N('In the kernel: a <b>preemptive</b> kernel can take the CPU from a process running in kernel mode (more responsive, but must handle races); a <b>non-preemptive</b> kernel lets it run until it leaves kernel mode, blocks or yields ⇒ essentially free of race conditions in kernel mode.');
WHY['o6-013'] = N('Hardware support is based on <b>locking</b>. On one CPU you could disable interrupts during the critical section, but that is too inefficient on multiprocessors. Modern machines provide <b>atomic</b> (non-interruptible) hardware instructions, such as test-and-set or compare-and-swap.');
WHY['o6-014'] = N('Solution pattern with locks: acquire lock → critical section → release lock → remainder section.');
WHY['o6-015'] = N('<b>Mutex lock</b> (mutual exclusion) = the simplest software tool: acquire() before the critical section, release() after. A Boolean <b>available</b> shows whether the lock is free. acquire() and release() must be <b>atomic</b>.');
WHY['o6-016'] = N('acquire() loops while the lock is not available (<b>busy waiting</b>) and then takes it; release() sets available = true. Busy waiting wastes CPU; such a lock is called a <b>spinlock</b> (useful when the wait is very short, no context switch).');
WHY['o6-017'] = N('<b>Semaphore S</b> = an integer accessed only through two <b>atomic</b> operations: <b>wait()</b> (originally P: while S ≤ 0 wait; then S--) and <b>signal()</b> (originally V: S++). More powerful than a mutex.');
WHY['o6-018'] = N('<b>Counting</b> semaphore: any integer value (e.g. number of available resources). <b>Binary</b> semaphore: 0 or 1, the same as a mutex lock. Ordering example: to make S1 run before S2, use a semaphore synch = 0: P1 does S1; signal(synch); P2 does wait(synch); S2.');
WHY['o6-019'] = N('wait() and signal() themselves must not run at the same time on the same semaphore, so their code is a critical section. To avoid busy waiting, the semaphore keeps a <b>waiting list</b>: wait() puts the process to sleep (block), signal() wakes one up.');
WHY['o6-020'] = N('<b>Deadlock</b>: two or more processes wait forever for an event that only one of the waiting processes can cause. Example: P0 does wait(S) then wait(Q); P1 does wait(Q) then wait(S) ⇒ each holds one and waits for the other. <b>Starvation</b> (indefinite blocking): a process is never removed from the semaphore queue. <b>Priority inversion</b>: a low-priority process holds a lock needed by a high-priority one (solved by priority inheritance).');
