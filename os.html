<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mariam's Operating Systems</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study notebook — chapter rail on the left, one lecture open at a time, worked lines with handwritten "why" notes in the margin. */
:root{
  --bg:#F3F7FD; --paper:#FFFFFF; --ink:#18213F; --ink-2:#3A4569; --muted:#5F6A8C; --line:#D4DEF0;
  --accent:#3E63CC; --accent-soft:#E3EBFB; --powder:#D9E7F8; --butter:#FBE9A6; --butter-ink:#5E4700; --salmon:#F6D2C9; --salmon-ink:#8A3220;
  --good:#1E7A55; --good-soft:#DDF2E8; --bad:#B23A2C; --bad-soft:#FBE3DF; --note:#FFF7D6; --note-ink:#5B4A10;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162B; --paper:#18203A; --ink:#E9EEFB; --ink-2:#C4CDE8; --muted:#9AA5C7; --line:#2C3860;
  --accent:#93AEF5; --accent-soft:#25335E; --powder:#22355E; --butter:#5A4A14; --butter-ink:#FBE9A6; --salmon:#5B2C24; --salmon-ink:#F8C9BD;
  --good:#6FD3A5; --good-soft:#173A2F; --bad:#F2998C; --bad-soft:#41211D; --note:#2A2814; --note-ink:#F4E3A3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10162B; --paper:#18203A; --ink:#E9EEFB; --ink-2:#C4CDE8; --muted:#9AA5C7; --line:#2C3860;
  --accent:#93AEF5; --accent-soft:#25335E; --powder:#22355E; --butter:#5A4A14; --butter-ink:#FBE9A6; --salmon:#5B2C24; --salmon-ink:#F8C9BD;
  --good:#6FD3A5; --good-soft:#173A2F; --bad:#F2998C; --bad-soft:#41211D; --note:#2A2814; --note-ink:#F4E3A3; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:22px 14px 30px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.01em;margin:0 6px 4px}
.brand small{display:block;font-family:var(--f-hand);font-weight:500;font-size:20px;color:var(--accent);letter-spacing:0;margin-top:4px}
.prog{margin:14px 6px 16px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--powder);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent);width:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:44px 1fr 16px;align-items:center;gap:6px;padding:8px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.25}
.nav a:hover{background:var(--accent-soft)}
.nav a.cur{background:var(--accent-soft);font-weight:700}
.nav .ln{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav .ck{font-size:13px;color:var(--good)}
.nav .grp{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}
.topbar{display:none}
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.ch{max-width:900px;margin:0 auto;scroll-margin-top:80px}
.ch-head{margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;margin:44px 0 10px;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:28px 0 8px}
p,li{max-width:68ch}
.lead{font-size:19px;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)} .small{font-size:14px}
sup{font-size:.7em;line-height:0}
.eps{color:var(--muted)}
code,.k{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
/* boxes */
.box{border-radius:var(--r);padding:14px 18px;margin:18px 0;border:1px solid var(--line);background:var(--paper)}
.box>.bt{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.box.one{background:var(--accent-soft);border-color:transparent}.box.one .bt{color:var(--accent)}
.box.one p{font-size:19px;margin:0}
.box.story{background:var(--paper)}.box.story .bt{color:var(--salmon-ink)}
.box.recipe{background:var(--paper);border:2px solid var(--accent)}.box.recipe .bt{color:var(--accent)}
.box.recipe ol{margin:6px 0 0;padding-left:22px}.box.recipe li{margin:6px 0}
.box.warn{background:var(--bad-soft);border-color:transparent}.box.warn .bt{color:var(--bad)}
.box.words{background:var(--paper)}.box.words .bt{color:var(--muted)}
.box.exam{background:var(--butter);border-color:transparent;color:var(--butter-ink)}.box.exam .bt{color:var(--butter-ink)}
.box ul{margin:4px 0;padding-left:20px}
dl.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:6px 0}
dl.terms dt{font-family:var(--f-mono);font-weight:600}
dl.terms dd{margin:0}
/* worked lines with margin notes */
.wl-list{margin:12px 0;border-top:1px dashed var(--line)}
.wl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.wl .n{display:none}
.wl.open .n,.whyall .wl .n{display:block}
.whyb{font:inherit;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);background:var(--note);color:var(--note-ink);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer;vertical-align:middle;white-space:nowrap}
.whyb:hover{border-color:var(--note-ink)}
.wl.open .whyb{background:var(--paper)}
.whyall .whyb{display:none}
.whytoggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:0 6px 12px;cursor:pointer}
.whytoggle input{accent-color:var(--accent)}
.wl .m{font-size:17px;min-width:0;overflow-wrap:anywhere}
.wl .n{font-family:var(--f-hand);font-size:21px;line-height:1.2;color:var(--note-ink);background:var(--note);padding:6px 10px;border-radius:8px;position:relative;min-width:0}
.wl .n::before{content:"why";display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
/* stepper */
.stepper{margin:16px 0}
.stepper>.step{animation:pop .25s ease}
.stepper>.step.latest .wl,.stepper>.step.latest.wl{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
@keyframes pop{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.step-count{font-size:13px;color:var(--muted)}
/* buttons */
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:14px;font-family:var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:4px 10px;border-radius:8px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chip.key{min-width:36px}
.txt{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.txt.wide{width:320px}
.sel{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.lbl{font-size:13px;color:var(--muted);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
/* widgets */
.widget{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0;box-shadow:0 1px 0 var(--line)}
.w-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.w-title::before{content:"try it";font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--butter);color:var(--butter-ink);padding:2px 7px;border-radius:5px}
.sub{font-size:14px;font-weight:700;color:var(--ink-2);margin:14px 0 6px}
.diagram-wrap{overflow-x:auto;margin:6px 0}
svg.diagram{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
svg.diagram .edge path,svg.diagram .startarrow{fill:none;stroke:var(--muted);stroke-width:1.6}
svg.diagram .mk{fill:var(--muted)} svg.diagram .mk-active{fill:var(--accent)}
svg.diagram .edge.on path{stroke:var(--accent);stroke-width:2.6}
svg.diagram .elabel{font-family:var(--f-mono);font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
svg.diagram .state .outer{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.8}
svg.diagram .state .inner{fill:none;stroke:var(--ink-2);stroke-width:1.4}
svg.diagram .slabel{font-family:var(--f-mono);font-size:14px;fill:var(--ink)} svg.diagram .slabel.small{font-size:10.5px}
svg.diagram .state.on .outer{fill:var(--butter);stroke:var(--accent);stroke-width:3}
svg.diagram .state.on .slabel{fill:var(--butter-ink);font-weight:600}
svg.diagram .state.rep .outer{fill:var(--butter);stroke:var(--salmon-ink);stroke-width:3}
svg.diagram .state.hl .outer{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.tape{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0}
.cell{font-family:var(--f-mono);min-width:30px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:16px;padding:0 4px}
.cell.read{color:var(--muted);background:var(--paper)}
.cell.head{border:2px solid var(--accent);background:var(--butter);color:var(--butter-ink);font-weight:700}
.cell.x{text-decoration:line-through;color:var(--muted)}
.cell.empty{color:var(--muted)}
.status{font-size:15px;padding:8px 12px;background:var(--bg);border-radius:8px;min-height:40px}
.verdict{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:2px 8px;border-radius:5px;margin:0 4px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:collapse;font-size:15px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-size:13px;font-weight:700;color:var(--ink-2)}
.tbl td.hot{background:var(--butter);color:var(--butter-ink);font-weight:700}
.tbl tr.acc td{background:var(--good-soft)}
.tbl tr.surv td{background:var(--bad-soft)}
.tbl.splits td{font-variant-numeric:tabular-nums;white-space:nowrap}
.narr p{margin:6px 0;font-size:15px;max-width:none}
.narr p.latest{background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.newtag{font-family:var(--f-mono);font-size:11px;background:var(--butter);color:var(--butter-ink);padding:1px 6px;border-radius:4px}
.note{font-size:15px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0}
.aiout{margin-top:8px}.aitext{white-space:pre-wrap;background:var(--surface-2,rgba(127,127,127,.08));border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55}
.banner{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.banner.ok{background:var(--good-soft);color:var(--good)} .banner.no{background:var(--bad-soft);color:var(--bad)}
.okc{color:var(--good);font-weight:700}.noc{color:var(--bad);font-weight:700}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:4px 0}
.pp{font-family:var(--f-mono);padding:2px 3px;border-radius:4px}
.pp.px{background:var(--powder)} .pp.py{background:var(--butter);color:var(--butter-ink);font-weight:700} .pp.pz{background:var(--salmon);color:var(--salmon-ink)} .pp.pm{background:var(--accent-soft)}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
.move{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mv{font-family:var(--f-display);font-weight:700;font-size:14px;min-width:180px}
.hint{font-size:13px;color:var(--muted)}
.gameinfo{padding:8px 0}.sline{font-size:17px}.big{font-size:20px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:10px 0;font-size:14px}
.pst{padding:3px 7px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pst.rep{background:var(--butter);color:var(--butter-ink);border-color:var(--salmon-ink);font-weight:700}
.parr{color:var(--muted);padding:0 2px}.parr::before{content:"—";}.parr::after{content:"→"}
/* grammar */
.rules{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.7}
.form{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:40px}
.vchip{font:inherit;font-family:var(--f-mono);font-weight:700;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;cursor:pointer}
.vchip.leftmost{box-shadow:0 0 0 3px var(--butter)}
.tchip{font-family:var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block;margin:1px}
.tchip.bad{background:var(--bad-soft);color:var(--bad)}
.done-tag{font-size:13px;color:var(--good);font-weight:700;margin-left:6px}
.derivlog{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.treewrap{overflow-x:auto;background:var(--bg);border-radius:8px;padding:6px}
svg.tree{display:block;margin:0 auto}
svg.tree .tl{stroke:var(--muted);stroke-width:1.3}
svg.tree .tv{font-family:var(--f-mono);font-weight:700;fill:var(--accent);font-size:15px}
svg.tree .tt{font-family:var(--f-mono);fill:var(--ink);font-size:15px}
/* PDA threads */
.threads{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.thread{border:1px solid var(--line);border-radius:10px;padding:6px;min-width:62px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:4px}
.thread.acc{border-color:var(--good);background:var(--good-soft)}
.tq{font-size:13px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:2px;align-items:stretch;min-width:44px}
.plate{font-family:var(--f-mono);text-align:center;background:var(--powder);border-radius:4px;padding:1px 6px;font-size:14px}
.plate.top{background:var(--butter);color:var(--butter-ink);font-weight:700}
.plate.empty{background:transparent;color:var(--muted);font-size:11px}
.stackcol{white-space:nowrap}
.cfg{font-size:15px;background:var(--bg);padding:6px 10px;border-radius:8px;margin:6px 0;overflow-wrap:anywhere}
.qtag{background:var(--butter);color:var(--butter-ink);padding:0 4px;border-radius:4px;margin:0 2px}
.tmt td{white-space:nowrap;font-size:13px}
/* river */
.river{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.bank{background:var(--bg);border-radius:10px;padding:10px;min-height:70px}
.bank-n{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.water{font-family:var(--f-mono);color:var(--accent);font-size:13px;writing-mode:vertical-rl}
/* quiz */
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0}
.quiz-title{font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:8px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.qtext{margin-bottom:8px}
.qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:15px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:8px;font-size:15px;padding:8px 12px;border-radius:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.quiz-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-weight:700}
/* map */
.ladder{display:grid;gap:10px;margin:16px 0}
.rung{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rung .lv{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.rung .lv small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.rung .d{font-size:15px}
.nest{position:relative;margin:16px auto;max-width:520px}
.nest div{border:2px solid var(--accent);border-radius:16px;padding:10px 12px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent);background:color-mix(in srgb, var(--accent-soft) 40%, transparent)}
.nest div div{margin-top:6px}
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:50px;padding-top:18px;border-top:1px solid var(--line)}
.got{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.got input{width:20px;height:20px;accent-color:var(--good)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols2>*{min-width:0}
.cheat{columns:2 320px;column-gap:24px}
.cheat .box{break-inside:avoid;margin-top:0}
.editor{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin:10px 0}
.edbar{display:flex;flex-wrap:wrap;gap:6px}
.edhint{font-size:13px;color:var(--muted);margin:6px 0}
.stage{position:relative;background:var(--paper);border:1px dashed var(--line);border-radius:10px;touch-action:manipulation}
.stage.dragmode{touch-action:none}
.stage .diagram-wrap{margin:0;overflow:hidden}
.stage svg.diagram{max-width:none;cursor:crosshair}
.stage .state,.stage .edge text{cursor:pointer}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}
.lpanel{margin-top:10px;padding:10px;border-radius:10px;background:var(--note);color:var(--note-ink)}
.ta{font:inherit;font-size:15px;width:100%;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.ta.mono{font-family:var(--f-mono)}
.penpad{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);margin:8px 0}
.pencv{display:block;width:100%;background:var(--paper);border-radius:8px;border:1px dashed var(--line);touch-action:pan-y;cursor:crosshair}
.pencv.fingerdraw{touch-action:none}
.pre{background:var(--bg);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:8px 0}
.qpaper{background:var(--bg);border-radius:10px;padding:10px 14px;margin:8px 0}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:8px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:20px}
.qtitle{font-weight:700}
.qmarks{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qtag{font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:5px}
.figimg{background:#fff;border-radius:10px;padding:8px;margin:10px 0;overflow-x:auto;border:1px solid var(--line)}
.figimg img{display:block;max-width:100%;height:auto;margin:0 auto}
.answer{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.field{display:grid;gap:4px;margin:8px 0}
.sheet{border:2px solid var(--good);border-radius:12px;padding:12px;margin-top:10px;background:var(--paper)}
.sheet-h{font-family:var(--f-display);font-weight:800;color:var(--good);margin-bottom:6px}
.rubric{margin-top:12px;padding:10px;border-radius:10px;background:var(--bg)}
.rbi{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px;cursor:pointer}
.rbi input{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
.pill{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px}
.markrow{margin:6px 0;font-size:14px}
.paperbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.timer{font-size:20px;font-weight:600;min-width:70px}
.tbl.tf td{vertical-align:top}.tbl.tf .txt{width:100%;min-width:140px}
.tffb{margin-top:4px;color:var(--ink-2)}
.cell-in{width:72px;padding:4px 6px}
.cell-in.good{border-color:var(--good);background:var(--good-soft)}.cell-in.bad{border-color:var(--bad);background:var(--bad-soft)}
ol.flaw{margin:6px 0;padding-left:22px;font-size:15px}
@media (max-width:860px){.paperbar{top:calc(env(safe-area-inset-top,0px) + 52px)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{font-size:16px;margin:0;flex:0 0 auto}
  .topbar select{flex:1;min-width:0}
  .wl{grid-template-columns:minmax(0,1fr);gap:6px}
  .rung{grid-template-columns:1fr}
  .cols2{grid-template-columns:1fr}
  .mv{min-width:0;width:100%}
  body{font-size:16px}
}

.tcard{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:var(--paper)}
.tcard>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:700;list-style:none}
.tcard>summary::-webkit-details-marker{display:none}
.tcard>summary::after{content:"+";margin-left:auto;font-weight:400;color:var(--accent);font-size:20px}
.tcard[open]>summary::after{content:"–"}
.tcard[open]{padding:0 14px 14px}.tcard[open]>summary{margin:0 -14px 8px;border-bottom:1px solid var(--line)}
.tkind{font-size:11px;letter-spacing:.12em;background:var(--accent);color:#fff;border-radius:4px;padding:2px 7px;font-weight:700;flex:0 0 auto}
.backlink{display:inline-block;font-size:13px;color:var(--ngu-cream)!important;text-decoration:none;margin:0 6px 10px;letter-spacing:.05em}
/* ===== NGU slide look (matches the lecture slides) ===== */
:root{--ngu:#750928;--ngu-2:#5C0720;--ngu-green:#97CB90;--ngu-cream:#FDF1B6;
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#111111; --ink-2:#333333; --muted:#6B6B6B; --line:#E7DCDF;
  --accent:#750928; --accent-soft:#F7E8EC; --powder:#E3F1E0; --butter:#FDF1B6; --butter-ink:#5E4700;
  --good:#2E7A3B; --good-soft:#E3F1E0; --note:#FDF6D6; --note-ink:#5B4A10;
  --f-display:Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
  --f-body:Calibri, Carlito, "Segoe UI", system-ui, sans-serif; --r:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#160B0F; --paper:#1F1016; --ink:#F4ECEE; --ink-2:#D9C9CE; --muted:#A9979C; --line:#3E2530;
  --accent:#EE9AB0; --accent-soft:#3A1824; --powder:#1E3320; --good:#8FD49A; --good-soft:#1A3020; --note:#2B2614; --note-ink:#F4E3A3}}
:root[data-theme="dark"]{
  --bg:#160B0F; --paper:#1F1016; --ink:#F4ECEE; --ink-2:#D9C9CE; --muted:#A9979C; --line:#3E2530;
  --accent:#EE9AB0; --accent-soft:#3A1824; --powder:#1E3320; --good:#8FD49A; --good-soft:#1A3020; --note:#2B2614; --note-ink:#F4E3A3}
body{font-size:18px}
h1,h2,h3{letter-spacing:0;font-weight:700}
h2,h3{color:var(--accent)}
h2{position:relative;padding:0 0 8px;border-bottom:2px solid var(--line);padding-right:200px}
h2::after{content:"NEWGIZA UNIVERSITY";position:absolute;right:0;bottom:12px;font-size:10px;letter-spacing:.42em;font-weight:400;color:var(--accent)}
@media (max-width:700px){h2{padding-right:0}h2::after{display:none}}
.eyebrow{font-family:var(--f-display);letter-spacing:.2em}
/* chapter head = title slide */
.ch-head{background:var(--ngu);color:#fff;padding:30px 120px 46px 30px;border-radius:4px;position:relative;overflow:hidden;min-height:170px}
.ch-head h1{color:#fff;font-weight:400}
.ch-head .eyebrow{color:var(--ngu-cream)}
.ch-head .lead,.ch-head p{color:#F2D9E0}
.ch-head a{color:var(--ngu-cream)}
.ch-head::before{content:"";position:absolute;right:30px;top:26px;width:62px;height:70px;background:linear-gradient(135deg,var(--ngu-green) 0 50%,transparent 50%),var(--ngu-cream);clip-path:polygon(0 0,100% 50%,0 100%);opacity:.95}
.ch-head::after{content:"NEWGIZA UNIVERSITY";position:absolute;left:30px;bottom:16px;font-size:10px;letter-spacing:.42em;color:var(--ngu-cream)}
@media (max-width:700px){.ch-head{padding:22px 62px 40px 18px}.ch-head::before{width:34px;height:40px;right:16px;top:16px}}
/* side rail = maroon like the slides */
.rail{background:var(--ngu);border-right:0;color:#fff}
.rail .brand{color:#fff;font-weight:700}
.rail .brand small{color:var(--ngu-cream);font-family:var(--f-display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;margin-top:8px}
.rail .prog{color:#F2D9E0}
.rail .bar{background:rgba(255,255,255,.18)} .rail .bar i{background:var(--ngu-green)}
.rail .whytoggle{color:#F2D9E0}
.rail .nav a{color:#fff}
.rail .nav a:hover{background:rgba(255,255,255,.12)}
.rail .nav a.cur{background:var(--ngu-green);color:#1C2A1A}
.rail .nav a.cur .ln{color:#1C2A1A}
.rail .nav .ln{color:#E4BFCA}
.rail .nav .ck{color:var(--ngu-green)} .rail .nav a.cur .ck{color:#1C2A1A}
.rail .nav .grp{color:var(--ngu-cream);letter-spacing:.3em}
@media (max-width:860px){.topbar{background:var(--ngu);border-bottom:3px solid var(--ngu-green)}.topbar .brand{color:#fff}}
.btn,.chip,.whyb{border-radius:6px}
.box{border-left:5px solid var(--accent)}
.backlink{display:inline-block;font-size:13px;color:var(--ngu-cream)!important;text-decoration:none;margin:0 6px 10px;letter-spacing:.05em}
.backlink:hover{text-decoration:underline}
.oq{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:12px 0}
.oqh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.oqn{font-weight:700;background:var(--accent);color:#fff;border-radius:4px;min-width:26px;text-align:center;padding:1px 6px;font-size:14px}
.oqk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.oqm{margin-left:auto;font-size:12px;color:var(--muted)}
.oqt{font-size:17px;line-height:1.55;margin:4px 0 10px}
.oqt pre{margin:8px 0}
.fillq .blank{width:170px;margin:0 4px;padding:3px 8px;font-size:16px}
.opt.picked{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.txt.good,.sel.good{border-color:var(--good);background:var(--good-soft)} .txt.bad,.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.opart{margin-top:10px}
.opartbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0}
@media (max-width:860px){.opartbar{top:calc(env(safe-area-inset-top,0px) + 52px)}}
.tbl.match td{vertical-align:top}
.ordl{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.ordi{display:flex;gap:10px;align-items:center}
.schin{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}
.schin label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.schin .txt{width:110px}
.ganttwrap{overflow-x:auto;padding:4px 0 22px}
.gantt{display:flex;min-width:420px;border:2px solid var(--ink);border-radius:2px}
.gb{position:relative;border-right:2px solid var(--ink);min-width:26px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);font-weight:700}
.gb:last-child{border-right:0}
.gb.idle{background:repeating-linear-gradient(45deg,var(--paper) 0 6px,var(--line) 6px 12px);font-weight:400;color:var(--muted)}
.gb i{position:absolute;left:-6px;bottom:-22px;font-style:normal;font-size:13px;font-family:var(--f-mono)}
.gb i.end{left:auto;right:-6px}
.model{margin-top:6px}
.btn.big{font-size:17px;padding:10px 20px}
.oq.exam .fb{display:block}

.dgwrap{overflow-x:auto;margin:6px 0 10px}
svg.dgm{display:block;width:100%;max-width:640px;height:auto;color:var(--ink)}
.dgs{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}.dgs.fill{fill:var(--accent-soft)}
.dga{fill:none;stroke:var(--ink);stroke-width:1.6}
.dgt{fill:var(--ink);font-size:15px;font-family:var(--f-body)}.dgt.small{font-size:12px}
.dgb{fill:var(--accent);stroke:none}.dgbn{fill:#fff;font-size:14px;font-weight:700;font-family:var(--f-body)}
.lblgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:6px 0}
.lblgrid label{display:flex;gap:8px;align-items:center}.lblgrid .txt{flex:1;width:auto}
.pbar{height:6px;background:var(--powder);border-radius:6px;overflow:hidden;width:100px;margin:4px 0}.pbar i{display:block;height:100%;background:var(--good)}
.pgood{color:var(--good);font-weight:700}.pmid{color:#B07400;font-weight:700}.pbad{color:var(--bad);font-weight:700}
.qkbar{margin:6px 0 2px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);line-height:1.5}
.linkbtn{font:inherit;font-weight:700;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}

/* ===== ML page ===== */
.learn h2{margin-top:34px}
.learn h3{margin-top:22px;color:var(--accent)}
.fx{font-family:var(--f-mono);font-size:16px;background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;margin:14px 0;border-radius:6px;overflow-x:auto;line-height:1.6}
.fx sup,.fx sub,.wl sup,.wl sub{font-size:.72em}
.learn .tblwrap{overflow-x:auto;margin:14px 0}
.learn .tbl td,.learn .tbl th{padding:7px 10px;border:1px solid var(--line);vertical-align:top}
.learn .tbl th{background:var(--accent);color:#fff;text-align:left}
.nextbar{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 10px;padding-top:18px;border-top:2px solid var(--line)}
.nextbar .btn{text-decoration:none}
.mlplot{display:block;width:100%;max-width:520px;height:auto;margin:6px 0;background:var(--paper);border-radius:8px}
.mlplot .ax{stroke:var(--muted);stroke-width:1.2}
.mlplot .res{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:3 3}
.mlplot .pt{fill:var(--accent)}
.mlplot .pt2{fill:var(--ngu-green);stroke:var(--ink);stroke-width:.6}
.mlplot .ln{stroke:var(--ink);stroke-width:2.4;fill:none}
.mlplot .cost{stroke:var(--accent);stroke-width:2;fill:none}
.mlplot .truth{stroke:var(--ngu-green);stroke-width:2;fill:none;stroke-dasharray:6 4}
.mlplot .thr{stroke:var(--bad);stroke-width:2;stroke-dasharray:5 4}
.mlplot .pos{fill:var(--accent)}
.mlplot .neg{fill:var(--ngu-green);stroke:var(--ink);stroke-width:.6}
.mlplot .cut{fill:var(--bad-soft);opacity:.55}
.mlplot text,.mlplot .ta{fill:var(--ink);font-size:11px;font-family:var(--f-mono)}
.mlsl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;font-size:15px}
.mlsl input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.mlinfo{font-size:15px;margin:8px 0;padding:8px 12px;background:var(--bg);border-radius:8px;overflow-wrap:anywhere}
.mlrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.mlrow>*{flex:1 1 260px;min-width:0}
.tbl.cm td{text-align:center;font-family:var(--f-mono);padding:6px 10px;border:1px solid var(--line)}
.whytoggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:6px 0 14px;cursor:pointer}
.oqsrc{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--ngu-green);color:#1d3b1a}
.qfig{margin:12px 0;max-width:520px}.qfig figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.fsvg{width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.fsvg .fax{stroke:var(--ink);stroke-width:1.4}.fsvg .ftx{fill:var(--ink);font-size:12px;font-family:var(--f-body,inherit)}.fsvg .fbig{font-size:16px;font-weight:700}
.fsvg .fl1{fill:none;stroke:#d0312d;stroke-width:2.6}.fsvg .fl2{fill:none;stroke:#3d7fc4;stroke-width:2.6}
.fsvg .fgood{fill:var(--ngu-green);opacity:.18}.fsvg .fbadz{fill:#e88;opacity:.13}
.fsvg .fpt{fill:#3d7fc4;opacity:.75}.fsvg .fpa{fill:none;stroke:var(--ink);stroke-width:1.2}.fsvg .fpb{fill:none;stroke:var(--ink);stroke-width:1.2}
.fsvg .fza{fill:#8fc1e3;opacity:.55}.fsvg .fzb{fill:#c0682a;opacity:.45}.fsvg .fbd{stroke:var(--ink);stroke-width:1.5}
.fsvg .fr1{fill:var(--paper);stroke:var(--ink)}.fsvg .fr2{fill:#5b9bd5}.fsvg .fr3{fill:var(--paper)}.fsvg .fr4{fill:#d0312d}.fsvg .fdot{fill:#1b2a6b}
.qtbl{width:auto;margin:8px 0}.qtbl td,.qtbl th{padding:4px 12px;border:1px solid var(--line);text-align:center}
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;border-bottom:2px solid var(--line)}
.ltab{font:inherit;font-weight:700;padding:10px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;margin-bottom:-2px}
.ltab.on{color:var(--accent);border-bottom-color:var(--accent)}
.sdeckbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.sjump{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.sdecktitle{margin-top:26px}
.scard2{margin:0 0 22px;padding:0}.scard2 figcaption{font-size:13px;margin-bottom:4px}
.scard2 img{display:block;width:100%;height:auto;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stxt{margin-top:6px;font-size:14px}.stxt summary{cursor:pointer;color:var(--muted);font-size:13px}
.stxt pre{white-space:pre-wrap;font-family:var(--f-body,inherit);font-size:15px;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0 0;overflow-wrap:anywhere}
.slideview{position:fixed;inset:0;z-index:1000;background:rgba(15,15,15,.96);display:flex;flex-direction:column}
.svbar{display:flex;align-items:center;gap:6px;padding:8px;color:#fff}.svcap{flex:1;font-size:13px;text-align:center}
.svb{font:inherit;font-size:20px;min-width:44px;height:44px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.svbox{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.svbox img{max-width:100%;max-height:100%;cursor:zoom-in;background:#fff}
.slideview.zoomed .svbox{display:block}.slideview.zoomed .svbox img{max-width:none;max-height:none;width:220%;cursor:zoom-out}
.partttl{margin-top:30px;padding-top:12px;border-top:3px solid var(--accent)}
.simg{width:100%;aspect-ratio:16/9;background-color:#fff;background-repeat:no-repeat;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.svimgwrap{width:100%;max-width:min(100%,calc((100vh - 70px)*16/9))}
.slideview .simg{border:0;border-radius:0;cursor:zoom-in}
.slideview.zoomed .svimgwrap{width:220%;max-width:none}.slideview.zoomed .simg{cursor:zoom-out}
.sl-card{margin:0 0 26px;padding:14px 16px 10px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--paper)}
.sl-section{background:var(--accent);border-color:var(--accent)}.sl-section .sl-title,.sl-section .sl-no{color:#fff}
.sl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sl-no{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sl-title{margin:0;color:var(--accent);font-size:21px}
.sl-line{margin:0;padding:3px 0;border:0;background:none;box-shadow:none}
.sl-line .m{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:17px;line-height:1.5}
.sl-line .m>span:nth-child(2){flex:1 1 200px}
.sl-bul{color:var(--accent);font-weight:700}
.sl-line.lv1{padding-left:24px}.sl-line.lv2{padding-left:48px}.sl-line.lv3{padding-left:72px}
.sl-line.lv1 .sl-bul,.sl-line.lv2 .sl-bul{font-size:.8em;color:var(--muted)}
.sl-line .n{margin:4px 0 6px 18px}
.sl-big{font-size:24px;font-weight:700;color:var(--accent);margin:8px 0}
.sl-section .sl-big{color:#fff}
.sl-pics{display:flex;justify-content:center;margin:10px 0}.sl-pics.row{gap:10px;flex-wrap:wrap}

<script>window.SYNC_CFG={subject:"os",prefixes:["os-"]};</script>
<script>
/* ===== Mariam's Study Room: account sync (Firebase) + notes =====
   - Every subject page keeps working from localStorage exactly as before.
   - When signed in with Google, the subject's keys are copied to Firestore
     (users/<uid>/subjects/<subject>) and merged key by key: the newest write wins.
   - Notes live in localStorage "study-notes" and sync in users/<uid>/subjects/common. */
(function () {
  const CFG = window.SYNC_CFG || { subject: null, prefixes: [] };
  const FB = { apiKey: 'AIzaSyDk3CSvsMDx3i0yF07DgZCjFL-IO7ugwPg', authDomain: 'mariam-study-room.firebaseapp.com', projectId: 'mariam-study-room', storageBucket: 'mariam-study-room.firebasestorage.app', messagingSenderId: '146983002691', appId: '1:146983002691:web:89635e012679adac8c2af6' };
  const CAN_SYNC = /(^|\.)github\.io$/.test(location.hostname) || location.hostname === 'localhost' || window.SYNC_FORCE;
  const SDK = window.SYNC_SDK || 'https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
  const NOTES = 'study-notes';
  const PAGES = { toc: 'theory.html', os: 'os.html', ml: 'ml.html', pm: 'pm.html' };
  const SUBJ_NAME = { toc: 'Theory of Computing', os: 'Operating Systems', ml: 'Machine Learning', pm: 'Project Management', home: 'Front page' };
  const LS = window.localStorage;
  const set0 = Storage.prototype.setItem, rem0 = Storage.prototype.removeItem;
  const raw = (k, d) => { try { const v = LS.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  const docOf = k => k === NOTES ? 'common' : CFG.subject;
  const mine = k => k === NOTES || (!!CFG.subject && (CFG.prefixes || []).some(p => k.startsWith(p)) && !/-pen$/.test(k) && !/^__sync/.test(k));
  const TSK = '__sync_ts';
  let ts = {}; try { ts = JSON.parse(raw(TSK, '{}')) || {}; } catch (e) { ts = {}; }
  const saveTs = () => { try { set0.call(LS, TSK, JSON.stringify(ts)); } catch (e) {} };
  let applying = false, user = null, db = null, timer = null, state = 'off';
  const touch = k => { ts[k] = Date.now(); saveTs(); schedule(); };
  // a write only counts as a change if the value really changed (and not just "empty default" on a fresh device)
  const EMPTY = /^(\[\]|\{\}|false|""|null|0)$/;
  Storage.prototype.setItem = function (k, v) { const watch = this === LS && !applying && mine(k); const old = watch ? raw(k, null) : null; set0.call(this, k, v); if (!watch) return; v = String(v); if (old === v || (old == null && EMPTY.test(v))) return; touch(k); };
  Storage.prototype.removeItem = function (k) { const watch = this === LS && !applying && mine(k); const old = watch ? raw(k, null) : null; rem0.call(this, k); if (watch && old != null) touch(k); };
  const enc = k => encodeURIComponent(k).replace(/\./g, '%2E').replace(/\*/g, '%2A');
  const dec = k => decodeURIComponent(k);

  /* ---------- UI: a small dock in the corner ---------- */
  const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };
  const dock = el('div', { class: 'sdock' });
  const bAcc = el('button', { class: 'sbtn', type: 'button', 'aria-label': 'Account and sync' });
  const bNotes = el('button', { class: 'sbtn notes', type: 'button', 'aria-label': 'My notes' }, '✎ Notes');
  const menu = el('div', { class: 'smenu', hidden: true });
  dock.append(menu, bAcc, bNotes);
  const label = () => {
    if (!CAN_SYNC) { bAcc.hidden = true; return; }
    bAcc.hidden = false;
    bAcc.textContent = !user ? '☁ Sign in to save everywhere' : state === 'saving' ? '☁ Saving…' : state === 'error' ? '☁ Not saved (offline?)' : '☁ Saved';
    bAcc.classList.toggle('on', !!user); bAcc.classList.toggle('err', state === 'error');
  };
  bAcc.onclick = () => {
    if (!user) { signIn(); return; }
    menu.hidden = !menu.hidden; menu.innerHTML = '';
    menu.append(el('div', { class: 'smrow' }, 'Signed in as ', el('b', {}, user.displayName || user.email || 'you')),
      el('div', { class: 'smrow small' }, 'Your answers, mistakes, progress and notes are saved to your account. Open the site on any device and sign in with the same Google account.'),
      el('button', { class: 'btn ghost', type: 'button', onclick: () => { menu.hidden = true; pullAll(true); } }, 'Sync now'),
      el('button', { class: 'btn ghost', type: 'button', onclick: () => { menu.hidden = true; window.firebase.auth().signOut(); } }, 'Sign out'));
  };
  document.addEventListener('click', e => { if (!dock.contains(e.target)) menu.hidden = true; });

  /* ---------- notes ---------- */
  let selText = '';
  const grabSel = () => { const s = String(window.getSelection ? window.getSelection() : '').trim(); if (s) selText = s.slice(0, 600); };
  bNotes.addEventListener('pointerdown', grabSel); bNotes.addEventListener('touchstart', grabSel, { passive: true });
  const notesGet = () => { try { return JSON.parse(raw(NOTES, '{}')) || {}; } catch (e) { return {}; } };
  const notesSet = o => { try { LS.setItem(NOTES, JSON.stringify(o)); } catch (e) {} };
  const pageId = () => (CFG.subject || 'home') + '|' + (location.hash || '#');
  const pageTitle = () => { const sec = document.querySelector('section.ch:not([hidden]) h1, main h1, .lhead h1'); const s = document.querySelector('.ch-head .eyebrow'); return ((s ? s.textContent + ' · ' : '') + (sec ? sec.textContent : document.title)).trim().slice(0, 120); };
  /* the notes window: floats above the page, can be dragged by its title bar, resized from the corner, and expanded */
  const panel = el('div', { class: 'snotes', hidden: true, role: 'dialog', 'aria-label': 'My notes' });
  const POSK = 'study-notes-pos';
  const isPhone = () => window.innerWidth < 640;
  let geo = null; try { geo = JSON.parse(raw(POSK, 'null')); } catch (e) { geo = null; }
  let big = false;
  function place() {
    const vw = window.innerWidth, vh = window.innerHeight;
    if (big) { Object.assign(panel.style, { left: '8px', top: '8px', width: (vw - 16) + 'px', height: (vh - 16) + 'px' }); return; }
    let g = geo || (isPhone() ? { x: 8, y: Math.round(vh * 0.3), w: vw - 16, h: Math.round(vh * 0.62) } : { x: vw - 460, y: vh - 600, w: 440, h: 520 });
    g.w = Math.max(260, Math.min(g.w, vw - 16)); g.h = Math.max(220, Math.min(g.h, vh - 16));
    g.x = Math.max(8, Math.min(g.x, vw - g.w - 8)); g.y = Math.max(8, Math.min(g.y, vh - g.h - 8));
    Object.assign(panel.style, { left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px' });
  }
  const saveGeo = () => { const r = panel.getBoundingClientRect(); geo = { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }; try { set0.call(LS, POSK, JSON.stringify(geo)); } catch (e) {} };
  function dragger(handle, onMove) {
    handle.addEventListener('pointerdown', e => {
      if (e.target.closest('button,textarea,input,a')) return;
      e.preventDefault(); handle.setPointerCapture(e.pointerId);
      const r = panel.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      const mv = ev => onMove(r, ev.clientX - sx, ev.clientY - sy);
      const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); saveGeo(); if (tab === 'draw' && pad) pad.size(); };
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
    });
  }
  window.addEventListener('resize', () => { if (!panel.hidden) { place(); if (pad) pad.size(); } });
  document.addEventListener('DOMContentLoaded', () => { document.body.append(dock, panel); label(); });
  if (document.body) { document.body.append(dock, panel); }
  let tab = 'page', pad = null;
  function openNotes() { panel.hidden = false; place(); renderNotes(); }
  bNotes.onclick = () => { if (!panel.hidden) { panel.hidden = true; return; } openNotes(); };

  /* a scratch sheet for the pencil (kept on this device) */
  function Pad(host, key) {
    const bar = el('div', { class: 'spadbar' });
    const cv = el('canvas', { class: 'spad' });
    const fin = el('input', { type: 'checkbox' });
    let strokes = []; try { strokes = JSON.parse(raw(key, '[]')) || []; } catch (e) { strokes = []; }
    let mode = 'pen', cur = null, color = 'ink';
    const mk = (t, f, sel) => { const b = el('button', { class: 'chip' + (sel ? ' sel' : ''), type: 'button' }, t); b.onclick = () => { f(b); }; return b; };
    const pick = (b, m) => { mode = m; [...bar.querySelectorAll('.chip.tool')].forEach(x => x.classList.remove('sel')); b.classList.add('sel'); };
    const bPen = mk('✎ Pen', b => pick(b, 'pen'), true); bPen.classList.add('tool');
    const bRed = mk('Red', b => { pick(b, 'pen'); color = color === 'red' ? 'ink' : 'red'; b.textContent = color === 'red' ? 'Red ✓' : 'Red'; }); bRed.classList.add('tool');
    const bEr = mk('⌫ Eraser', b => pick(b, 'er')); bEr.classList.add('tool');
    const bUndo = mk('↶ Undo', () => { strokes.pop(); store(); redraw(); });
    const bClr = mk('Clear', () => { if (!strokes.length || confirm('Clear the whole sheet?')) { strokes = []; store(); redraw(); } });
    bar.append(bPen, bRed, bEr, bUndo, bClr, el('label', { class: 'small muted', style: 'display:flex;gap:4px;align-items:center' }, fin, 'finger'));
    host.append(bar, cv);
    const ctx = cv.getContext('2d');
    const store = () => { try { set0.call(LS, key, JSON.stringify(strokes)); } catch (e) {} };
    const ink = () => getComputedStyle(document.body).color || '#111';
    function line(s) { if (!s.p.length) return; ctx.save(); ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over'; ctx.strokeStyle = s.c === 'red' ? '#C0392B' : ink(); ctx.lineCap = ctx.lineJoin = 'round';
      for (let i = 1; i < s.p.length; i++) { const a = s.p[i - 1], b = s.p[i]; ctx.lineWidth = s.e ? 20 : 1.2 + 2.4 * (b[2] || .5); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
      if (s.p.length === 1 && !s.e) { ctx.beginPath(); ctx.arc(s.p[0][0], s.p[0][1], 1.5, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); } ctx.restore(); }
    function redraw() { ctx.clearRect(0, 0, cv.width, cv.height); strokes.forEach(line); }
    function size() { const r = cv.getBoundingClientRect(); const d = window.devicePixelRatio || 1; if (!r.width) return; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); redraw(); }
    const ok = e => e.pointerType === 'pen' || e.pointerType === 'mouse' || fin.checked;
    const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top), e.pressure || .5]; };
    cv.addEventListener('pointerdown', e => { if (!ok(e)) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = { e: mode === 'er', c: color, p: [pos(e)] }; strokes.push(cur); line(cur); });
    cv.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(v => cur.p.push(pos(v))); redraw(); });
    const end = () => { if (cur) { cur = null; store(); } };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    ['touchstart', 'touchmove'].forEach(t => cv.addEventListener(t, e => { const x = e.touches[0]; if ((x && x.touchType === 'stylus') || fin.checked) e.preventDefault(); }, { passive: false }));
    fin.onchange = () => cv.classList.toggle('finger', fin.checked);
    setTimeout(size, 30);
    return { size };
  }

  function renderNotes() {
    panel.innerHTML = ''; pad = null;
    const all = notesGet(); const id = pageId();
    const bBig = el('button', { class: 'sx', type: 'button', title: big ? 'Make it smaller' : 'Full screen', 'aria-label': 'Toggle full screen' }, big ? '🗗' : '⛶');
    bBig.onclick = () => { big = !big; place(); renderNotes(); };
    const head = el('div', { class: 'snh' }, el('span', { class: 'sgrip', 'aria-hidden': 'true' }, '⠿'), el('b', {}, 'My notes'), el('span', { class: 'snsp' }), bBig, el('button', { class: 'sx', type: 'button', 'aria-label': 'Close', onclick: () => panel.hidden = true }, '×'));
    if (!big) dragger(head, (r, dx, dy) => { const vw = window.innerWidth, vh = window.innerHeight; panel.style.left = Math.max(0, Math.min(r.left + dx, vw - 60)) + 'px'; panel.style.top = Math.max(0, Math.min(r.top + dy, vh - 50)) + 'px'; });
    const cnt = Object.values(all).filter(n => n.text && n.text.trim()).length;
    const T = (k, t) => el('button', { class: 'chip' + (tab === k ? ' sel' : ''), type: 'button', onclick: () => { tab = k; renderNotes(); } }, t);
    const body = el('div', { class: 'snb' });
    panel.append(head, el('div', { class: 'chips sntabs' }, T('page', '✎ Write'), T('draw', '✍ Draw / solve'), T('all', `All notes (${cnt})`)), body);
    if (!big) { const grip = el('div', { class: 'sresize', title: 'Drag to resize', 'aria-hidden': 'true' }); panel.append(grip); dragger(grip, (r, dx, dy) => { panel.style.width = Math.max(260, Math.min(r.width + dx, window.innerWidth - r.left - 4)) + 'px'; panel.style.height = Math.max(220, Math.min(r.height + dy, window.innerHeight - r.top - 4)) + 'px'; }); }
    if (tab === 'page') {
      const n = all[id] || { text: '' };
      body.append(el('div', { class: 'small muted' }, pageTitle()));
      const ta = el('textarea', { class: 'ta snta', placeholder: 'Write anything: a rule, a trick, your own solution, a question for the doctor… It saves by itself.' }); ta.value = n.text || '';
      const saved = el('span', { class: 'small muted' });
      const save = () => { const o = notesGet(); o[id] = { subj: CFG.subject || 'home', hash: location.hash || '', title: pageTitle(), text: ta.value, ts: Date.now() }; if (!ta.value.trim()) delete o[id]; notesSet(o); saved.textContent = 'Saved'; };
      let t0 = null; ta.oninput = () => { saved.textContent = '…'; clearTimeout(t0); t0 = setTimeout(save, 400); };
      const bQuote = el('button', { class: 'btn ghost', type: 'button', onclick: () => { if (!selText) { saved.textContent = 'First select some text on the page, then open Notes.'; return; } ta.value += (ta.value && !ta.value.endsWith('\n') ? '\n' : '') + '“' + selText + '”\n'; selText = ''; save(); ta.focus(); } }, '+ Add the text I selected');
      body.append(ta, el('div', { class: 'ctl' }, bQuote, saved));
    } else if (tab === 'draw') {
      body.append(el('div', { class: 'small muted' }, 'Scratch paper for this page. Solve with the pencil; it stays on this device. Use ⛶ for a bigger sheet.'));
      const box = el('div', { class: 'spadwrap' }); body.append(box); pad = Pad(box, 'study-scratch|' + id);
    } else {
      const list = Object.entries(all).filter(([, n]) => n.text && n.text.trim()).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
      if (!list.length) body.append(el('p', { class: 'small muted' }, 'No notes yet. Open "Write" on any page.'));
      const groups = {}; list.forEach(([k, n]) => (groups[n.subj] = groups[n.subj] || []).push([k, n]));
      Object.entries(groups).forEach(([s, arr]) => {
        body.append(el('div', { class: 'sng' }, SUBJ_NAME[s] || s));
        arr.forEach(([k, n]) => {
          const href = (s === (CFG.subject || 'home') ? '' : (PAGES[s] || './')) + (n.hash || '');
          const go = el('a', { href: href || '#', class: 'snt' }, n.title || 'Note');
          go.onclick = () => { if (s === (CFG.subject || 'home')) setTimeout(() => { tab = 'page'; renderNotes(); }, 60); };
          const del = el('button', { class: 'sx small', type: 'button', 'aria-label': 'Delete note', title: 'Delete', onclick: () => { if (!confirm('Delete this note?')) return; const o = notesGet(); delete o[k]; notesSet(o); renderNotes(); } }, '🗑');
          body.append(el('div', { class: 'sni' }, el('div', { class: 'snl' }, go, del), el('div', { class: 'snx' }, n.text.length > 220 ? n.text.slice(0, 220) + '…' : n.text), el('div', { class: 'small muted' }, n.ts ? new Date(n.ts).toLocaleString() : '')));
        });
      });
    }
  }
  window.addEventListener('hashchange', () => { if (!panel.hidden && tab !== 'all') setTimeout(renderNotes, 80); });

  /* ---------- Firebase ---------- */
  if (!CAN_SYNC) { label(); return; }
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
  label();
  (async () => {
    try {
      await load(SDK + 'firebase-app-compat.js');

  const draw = () => { chips.innerHTML = ''; algs.forEach(a => chips.append(h('button', { class: 'chip' + (a === alg ? ' sel' : ''), type: 'button', onclick: () => { alg = a; store.set('lab-alg', a); draw(); gen(); } }, ALG_NAME[a] + (a === 'srtf' || a === 'pprio' ? ' · extra' : '')))); };
  let n = 0;
  const gen = () => {
    const k = 3 + Math.floor(Math.random() * 3); const procs = [];
    for (let i = 0; i < k; i++) procs.push({ n: 'P' + (i + 1), at: i === 0 ? 0 : Math.floor(Math.random() * 8), bt: 1 + Math.floor(Math.random() * 9), pr: alg.includes('prio') ? 1 + Math.floor(Math.random() * 5) : undefined });

  C('Timesharing is also called ___.', ['multitasking']),
  C('A ___ cloud is available via the Internet to anyone willing to pay.', ['public']),
  C('The bootstrap program is generally known as ___.', ['firmware']),
  C('Load ___ spread traffic across multiple applications in cloud environments.', ['balancers', 'balancer']),

  MATCH('Match each cloud term with its meaning.', [['SaaS', 'Applications available via the Internet (e.g. word processor)'], ['PaaS', 'Software stack ready for application use (e.g. database server)'], ['IaaS', 'Servers or storage available over the Internet'], ['Public cloud', 'Available via Internet to anyone willing to pay'], ['Private cloud', 'Run by a company for its own use'], ['Hybrid cloud', 'Includes both public and private components']]),
  MATCH('Match each computer-system component with its role.', [['Hardware', 'Provides basic computing resources: CPU, memory, I/O devices'], ['Operating system', 'Controls and coordinates use of hardware among applications and users'], ['Application programs', 'Use system resources to solve the tasks of the users'], ['Users', 'People, computers and other devices']]),
  ORD('Put the computer startup in order.', ['Power-up or reboot', 'The bootstrap program (in ROM/EPROM) is loaded', 'It initializes all aspects of the system', 'It loads the operating system kernel', 'The kernel starts execution']),
  ORD('Put an I/O operation in order.', ['The CPU loads the device controller\'s registers / starts the operation', 'The device controller moves data from the device to its local buffer', 'The device controller informs the CPU by causing an interrupt', 'The CPU moves data from the local buffer to main memory']),

  DEF('operating system', 'A program that acts as an <b>intermediary between a user</b> of a computer and the <b>computer hardware</b>. It is a <b>resource allocator</b> (manages all resources) and a <b>control program</b> (controls execution of programs to prevent errors and improper use).', ['Intermediary between user and hardware', 'Resource allocator (manages resources, fair and efficient)', 'Control program (prevents errors and improper use)']),
  DEF('bootstrap program', 'The program loaded at <b>power-up or reboot</b>. It is stored in <b>ROM or EPROM</b> (firmware), <b>initializes</b> all aspects of the system, and <b>loads the OS kernel</b> and starts its execution.', ['Loaded at power-up or reboot', 'Stored in ROM/EPROM (firmware)', 'Initializes the system and loads the kernel']),
  DEF('interrupt', 'A signal that tells the CPU an event happened. A <b>hardware interrupt</b> comes from a device (e.g. the device controller finished its operation). A <b>software interrupt</b> (exception or trap) comes from software, e.g. division by zero or a request for an OS service.', ['Signal to the CPU that an event happened', 'Hardware interrupt from a device', 'Software interrupt = exception/trap (error or OS service request)']),
  DEF('multiprogramming', 'Organizing jobs (code and data) so the <b>CPU always has one to execute</b>. A subset of jobs is kept in memory; one is selected by job scheduling; when it has to <b>wait (e.g. for I/O)</b>, the OS <b>switches to another job</b>. Needed for efficiency.', ['CPU always has a job to execute', 'Subset of jobs kept in memory', 'When a job waits for I/O, OS switches to another job']),
  DEF('timesharing (multitasking)', 'A logical extension of multiprogramming in which the CPU <b>switches jobs so frequently</b> that <b>users can interact</b> with each job while it is running, creating <b>interactive computing</b>.', ['Extension of multiprogramming', 'CPU switches jobs very frequently', 'Users interact with each job (interactive computing)']),
  DEF('clustered systems', 'Like multiprocessor systems, but <b>multiple systems working together</b>, usually sharing storage via a <b>SAN</b>. They provide a <b>high-availability</b> service that survives failures.', ['Multiple systems working together', 'Share storage via SAN', 'High availability / survive failures']),
  DEF('virtualization', 'Allows operating systems to <b>run applications within other OSes</b>, e.g. a Mac OS X host running Windows as a guest. Used for exploration, compatibility and testing apps on several OSes without several machines.', ['Run an OS / apps inside another OS', 'Host and guest example', 'Use: compatibility, development, QA testing']),
  DEF('cloud computing', 'Delivers <b>computing, storage, even apps as a service across a network</b>. A logical extension of <b>virtualization</b>. Types: public, private, hybrid. Models: SaaS, PaaS, IaaS.', ['Computing/storage/apps as a service over a network', 'Extension of virtualization', 'Types or models (public/private/hybrid, SaaS/PaaS/IaaS)']),
  DEF('real-time operating system', 'An OS with <b>well-defined fixed time constraints</b>. Processing <b>must be done within the constraint</b>; correct operation only if the constraints are met.', ['Fixed time constraints', 'Processing must finish within them', 'Correct only if constraints met']),
  DEF('open-source operating system', 'An OS made available in <b>source-code format</b> rather than just binary (closed-source). Started by the <b>Free Software Foundation</b> (GPL, copyleft). Examples: <b>GNU/Linux, BSD UNIX</b>.', ['Available as source code, not only binary', 'FSF / GPL copyleft', 'Example: Linux or BSD']),
  DEF('peer-to-peer (P2P) computing', 'A distributed model that <b>does not distinguish clients and servers</b>: all nodes are peers and may act as <b>client, server or both</b>. A node joins by registering with a central lookup service or by broadcasting through a discovery protocol. Example: <b>Skype (VoIP)</b>.', ['No distinction between client and server', 'Each node can be client, server or both', 'Example: VoIP / Skype']),
  W('List', 'List the <b>four components</b> of a computer system.', '1. <b>Hardware</b>: CPU, memory, I/O devices.<br>2. <b>Operating system</b>: controls and coordinates hardware use.<br>3. <b>Application programs</b>: solve the users\' tasks.<br>4. <b>Users</b>: people, computers, other devices.', ['Hardware', 'Operating system', 'Application programs', 'Users']),
  W('List', 'List the <b>three goals</b> of an operating system.', '1. Execute user programs (and make solving user problems easier).<br>2. Make the computer system <b>convenient</b> to use.<br>3. Use the computer hardware in an <b>efficient</b> manner.', ['Execute user programs', 'Convenient to use', 'Use hardware efficiently']),
  W('List', 'List the <b>three advantages</b> of multiprocessor systems.', '1. <b>Increased throughput</b>.<br>2. <b>Economy of scale</b>.<br>3. <b>Increased reliability</b> (graceful degradation or fault tolerance).', ['Increased throughput', 'Economy of scale', 'Increased reliability / fault tolerance']),
  W('List', 'List the operating system services mentioned in Lecture 1.', 'Program execution, process management, file management, memory management, file I/O, error detection and handling, security and protection.', ['Program execution / process management', 'File management / file I/O', 'Memory management', 'Error detection and handling', 'Security and protection']),
  W('Explain', 'What an operating system does <b>depends on the point of view</b>. Explain.', '<b>Users</b> want convenience, ease of use and good performance and don\'t care about resource utilization. <b>Shared computers (mainframes)</b> must keep all users happy. <b>Dedicated systems (workstations)</b> have dedicated resources but use shared resources from servers. <b>Handheld computers</b> are resource-poor, optimized for usability and battery life.', ['Users: convenience, performance', 'Mainframes: keep all users happy (resource use)', 'Workstations: dedicated + shared server resources', 'Handhelds: usability and battery life']),
  W('Explain', 'Explain how a <b>computer system operates</b> (device controllers, buffers, interrupts).', 'I/O devices and the CPU execute <b>concurrently</b>. Each <b>device controller</b> is in charge of one device type and has a <b>local buffer</b>. The CPU moves data between <b>main memory</b> and the local buffers. I/O goes from the device to the controller\'s buffer. When done, the controller <b>informs the CPU by causing an interrupt</b>.', ['CPU and devices run concurrently', 'Each controller has a local buffer', 'CPU moves data memory ↔ buffer', 'Controller signals completion by interrupt']),
  W('List', 'List the <b>types of cloud computing</b> and the <b>cloud computing models</b>.', 'Types: <b>public</b>, <b>private</b>, <b>hybrid</b>.<br>Models: <b>SaaS</b>, <b>PaaS</b>, <b>IaaS</b>.', ['Public, private, hybrid', 'SaaS, PaaS, IaaS']),
  W('Give examples', 'Give <b>two examples</b> of software interrupts (exceptions or traps).', 'Software error such as <b>division by zero</b>; a <b>request for an operating system service</b>; other process problems such as an <b>infinite loop</b> or processes modifying each other or the OS.', ['Division by zero (software error)', 'Request for an OS service']),

  DIFF('symmetric multiprocessing', 'asymmetric multiprocessing', [['Task assignment', 'Each processor performs <b>all tasks</b>', 'Each processor is assigned a <b>specific task</b>'], ['Processors', 'All processors are peers', 'Processors have different roles'], ['Load', 'Work is shared among all processors', 'Each processor only does its own task']]),
  DIFF('multiprogramming', 'timesharing (multitasking)', [['Goal', 'Efficiency: keep the CPU busy', 'Interactivity: users interact with each job'], ['When the CPU switches', 'When the running job has to <b>wait</b> (e.g. I/O)', '<b>Very frequently</b> (time slices)'], ['Users', 'Users do not interact with running jobs (batch)', 'Interactive computing'], ['Relation', 'The base idea', 'A logical extension of multiprogramming']]),
  DIFF('hardware interrupt', 'software interrupt', [['Source', 'One of the <b>devices</b>', 'The running <b>program</b>'], ['Other name', '—', '<b>Exception</b> or <b>trap</b>'], ['Example', 'Device controller finished its operation', 'Division by zero, request for an OS service']]),
  DIFF('symmetric clustering', 'asymmetric clustering', [['Machines', '<b>Multiple nodes</b> run applications', 'One machine in <b>hot-standby</b> mode'], ['Monitoring', 'Nodes monitor each other', 'The standby machine monitors the active server'], ['Use of hardware', 'All machines do useful work', 'Standby machine waits until a failure']]),
  DIFF('client-server computing', 'peer-to-peer computing', [['Roles', 'Servers respond to requests generated by clients', 'No distinction: all nodes are peers'], ['A node is', 'Either client or server', 'Client, server or both'], ['Joining', 'Clients just contact the server', 'Node must join the P2P network (central lookup or discovery protocol)'], ['Example', 'Compute-server, file-server', 'VoIP (Skype)']]),
  DIFF('private cloud', 'public cloud', [['Who uses it', 'A company for its own use', 'Anyone willing to pay'], ['Access', 'Run by the company', 'Via the Internet'], ['Ownership', 'Company runs it', 'Provider runs it (e.g. Amazon EC2)']]),
  DIFF('compute-server system', 'file-server system', [['Provides', 'An interface to request <b>services</b> (e.g. database)', 'An interface to <b>store and retrieve files</b>'], ['Client asks for', 'An action / computation', 'Files'], ['Type', 'Both are client-server systems', 'Both are client-server systems']])
]};

LECT.l2 = { ln: 'L2', title: 'Week 2', name: 'Operating System Structures', covers: 'OS services, CLI / GUI / touchscreen, system calls and APIs, parameter passing, types of system calls, system programs, design and implementation, simple / UNIX / layered / microkernel / modules / hybrid structures, Mac OS X, iOS, Android, debugging, performance tuning',
items: [

  M('"get and set permissions, allow and deny user access" belong to ___.', ['Protection', 'Accounting', 'Information maintenance', 'File management'], 0),

  M('MS-DOS was written to provide ___.', ['The best security', 'The most functionality in the least space', 'Many layers', 'Message passing'], 1),

  M('In the layered approach, layer 0 is ___.', ['The user interface', 'The hardware', 'The kernel', 'The shell'], 1),
  M('In the layered approach, the highest layer (layer N) is ___.', ['The hardware', 'The user interface', 'Memory management', 'The CPU scheduler'], 1),

  T('Almost all operating systems have a user interface (UI).', true),

  T('The caller of a system call needs to know how the system call is implemented.', false, 'The caller knows <b>nothing</b> about how it is implemented; the API hides the details.'),

  C('The ___ or command interpreter allows direct command entry.', ['CLI', 'command-line interface', 'command line interface', 'shell']),

  C('The three most common APIs are Win32, ___ and Java API.', ['POSIX']),

  MATCH('Match each system call with its type.', [['create process / terminate process', 'Process control'], ['open, close file', 'File management'], ['request device, release device', 'Device management'], ['get time or date', 'Information maintenance'], ['send, receive messages', 'Communications'], ['get and set permissions', 'Protection']]),
  MATCH('Match each operating system with its structure.', [['MS-DOS', 'Simple structure'], ['Original UNIX', 'Kernel + systems programs (limited structure)'], ['Mach', 'Microkernel'], ['Linux / Solaris', 'Monolithic plus loadable kernel modules'], ['Mac OS X', 'Hybrid: layered, Aqua UI, Mach + BSD']]),

  ORD('Put the steps of a system call (through an API) in order.', ['The user program calls a function of the API (e.g. printf)', 'The API invokes the system call through the system-call interface', 'The system-call interface finds the call by its number in the table', 'The system call runs in the kernel', 'The status and return values go back to the caller']),

  DEF('system call', 'An <b>interface to the services provided by the OS</b>. Typically written in C/C++ and mostly accessed through a high-level <b>API</b> (Win32, POSIX, Java). Each system call has a <b>number</b>; the system-call interface uses a table indexed by these numbers.', ['Interface to OS services', 'Accessed via an API', 'Numbered / table in the system-call interface']),
  DEF('API (Application Programming Interface)', 'A high-level set of functions that programs use instead of calling system calls directly. It <b>hides most details</b> of the OS interface from the programmer. Examples: <b>Win32, POSIX, Java API</b>.', ['High-level functions used by programs', 'Hides system-call details', 'Example: Win32 / POSIX / Java']),
  DEF('shell (command interpreter)', 'The CLI program that <b>fetches a command from the user and executes it</b>. Commands are built-in or names of programs.', ['CLI / command interpreter', 'Fetches a command and executes it', 'Built-in commands or program names']),
  DEF('system programs', 'Programs that provide a <b>convenient environment for program development and execution</b>: file manipulation, status information, programming language support, program loading and execution, communications, background services, application programs.', ['Convenient environment for development and execution', 'At least two categories (file manipulation, status info, …)']),
  DEF('microkernel', 'A structure that <b>moves as much as possible from the kernel into user space</b>. User modules communicate by <b>message passing</b>. Example: <b>Mach</b>. Benefits: easier to extend and port, more reliable and secure.', ['Move services from kernel to user space', 'Message passing', 'Example Mach / a benefit']),
  DEF('layered approach', 'The OS is divided into <b>layers</b>, each <b>built on top of lower layers</b>. Layer 0 is the <b>hardware</b>; layer N is the <b>user interface</b>.', ['Divided into layers built on lower layers', 'Layer 0 = hardware, layer N = user interface']),
  DEF('loadable kernel modules', 'A modern structure (Linux, Solaris) where the kernel is made of modules that can be loaded when needed; <b>each module talks to the others over known interfaces</b>.', ['Kernel parts loaded dynamically', 'Communicate over known interfaces', 'Example Linux / Solaris']),
  DEF('hybrid system', 'An OS that is <b>not one pure model</b> but combines multiple approaches to address <b>performance, security and usability</b>. Examples: Linux/Solaris (monolithic + modules), Windows (monolithic + microkernel), Mac OS X.', ['Combines several structures', 'For performance, security, usability', 'An example']),
  DEF('debugging', '<b>Finding and fixing errors, or bugs</b>. The OS helps with <b>log files</b> (error information), <b>core dumps</b> (application failure) and <b>crash dumps</b> (OS failure).', ['Finding and fixing bugs', 'Log files / core dump / crash dump']),
  W('List', 'List the <b>three methods</b> used to pass parameters to the OS in a system call.', '1. In <b>registers</b> (simplest).<br>2. In a <b>block (table) in memory</b>, with the block address passed in a register (Linux, Solaris).<br>3. <b>Pushed onto the stack</b> by the program and popped off by the OS.', ['Registers', 'Block/table in memory + address in register', 'Stack']),
  W('List', 'List the <b>six types</b> of system calls, with one example each.', 'Process control (create/terminate process), File management (open/close file), Device management (request/release device), Information maintenance (get time or date), Communications (send/receive messages), Protection (get/set permissions).', ['Process control', 'File management', 'Device management', 'Information maintenance', 'Communications', 'Protection']),
  W('List', 'List the OS services that are helpful to the <b>user</b>.', 'User interface, program execution, I/O operations, file-system manipulation, communications, error detection, debugging facilities.', ['User interface', 'Program execution / I/O operations', 'File-system manipulation', 'Communications', 'Error detection']),
  W('List', 'List the OS services that ensure the <b>efficient operation of the system itself</b>.', 'Resource allocation, accounting, protection, security.', ['Resource allocation', 'Accounting', 'Protection', 'Security']),
  W('List', 'List the <b>benefits of a microkernel</b>.', 'Easier to <b>extend</b>; easier to <b>port</b> to new architectures; more <b>reliable</b> (less code in kernel mode); more <b>secure</b>.', ['Easier to extend', 'Easier to port', 'More reliable', 'More secure']),
  W('List', 'List the ways an operating system can be structured.', 'Simple structure (MS-DOS); non-simple / more complex (UNIX); layered; microkernel (Mach); modules; hybrid.', ['Simple (MS-DOS)', 'UNIX', 'Layered', 'Microkernel', 'Modules / hybrid']),
  W('Explain', 'Explain how a <b>system call is implemented</b>.', 'Each system call has a <b>number</b>. The <b>system-call interface</b> keeps a <b>table indexed by these numbers</b>. It invokes the intended system call in the <b>kernel</b> and returns its <b>status and return values</b>. The caller knows nothing about the implementation; the <b>API hides</b> the details.', ['Number per system call', 'Table indexed by number', 'Invoked in kernel, returns status/values', 'Caller unaware / API hides details']),
  W('Explain', 'How is a touchscreen interface different from a GUI?', 'A mouse is not possible or not desired, so actions and selection are based on <b>gestures</b>, a <b>virtual keyboard</b> for text entry and <b>voice commands</b>.', ['No mouse', 'Gestures', 'Virtual keyboard / voice']),
  W('Explain', 'Describe the structure of <b>Android</b>.', 'Developed mostly by <b>Google</b>. Based on the <b>Linux kernel</b> with added power management. Runtime environment: <b>core libraries + Dalvik virtual machine</b>. Libraries include frameworks for web browser (webkit), database (SQLite), multimedia. On top: application framework and applications.', ['Google', 'Linux kernel (+ power management)', 'Dalvik VM + core libraries', 'Libraries: webkit, SQLite, media']),
  W('Explain', 'In which languages are operating systems implemented?', 'Early OSes in <b>assembly</b>; now <b>C, C++</b>. Usually a <b>mix</b>: lowest levels in assembly, main body in C, systems programs in C, C++ and scripting languages (Perl, Python, shell scripts).', ['Early: assembly', 'Now C/C++', 'Mix: lowest levels assembly, body C, scripts for system programs']),

  DIFF('system call', 'API', [['What it is', 'The actual interface to OS services in the kernel', 'High-level functions used by programmers'], ['Used by', 'The API (rarely called directly)', 'Application programs'], ['Details', 'Implementation inside the kernel', 'Hides the system-call details'], ['Example', 'write()', 'printf(), Win32, POSIX, Java API']]),

  DIFF('core dump', 'crash dump', [['Generated by', 'Failure of an <b>application</b>', 'Failure of the <b>operating system</b>'], ['Contains', 'Memory of the process', 'Kernel memory'], ['Use', 'Debugging the application', 'Debugging the OS']]),
  DIFF('passing parameters in registers', 'passing parameters in a block in memory', [['Where', 'CPU registers', 'Table in memory; its address in a register'], ['Simplicity', 'Simplest', 'Slightly more work'], ['Limit', 'Limited by number of registers', 'Any number of parameters'], ['Used by', '—', 'Linux and Solaris']])

LECT.l3 = { ln: 'L3', title: 'Week 3', name: 'Processes', covers: 'process concept, Chrome multiprocess, process in memory, process states, PCB, context switch, scheduling queues, short / long / medium-term schedulers, I/O-bound vs CPU-bound, process creation (pid, fork, exec), termination (exit, wait, abort, zombie, orphan), IPC (shared memory, message passing), sockets, RPC, pipes',
items: [
