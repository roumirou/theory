WN('nw4-002','Module 4: introduction to layer 2, MAC protocols, IEEE LAN standards, Ethernet.');
WN('nw4-003','Layer 2 = communication between end-device <b>NICs</b>. It gives upper layers access to the media, encapsulates L3 packets (IPv4/IPv6) into L2 <b>frames</b>, and does <b>error detection</b> (rejects corrupt frames).');
WN('nw4-004','At each hop a router does 4 L2 jobs: <b>Accept</b> the frame → <b>De-encapsulate</b> it (expose the packet) → <b>Re-encapsulate</b> into a new frame → <b>Forward</b> on the next segment.');
WN('nw4-005','L2 standards bodies: <b>IEEE, ITU, ISO, ANSI, IETF</b>.');
WN('nw4-006','Frame = <b>header + data + trailer</b>. Header/trailer fields depend on the L2 protocol; amount of control info depends on access control and logical topology.');
WN('nw4-007','L2 address = <b>physical address</b>, in the frame header, used only for <b>local delivery</b> on the link, and <b>updated at each hop</b>.');
WN('nw4-008','<b>Half-duplex</b>: one device sends or receives at a time — WLANs and legacy hub/bus networks. <b>Full-duplex</b>: both at once — Ethernet switches.');
WN('nw4-009','MAC protocols manage a <b>shared broadcast channel</b> (cable or air) and add a MAC header with the source and destination addresses from the NIC. They are a sublayer of layer 2.');
WN('nw4-010','IEEE: <b>ALOHA / Slotted ALOHA</b> (satellite & wireless), <b>CSMA/CD</b> (wired Ethernet), <b>Token Bus 802.4</b>, <b>Token Ring 802.5</b>. ANSI: <b>FDDI</b> (fiber token LAN, up to 100 Mbps). ATM Forum: <b>ATM</b> (fixed 53-byte cells, real-time voice/video).');
WN('nw4-011','<b>Pure ALOHA</b>: Norman Abramson, University of Hawaii, early 1970s (radio between islands). Send whenever you have data, no checking. Wait for ACK; if none after <b>twice the max propagation delay</b>, resend after a random delay. Layer 2; inspired Slotted ALOHA, CSMA/CD, Ethernet.');
WN('nw4-012','A frame sent at t0 collides with frames sent in [t0−1, t0+1] → vulnerable period = <b>2× frame time</b>. Simple, no synchronization. Efficiency ≈ <b>18%</b>.');
WN('nw4-013','<b>Slotted ALOHA</b>: time divided into slots = one packet time; send only at the start of a slot. Efficiency <b>36.8%</b> (about double). Needs <b>clock synchronization</b>. + one active node uses full rate, decentralized, simple. − collisions and idle slots waste slots. Foundation of CSMA and TDMA.');
WN('nw4-014','<b>CSMA/CD</b> (Ethernet 802.3): 1 <b>carrier sense</b> (listen first) → 2 <b>collision detection</b> (watch voltage, stop at once) → 3 <b>jam signal</b> (tell everyone) → 4 <b>backoff</b> (wait a random time, retry).');
WN('nw4-015','Flowchart: wait until the medium is free → assemble frame → transmit → if collision: jam, attempts+1; too many attempts → abort; otherwise backoff, wait t, try again. No collision → keep transmitting until done.');
WN('nw4-016','Evolution: Pure ALOHA (collisions any time) → Slotted ALOHA (collisions only at slot start; equal time slots) → CSMA (wait until medium free) → CSMA/CD (jam signal so everyone knows about the collision).');
WN('nw4-017','IEEE 802 = LAN/MAN standards for layers 1–2. <b>802.3 Ethernet</b> (CSMA/CD, 10 Mbps → 100 Gbps+). <b>802.4 Token Bus</b> (industrial, replaced by Ethernet). <b>802.5 Token Ring</b> (IBM, 1980s–90s, token avoids collisions).');
WN('nw4-018','<b>802.11 Wi-Fi</b> uses <b>CSMA/CA</b>. <b>802.15</b> Bluetooth/WPAN short range. <b>802.16 WiMAX</b> long-distance broadband.');
WN('nw4-019','Wi-Fi uses collision <b>Avoidance</b> because detecting collisions in wireless is difficult. <b>DIFS</b> (wait before sending), <b>RTS/CTS</b> (reserve the channel), <b>ACK</b> (confirm receipt).');
WN('nw4-020','802.1 = overview, architecture, management, bridging. <b>802.2 = LLC</b>: talks to layer 3, flow control, error detection, SAPs. <b>MAC</b> sublayers (802.3, 802.11, 802.15, 802.16): talk to the physical layer, frame format and medium access.');
WN('nw4-021','First Ethernet: <b>Robert Metcalfe, 1976, Xerox PARC, 2.94 Mbps</b>. One shared coax cable, one collision domain (one sender at a time), passive (no switching).');
WN('nw4-022','IEEE 802.3 adopted in <b>1983</b>. Specifies <b>PMD</b> (signaling on the medium), <b>PHY</b> (encoding/decoding), <b>MAC</b> (frame, addressing, access). LLC (802.2) is separate, so all 802 networks are compatible.');
WN('nw4-023','Frame: Preamble 7 B · SFD 1 B (10101011) · Destination MAC 6 · Source MAC 6 · Length/Type 2 · Data 46–1500 · FCS 4 (CRC). Frame size <b>64–1518 bytes</b> (preamble not counted). &lt;64 = <b>runt / collision fragment</b> (discarded). &gt;1500 data = <b>jumbo / baby giant</b>.');
WN('nw4-024','Ethernet 10 Mb/s (1973) → Fast 100 (1980) → Gigabit 1000 (1995) → 10 GbE (1998) → 100 GbE (2002).');
WN('nw4-025','Gigabit Ethernet: 1 Gbps, backward-compatible frame, star/tree via switches, <b>full-duplex → no collisions → CSMA/CD not used</b>. <b>GMII</b> connects MAC and PHY (copper or fiber), <b>PMA</b> encoding & sync, <b>PMD</b> transmission medium, <b>Reconciliation</b> maps MAC signals to GMII.');
WN('nw4-026','Encapsulation: application creates the message → transport adds TCP/UDP header → network adds IP header → data link adds Ethernet header + FCS → physical converts to signals.');
WN('nw4-027','Ethernet moved from a shared bus to a <b>switched star/tree</b>: root switch → intermediate switches → leaf switches → end devices, with mixed speeds (10 Mb/s–10 Gb/s).');
WN('nw4-028','MAC address = <b>48 bits (6 bytes)</b>. First 3 bytes = <b>OUI</b> (assigned by IEEE to the maker; includes I/G and U/L bits). Last 3 bytes = device ID (assigned by the maker). Used only on the local segment; ARP maps IP → MAC.');
WN('nw4-029','The NIC compares the destination MAC with its own: no match → discard; match → pass up. It also accepts broadcast and its multicast groups. Every device that sends/receives Ethernet frames has a MAC (PCs, servers, printers, phones, routers).');
WN('nw4-030','<b>Unicast MAC</b>: one sender → one receiver. IPv4 → MAC is found by <b>ARP</b>; IPv6 → by <b>Neighbor Discovery (ND)</b>. The <b>source MAC is always unicast</b>.');
WN('nw4-031','<b>Broadcast MAC</b> = <b>FF-FF-FF-FF-FF-FF</b> (48 ones). The switch floods it out all ports except the incoming one; <b>a router does not forward it</b>. An IPv4 broadcast has all 1s in the host part.');
WN('nw4-032','<b>Multicast MAC</b>: <b>01-00-5E</b> for IPv4 multicast, <b>33-33</b> for IPv6 multicast. Source is always unicast. Flooded unless the switch uses <b>multicast snooping</b>; not routed unless the router is configured for multicast.');
WN('nw4-033','A L2 switch forwards using <b>only MAC addresses</b>; it doesn\'t care what is inside (IPv4, ARP, IPv6). It looks up its <b>MAC address table</b> (= <b>CAM table</b>), unlike a hub that repeats bits out all ports. Table is empty at power-on.');
WN('nw4-034','<b>Learn</b> from the <b>source MAC</b> + incoming port: new → add it; exists → refresh the timer (default <b>5 minutes</b>); exists on a different port → replace with the new port.');
WN('nw4-035','<b>Forward</b> by the <b>destination MAC</b>: found → send out that port; not found → <b>unknown unicast</b> → flood out all ports except incoming. Broadcast/multicast → flooded too.');
WN('nw4-036','<b>Store-and-forward</b>: receive the whole frame, check the CRC, then forward; discards errors (saves bandwidth) and is <b>required for QoS</b> (e.g. VoIP priority). <b>Cut-through</b>: forward before the whole frame arrives — at minimum after reading the destination address.');
WN('nw4-037','<b>Port-based</b> memory: queues per port; one busy port can delay all frames behind it. <b>Shared memory</b>: one common buffer, dynamically allocated; fewer dropped frames, larger frames, supports <b>asymmetric switching</b> (more bandwidth for e.g. a server port).');

WN('nw5-002','Module 5: internetworking, the IP protocol (IPv4 header, addressing, CIDR, NAT, IPv6), DHCP, ARP, ICMP.');
WN('nw5-003','The Internet is a global collection of big and small networks joined together.');
WN('nw5-004','<b>Internetworking</b> = joining independent networks so they act as one system. Each LAN/WAN can have its own hardware; <b>IP</b> unifies them and <b>routers</b> interconnect them. Routing protocols (RIP, OSPF, BGP) choose optimal paths.');
WN('nw5-005','Internet evolved from <b>ARPANET (1969)</b>, funded by the US DoD. No one owns it. <b>ISOC</b> (1992) promotes open standards · <b>IETF</b> writes standards (IP, TCP, HTTP) · <b>ICANN</b> domain names and IP allocation · <b>IANA</b> coordinates IP blocks and protocol numbers. Features: open standards, scalability, resilience.');
WN('nw5-006','OSI 5–7 = Application (FTP, TELNET); 4 = TCP or UDP; 3 = IP; 1–2 = LAN/WAN technology (Ethernet).');
WN('nw5-007','IP = logical addressing and routing. <b>Best-effort</b>: no guarantee of delivery, order or error recovery (TCP does that). <b>Connectionless</b> (each datagram independent), <b>unreliable</b>, works over heterogeneous networks. TCP adds reliability; UDP is light (streaming, DNS).');
WN('nw5-008','The IPv4 header is normally 20 bytes (5 × 32-bit words) without options.');
WN('nw5-009','Fields: Version 4 · IHL 4 (in 32-bit words) · ToS 8 · Total length 16 · Identification 16 · Flags + fragment offset · <b>TTL 8</b> · <b>Protocol 8</b> (TCP 6, UDP 17, ICMP 1) · Header checksum 16 · Source 32 · Destination 32 · Options & padding.');
WN('nw5-010','ToS bits: 0–2 <b>precedence</b> (0 routine … 7 network control), 3 <b>D</b> low delay, 4 <b>T</b> high throughput, 5 <b>R</b> high reliability, 6–7 unused. Voice/video → low delay; file transfer → throughput; banking → reliability.');
WN('nw5-011','Flags: bit 0 reserved, <b>DF</b> = don\'t fragment (if too big → discarded + ICMP "Fragmentation Needed"), <b>MF</b> = more fragments (0 = last). Offset = position in the original; Identification = which packet. <b>TTL</b>: each router −1; at 0 → drop + ICMP <b>Time Exceeded</b>.');
WN('nw5-012','Protocol field: TCP 6, UDP 17, ICMP 1. The <b>header checksum covers only the header</b>, uses 1\'s complement; every router recalculates it (TTL changes). Fails → packet discarded.');
WN('nw5-013','1\'s complement checksum: add the 16-bit words → add the carry back in → invert all bits. Example result 0000 0000 0010 1101 = <b>0x002D</b>.');
WN('nw5-014','IPv4 = <b>32 bits</b>, four octets 0–255 (e.g. 192.168.10.5). Allocated by registries (NIC) to ISPs/users. One address <b>per interface</b>; routers use it to find the network segment.');
WN('nw5-015','Classes: <b>A</b> 0–127 (0xxx, 128 nets, 16,777,214 hosts) · <b>B</b> 128–191 (10xx, 16,384 nets, 65,534 hosts) · <b>C</b> 192–223 (110x, 2,097,152 nets, 254 hosts) · <b>D</b> 224–239 multicast · <b>E</b> 240–255 reserved.');
WN('nw5-016','Classful problems: <b>address waste</b> (Class C too small → people took Class B and wasted it) and <b>routing table explosion</b> (one entry per Class C).');
WN('nw5-017','Rigid classes didn\'t fit: 2,000 hosts → 8 Class C or 1 Class B. Exhaustion by mid-1990s. Solution: <b>CIDR and subnetting</b>.');
WN('nw5-018','Four Class C networks 195.168.0.0–195.168.3.0 (/24 each) aggregate into one CIDR network with mask <b>255.255.252.0</b> (/22).');
WN('nw5-019','CIDR notation <b>a.b.c.d/x</b>, x = network bits. 200.23.16.0/23 → 23 network bits, 9 host bits.');
WN('nw5-020','<b>Route aggregation / supernetting</b>: advertise many adjacent networks as one. 64 Class C blocks 192.24.0.0–192.24.63.0 → <b>192.24.0.0/18</b> (255.255.192.0). Faster lookups, less memory, efficient advertisements.');
WN('nw5-021','<b>NAT</b>: all LAN devices share one public IPv4. Inside: private addresses (10.0.0/24). The NAT router rewrites the source to the public IP (138.76.29.7) with a unique source port. The Internet sees only one IP.');
WN('nw5-022','Example: 10.0.0.1:3345 → 128.119.40.186:80. NAT changes the source to 138.76.29.7:5001 and stores it in the translation table; the reply to 138.76.29.7:5001 is translated back to 10.0.0.1:3345.');
WN('nw5-023','IPv6 because the 32-bit space was running out. Also: fixed <b>40-byte header</b> (faster forwarding) and <b>flow</b> support.');
WN('nw5-024','IPv6 header: Version, Priority, <b>Flow label</b>, Payload length, <b>Next header</b>, <b>Hop limit</b>, 128-bit source and destination. Removed vs IPv4: <b>no checksum, no fragmentation/reassembly, no options</b>.');
WN('nw5-025','IPv6 = <b>128 bits</b>, hexadecimal, not case-sensitive, 8 groups of 4 hex digits. A 16-bit group = <b>hextet</b>.');
WN('nw5-026','Rule 1: omit <b>leading</b> zeros in each hextet (not trailing). 2001:0db8:0000:1111:0000:0000:0000:0200 → 2001:db8:0:1111:0:0:0:200.');
WN('nw5-027','Rule 2: <b>::</b> replaces ONE contiguous string of all-zero hextets, only <b>once</b> per address. → 2001:db8:0:1111::200. Also 2001:db8:cafe:1:0:0:0:1 → 2001:db8:cafe:1::1.');
WN('nw5-028','IETF transition strategies: <b>dual stack</b> (run both), <b>tunneling</b> (IPv6 inside IPv4), <b>translation NAT64</b> (IPv6 ↔ IPv4).');
WN('nw5-029','Host address: <b>manual</b> (admin types IP and mask) or <b>automatic (DHCP)</b>. Network block: from the ISP\'s space, divided by subnetting.');
WN('nw5-030','<b>DHCP</b>: the host gets its IP from a server when it joins. <b>Leased</b> (not permanent), renewable, mobile-friendly, addresses returned to the pool for reuse.');
WN('nw5-031','DORA: 1 <b>Discover</b> (host broadcasts) → 2 <b>Offer</b> → 3 <b>Request</b> → 4 <b>ACK</b>. Discover and offer are optional; request + ACK finalize the lease. All messages are <b>broadcast</b> (client has no IP yet).');
WN('nw5-032','DHCP also gives: <b>first-hop router (default gateway)</b>, <b>DNS server</b>, <b>network mask</b>.');
WN('nw5-033','The DHCP server is usually co-located in the router, serving all its subnets.');
WN('nw5-034','The arriving client broadcasts "is there a DHCP server?"; the server offers an address; the client requests it; the server acknowledges. The first two steps can be skipped if the client reuses a previous address.');
WN('nw5-035','<b>ARP</b> (IPv4) / <b>NDP</b> (IPv6) map an IP address to a MAC address on the local network. Needed because frames need a destination MAC. "Who has 192.168.1.20? Tell me your MAC."');
WN('nw5-036','ARP request = <b>broadcast</b>; ARP reply = <b>unicast</b>. Each node keeps an <b>ARP cache</b>.');
WN('nw5-037','<b>ICMP</b> = error reporting and diagnostics: destination unreachable, time exceeded, echo request/reply. Protocol number <b>1</b>; works within IP; not reliable. ICMPv4 for IPv4, ICMPv6 for IPv6 (more functions).');
WN('nw5-038','ICMP sends control messages, not user data: 1 <b>network errors</b> (unreachable, fragmentation needed) · 2 <b>congestion</b> (deprecated; TCP handles it now) · 3 <b>redirect</b> (a better router on the same network).');
WN('nw5-039','<b>Ping</b>: Echo Request <b>type 8</b>, Echo Reply <b>type 0</b>; shows reachability, RTT, packet loss. TTL reaching 0 → ICMP <b>Time Exceeded type 11</b>.');

// ---------- Module 6 notes ----------
WN('nw6-002','Module 6: introduction, TCP, UDP, TCP vs UDP.');
WN('nw6-003','<b>IP (L3)</b>: best effort, delivers to the right <b>host</b> (not application). <b>TCP (L4)</b>: reliable, ordered, flow-controlled; 3-way handshake to open, 4 steps to close. <b>UDP (L4)</b>: minimal — no ACKs, sequencing or retransmission; low latency (voice, video, DNS). Both use <b>ports</b>.');
WN('nw6-004','TCP: 3-way handshake synchronizes sequence numbers; segmentation and reassembly by sequence number; out-of-order segments buffered and reordered; lost ones retransmitted; graceful 4-way FIN/ACK close. End-to-end reliability, <b>full-duplex</b>, error detection & correction.');
WN('nw6-005','Each segment has a sequence number and an ACK number. Send bytes 0–4999 → receiver replies <b>ACK = 5000</b> ("send the next byte"). This is <b>PAR</b> (positive acknowledgment with retransmission). TCP is <b>stream-oriented</b>: every byte is numbered.');
WN('nw6-006','No ACK within the <b>RTO</b> → retransmit; RTO adapts using RTT. <b>Sliding window</b>: the receiver advertises a window size; the sender stays within it → no buffer overflow.');
WN('nw6-007','TCP header: source port, destination port, sequence number, acknowledgment number, data offset, reserved, flags, window, checksum, urgent pointer, options, data.');
WN('nw6-008','Ports (16 bits) identify the application process. Client e.g. 49152 → server 80/443. <b>Socket pair</b> = &lt;src IP, src port, dst IP, dst port&gt;. Well-known: 80 HTTP, 25 SMTP, 21 FTP, 443 HTTPS.');
WN('nw6-009','<b>Sequence number</b> (32 bits) = position of the first byte; random <b>ISN</b>. ISN 1000 + 500 bytes → next seq 1500. <b>ACK number</b> = next byte expected: ACK 1501 = got everything up to 1500.');
WN('nw6-010','<b>Data offset</b> (4 bits, in 32-bit words): header 20–60 bytes, minimum 5 (=20 bytes). Flags: <b>SYN</b> setup, <b>ACK</b> confirm, <b>FIN</b> close, <b>RST</b> abrupt reset, <b>PSH</b> push now, <b>URG</b> urgent.');
WN('nw6-011','<b>Window</b> (16 bits) = bytes the receiver can accept → flow control. <b>Checksum</b> covers header + data + <b>pseudo-header</b> (IPs, protocol, length); mismatch → discard. Options: <b>MSS</b>, <b>timestamps</b> (RTT), <b>SACK</b> (non-contiguous blocks).');
WN('nw6-012','Connection setup: client SYN → server SYN-ACK → client ACK.');
WN('nw6-013','Example: client SYN seq=100 → server SYN-ACK seq=500, ACK=101 → client ACK=501. Both sides now know each other\'s sequence numbers.');
WN('nw6-014','Random ISN avoids confusing old and new sessions. The handshake negotiates <b>MSS</b> and <b>window scaling</b>. Timeouts/retries prevent spoofing and half-open connections. After step 3 both sides can send.');
WN('nw6-015','Close: client FIN → server ACK → server FIN → client ACK. Each direction closes independently because TCP is full-duplex.');
WN('nw6-016','Window 5000, seq 1000 → send 1000–5999. ACK up to 3000 → window slides → 6000–7999 can go. Big window = high throughput; <b>window 0 = pause</b>. TCP also has a <b>congestion window (cwnd)</b>.');
WN('nw6-017','<b>UDP</b>: connectionless, no reliability, no reordering — independent datagrams. Source port <b>optional</b> (can be 0). Destination port <b>always required</b>: 53 DNS, 161 SNMP, 69 TFTP, 5004 RTP.');
WN('nw6-018','UDP <b>Length</b> = header + data; min <b>8</b>, max 65,535. 24 data + 8 → 32. <b>Checksum</b> over header + data + pseudo-header; <b>optional in IPv4, mandatory in IPv6</b>.');
WN('nw6-019','TCP: connection-oriented, reliable, ordered, flow control (sliding window), congestion control (slow start, AIMD), more overhead, header ≥ 20 B → file transfer, web, email. UDP: connectionless, unreliable, no ordering/flow/congestion control, fast, 8 B header → streaming, gaming, DNS, VoIP. Ports: 21 FTP, 22 SSH, 25 SMTP, 69 TFTP, 123 NTP. IP + port = socket.');
// ---------- Module 7 notes ----------
WN('nw7-002','Each router picks the <b>next hop</b> from its routing table. Decisions are <b>local</b> (routers know neighbors and best paths, not the whole Internet). Metrics: distance (delay, bandwidth, hop count) and cost (admin, reliability, load). Goals: shortest (RIP), lowest cost (OSPF), least delay.');
WN('nw7-003','<b>Static</b> (non-adaptive): manual, small stable LANs; simple, predictable, no overhead, but no automatic recovery and hard to scale. <b>Dynamic</b> (adaptive): routers exchange info (RIP, OSPF, BGP); adapt to failures and scale, but use bandwidth and are complex. Static = fixed map; dynamic = live GPS.');
WN('nw7-004','Functions: <b>packet forwarding</b> and <b>routing-table updating</b>. Good algorithm: correctness, robustness & stability, simplicity, fairness, optimality. RIP → simplicity/stability; OSPF → optimality (Dijkstra); BGP → robustness and policy.');
WN('nw7-005','<b>Distance vector</b>: share best distances with neighbors periodically — RIP (hop count, max 15), IGRP (Cisco, multiple metrics), BGP (path-vector). <b>Link state</b>: each router maps the whole network, floods LSAs, runs Dijkstra — OSPF. <b>Spanning tree</b>: L2 Ethernet, disables redundant links to stop loops. <b>Source routing</b>: the source picks the whole route (Token Ring, obsolete).');
WN('nw7-006','DV table entry: destination, next hop, distance. Neighbors add the link cost to received distances and keep the shorter path. <b>Convergence</b> = all agree. Based on <b>Bellman–Ford</b>.');
WN('nw7-007','B says X is 3 hops; A→B costs 2 → A: X = 5 via B. Changes can cause loops. Fixes: <b>split horizon</b> (don\'t advertise a route back where it came from), <b>poison reverse</b> (advertise bad routes with infinite metric), <b>triggered updates</b> (send at once). DV: simple, slow convergence → small stable networks.');
WN('nw7-008','Link state steps: <b>neighbor discovery</b> (hello packets) → <b>measure link costs</b> → <b>create LSA</b> → <b>flood LSAs</b> to all routers in the area → <b>compute shortest paths</b> (Dijkstra). Full topology knowledge, fast convergence, loop-free.');
WN('nw7-009','<b>AS</b> = routers under one administration with one policy and a unique <b>ASN from IANA</b>. <b>IGP</b> inside an AS (RIP, OSPF, EIGRP): efficiency, fast convergence. <b>EGP</b> between ASes (BGP): scalability and policy. AS = country; IGP = highways; EGP = border crossings.');
WN('nw7-010','<b>RIP</b>: DV IGP from the 1980s (ARPANET). Best route = lowest hop count. Sends the <b>full table every 30 s</b> on <b>UDP 520</b>. Max <b>15 hops</b>, slow convergence, wastes bandwidth. Packets: <b>Request</b>, <b>Response</b>.');
WN('nw7-011','A tells B about 1.0.0.0 and 2.0.0.0 → B adds 1.0.0.0 via E0, 1 hop. B tells C → C adds 1.0.0.0 (2 hops) and 2.0.0.0 (1 hop). Eventually A learns 4.0.0.0 at 2 hops. Each hop adds 1.');
WN('nw7-012','<b>OSPF</b>: link-state IGP for large networks; updates only on change → fast convergence. Metric = <b>cost = inverse of bandwidth</b>. <b>Areas</b>, <b>Area 0 = backbone</b>. <b>ECMP</b> load balancing. Authentication of updates.');
WN('nw7-013','<b>BGP</b>: the Internet\'s inter-AS protocol. <b>Path vector</b> (enhanced DV): each route carries the full AS path; a router rejects a path containing its own AS (loop avoidance). Decisions by <b>policy</b>, not just cost.');
WN('nw7-014','Queuing happens at <b>output interfaces</b> when packets arrive faster than they can be sent; full buffer → drops (congestion loss). Purpose: smooth bursts, prioritize, fairness, control congestion. Types: FIFO, PQ, FQ, WFQ.');
WN('nw7-015','<b>FIFO</b>: default, one queue, oldest first, <b>tail drop</b> when full. + simple, low overhead. − high latency for time-sensitive traffic, no differentiation. Like one supermarket line.');
WN('nw7-016','<b>PQ</b>: High (VoIP, control), Medium (video), Normal (email, web), Low (background files). Higher always served first. Risk: <b>starvation</b> of low priority. Like first class at the airport.');
WN('nw7-017','<b>FQ</b>: one queue per flow, round-robin one packet each → no hogging. − equal fairness doesn\'t prioritize voice. 3 users on 10 Mbps ≈ 3.3 Mbps each.');
WN('nw7-018','<b>WFQ</b>: FQ + <b>weights</b>; bandwidth shared proportionally. Weights 1:2:3 → 1/6, 2/6, 3/6. Good for QoS (voice high weight). − more complex, weights must be set carefully.');

// ---------- Wireshark lab slides notes ----------
WN('nws1-002','A <b>packet sniffer</b> captures ("sniffs") messages sent/received by your computer and displays their protocol fields.');
WN('nws1-003','The sniffer is <b>passive</b>: it never sends packets and packets are never addressed to it; it receives a <b>copy</b> of packets.');
WN('nws1-004','Two parts: <b>packet capture library</b> (copy of every link-layer frame) and <b>packet analyzer</b> (displays all fields of a protocol message).');
WN('nws1-005','<b>Wireshark</b>: free, open-source protocol analyzer for troubleshooting and analysis. Captures in real time, human-readable; live capture & offline analysis, three-pane browser, coloring rules.');
WN('nws1-007','Application (HTTP, SSH, FTP, SMTP) · Transport: process-to-process using <b>ports</b> (TCP, UDP).');
WN('nws1-008','Internet: host identification (IPv4/IPv6) and routing (IP, ICMP, ARP). Data link: moves packets between two hosts on the same link (Ethernet, PPP).');
WN('nws1-009','First choose the interface (Wi-Fi or Ethernet) to capture on.');
WN('nws1-010','Five parts of the window: command menus, display filter field, packet-listing window, packet-header details window, packet-contents window.');
WN('nws1-011','Packet-listing: one line per packet — number (given by <b>Wireshark</b>, not from a header), time, source, destination, protocol, info.');
WN('nws1-012','Packet-header details: Ethernet frame, IP datagram, TCP/UDP, highest-level protocol. Packet-contents: whole frame in <b>ASCII and hexadecimal</b>.');
WN('nws1-013','Type a protocol (e.g. http, icmp) in the display filter to show only those packets.');
WN('nws1-014','Default colors: <b>green = TCP</b>, <b>dark blue = DNS</b>, <b>light blue = UDP</b>, <b>black = TCP packets with problems</b> (e.g. out of order).');
WN('nws2-002','<b>traceroute</b> sends datagrams with TTL 1, then 2, then 3… Each router decrements TTL; at 0 it returns ICMP <b>type 11 TTL-exceeded</b>.');
WN('nws2-004','The host learns the routers on the path from the <b>source IPs of the TTL-exceeded messages</b>. Windows tracert can\'t change the size (default 56 bytes) → use <b>pingplotter</b>.');
WN('nws2-005','Steps: start Wireshark capture → pingplotter to gaia.cs.umass.edu (128.119.245.12) → packet size 56, then 2000, then 3500 → stop capture. Or use the IP-Trace-1 file.');
WN('nws2-007','Edit → Options → Engine → Packet Size.');
WN('nws2-009','Filter: <b>icmp</b>.');
WN('nws2-010','Q1: your IP (source of the first Echo Request) = <b>192.168.1.3</b>.');
WN('nws2-011','Q2: upper-layer protocol field = <b>ICMP (1)</b>.');
WN('nws2-012','Q3: header <b>20 bytes</b>, total length <b>56</b> → payload = 56 − 20 = <b>36 bytes</b>.');
WN('nws2-013','Q4: <b>not fragmented</b> (MF = 0 and fragment offset = 0).');
WN('nws2-014','Q5: always change: <b>Identification, TTL, header checksum</b>.');
WN('nws2-015','Q6: constant: version, header length, source IP, destination IP, differentiated services, upper-layer protocol.');
WN('nws2-016','Must change: Identification (unique per datagram), header checksum (header changes), TTL (traceroute increments it).');
WN('nws2-017','Q7: the Identification field <b>increments</b> with each Echo Request.');
WN('nws2-018','Q8: the first-hop router is on your network: <b>192.168.1.1</b>.');
WN('nws2-019','First TTL-exceeded reply from 192.168.1.1: Identification <b>25211</b>, TTL <b>64</b>.');
