<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mariam's Machine Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study notebook — chapter rail on the left, one lecture open at a time, worked lines with handwritten "why" notes in the margin. */
:root{
  --bg:#F3F7FD; --paper:#FFFFFF; --ink:#18213F; --ink-2:#3A4569; --muted:#5F6A8C; --line:#D4DEF0;
  --accent:#3E63CC; --accent-soft:#E3EBFB; --powder:#D9E7F8; --butter:#FBE9A6; --butter-ink:#5E4700; --salmon:#F6D2C9; --salmon-ink:#8A3220;
  --good:#1E7A55; --good-soft:#DDF2E8; --bad:#B23A2C; --bad-soft:#FBE3DF; --note:#FFF7D6; --note-ink:#5B4A10;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162B; --paper:#18203A; --ink:#E9EEFB; --ink-2:#C4CDE8; --muted:#9AA5C7; --line:#2C3860;
  --accent:#93AEF5; --accent-soft:#25335E; --powder:#22355E; --butter:#5A4A14; --butter-ink:#FBE9A6; --salmon:#5B2C24; --salmon-ink:#F8C9BD;
  --good:#6FD3A5; --good-soft:#173A2F; --bad:#F2998C; --bad-soft:#41211D; --note:#2A2814; --note-ink:#F4E3A3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10162B; --paper:#18203A; --ink:#E9EEFB; --ink-2:#C4CDE8; --muted:#9AA5C7; --line:#2C3860;
  --accent:#93AEF5; --accent-soft:#25335E; --powder:#22355E; --butter:#5A4A14; --butter-ink:#FBE9A6; --salmon:#5B2C24; --salmon-ink:#F8C9BD;
  --good:#6FD3A5; --good-soft:#173A2F; --bad:#F2998C; --bad-soft:#41211D; --note:#2A2814; --note-ink:#F4E3A3; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:22px 14px 30px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.01em;margin:0 6px 4px}
.brand small{display:block;font-family:var(--f-hand);font-weight:500;font-size:20px;color:var(--accent);letter-spacing:0;margin-top:4px}
.prog{margin:14px 6px 16px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--powder);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent);width:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:44px 1fr 16px;align-items:center;gap:6px;padding:8px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.25}
.nav a:hover{background:var(--accent-soft)}
.nav a.cur{background:var(--accent-soft);font-weight:700}
.nav .ln{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav .ck{font-size:13px;color:var(--good)}
.nav .grp{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}
.topbar{display:none}
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.ch{max-width:900px;margin:0 auto;scroll-margin-top:80px}
.ch-head{margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;margin:44px 0 10px;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:28px 0 8px}
p,li{max-width:68ch}
.lead{font-size:19px;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)} .small{font-size:14px}
sup{font-size:.7em;line-height:0}
.eps{color:var(--muted)}
code,.k{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
/* boxes */
.box{border-radius:var(--r);padding:14px 18px;margin:18px 0;border:1px solid var(--line);background:var(--paper)}
.box>.bt{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.box.one{background:var(--accent-soft);border-color:transparent}.box.one .bt{color:var(--accent)}
.box.one p{font-size:19px;margin:0}
.box.story{background:var(--paper)}.box.story .bt{color:var(--salmon-ink)}
.box.recipe{background:var(--paper);border:2px solid var(--accent)}.box.recipe .bt{color:var(--accent)}
.box.recipe ol{margin:6px 0 0;padding-left:22px}.box.recipe li{margin:6px 0}
.box.warn{background:var(--bad-soft);border-color:transparent}.box.warn .bt{color:var(--bad)}
.box.words{background:var(--paper)}.box.words .bt{color:var(--muted)}
.box.exam{background:var(--butter);border-color:transparent;color:var(--butter-ink)}.box.exam .bt{color:var(--butter-ink)}
.box ul{margin:4px 0;padding-left:20px}
dl.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:6px 0}
dl.terms dt{font-family:var(--f-mono);font-weight:600}
dl.terms dd{margin:0}
/* worked lines with margin notes */
.wl-list{margin:12px 0;border-top:1px dashed var(--line)}
.wl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.wl .n{display:none}
.wl.open .n,.whyall .wl .n{display:block}
.whyb{font:inherit;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);background:var(--note);color:var(--note-ink);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer;vertical-align:middle;white-space:nowrap}
.whyb:hover{border-color:var(--note-ink)}
.wl.open .whyb{background:var(--paper)}
.whyall .whyb{display:none}
.whytoggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:0 6px 12px;cursor:pointer}
.whytoggle input{accent-color:var(--accent)}
.wl .m{font-size:17px;min-width:0;overflow-wrap:anywhere}
.wl .n{font-family:var(--f-hand);font-size:21px;line-height:1.2;color:var(--note-ink);background:var(--note);padding:6px 10px;border-radius:8px;position:relative;min-width:0}
.wl .n::before{content:"why";display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
/* stepper */
.stepper{margin:16px 0}
.stepper>.step{animation:pop .25s ease}
.stepper>.step.latest .wl,.stepper>.step.latest.wl{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
@keyframes pop{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.step-count{font-size:13px;color:var(--muted)}
/* buttons */
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:14px;font-family:var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:4px 10px;border-radius:8px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chip.key{min-width:36px}
.txt{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.txt.wide{width:320px}
.sel{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.lbl{font-size:13px;color:var(--muted);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
/* widgets */
.widget{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0;box-shadow:0 1px 0 var(--line)}
.w-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.w-title::before{content:"try it";font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--butter);color:var(--butter-ink);padding:2px 7px;border-radius:5px}
.sub{font-size:14px;font-weight:700;color:var(--ink-2);margin:14px 0 6px}
.diagram-wrap{overflow-x:auto;margin:6px 0}
svg.diagram{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
svg.diagram .edge path,svg.diagram .startarrow{fill:none;stroke:var(--muted);stroke-width:1.6}
svg.diagram .mk{fill:var(--muted)} svg.diagram .mk-active{fill:var(--accent)}
svg.diagram .edge.on path{stroke:var(--accent);stroke-width:2.6}
svg.diagram .elabel{font-family:var(--f-mono);font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
svg.diagram .state .outer{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.8}
svg.diagram .state .inner{fill:none;stroke:var(--ink-2);stroke-width:1.4}
svg.diagram .slabel{font-family:var(--f-mono);font-size:14px;fill:var(--ink)} svg.diagram .slabel.small{font-size:10.5px}
svg.diagram .state.on .outer{fill:var(--butter);stroke:var(--accent);stroke-width:3}
svg.diagram .state.on .slabel{fill:var(--butter-ink);font-weight:600}
svg.diagram .state.rep .outer{fill:var(--butter);stroke:var(--salmon-ink);stroke-width:3}
svg.diagram .state.hl .outer{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.tape{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0}
.cell{font-family:var(--f-mono);min-width:30px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:16px;padding:0 4px}
.cell.read{color:var(--muted);background:var(--paper)}
.cell.head{border:2px solid var(--accent);background:var(--butter);color:var(--butter-ink);font-weight:700}
.cell.x{text-decoration:line-through;color:var(--muted)}
.cell.empty{color:var(--muted)}
.status{font-size:15px;padding:8px 12px;background:var(--bg);border-radius:8px;min-height:40px}
.verdict{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:2px 8px;border-radius:5px;margin:0 4px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:collapse;font-size:15px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-size:13px;font-weight:700;color:var(--ink-2)}
.tbl td.hot{background:var(--butter);color:var(--butter-ink);font-weight:700}
.tbl tr.acc td{background:var(--good-soft)}
.tbl tr.surv td{background:var(--bad-soft)}
.tbl.splits td{font-variant-numeric:tabular-nums;white-space:nowrap}
.narr p{margin:6px 0;font-size:15px;max-width:none}
.narr p.latest{background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.newtag{font-family:var(--f-mono);font-size:11px;background:var(--butter);color:var(--butter-ink);padding:1px 6px;border-radius:4px}
.note{font-size:15px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0}
.aiout{margin-top:8px}.aitext{white-space:pre-wrap;background:var(--surface-2,rgba(127,127,127,.08));border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55}
.banner{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.banner.ok{background:var(--good-soft);color:var(--good)} .banner.no{background:var(--bad-soft);color:var(--bad)}
.okc{color:var(--good);font-weight:700}.noc{color:var(--bad);font-weight:700}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:4px 0}
.pp{font-family:var(--f-mono);padding:2px 3px;border-radius:4px}
.pp.px{background:var(--powder)} .pp.py{background:var(--butter);color:var(--butter-ink);font-weight:700} .pp.pz{background:var(--salmon);color:var(--salmon-ink)} .pp.pm{background:var(--accent-soft)}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
.move{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mv{font-family:var(--f-display);font-weight:700;font-size:14px;min-width:180px}
.hint{font-size:13px;color:var(--muted)}
.gameinfo{padding:8px 0}.sline{font-size:17px}.big{font-size:20px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:10px 0;font-size:14px}
.pst{padding:3px 7px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pst.rep{background:var(--butter);color:var(--butter-ink);border-color:var(--salmon-ink);font-weight:700}
.parr{color:var(--muted);padding:0 2px}.parr::before{content:"—";}.parr::after{content:"→"}
/* grammar */
.rules{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.7}
.form{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:40px}
.vchip{font:inherit;font-family:var(--f-mono);font-weight:700;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;cursor:pointer}
.vchip.leftmost{box-shadow:0 0 0 3px var(--butter)}
.tchip{font-family:var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block;margin:1px}
.tchip.bad{background:var(--bad-soft);color:var(--bad)}
.done-tag{font-size:13px;color:var(--good);font-weight:700;margin-left:6px}
.derivlog{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.treewrap{overflow-x:auto;background:var(--bg);border-radius:8px;padding:6px}
svg.tree{display:block;margin:0 auto}
svg.tree .tl{stroke:var(--muted);stroke-width:1.3}
svg.tree .tv{font-family:var(--f-mono);font-weight:700;fill:var(--accent);font-size:15px}
svg.tree .tt{font-family:var(--f-mono);fill:var(--ink);font-size:15px}
/* PDA threads */
.threads{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.thread{border:1px solid var(--line);border-radius:10px;padding:6px;min-width:62px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:4px}
.thread.acc{border-color:var(--good);background:var(--good-soft)}
.tq{font-size:13px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:2px;align-items:stretch;min-width:44px}
.plate{font-family:var(--f-mono);text-align:center;background:var(--powder);border-radius:4px;padding:1px 6px;font-size:14px}
.plate.top{background:var(--butter);color:var(--butter-ink);font-weight:700}
.plate.empty{background:transparent;color:var(--muted);font-size:11px}
.stackcol{white-space:nowrap}
.cfg{font-size:15px;background:var(--bg);padding:6px 10px;border-radius:8px;margin:6px 0;overflow-wrap:anywhere}
.qtag{background:var(--butter);color:var(--butter-ink);padding:0 4px;border-radius:4px;margin:0 2px}
.tmt td{white-space:nowrap;font-size:13px}
/* river */
.river{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.bank{background:var(--bg);border-radius:10px;padding:10px;min-height:70px}
.bank-n{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.water{font-family:var(--f-mono);color:var(--accent);font-size:13px;writing-mode:vertical-rl}
/* quiz */
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0}
.quiz-title{font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:8px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.qtext{margin-bottom:8px}
.qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:15px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:8px;font-size:15px;padding:8px 12px;border-radius:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.quiz-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-weight:700}
/* map */
.ladder{display:grid;gap:10px;margin:16px 0}
.rung{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rung .lv{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.rung .lv small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.rung .d{font-size:15px}
.nest{position:relative;margin:16px auto;max-width:520px}
.nest div{border:2px solid var(--accent);border-radius:16px;padding:10px 12px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent);background:color-mix(in srgb, var(--accent-soft) 40%, transparent)}
.nest div div{margin-top:6px}
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:50px;padding-top:18px;border-top:1px solid var(--line)}
.got{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.got input{width:20px;height:20px;accent-color:var(--good)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols2>*{min-width:0}
.cheat{columns:2 320px;column-gap:24px}
.cheat .box{break-inside:avoid;margin-top:0}
.editor{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin:10px 0}

 ['Set the gradient to zero: X<sup>T</sup>(y − Xβ) = 0.', 'Bottom of the bowl.'],
 ['→ <b>X<sup>T</sup>Xβ = X<sup>T</sup>y</b> (the <b>normal equations</b>).', 'Multiply out: X<sup>T</sup>y − X<sup>T</sup>Xβ = 0.'],
 ['→ <b>β = (X<sup>T</sup>X)<sup>−1</sup>X<sup>T</sup>y</b>.', 'Multiply both sides by the inverse of X<sup>T</sup>X. One formula, no iterations: the <b>closed-form</b> / <b>analytical</b> / <b>OLS</b> solution.']
])}
${FX('β̂ = (X<sup>T</sup>X)<sup>−1</sup> X<sup>T</sup> y')}
${BOX('Example by hand (slide)', `<p>Find y = β<sub>0</sub> + β<sub>1</sub>x for the points (2,1), (5,2), (7,3), (8,3).</p>
${WL([
 ['X = [[1,2],[1,5],[1,7],[1,8]], y = [1,2,3,3].', 'First column of 1s (for β<sub>0</sub>), second column = the x values.'],
 ['X<sup>T</sup>X = [[4, 22],[22, 142]].', '4 = number of points, 22 = Σx = 2+5+7+8, 142 = Σx² = 4+25+49+64.'],
 ['X<sup>T</sup>y = [9, 57].', '9 = Σy, 57 = Σxy = 2+10+21+24.'],
 ['Inverse of [[a,b],[c,d]] = <sup>1</sup>⁄<sub>ad−bc</sub>[[d,−b],[−c,a]] → <sup>1</sup>⁄<sub>84</sub>[[142,−22],[−22,4]].', 'ad − bc = 4·142 − 22·22 = 568 − 484 = 84.'],
 ['β = <sup>1</sup>⁄<sub>84</sub>[142·9 − 22·57, −22·9 + 4·57] = <sup>1</sup>⁄<sub>84</sub>[24, 30] = [2/7, 5/14].', '1278 − 1254 = 24 and −198 + 228 = 30.'],
 ['Answer: <b>y = 2/7 + (5/14)x</b> ≈ 0.286 + 0.357x.', '']
])}`)}
${BOX('Second example (doctor\'s guide)', `<p>X = [[1,1],[2,1],[3,1]], y = [2,3,4] (here the column of 1s is the <b>second</b> column).</p>
${WL([
 ['X<sup>T</sup>X = [[14, 6],[6, 3]], X<sup>T</sup>y = [20, 9].', '14 = 1+4+9, 6 = 1+2+3, 3 = three ones; 20 = 2+6+12, 9 = 2+3+4.'],
 ['det = 14·3 − 6·6 = 6; inverse = <sup>1</sup>⁄<sub>6</sub>[[3,−6],[−6,14]].', 'Same 2×2 inverse rule.'],
 ['β = <sup>1</sup>⁄<sub>6</sub>[3·20 − 6·9, −6·20 + 14·9] = <sup>1</sup>⁄<sub>6</sub>[6, 6] = [1, 1].', 'First entry multiplies the x column (slope), second the 1s column (intercept): y = x + 1. Check: 1→2, 2→3, 3→4 ✓.']
])}`)}
<h2>5. What OLS really does</h2>
${WL([
 ['Ordinary Least Squares = minimizing the MSE = minimizing the distance between y and ŷ = minimizing the <b>length of the residual vector</b> e = y − ŷ.', 'Three ways to say the same thing.'],
 ['Geometry: Xβ can only reach vectors in the <b>column space</b> (span) of X.', 'All linear combinations of the columns. y is usually outside it.'],
 ['ŷ = Xβ̂ is the <b>orthogonal projection</b> of y onto the column space: ŷ = X(X<sup>T</sup>X)<sup>−1</sup>X<sup>T</sup>y.', 'The closest point to y that we can reach.'],
 ['Orthogonality condition: <b>X<sup>T</sup>e = 0</b> → the residual is perpendicular to every feature column.', 'If the residual still had a component along a feature, moving β in that direction would reduce the error.']
])}
<h2>6. When the formula breaks: multicollinearity</h2>
${WL([
 ['The normal equation needs X<sup>T</sup>X to be <b>invertible</b>: X must have <b>full rank</b> (linearly independent features).', 'Otherwise no unique β.'],
 ['Data is <b>collinear</b> when: n &lt; p + 1; a feature is constant; two features are proportional (x<sub>1</sub> = 3x<sub>2</sub>); or otherwise linearly related.', 'Then we cannot get the inverse.'],
 ['Example: X = [[1,2],[2,4],[3,6]] → X<sup>T</sup>X = [[14,28],[28,56]], det = 14·56 − 28·28 = 0 → singular.', 'Column 2 = 2 × column 1.'],
 ['Highly correlated features → X<sup>T</sup>X <b>ill-conditioned</b> (det ≈ 0) → <b>numerical instability</b>, coefficients blow up, small data changes → big coefficient changes.', 'This is <b>multicollinearity</b>.'],
 ['Remedies: <b>remove or combine</b> correlated features; <b>Ridge regularization</b>.', 'Ridge adds λI to X<sup>T</sup>X, which makes it invertible (Lecture 5).']
])}
<h2>7. Orthonormal features are nice</h2>
${WL([
 ['<b>Orthonormal</b> = orthogonal (x<sub>i</sub><sup>T</sup>x<sub>j</sub> = 0 for i ≠ j) and unit length (x<sub>i</sub><sup>T</sup>x<sub>i</sub> = 1).', 'Example: x<sub>1</sub> = [1,0], x<sub>2</sub> = [0,1].'],
 ['Then X<sup>T</sup>X = I and β = X<sup>T</sup>y.', 'No inversion needed: each coefficient computed independently.'],
 ['Benefits: interpretability (each coefficient = direct effect), stability (no singularity), simple calculation.', 'Orthogonal vectors: pairwise dot product = 0, e.g. [3,1,1], [−1,2,1], [−1/2,−2,7/2].']
])}
<h2>8. Why not always use the formula? (computation)</h2>
${WL([
 ['β = (X<sup>T</sup>X)<sup>−1</sup>X<sup>T</sup>y is good for <b>math</b>, terrible for <b>computation</b>: "never program your solver like that".', 'Inverting a matrix costs about <b>O(p<sup>3</sup>)</b> in the number of features and lots of memory, and is unstable when X<sup>T</sup>X is near-singular.'],
 ['In practice: <b>SVD</b> X = USV<sup>T</sup> (U, V orthonormal columns, S diagonal with singular values) → ŷ = UU<sup>T</sup>y, β = VS<sup>−1</sup>U<sup>T</sup>y.', 'Just know the idea. Lesson: strong correlations → small singular values → numerical problems.'],
 ['<b>Gradient descent</b> is often the first choice even for linear regression: works for many more models and can be easier to implement.', 'But GD works badly if features are <b>unscaled</b>: the bowl becomes a long narrow valley.']
])}
<h2>9. Gradient descent vs normal equation</h2>
<div class="tblwrap"><table class="tbl"><tr><th></th><th>Gradient descent</th><th>Normal equation (OLS / closed form)</th></tr>
<tr><td><b>Computation type</b></td><td>Iterative optimization</td><td>Direct (closed-form) solution</td></tr>
<tr><td><b>Time</b></td><td>Depends on the number of iterations and dataset size</td><td>Fast for small datasets, expensive for large (matrix inversion)</td></tr>
<tr><td><b>Memory</b></td><td>Stores only the current parameters</td><td>Stores the entire design matrix X</td></tr>
<tr><td><b>Scalability</b></td><td>Scales to very large datasets</td><td>Not suitable for very large datasets</td></tr>
<tr><td><b>Accuracy</b></td><td>Approximates the solution over iterations</td><td>Exact solution if the inverse exists</td></tr>
<tr><td><b>Adaptability</b></td><td>Stochastic versions (SGD), mini-batches, other models</td><td>Only standard linear regression</td></tr>
<tr><td><b>Convergence</b></td><td>May need many iterations (could get stuck)</td><td>Immediate once computed</td></tr>
<tr><td><b>Implementation</b></td><td>Needs hyperparameters like the learning rate</td><td>Simpler: one direct formula</td></tr>
<tr><td><b>Feature scaling</b></td><td>Needed (works badly if unscaled)</td><td>Not needed</td></tr></table></div>
<div data-mlw="normeq"></div>
`;

LEARN.l4 = `
<h2>1. The goal</h2>
<p>We get the <b>same</b> MSE cost function again, but this time from <b>probability</b>, using the principle of <b>maximum likelihood</b>. Result: under Gaussian noise, <b>MLE = OLS</b>.</p>
<h2>2. Probability recap</h2>
${WL([
 ['<b>Discrete</b> random variable → <b>pmf</b> (probability mass function): probabilities add up to 1.', 'Example: a die.'],
 ['<b>Continuous</b> random variable → <b>pdf</b> (probability density function): area under the curve ∫f(x)dx = 1.', 'Example: height.'],
 ['<b>Mean (expectation)</b> E[X] = Σ x·P(X = x): the weighted average of the values.', 'Slide example: values 3, 4, 6, 8 with probabilities 0.1, 0.2, 0.4, 0.3 → E[X] = 0.3 + 0.8 + 2.4 + 2.4 = 5.9. Not a possible value of X: it is an average!'],
 ['<b>Variance</b> Var[X] = E[(X − E[X])<sup>2</sup>] = E[X<sup>2</sup>] − (E[X])<sup>2</sup>: how spread out X is.', 'High variance → values far from the mean; low variance → values tightly around the mean. Mean and variance are <b>numbers</b>, not random.']
])}
<h2>3. Covariance, correlation, independence</h2>
${WL([
 ['<b>Covariance</b> Cov[X,Y] = E[(X − E[X])(Y − E[Y])] = E[XY] − E[X]E[Y]: how X and Y deviate from their means <b>together</b>.', 'Positive: they increase together. Negative: one up, the other down. 0: no linear relation.'],
 ['<b>Correlation</b> Corr[X,Y] = Cov[X,Y] / √(Var(X)Var(Y)) → between −1 and 1.', 'Covariance scaled so it has no units.'],
 ['<b>Independent ⇒ uncorrelated</b> (Cov = 0). But <b>uncorrelated ⇏ independent</b>.', 'Example: Y = X<sup>2</sup> with X symmetric around 0 → correlation ≈ 0, yet Y is completely determined by X (non-linear dependence).'],
 ['Rule of thumb: <b>independence</b> = complete lack of any relationship; <b>correlation</b> only measures the lack of a <b>straight-line</b> relationship.', 'Uncorrelated ⇔ E[XY] = E[X]E[Y].'],
 ['Var(X + Y) = Var(X) + Var(Y) <b>iff</b> Cov(X,Y) = 0.', 'In general Var(X+Y) = Var X + Var Y + 2Cov(X,Y).']
])}
<h2>4. The probabilistic model</h2>
${FX('y = Xβ + ε, &nbsp;&nbsp; ε<sub>i</sub> ~ N(0, σ<sup>2</sup>) i.i.d.')}
${WL([
 ['X (features) is known, <b>not random</b>. y is <b>random</b> because of the noise ε.', 'The true relationship g(x) exists; the data are <b>noisy observations</b> of it.'],
 ['The errors ε<sub>i</sub> are <b>i.i.d.</b>: independent and identically distributed.', 'Like fair coin throws: no memory (independent), and every throw is 50/50 (identical).'],
 ['ε ~ N(0, σ<sup>2</sup>I<sub>n</sub>): mean 0, variance σ<sup>2</sup>, every two noise samples independent.', 'Data points are not exactly on the line but <b>spread around it</b> with a Gaussian shape.'],
 ['So y<sub>i</sub> ~ N(β<sup>T</sup>x<sup>(i)</sup>, σ<sup>2</sup>): the <b>peak</b> of the distribution is <b>on the line</b>.', 'E(y<sub>i</sub>) = β<sup>T</sup>x<sup>(i)</sup> + E(ε<sub>i</sub>) = β<sup>T</sup>x<sup>(i)</sup>. The prediction is a distribution, which tells how confident we are.'],
 ['σ<sup>2</sup> = the <b>irreducible error</b>: the minimum achievable expected MSE on new data.', 'Even the true line cannot do better.']
])}
<h2>5. Maximum likelihood → least squares</h2>
${WL([
 ['<b>Likelihood</b> P(y | X, β): how likely the observed data is for a given β.', 'MLE = choose the β that makes the data we saw <b>most likely</b>.'],
 ['For one point: f(y<sub>i</sub>) = <sup>1</sup>⁄<sub>√(2πσ²)</sub> exp(−(y<sub>i</sub> − β<sup>T</sup>x<sup>(i)</sup>)<sup>2</sup> / 2σ<sup>2</sup>). For all points: <b>multiply</b> (independent).', 'The product of n Gaussian densities.'],
 ['Take the <b>log</b>: the product becomes a sum, the exp disappears.', 'Log-likelihood = constant − <sup>1</sup>⁄<sub>2σ²</sub> Σ (y<sub>i</sub> − β<sup>T</sup>x<sup>(i)</sup>)<sup>2</sup>.'],
 ['Maximizing it = <b>minimizing Σ (y<sub>i</sub> − β<sup>T</sup>x<sup>(i)</sup>)<sup>2</sup></b> = least squares!', 'Maximizing the log-likelihood = minimizing the <b>negative</b> log-likelihood.'],
 ['Derivative = 0 gives the same normal equations → <b>same solution</b> as multiple linear regression.', '<sup>1</sup>⁄<sub>σ²</sub> Σ (y<sub>i</sub> − β<sup>T</sup>x<sup>(i)</sup>) x<sub>k</sub><sup>(i)</sup> = 0.']
])}
${KEY('<b>OLS is equivalent to MLE</b> when the errors are <b>normally distributed</b>. OLS is also an <b>MMSE</b> estimator (minimum mean squared error) and minimizes the <b>length of the residual vector</b>. All of them give the same β.')}
<h2>6. The slope = covariance / variance</h2>
${FX('β̂<sub>1</sub> = <sup>Cov(x, y)</sup>⁄<sub>Var(x)</sub> = <sup>(mean of xy) − x̄ȳ</sup>⁄<sub>(mean of x²) − x̄²</sub>, &nbsp;&nbsp; β̂<sub>0</sub> = ȳ − β̂<sub>1</sub>x̄')}
${WL([
 ['β<sub>1</sub> = change in y for a <b>one-unit change in x</b>.', 'Covariance: how x and y move together. Variance: how spread x is.'],
 ['Sign of β<sub>1</sub> = sign of the covariance.', 'β<sub>1</sub> &gt; 0 → y increases with x; β<sub>1</sub> &lt; 0 → y decreases.'],
 ['β<sub>1</sub> = 0 → <b>horizontal</b> line: x does not affect y.', 'The prediction is always ȳ.']
])}
${BOX('Example by hand', `Points (1,2), (2,4), (3,5).
${WL([
 ['x̄ = 2, ȳ = 11/3 ≈ 3.667.', 'Means.'],
 ['Cov(x,y) = mean of xy − x̄ȳ = (2 + 8 + 15)/3 − 2·11/3 = 25/3 − 22/3 = 1.', 'Sample covariance as in the slide (dividing by n).'],
 ['Var(x) = mean of x² − x̄² = 14/3 − 4 = 2/3.', '(1 + 4 + 9)/3 = 14/3.'],
 ['β<sub>1</sub> = 1 / (2/3) = 1.5; β<sub>0</sub> = 11/3 − 1.5·2 = 2/3 ≈ 0.667.', 'Line: ŷ = 0.667 + 1.5x.']
])}`)}
`;

LEARN.l5 = `
<h2>1. Polynomial regression is still linear regression</h2>
${FX('f(x) = β<sub>0</sub> + β<sub>1</sub>x + β<sub>2</sub>x<sup>2</sup> + β<sub>3</sub>x<sup>3</sup>')}
${WL([

<div data-mlw="poly"></div>
<h2>2. Underfitting vs overfitting</h2>
<div class="tblwrap"><table class="tbl"><tr><th></th><th>Underfitting</th><th>Overfitting</th></tr>
<tr><td><b>Model</b></td><td>Too simple</td><td>Too flexible / complex</td></tr>
<tr><td><b>Bias / variance</b></td><td>High bias, low variance</td><td>Low bias, high variance</td></tr>
<tr><td><b>Training error</b></td><td>High</td><td>Very low (it even learns the noise)</td></tr>
<tr><td><b>Testing error</b></td><td>High</td><td>High (does not generalize)</td></tr>
<tr><td><b>Fix</b></td><td>More expressive model, richer features</td><td>Simpler model, more data, regularization</td></tr></table></div>
${WL([
 ['As complexity grows, <b>training error keeps going down</b>, but <b>testing error goes down then up</b>.', 'The <b>gap</b> between them = overfitting. The bottom of the test curve = <b>optimal complexity</b>.'],
 ['Low training error can <b>fool you</b> when you overfit.', 'Training error reflects bias but not much variance; test error reflects both.']
])}
<h2>3. The bias–variance tradeoff</h2>
${FX('Expected test error (model risk) = Bias<sup>2</sup> + Variance + σ<sup>2</sup> (irreducible error / noise)')}
${WL([
 ['<b>Bias</b>: error from the model\'s <b>simplifying assumptions</b>. Model bias = E[ŷ] − g(x): gap between the truth and the model\'s <b>average</b> prediction.', 'High bias = the model is too simple → <b>underfits</b> (systematic errors).'],
 ['<b>Variance</b>: error from <b>sensitivity</b> to small changes in the training set.', 'High variance = too complex → <b>overfits</b>, captures noise ("the picture of the cat with the fly"). It comes from the random sample x<sub>1</sub>…x<sub>n</sub>.'],
 ['<b>Noise / irreducible error</b> σ<sup>2</sup>: randomness in the data itself (observation variance).', 'No model can remove it. It is the σ<sup>2</sup> of Lecture 4.'],
 ['They pull in <b>opposite directions</b>: ↑ complexity → bias ↓, variance ↑; ↓ complexity → bias ↑, variance ↓.', 'Goal: the <b>sweet spot</b> where the total is minimal. Ideal: low bias AND low variance.'],
 ['Model risk = total test error = residual error = mean squared prediction error.', 'It is an expectation, so a fixed number for a given x.']

${BOX('Numerical example (doctor\'s guide)', `<div class="tblwrap"><table class="tbl"><tr><th>Complexity</th><th>Bias²</th><th>Variance</th><th>Irreducible</th><th>Total</th></tr>
<tr><td>1 (underfit)</td><td>0.50</td><td>0.10</td><td>0.15</td><td>0.75</td></tr><tr><td>3</td><td>0.30</td><td>0.15</td><td>0.15</td><td>0.60</td></tr>
<tr><td>5 (optimal)</td><td>0.15</td><td>0.25</td><td>0.15</td><td><b>0.55</b></td></tr><tr><td>7</td><td>0.10</td><td>0.40</td><td>0.15</td><td>0.65</td></tr><tr><td>10 (overfit)</td><td>0.05</td><td>0.70</td><td>0.15</td><td>0.90</td></tr></table></div>
${WL([['Total = Bias² + Variance + Irreducible (each row adds up).', 'E.g. 0.15 + 0.25 + 0.15 = 0.55.'],['Best = complexity 5: the smallest total.', 'Bias is low enough to capture the pattern, variance not yet too high. The irreducible part never changes.']])}`)}
${KEY('Notes from the slides: adding a <b>good</b> feature reduces bias; adding a bad feature rarely increases it. Adding a feature usually <b>increases variance</b> (don\'t add one unless it reduces bias more). You cannot reduce the irreducible error. We cannot measure bias/variance exactly on real data (we don\'t know g), but we can test algorithms on synthetic data. Simple models (e.g. linear regression) → higher bias, lower variance; complex models → lower bias, higher variance.')}
<h2>4. Regularization</h2>
${FX('minimize &nbsp; <sup>1</sup>⁄<sub>n</sub>‖y − Xβ‖<sup>2</sup> + λR(β)')}
${WL([

<h3>Lasso (L1) and Ridge (L2)</h3>
${FX('Lasso: R(β) = ‖β‖<sub>1</sub> = Σ|β<sub>j</sub>| &nbsp;&nbsp;&nbsp;&nbsp; Ridge: R(β) = ‖β‖<sub>2</sub><sup>2</sup> = Σβ<sub>j</sub><sup>2</sup>')}
${WL([

<h3>Ridge in formulas (light)</h3>
${WL([
 ['Loss: 𝓛 = <sup>1</sup>⁄<sub>n</sub>‖y − Xβ‖<sup>2</sup> + λ‖β‖<sup>2</sup>; gradient ∇𝓛 = −<sup>2</sup>⁄<sub>n</sub>X<sup>T</sup>(y − Xβ) + 2λβ.', 'The extra 2λβ comes from the derivative of λΣβ<sub>j</sub><sup>2</sup>.'],
 ['GD step: β ← (1 − 2ηλ)β + η<sup>2</sup>⁄<sub>n</sub>X<sup>T</sup>(y − Xβ): <b>"weight decay"</b>.', 'Every step first shrinks β a little (×(1 − 2ηλ)).'],
 ['Closed form: <b>β = (X<sup>T</sup>X + nλI)<sup>−1</sup>X<sup>T</sup>y</b> → a <b>shrinkage estimator</b>.', 'Adding nλI makes the matrix invertible even with collinear features. If X<sup>T</sup>X has full rank, the optimal λ &gt; 0 (Hoerl and Kennard, 1970).'],

<h2>5. Training, validation and test sets</h2>
${WL([

  const info = h('div', { class: 'mlinfo' });
  const draw = () => { const p = 1 / (1 + Math.exp(-z)); gg.innerHTML = ''; gg.append(sv('circle', { cx: P.X(z), cy: P.Y(p), r: 6, class: 'pt' }));

MLW.threshold = host => {
  const POS = [0.95, 0.9, 0.85, 0.78, 0.7, 0.62, 0.4, 0.3], NEG = [0.8, 0.66, 0.58, 0.55, 0.52, 0.45, 0.42, 0.38, 0.35, 0.33, 0.3, 0.28, 0.25, 0.22, 0.2, 0.18, 0.15, 0.13, 0.12, 0.1, 0.08, 0.07, 0.06, 0.05, 0.04, 0.02];
  let t = 0.5;
  const strip = plotBox(420, 90, [0, 1], [0, 1], 20); const sg = sv('g'); strip.svg.append(sg);
  const roc = plotBox(220, 220, [0, 1], [0, 1], 28); const rg = sv('g'); roc.svg.append(rg);
  const cm = h('div'); const info = h('div', { class: 'mlinfo' });
  const met = th => { const TP = POS.filter(p => p >= th).length, FN = POS.length - TP, FP = NEG.filter(p => p >= th).length, TN = NEG.length - FP; return { TP, FN, FP, TN }; };
  let rp = ''; [-0.01, ...[...POS, ...NEG].sort((a, b) => a - b), 1.01].forEach((th, i) => { const m = met(th); rp += (i ? 'L' : 'M') + roc.X(m.FP / 26).toFixed(1) + ',' + roc.Y(m.TP / 8).toFixed(1); });
  roc.svg.insertBefore(sv('path', { d: rp, class: 'ln' }), rg); roc.svg.insertBefore(sv('line', { x1: roc.X(0), y1: roc.Y(0), x2: roc.X(1), y2: roc.Y(1), class: 'thr' }), rg);
  const draw = () => { const { TP, FN, FP, TN } = met(t); sg.innerHTML = '';
    POS.forEach((p, i) => sg.append(sv('circle', { cx: strip.X(p), cy: 25 + (i % 2) * 10, r: 5, class: 'pos' }))); NEG.forEach((p, i) => sg.append(sv('circle', { cx: strip.X(p), cy: 55 + (i % 3) * 8, r: 4.5, class: 'neg' })));
    sg.append(sv('line', { x1: strip.X(t), y1: 6, x2: strip.X(t), y2: 82, class: 'cut' }));
    rg.innerHTML = ''; rg.append(sv('circle', { cx: roc.X(FP / 26), cy: roc.Y(TP / 8), r: 6, class: 'pt' }));
    const f = x => isFinite(x) ? Math.round(x * 100) + '%' : '—';
    cm.innerHTML = `<table class="tbl cm"><tr><th></th><th>Predicted positive</th><th>Predicted negative</th></tr><tr><th>Actual positive</th><td class="ok">TP = ${TP}</td><td class="no">FN = ${FN}</td></tr><tr><th>Actual negative</th><td class="no">FP = ${FP}</td><td class="ok">TN = ${TN}</td></tr></table>`;
    info.innerHTML = `Accuracy ${f((TP + TN) / 34)} · Precision ${f(TP / (TP + FP))} · Recall/TPR ${f(TP / 8)} · Specificity ${f(TN / 26)} · FPR ${f(FP / 26)} · F1 ${f(2 * TP / (2 * TP + FP + FN))}`; };
  host.append(h('div', { class: 'widget' }, h('div', { class: 'w-title' }, 'Try it: move the threshold (the cancer example)'), h('p', { class: 'small muted' }, 'Top: predicted probabilities. Red = actually sick (8), grey = healthy (26). Everything right of the line is predicted positive. At 0.5 you get the slide\'s TP 6, FN 2, FP 5, TN 21. Right: the ROC curve and where your threshold is on it.'),
    strip.svg, slider('threshold t', 0, 1, 0.01, t, v => { t = v; draw(); }).el, h('div', { class: 'mlrow' }, cm, roc.svg), info));
  draw();
};

  DIFF('machine learning', 'deep learning', [['Scope', 'Learning from experience in general', 'A family of algorithms inspired by the brain'], ['Relation', 'Contains DL', 'Subset of ML']]),
  DIFF('learning to predict', 'learning to explain', [['Goal', 'Good predictions on new data', 'Understand the relationship in the data'], ['Care about model structure', 'Not necessarily', 'Yes, it is the point'], ['Example', 'Stock price development', 'Risk factors of a disease'], ['Tradition', 'ML', 'Classical statistics']]),
  DIFF('attribute', 'feature', [['Meaning', 'A raw numerical variable describing the object', 'A custom description built from attributes'], ['Example', 'Age, BMI', '"Old man", "BMI above obesity threshold"'], ['In practice', 'Used interchangeably', 'Used interchangeably']]),
  DIFF('mean squared error', 'absolute (L1) error', [['Formula', '(1/2n) Σ (f(x) − y)²', '(1/n) Σ |f(x) − y|'], ['Big errors', 'Punished more (squared)', 'Punished linearly'], ['Units', 'Squared units', 'Same units as y']]),

  WHATIF('What happens if a model is trained on biased data?', 'The model becomes <b>as biased as the data</b>: e.g. face recognition working worse on minorities, CV rating systems learning socio-economic biases.', ['Model inherits the bias', 'Example']),
  WHATIF('What happens if a predictive model gets a slightly perturbed input?', 'It may <b>fail</b>: models can be <b>non-robust</b>, which makes them hard to deploy.', ['May fail', 'Non-robust / not deployable']),
  WHATIF('What happens if we choose a very simple model class?', 'It is easy to find the best model in it, but it may not be <b>expressive</b> enough to fit the data → poor predictions (tradeoff between expressiveness and difficulty of finding a good model).', ['Easy to optimize', 'Not expressive enough']),
  ADV('Give the advantages and limitations of machine learning compared with writing rules by hand.', 'Advantages: no manual rules, handles problems humans can\'t explain, improves with more data, can customize. Limitations: as biased as the data, may fail on perturbed input (non-robust), needs lots of data.', ['Advantage(s)', 'Limitation(s)']),
  EX('Give one example each of supervised, unsupervised and reinforcement learning.', 'Supervised: predicting house prices / diabetes risk. Unsupervised: finding clusters or outliers. Reinforcement: an agent playing chess or Go, controlling cooling systems.', ['Supervised example', 'Unsupervised example', 'Reinforcement example']),
  EX('Give an example of a regression problem and a classification problem.', 'Regression: predicting a house price or diabetes risk score. Classification: spam vs not spam, type of residence.', ['Regression example', 'Classification example']),
  EX('Give two everyday applications of ML.', 'Search engines, personal assistants (Siri), spam/fraud detection, games, recommender systems, medicine, self-driving cars.', ['Two correct examples']),
  FIX('A student wrote: "<i>In y = θ₁x + θ₀, x is the dependent variable and y is the independent variable.</i>" Correct it.', 'It is the opposite: <b>x is the independent</b> variable (input / feature) and <b>y is the dependent</b> variable (target). (One slide in 01b swaps them by mistake.)', ['x independent', 'y dependent']),
  FIX('A student wrote: "<i>Unsupervised learning is the icing on the cake.</i>" Correct it.', 'Unsupervised = the <b>cake</b>; supervised = the icing; reinforcement = the cherry.', ['Unsupervised = cake', 'Supervised = icing']),
  FIX('A student wrote: "<i>Classification fits a curve through the targets, regression separates the classes.</i>" Correct it.', 'Swapped: <b>regression</b> fits a curve; <b>classification</b> finds a hyperplane separating the classes.', ['Regression fits a curve', 'Classification separates classes'])
]};

LECT.l2 = { ln: 'L2', name: 'Linear Regression & Gradient Descent', title: 'Lecture 02a', covers: 'linear regression, the equation and its terms, inference, MSE loss and why squared, residuals, RMSE, evaluation metrics, iterative vs closed form, gradient descent, convex cost, learning rate, local vs global minima, partial derivatives, update rule, convergence, LMS rule, assumptions',
items: [
  M('Linear regression is a ___ algorithm.', ['Unsupervised', 'Supervised', 'Reinforcement', 'Clustering'], 1),
  M('Linear regression is also known as ___.', ['Maximum entropy', 'Least squares estimation', 'Logistic estimation', 'K-means'], 1),
  M('In y = β₀ + β₁x₁ + … + β_px_p + ε, the β\'s are ___.', ['Features', 'Coefficients (weights) learned by the model', 'Errors', 'Labels'], 1),
  M('In the linear regression equation, ε is ___.', ['The learning rate', 'The irreducible error', 'The intercept', 'The slope'], 1),
  M('ε collects ___.', ['All the unmodeled parts of the data', 'The coefficients', 'The features', 'The predictions'], 0),
  M('Predicting future values with ŷ = β̂₀ + β̂₁x₁ + … is often called ___.', ['Training', 'Inference', 'Regularization', 'Clustering'], 1),
  M('β₀ is the ___.', ['Slope', 'Intercept (value of y when x = 0)', 'Learning rate', 'Error'], 1),
  M('β₁ in simple linear regression is the ___.', ['Intercept', 'Slope: change in y for a one-unit change in x', 'Noise', 'Loss'], 1),
  M('MSE = ___.', ['(1/n) Σ |yᵢ − ŷᵢ|', '(1/n) Σ (yᵢ − ŷᵢ)²', 'Σ (yᵢ − ŷᵢ)', '√Σ yᵢ'], 1),
  M('A residual is ___.', ['ŷ − β', 'The vertical distance yᵢ − ŷᵢ between a point and the line', 'The slope', 'The learning rate'], 1),
  M('Why are errors squared in MSE?', ['To make them negative', 'So positive and negative errors don\'t cancel, and far points get more weight', 'To make computation slower', 'To ignore outliers'], 1),
  M('MSE ___ outliers.', ['Ignores', 'Punishes (gives more weight to)', 'Removes', 'Labels'], 1),
  M('The disadvantage of MSE for interpretation is that ___.', ['It is always zero', 'The error is in squared units (fixed by RMSE)', 'It has no derivative', 'It is negative'], 1),
  M('RMSE = ___.', ['MSE²', '√MSE', 'MSE / n', '1 − MSE'], 1),
  M('A higher cost (MSE) means ___.', ['A better model', 'The model performs poorly on the training set', 'Lower error', 'The learning rate is good'], 1),
  M('The two ways to estimate coefficients discussed are ___.', ['Random and manual', 'An iterative solution and a closed-form solution', 'Clustering and voting', 'Rewards and penalties'], 1),
  M('Gradient descent is a(n) ___ algorithm.', ['Closed-form', 'Iterative optimization', 'Clustering', 'Classification'], 1),
  M('Gradient descent finds the minimum of a ___ function.', ['Linear', 'Convex', 'Random', 'Discrete'], 1),
  M('The gradient points in the direction where the function ___.', ['Decreases', 'Increases (and how fast)', 'Is zero', 'Is constant'], 1),
  M('Gradient descent takes steps ___ the gradient.', ['In the same direction as', 'Opposite to', 'Perpendicular to', 'Ignoring'], 1),
  M('The update rule of gradient descent is ___.', ['β ← β + η dL/dβ', 'β ← β − η dL/dβ', 'β ← dL/dβ', 'β ← η'], 1),
  M('η (or α) in gradient descent is the ___.', ['Intercept', 'Learning rate', 'Error', 'Number of features'], 1),
  M('If the learning rate is too small, gradient descent ___.', ['Diverges', 'May be slow', 'Overshoots', 'Never moves'], 1),
  M('If the learning rate is too large, gradient descent may ___.', ['Be slow', 'Overshoot, never reach the minimum, or diverge', 'Stop immediately', 'Find the exact answer in one step'], 1),
  M('A cost function with several valleys can trap gradient descent in a ___.', ['Global minimum', 'Local minimum', 'Saddle of rewards', 'Cluster'], 1),
  M('∂𝓛/∂β₀ for simple linear regression with MSE is ___.', ['−(2/n) Σ (yᵢ − ŷᵢ) xᵢ', '−(2/n) Σ (yᵢ − ŷᵢ)', '(1/n) Σ yᵢ', '2β₀'], 1),
  M('∂𝓛/∂β₁ for simple linear regression with MSE is ___.', ['−(2/n) Σ (yᵢ − ŷᵢ) xᵢ', '−(2/n) Σ (yᵢ − ŷᵢ)', 'Σ xᵢ', '−2β₁'], 0),
  M('In gradient descent, β₀ and β₁ are updated ___.', ['One after the other with new values', 'Simultaneously', 'Only β₁', 'Randomly'], 1),
  M('A typical stopping condition for gradient descent is ___.', ['After exactly one step', 'When ‖θᵢ − θᵢ₋₁‖ (or the change in cost) is small', 'When the learning rate is 0', 'Never'], 1),
  M('The gradient descent update rule for linear regression with MSE is also known as ___.', ['Newton\'s method', 'Least Mean Squares (LMS) or Widrow-Hoff rule', 'Softmax', 'Lasso'], 1),
  M('The cost function of linear regression with two parameters looks like ___.', ['A straight line', 'A bowl (convex surface)', 'A sine wave', 'A step'], 1),
  M('The learning rate is a ___.', ['Parameter learned by the model', 'Hyperparameter we choose', 'Feature', 'Label'], 1),
  M('Which is an assumption of linear regression?', ['Errors are uniformly distributed', 'Linearity between x and y', 'Features must be categorical', 'There is no noise'], 1),

  T('Linear regression predicts a numeric response from one or more independent variables.', true),
  T('Linear regression is rarely used today because of neural networks.', false, 'It is still <b>widely used</b>: effective, easy to interpret, easy to extend.'),
  T('The coefficients β are what the model learns during optimization.', true),
  T('We can always know the true parameters of the model.', false, 'We may <b>never know</b> the true parameters; we <b>estimate</b> them.'),
  T('Squaring errors lets positive and negative errors cancel out.', false, 'Squaring <b>prevents</b> them from cancelling.'),
  T('MSE gives more weight to points far from the line.', true),
  T('Lower MSE means a better model.', true),
  T('In practice, we fit the model on the training set and evaluate MSE on the test set.', true),
  T('The evaluation metric should reflect what you actually care about.', true),
  T('Selecting coefficients by hand is easy for models with many features.', false, 'It quickly becomes <b>infeasible</b>.'),
  T('Gradient descent moves in the direction where the error function increases.', false, 'It moves in the <b>opposite</b> direction.'),
  T('With a very small learning rate, gradient descent is slower but more stable.', true),
  T('With a very large learning rate, gradient descent always converges faster.', false, 'It may <b>overshoot</b> and <b>diverge</b>.'),
  T('Gradient descent starts from a random initial value.', true),
  T('Steps are proportional to the rate of change of the error.', true),
  T('In 2D, the update is β ← β − η∇𝓛 for the vector β = (β₀, β₁).', true),
  T('Partial derivative ∂𝓛/∂β₁ is computed with β₀ fixed.', true),
  T('The MSE cost of linear regression has many local minima.', false, 'It is <b>convex</b> (a bowl): one global minimum.'),
  T('The residuals of linear regression should be normally distributed (assumption, useful for inference).', true),

  C('MSE = (1/n) Σ (yᵢ − ___)².', ['ŷᵢ', 'yhat', 'y hat', 'ŷ', 'predicted']),
  C('The square root of the MSE is called ___.', ['RMSE', 'root mean squared error', 'root MSE']),
  C('In gradient descent, ___ is the learning rate.', ['η', 'eta', 'alpha', 'α']),
  C('Gradient descent is an ___ optimization algorithm that finds the minimum of a ___ function.', [['iterative'], ['convex']]),
  C('Update rule: β ← β − η · d𝓛/d___.', ['β', 'beta']),
  C('If the learning rate is too large, gradient descent may ___ the minimum.', ['overshoot', 'miss', 'skip']),
  C('The gradient descent update for linear regression is known as the LMS or ___-Hoff rule.', ['Widrow']),
  C('Linear regression is also known as Least ___ Estimation.', ['Squares']),
  C('The two estimation methods: an iterative solution and a ___-form solution.', ['closed']),
  C('ε is called the ___ error.', ['irreducible']),
  C('The three assumptions of linear regression: linearity, ___ and normality of errors.', ['independence']),

  MATCH('Match each symbol with its meaning.', [['y', 'Dependent variable (target)'], ['xₖ', 'Independent variable (feature)'], ['βₖ', 'Coefficient (weight)'], ['ε', 'Irreducible error'], ['η', 'Learning rate']]),
  MATCH('Match each learning rate with its effect.', [['Too small', 'Slow convergence'], ['Too large', 'Overshoots / may diverge'], ['Well chosen', 'Reaches the minimum efficiently']]),
  ORD('Put the gradient descent algorithm in order.', ['Initialize the coefficients randomly', 'Compute the predictions and the gradient of the loss', 'Update all coefficients: β ← β − η∇𝓛', 'Repeat until the change is small (convergence)']),
  ORD('Put the MSE computation in order.', ['Compute the prediction ŷᵢ for every point', 'Compute each residual yᵢ − ŷᵢ', 'Square each residual', 'Add them up and divide by n']),

  NUM('Points (1,2), (2,4), (3,5) and the line ŷ = 1 + 1.5x. Compute the <b>MSE</b>. (Round to 3 decimals.)', 0.167, 'ŷ = 2.5, 4, 5.5 → residuals −0.5, 0, −0.5 → (0.25 + 0 + 0.25)/3 = <b>0.167</b>.'),
  NUM('Points (0,1), (1,3), (2,5) and the line ŷ = 1 + x. Compute the <b>MSE</b>.', 1.667, 'ŷ = 1, 2, 3 → residuals 0, 1, 2 → (0 + 1 + 4)/3 = 5/3 ≈ <b>1.667</b>.'),
  NUM('The MSE of a model is 16. What is its <b>RMSE</b>?', 4, 'RMSE = √16 = <b>4</b>.'),
  NUM('One gradient descent step: data (1,2), (2,4); start β₀ = β₁ = 0; η = 0.1. What is the new <b>β₀</b>?', 0.6, 'Errors y − ŷ = 2, 4. ∂𝓛/∂β₀ = −(2/2)(2 + 4) = −6. β₀ = 0 − 0.1(−6) = <b>0.6</b>.'),
  NUM('Same step: data (1,2), (2,4); β₀ = β₁ = 0; η = 0.1. What is the new <b>β₁</b>?', 1, '∂𝓛/∂β₁ = −(2/2)(2·1 + 4·2) = −10. β₁ = 0 − 0.1(−10) = <b>1</b>.'),
  NUM('1D gradient descent on J(w) = w². Start w = 4, η = 0.25. What is w after <b>one</b> step? (dJ/dw = 2w)', 2, 'w = 4 − 0.25·(2·4) = 4 − 2 = <b>2</b>.'),
  NUM('J(w) = w², start w = 4, η = 1.5. What is w after one step? (Watch what happens.)', -8, 'w = 4 − 1.5·8 = <b>−8</b>: it jumped to the other side and got further away → learning rate too large, diverges.'),
  NUM('A model ŷ = 3 + 2x. Predict y for x = 4.', 11, 'ŷ = 3 + 2·4 = <b>11</b> (inference = plug x in).'),

  DEF('linear regression', 'A <b>supervised</b> algorithm that models a <b>dependent variable y</b> as a <b>linear</b> function of independent variables (features) by finding the line / surface that best fits the data (least squares).', ['Supervised', 'y as linear function of features', 'Best-fit line / surface (least squares)']),
  DEF('residual', 'The difference between the observed and predicted value, yᵢ − ŷᵢ: the vertical distance from a data point to the regression line.', ['y − ŷ', 'Distance from point to line']),
  DEF('mean squared error (MSE)', 'MSE = (1/n) Σ (yᵢ − ŷᵢ)²: the <b>average of the squared</b> residuals. Measures how close predictions are to the true values; lower is better.', ['Formula', 'Average squared error / lower is better']),
  DEF('gradient descent', 'An <b>iterative</b> optimization algorithm that finds the coefficients minimizing a (convex) cost function by repeatedly stepping <b>opposite to the gradient</b>: β ← β − η∇𝓛.', ['Iterative', 'Steps opposite to the gradient', 'Update rule with learning rate']),
  DEF('learning rate', 'The hyperparameter η (α) that controls the <b>size of each step</b> in gradient descent. Too small → slow; too large → overshoot / diverge.', ['Step size', 'Too small slow / too large diverge']),
  DEF('gradient', 'The vector of partial derivatives of the loss; it shows the <b>direction</b> in which the function <b>increases</b> and the <b>rate</b> at which it increases.', ['Vector of partial derivatives', 'Direction and rate of increase']),
  DEF('irreducible error (ε)', 'The error term that collects all the <b>unmodeled</b> parts of the data (noise). No model can remove it.', ['Unmodeled part / noise', 'Cannot be removed']),
  DEF('inference (in linear regression)', 'Predicting future values by <b>plugging the feature values</b> into the fitted equation ŷ = β̂₀ + β̂₁x₁ + ….', ['Predict with the fitted equation']),
  W('Explain', 'Explain <b>why we square</b> the errors in MSE, and the cost of doing so.', 'Squaring (1) stops positive and negative errors from <b>cancelling</b>, (2) gives <b>more weight</b> to points far from the line (punishes outliers). Cost: the error is in <b>squared units</b> → less interpretable (use RMSE).', ['No cancelling', 'Punishes outliers / far points', 'Squared units → RMSE']),
  W('Explain', 'Explain the effect of the <b>learning rate</b> on gradient descent.', 'Too small: tiny steps → slow (but stable) convergence. Too large: overshoots the minimum, may never reach it, may diverge. A good value reaches the minimum efficiently.', ['Too small → slow', 'Too large → overshoot/diverge', 'Good value']),
  W('Write', 'Write the gradient descent update equations for β₀ and β₁ in simple linear regression with MSE.', 'β₀ ← β₀ − η(−(2/n) Σ (yᵢ − ŷᵢ))<br>β₁ ← β₁ − η(−(2/n) Σ (yᵢ − ŷᵢ) xᵢ)<br>Repeat until convergence, updating both simultaneously.', ['β₀ update', 'β₁ update', 'Repeat / simultaneous']),
  W('Write', 'Write the gradient descent algorithm (pseudocode).', 'theta = random_initialization()<br>while norm(theta − theta_prev) &gt; threshold:<br>&nbsp;&nbsp;theta_prev = theta<br>&nbsp;&nbsp;theta = theta_prev − step_size × gradient(theta_prev)', ['Random initialization', 'Loop until small change', 'Step against the gradient']),
  W('List', 'List the <b>assumptions of linear regression</b>.', 'Linearity (x and y linearly related); Independence (observations independent); Normality (residuals normally distributed).', ['Linearity', 'Independence', 'Normality of errors']),
  W('Explain', 'Explain each term in y = β₀ + β₁x₁ + … + β_px_p + ε.', 'y: dependent variable (what we predict). xₖ: independent variables (features). βₖ: coefficients / weights learned by the model (β₀ intercept). ε: irreducible error (unmodeled part).', ['y', 'xₖ', 'βₖ', 'ε']),

  DIFF('gradient descent', 'closed-form (analytical) solution', [['Type', 'Iterative', 'Direct formula'], ['Hyperparameters', 'Needs a learning rate', 'None'], ['Result', 'Approximation that improves each step', 'Exact (if the inverse exists)'], ['Large data', 'Scales well', 'Expensive (matrix inversion)']]),
  DIFF('small learning rate', 'large learning rate', [['Steps', 'Small', 'Big'], ['Speed', 'Slow convergence', 'Fast at first'], ['Risk', 'Takes too long', 'Overshoots, may diverge'], ['Stability', 'Stable', 'Unstable']]),
  DIFF('local minimum', 'global minimum', [['Meaning', 'Lowest point in a neighborhood', 'Lowest point of the whole function'], ['Gradient descent', 'Can get stuck there', 'The goal'], ['Linear regression MSE', 'None besides the global', 'Exactly one (convex)']]),
  DIFF('MSE', 'RMSE', [['Formula', '(1/n) Σ (y − ŷ)²', '√MSE'], ['Units', 'Squared units', 'Same units as y'], ['Interpretation', 'Harder', 'Easier']]),
  DIFF('parameter', 'hyperparameter', [['Who sets it', 'Learned from data', 'Chosen by us before training'], ['Example', 'β₀, β₁', 'Learning rate η'], ['Found by', 'GD / OLS', 'Trying values / validation']]),
  DIFF('residual', 'irreducible error (ε)', [['Meaning', 'Observed − predicted for a fitted model', 'Noise in the true relationship'], ['Can be reduced', 'Yes, by a better model', 'No']]),

  WHATIF('What happens if we use a learning rate that is too large?', 'The steps <b>overshoot</b> the minimum: the cost may go up and down, never reach the minimum, or <b>diverge</b> (explode).', ['Overshoot', 'May diverge']),
  WHATIF('What happens if we use a learning rate that is too small?', 'Gradient descent moves in tiny steps: it is <b>very slow</b> (needs many iterations) but stable.', ['Very slow', 'Many iterations']),
  WHATIF('What happens if the cost function is not convex?', 'Gradient descent may get stuck in a <b>local minimum</b> instead of the global minimum (it depends on the random starting point).', ['Local minimum', 'Depends on starting point']),
  WHATIF('What happens to MSE if one point is very far from the line (an outlier)?', 'Its squared error is <b>very large</b>, so the MSE grows a lot and the line is pulled towards the outlier: MSE punishes outliers.', ['Large squared error', 'MSE increases / line pulled']),
  ADV('Give the advantages and disadvantages of <b>linear regression</b>.', 'Advantages: simple, effective, easy to interpret, easy to extend, ideas reused everywhere. Disadvantages: assumes a linear relationship, sensitive to outliers (squared errors), can underfit complex data.', ['Advantages', 'Disadvantages']),
  ADV('Give the advantages and disadvantages of <b>MSE</b> as a loss.', 'Advantages: no cancelling of errors, punishes big errors, smooth and convex for linear regression (easy to minimize). Disadvantages: squared units (hard to interpret), very sensitive to outliers.', ['Advantages', 'Disadvantages']),
  ADV('Give the advantages and disadvantages of <b>gradient descent</b>.', 'Advantages: works for many models, scales to large data, low memory, easy to implement. Disadvantages: needs a learning rate, many iterations, approximate, can get stuck / diverge, needs feature scaling.', ['Advantages', 'Disadvantages']),
  EX('Give two examples of linear regression problems.', 'House price from number of rooms; weight from height and age; diabetes risk from BMI.', ['Two examples with y and x']),
  FIX('A student wrote the update rule as <b>β ← β + η·d𝓛/dβ</b>. What is wrong?', 'It must be <b>minus</b>: β ← β − η d𝓛/dβ. We move opposite to the gradient to go downhill; plus would go uphill.', ['Minus sign', 'Opposite to the gradient']),
  FIX('A student wrote: "<i>MSE = (1/n) Σ (yᵢ − ŷᵢ). Squaring is not needed.</i>" Correct it.', 'MSE = (1/n) Σ (yᵢ − ŷᵢ)². Without squaring, positive and negative errors cancel and the sum can be 0 for a bad line.', ['Squared', 'Errors would cancel']),
  FIX('A student updated β₀ first, then used the <b>new</b> β₀ to compute the gradient for β₁. What is wrong?', 'Updates must be <b>simultaneous</b>: compute both gradients with the old values, then update both.', ['Simultaneous update', 'Use old values for both gradients'])
]};

LECT.l3 = { ln: 'L3', name: 'Multi-Linear Regression & Normal Equation', title: 'Week 3', covers: 'analytical solution for one feature, multiple predictors, x₀ = 1, which models are linear, design matrix, matrix loss and gradient, normal equations, example by hand, OLS interpretations, column space and projection, multicollinearity, orthogonal and orthonormal features, SVD and why not to invert, why GD is still used, GD vs normal equation',
items: [
  M('Multiple linear regression has ___.', ['Exactly one predictor', 'More than one predictor', 'No intercept', 'A categorical target'], 1),
  M('The multiple linear regression model is f(x) = ___.', ['β₀x₀x₁…', 'β₀ + β₁x₁ + β₂x₂ + … + β_px_p', 'σ(βᵀx)', 'β₁x²'], 1),
  M('Why do we define x₀ = 1?', ['To remove the intercept', 'So the intercept becomes a weight and f(x) = βᵀx', 'To scale the features', 'To make X square'], 1),
  M('The all-ones feature column is often called the ___.', ['Residual', 'Bias / intercept feature', 'Target', 'Noise'], 1),
  M('In the basketball example, the target is ___.', ['FG', 'AST', '3PA', 'PTS (average points per game)'], 3),
  M('In the basketball data table, each row corresponds to ___.', ['A feature', 'An individual player', 'A game', 'A coefficient'], 1),
  M('Which model is <b>not</b> linear (in the parameters)?', ['Y = β₀ + β₁X + ε', 'Y = β₀ + β₁X² + β₂log(X) + ε', 'Y = β₀β₁^X ε', 'Y = β₀ + β₁eˣ + ε'], 2, '"Linear" means linear in the β\'s. X², log X, eˣ are just transformed features.'),
  M('"Linear" in linear regression means linear in ___.', ['X', 'The coefficients β', 'y', 'Time'], 1),
  M('The design matrix X has size ___.', ['p × n', 'n × (p + 1)', '(p + 1) × (p + 1)', 'n × 1'], 1),
  M('Row i of the design matrix is ___.', ['[y⁽ⁱ⁾]', 'x⁽ⁱ⁾ᵀ = [1, x₁⁽ⁱ⁾, …, x_p⁽ⁱ⁾]', 'One feature for all samples', 'The coefficients'], 1),
  M('The model in matrix form is ___.', ['y = βX', 'y = Xβ + ε', 'y = XᵀX', 'y = X⁻¹β'], 1),
  M('The MSE in matrix form is ___.', ['(1/n)(y − Xβ)ᵀ(y − Xβ)', 'XᵀXβ', '(1/n)Xβ', 'yᵀy'], 0),
  M('aᵀa equals ___.', ['0', '‖a‖² (squared length)', '1', 'a²ᵀ'], 1),
  M('The gradient of the MSE in matrix form is ___.', ['−(2/n)Xᵀ(y − Xβ)', 'XᵀX', '(2/n)yᵀX', 'X(y − β)'], 0),
  M('The normal equations are ___.', ['Xβ = 0', 'XᵀXβ = Xᵀy', 'Xᵀy = 0', 'βᵀβ = 1'], 1),
  M('The closed-form solution is β̂ = ___.', ['(XXᵀ)⁻¹Xy', '(XᵀX)⁻¹Xᵀy', 'Xᵀy', 'X⁻¹y always'], 1),
  M('To get the normal equation we ___.', ['Run gradient descent', 'Set the gradient to zero and solve', 'Take the log', 'Add noise'], 1),
  M('"Baby" (one-feature, no intercept) linear regression gives β = ___.', ['Σxᵢyᵢ / Σxᵢ²', 'Σyᵢ / n', 'Σxᵢ / Σyᵢ', 'Σxᵢ²'], 0),

  DEF('overfitting', 'The model is too complex: it "memorizes" the training data including the noise → very <b>low training error</b> but <b>high test error</b> (high variance).', ['Too complex / memorizes noise', 'Low train, high test error']),

/* ---------- calculation lab: unlimited generated problems ---------- */
const RND = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const PICK = a => a[Math.floor(Math.random() * a.length)];
const R3 = x => Math.round(x * 1000) / 1000;
const SIG = z => 1 / (1 + Math.exp(-z));
const GEN = {
  mse: { name: 'MSE of a line', f: () => { const b0 = RND(0, 3), b1 = RND(1, 3); const P = [1, 2, 3, 4].slice(0, RND(3, 4)).map(x => [x, b0 + b1 * x + RND(-2, 2)]); const yh = P.map(([x]) => b0 + b1 * x); const r = P.map(([, y], i) => y - yh[i]); const ans = R3(r.reduce((s, e) => s + e * e, 0) / P.length);

      LK.forEach(k => row('#' + k, LECT[k].ln, LECT[k].name, LECT[k].items));
      row('#all', 'Mix', 'Mixed review & comparisons', ALLX);
      PAPERS.forEach(P => row('#' + P.id, P.ln, P.title, P.qs.flatMap(q => q.items)));
      sec.append(h('h2', {}, 'Your progress'), h('p', { class: 'small muted' }, 'Answered = questions you checked at least once. Correct = of those, how many were right the last time. Red or orange = go back to that lecture.'), h('div', { class: 'tblwrap' }, tb));
      sec.append(h('h2', {}, 'How to use it'), h('ol', {},
        h('li', { html: 'Open <b>① Learn</b> for a lecture. Read each line; if you don\'t see where something comes from, press <b>why?</b>. The formulas are kept light: you need to know what they mean and how to use them.' }),
        h('li', { html: 'Then open <b>② Questions</b> for the same lecture. Choices and blanks are marked as soon as you answer. For written questions, write first (on paper or with the ✎ pencil), then open the model answer and tick the points you wrote.' }),
        h('li', { html: '<b>All comparisons & pros/cons</b> puts every "differentiate" and "advantages and disadvantages" question in one place (gradient descent vs normal equation, linear vs logistic, Ridge vs Lasso …).' }),
        h('li', { html: '<b>Calculation problems</b> makes unlimited new problems (MSE, a gradient descent step, the normal equation, Cov/Var slope, sigmoid, odds, cross-entropy, confusion-matrix metrics …).' }),
        h('li', { html: 'Before the midterm, take <b>Quiz A, B and C</b> with the clock, then the <b>Mock Midterm</b> 2–3 days before the exam.' }),
        h('li', { html: 'Anything you get wrong goes to the <b>Mistakes notebook</b>. It leaves after you get it right twice.' })));
      sec.append(h('div', { class: 'box warn' }, h('div', { class: 'bt' }, 'Careful: one slide mistake'), h('p', { class: 'small', html: 'In Lecture 01b, one slide calls x the "dependent" variable and y the "independent" variable. It is the other way round: <b>y is the dependent variable</b> (the target) and <b>x is the independent variable</b> (the feature).' })));
      sec.append(h('div', { class: 'box' }, h('div', { class: 'bt' }, 'Typing tips'), h('p', { class: 'small', html: 'Blanks accept the usual spellings and symbols (e.g. "λ" or "lambda", "σ²" or "sigma^2"). Capital letters and spaces do not matter. For numbers, 3 decimals are enough.' })));
    } else if (lk && LECT[lk]) {
      const Lx = LECT[lk];
      sec.append(headEl(`${Lx.title} · Explanation`, Lx.name, 'Read line by line. Press <b>why?</b> next to any line to see where it comes from.'));
      sec.append(whyToggle());
      const body = h('div', { class: 'learn', html: LEARN[lk] }); sec.append(body);
      addWhy(body);
      body.querySelectorAll('[data-mlw]').forEach(el => { try { MLW[el.dataset.mlw] && MLW[el.dataset.mlw](el); } catch (e) { console.error(e); } });
      const i = LK.indexOf(lk);
      sec.append(h('div', { class: 'nextbar' }, h('a', { class: 'btn primary', href: '#' + lk }, `Now answer the questions on ${Lx.ln} →`), i + 1 < LK.length ? h('a', { class: 'btn ghost', href: '#learn-' + LK[i + 1] }, `Next explanation: ${LECT[LK[i + 1]].ln}`) : null));
    } else if (L) {
      sec.append(headEl(`${L.title} · Questions`, L.name, `${L.items.length} questions. Covers: ${L.covers}.`));
      const bReset = h('button', { class: 'btn ghost', type: 'button' }, 'Clear my answers on this lecture and start again');
      bReset.onclick = () => { if (!confirm('Clear all your answers on this lecture? (Your progress numbers and Mistakes notebook stay.)')) return; const ids = L.items.map(x => SP + x.id + '-'); Object.keys(localStorage).filter(k => ids.some(p => k.startsWith(p)) && !/-pen$/.test(k)).forEach(k => localStorage.removeItem(k)); render(id); };
      sec.append(h('div', { class: 'ctl' }, h('a', { class: 'btn ghost', href: '#learn-' + id }, '← Read the explanation'), bReset, h('span', { class: 'small muted' }, 'Your answers stay here when you leave and come back.')));
      Practice(sec, L.items);
    } else if (id === 'all') {
      sec.append(headEl('All lectures together', 'Mixed review & model comparisons', 'Questions that connect the lectures: which model, which loss, which solver, and the pros and cons of each. Then a random shuffle of everything.'));
      Practice(sec, ALLX);
      sec.append(h('h2', {}, 'Shuffle 20 questions from all six lectures'));
      const area = h('div'); const go = () => { area.innerHTML = ''; const pool = Object.values(LECT).flatMap(L => L.items).filter(x => ['mc', 'tf', 'fill'].includes(x.t)); shuffle(pool).slice(0, 20).forEach((it, i) => Item(area, it, i + 1, 'practice')); };
      sec.append(h('div', { class: 'ctl' }, h('button', { class: 'btn primary', type: 'button', onclick: go }, 'Give me 20 new questions')), area); go();
    } else if (id === 'defs' || id === 'diffs') {
      const pick = x => id === 'defs' ? x.kind === 'Define' : (x.t === 'diff' || x.kind === 'Advantages & disadvantages');
      sec.append(headEl('All lectures together', id === 'defs' ? 'All definitions' : 'All comparisons & pros/cons', id === 'defs' ? 'Every "Define …" question from the six lectures in one place.' : 'Every "Differentiate between …" and "Advantages and disadvantages" question in one place: between methods (gradient descent vs normal equation), between models (linear vs logistic, Ridge vs Lasso), between metrics and between ideas. Usually 4 points of difference are enough for full marks.'));
      const groups = [...LK.map(k => [`Lecture ${LECT[k].ln} · ${LECT[k].name}`, LECT[k].items]), ...(id === 'diffs' ? [['Between lectures: comparing the models', ALLX]] : [])];
      groups.forEach(([t, its0]) => { const its = its0.filter(pick); if (!its.length) return; sec.append(h('h2', {}, t)); its.forEach((it, i) => Item(sec, it, i + 1, 'practice')); });
    } else if (id === 'lab') {
      sec.append(headEl('All lectures together', 'Calculation problems', 'Every calculation that can come in the exam, with new numbers each time and the full solution after you answer.'));
      sec.append(h('div', { class: 'box' }, h('div', { class: 'bt' }, 'The formulas you need'), h('p', { html: 'MSE = (1/n)Σ(y − ŷ)² · GD: β ← β − η·gradient · Normal equation: β = (XᵀX)⁻¹Xᵀy, 2×2 inverse = (1/(ad − bc))[[d, −b],[−c, a]] · β₁ = Cov(x,y)/Var(x), β₀ = ȳ − β₁x̄ · Total error = Bias² + Var + σ² · σ(z) = 1/(1 + e^(−z)) · odds = p/(1 − p) · log-loss = −ln p̂ (y = 1), −ln(1 − p̂) (y = 0) · Precision = TP/(TP+FP), Recall = TP/(TP+FN), F1 = 2TP/(2TP+FP+FN).' })));
      CalcLab(sec);
    } else if (P) {
      sec.append(headEl('Quiz before the midterm', P.title, P.sub));
      Paper(sec, P);
    } else if (id === 'mistakes') {
      sec.append(headEl('Review', 'Mistakes notebook', 'Every question you got wrong, in one place. A question leaves after you answer it right twice.'));
      const ids = store.get('mistakes', []).filter(x => REG[x]);
      if (!ids.length) sec.append(h('div', { class: 'banner ok' }, 'Empty. Nothing to redo right now.'));
      else { sec.append(h('p', {}, `${ids.length} question(s).`)); ids.forEach((x, i) => Item(sec, REG[x], i + 1, 'practice')); }
    }
    if (!lk) document.body.classList.remove('whyall');
    $$('#nav a').forEach(a => a.classList.toggle('cur', a.dataset.id === id)); sel.value = id; badge();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  const show = () => { const id = (location.hash || '#start').slice(1); render(secs.some(s => s.id === id) ? id : 'start'); };
  window.addEventListener('hashchange', show); show();
}

if(/github\.io$/.test(location.hostname))document.querySelectorAll(".backlink").forEach(a=>a.hidden=false);
