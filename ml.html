    return { q: `Points ${P.map(p => `(${p[0]},${p[1]})`).join(', ')}. Use β = (XᵀX)⁻¹Xᵀy to find <b>β${which ? '₁ (slope)' : '₀ (intercept)'}</b> (3 decimals).`, ans: R3(which ? b1 : b0), model: `XᵀX = [[${n}, ${sx}],[${sx}, ${sxx}]], Xᵀy = [${sy}, ${sxy}]. det = ${n}·${sxx} − ${sx}² = ${det}. Inverse = (1/${det})[[${sxx}, ${-sx}],[${-sx}, ${n}]]. β₀ = (${sxx}·${sy} − ${sx}·${sxy})/${det} = ${R3(b0)}; β₁ = (−${sx}·${sy} + ${n}·${sxy})/${det} = ${R3(b1)}. Answer <b>${R3(which ? b1 : b0)}</b>.` }; } },
  cov: { name: 'Slope = Cov / Var', f: () => { let P; do { P = [1, 2, 3].map(x => [x, RND(1, 9)]); } while (new Set(P.map(p => p[1])).size < 2); const n = 3, mx = 2, my = P.reduce((s, p) => s + p[1], 0) / n; const cov = P.reduce((s, p) => s + p[0] * p[1], 0) / n - mx * my, vr = 14 / 3 - 4; const b1 = cov / vr, b0 = my - b1 * mx; const which = PICK([0, 1]);
    return { q: `Points ${P.map(p => `(${p[0]},${p[1]})`).join(', ')}. Using β₁ = Cov(x,y)/Var(x) and β₀ = ȳ − β₁x̄, find <b>β${which ? '₁' : '₀'}</b> (3 decimals).`, ans: R3(which ? b1 : b0), model: `x̄ = 2, ȳ = ${R3(my)}. Cov = mean(xy) − x̄ȳ = ${R3(P.reduce((s, p) => s + p[0] * p[1], 0) / n)} − ${R3(mx * my)} = ${R3(cov)}. Var(x) = 14/3 − 4 = 0.667. β₁ = ${R3(b1)}, β₀ = ${R3(my)} − ${R3(b1)}·2 = ${R3(b0)}. Answer <b>${R3(which ? b1 : b0)}</b>.` }; } },
  ex: { name: 'Expectation / variance', f: () => { const v = [RND(0, 3), RND(4, 6), RND(7, 9)]; const pr = PICK([[0.2, 0.5, 0.3], [0.1, 0.6, 0.3], [0.25, 0.25, 0.5], [0.4, 0.4, 0.2]]); const E = v.reduce((s, x, i) => s + x * pr[i], 0), E2 = v.reduce((s, x, i) => s + x * x * pr[i], 0); const which = PICK([0, 1]); const ans = R3(which ? E2 - E * E : E);
    return { q: `X takes the values ${v.join(', ')} with probabilities ${pr.join(', ')}. Compute <b>${which ? 'Var[X]' : 'E[X]'}</b> (3 decimals).`, ans, model: `E[X] = ${v.map((x, i) => `${x}·${pr[i]}`).join(' + ')} = ${R3(E)}.${which ? ` E[X²] = ${R3(E2)}. Var = E[X²] − E[X]² = ${R3(E2)} − ${R3(E * E)} = <b>${ans}</b>.` : ` Answer <b>${ans}</b>.`}` }; } },
  bv: { name: 'Bias² + variance + noise', f: () => { const b = RND(1, 9) / 20, v = RND(1, 9) / 20, s = PICK([0.1, 0.15, 0.2]); const ans = R3(b + v + s);
    return { q: `A model has Bias² = ${b}, Variance = ${v}, irreducible error = ${s}. Compute the expected test error.`, ans, model: `${b} + ${v} + ${s} = <b>${ans}</b>. ${b > v ? 'Bias dominates → likely underfitting.' : v > b ? 'Variance dominates → likely overfitting.' : ''}` }; } },
  pen: { name: 'Lasso / Ridge penalty', f: () => { const B = [RND(1, 5), RND(-3, 3), RND(-3, 3), RND(-3, 3)]; const lam = PICK([0.1, 0.5, 1, 2]); const L1 = B.slice(1).reduce((s, x) => s + Math.abs(x), 0), L2 = B.slice(1).reduce((s, x) => s + x * x, 0); const which = PICK([0, 1]); const ans = R3(lam * (which ? L2 : L1));
    return { q: `β = [${B.join(', ')}] (β₀ = ${B[0]} is not penalized), λ = ${lam}. Compute the <b>${which ? 'Ridge' : 'Lasso'}</b> penalty λ·${which ? 'Σβⱼ²' : 'Σ|βⱼ|'}.`, ans, model: `${which ? B.slice(1).map(x => `${x}²`).join(' + ') + ' = ' + L2 : B.slice(1).map(x => `|${x}|`).join(' + ') + ' = ' + L1} → × ${lam} = <b>${ans}</b>.` }; } },
  sig: { name: 'Sigmoid probability', f: () => { const b = [RND(-3, 1), RND(-2, 2) / 2 || 0.5, RND(-2, 2) / 2 || -0.5]; const x = [1, RND(0, 4), RND(0, 4)]; const z = R3(b[0] + b[1] * x[1] + b[2] * x[2]); const ans = R3(SIG(z));
    return { q: `β = [${b.join(', ')}], x = [${x.join(', ')}] (x₀ = 1). Compute P(y = 1 | x) = σ(βᵀx) (3 decimals). (The model answer also gives the class for threshold 0.5.)`, ans, model: `z = ${b[0]} + ${b[1]}·${x[1]} + ${b[2]}·${x[2]} = ${z}. e^(−z) = ${R3(Math.exp(-z))}. σ = 1/(1 + ${R3(Math.exp(-z))}) = <b>${ans}</b> → class <b>${ans >= 0.5 ? 1 : 0}</b>.` }; } },
  odds: { name: 'Odds and log-odds', f: () => { const p = PICK([0.2, 0.25, 0.6, 0.75, 0.8, 0.9]); const o = p / (1 - p); const which = PICK([0, 1]); const ans = R3(which ? Math.log(o) : o);
    return { q: `p = ${p}. Compute the <b>${which ? 'log-odds (natural log)' : 'odds'}</b> (3 decimals).`, ans, model: `odds = ${p}/${R3(1 - p)} = ${R3(o)}${which ? `; ln(${R3(o)}) = <b>${ans}</b>` : ` → <b>${ans}</b>`}.` }; } },
  ce: { name: 'Cross-entropy of a point', f: () => { const y = PICK([0, 1]), p = PICK([0.1, 0.2, 0.3, 0.6, 0.7, 0.9, 0.95]); const ans = R3(-(y ? Math.log(p) : Math.log(1 - p)));
    return { q: `True label y = ${y}, predicted p̂ = ${p}. Compute the log-loss (natural log, 3 decimals).`, ans, model: `y = ${y} → loss = ${y ? '−ln(p̂)' : '−ln(1 − p̂)'} = −ln(${R3(y ? p : 1 - p)}) = <b>${ans}</b>. ${(y ? p : 1 - p) < 0.5 ? 'Large: confident and wrong.' : 'Small: right side.'}` }; } },
  cm: { name: 'Confusion-matrix metrics', f: () => { const TP = RND(3, 30), FN = RND(1, 10), FP = RND(1, 12), TN = RND(10, 60); const n = TP + FN + FP + TN; const M_ = { Accuracy: [(TP + TN) / n, `(${TP} + ${TN})/${n}`], Precision: [TP / (TP + FP), `${TP}/(${TP} + ${FP})`], Recall: [TP / (TP + FN), `${TP}/(${TP} + ${FN})`], Specificity: [TN / (TN + FP), `${TN}/(${TN} + ${FP})`], FPR: [FP / (FP + TN), `${FP}/(${FP} + ${TN})`], F1: [2 * TP / (2 * TP + FP + FN), `2·${TP}/(2·${TP} + ${FP} + ${FN})`] }; const k = PICK(Object.keys(M_)); const ans = R3(M_[k][0]);
    return { q: `TP = ${TP}, FN = ${FN}, FP = ${FP}, TN = ${TN}. Compute the <b>${k}</b> (3 decimals).`, ans, model: `${k} = ${M_[k][1]} = <b>${ans}</b>.` }; } }
};
function CalcLab(host) {
  let cur = store.get('lab-gen', 'mse'); if (!GEN[cur]) cur = 'mse';
  const chips = h('div', { class: 'chips' }); const area = h('div'); let n = 0;
  const draw = () => { chips.innerHTML = ''; Object.entries(GEN).forEach(([k, g]) => chips.append(h('button', { class: 'chip' + (k === cur ? ' sel' : ''), type: 'button', onclick: () => { cur = k; store.set('lab-gen', k); draw(); gen(); } }, g.name))); };
  const gen = () => { const p = GEN[cur].f(); area.innerHTML = ''; Item(area, { t: 'num', q: p.q, ans: p.ans, model: p.model, tol: p.tol, id: 'lab-' + (++n) + '-' + Date.now() }, 1, 'practice'); };
  host.append(h('div', { class: 'widget' }, h('div', { class: 'w-title' }, 'Unlimited calculation problems'), h('p', { class: 'small muted' }, 'Pick a type, solve on paper, type your answer, press Check. "New problem" makes another one with new numbers. Give 3 decimals when the answer is not whole.'), chips, h('div', { class: 'ctl' }, h('button', { class: 'btn primary', type: 'button', onclick: gen }, 'New problem')), area));
  draw(); gen();
}
/* ===== the lecture slides, exactly ===== */
const SLIDETXT = {"l1a-001": "   CSAI 420: Machine Learning\n01a – Introduction & Overview", "l1a-002": "Welcome to Machine Learning", "l1a-003": "Welcome to CSAI 420\n• Machine learning is one of today's most exciting emerging technologies.\n• In this course, you will learn what machine learning is, what are the most\n  important techniques in machine learning, and how to apply them to solve\n  problems in the real world.", "l1a-004": "All Over the News", "l1a-005": "ML Everyday\n• We use it in Search Engines", "l1a-006": "ML Everyday\n• We use it in Personal Assistants\n• Machine learning also powers\n  the speech recognition, question\n  answering and other intelligent\n  capabilities of smartphone\n  assistants like Apple Siri", "l1a-007": "ML Everyday\n• We use it in Spam/Fraud Detection", "l1a-008": "ML Everyday\n• Also in Games", "l1a-009": "ML Everyday\n• Also in Games\n                  https://www.youtube.com/watch?v=4cgWya-wjgY", "l1a-010": "ML Everyday\n• Recommender Systems all\n  over the internet", "l1a-011": "ML Everyday\n• Many applications in\n  medicine and healthcare", "l1a-012": "ML in Self Driving Cars", "l1a-013": "And Many More..\nBut What exactly is Machine Learning?", "l1a-014": "Arthur Samuel’s Definition\nIn 1959, Arthur Samuel defined machine learning as follows.\n“Machine learning is a field of study that gives computers the\nability to learn without being explicitly programmed.”\nWhat does \"learn\" and \"explicitly programmed\" mean here? Let's look at an example.", "l1a-015": "Consider Self Driving Cars\n• We need object detection systems for the cars to ”see”!", "l1a-016": "Rule Based Approach\n• We need object detection systems for the cars to ”see”!", "l1a-017": "Object Detection with Rules\n• Let’s Write Some Rules?\n• In practice, it's almost impossible for a human to specify all the edge cases.\n• Disappointment in expert systems (late 80s / early 90s) led to an “AI Winter”.", "l1a-018": "    Object Detection with ML\n• The machine learning approach is to teach a computer how to do detection by\n  showing it many examples of different objects.\n• No manual programming is needed: the computer learns what defines a pedestrian\n  or a car on its own!\n•", "l1a-019": "Improve with Experience", "l1a-020": " Interesting.. But why?\n• It is very hard to write programs that solve problems like recognizing an object or a\n  handwritten digit\n   • What distinguishes a 2 from a 7? A cycle from a motor-cycle?\n   • How does our brain do it?\n• Instead of writing a program by hand, we collect examples that specify the correct output\n  for a given input\n   • A machine learning algorithm then takes these examples and produces a program that\n       does the job\n• The program produced by the learning algorithm may look very different from a typical\n  hand-written program.\n   • It may contain millions of numbers.\n   • If we do it right, the program works for new cases as well as the ones we trained it on. 20", "l1a-021": "When to use?\n• ML is used when:\n  • Human expertise does not exist (navigating on Mars)\n  • Humans can’t explain their expertise (speech recognition)\n  • Models must be customized (personalized medicine)\n  • Models are based on huge amounts of data (genomics)\n• Learning isn’t always useful:\n   • There is no need to “learn” to calculate payroll", "l1a-022": "More Tasks that are best solved by ML\n• Recognizing patterns:\n   • Facial identities or facial expressions\n   • Handwritten or spoken words\n   • Medical images\n• Generating patterns:\n   • Generating images or motion sequences\n• Recognizing anomalies:\n   • Unusual credit card transactions\n   • Unusual patterns of sensor readings in a nuclear power plant\n• Prediction:\n   • Future stock prices or currency exchange rates", "l1a-023": " ML vs Statistics\n• Both statistics and machine learning aim to “detect\n  patterns in data” by building predictive models.\n• Statistics: use this as a tool to learn something about\n  the world (statistical inference).\n   • Focus on simple, interpretable models.\n   • Develop theoretical analysis, work out statistical\n      guarantees under some assumptions.\n• Machine learning: use this as a tool to actually make\n  useful predictions.\n   • Focus on complicated, competitive models.\n   • Use large datasets. Be pragmatic. Give up on\n      inference.", "l1a-024": "Why the boom?\n• Three main reasons:\n   • Computational Power\n   • Powerful Programming Frameworks\n   • Big Data available and growing\n   • Money and People", "l1a-025": "But also, with Limitations\n• Model trained from data: as biased as the data itself\n  • Facial recognition systems works less well on minorities\n  • CV rating systems learn socio-economic biases\n• Predictive model may fail on slightly perturbated input\n• Non robust, hence non deployable\n• As of today!", "l1a-026": "Three Approaches to Machine Learning", "l1a-027": "Three Types of Learning", "l1a-028": "Supervised Learning: We Know The Truth\n1. First, we collect a dataset of labeled training examples.\n2. We train a model to output accurate predictions on this dataset.\n3. When the model sees new, similar data, it will also be accurate.", "l1a-029": "Supervised Learning: House Prices\nConsider a simple dataset for supervised learning: house prices in Boston.\n   • Each datapoint is a house.\n   • We know its price and the neighborhood’s education level", "l1a-030": "Supervised Learning: The Algorithm\nWe can use this dataset of examples to fit a supervised learning model.\n   • The model maps input 𝑥 (the education level) to output a 𝑦 (the house price).\n   • It learns the mapping from our dataset of examples (𝑥, 𝑦).", "l1a-031": "More Features? Better but More Complex", "l1a-032": "Key Characteristics of Supervised\nLearning:\n1. Labeled Data: Supervised learning requires a dataset where each example is labeled\nwith the correct answer.\n2. Training Phase: During training, the algorithm learns the mapping from input\nfeatures to the desired output by minimizing a loss function that measures the\ndifference between predicted and actual outputs.\n3. Evaluation: The model's performance is evaluated on a separate test set to assess\nits ability to generalize to new, unseen data.", "l1a-033": " Supervised ML:\n Regression vs Classification\nSometimes we are interested in classification\n   • Regression: if y ∈ ℝ is a continuous variable, e.g., price prediction.\n   • Classification: the label is a discrete variable, e.g., predicting the types of\n     residence", "l1a-034": "https://www.javatpoint.com/regression-vs-classification-in-machine-learning   34", "l1a-035": "Unsupervised Learning\nHere, we have a dataset without labels. Our goal is to learn something interesting\nabout the structure of the data:\n   • Clusters hidden in the dataset.\n   • Outliers: particularly unusual and/or interesting datapoints.\n   • Useful signal hidden in noise, e.g., human speech over a noisy phone.", "l1a-036": "Unsupervised Learning\nWe can use this dataset of examples to fit an unsupervised learning model.\n   • The model defines a probability distribution over the inputs.\n   • The probability distribution identifies multiple components (multiple peaks).\n   • The components indicate structure in the data.", "l1a-037": "    Reinforcement Learning\n• In reinforcement learning, an agent is interacting with the world over time.\n   • The agent is taught good behavior through rewards\n       • the better its behavior, the higher its rewards.\n• Applications include:\n   • Play games such as Chess or Go.\n   • Control the cooling systems.\n   • Designing new drug compounds.", "l1a-038": "Many Applications in all Three Tracks", "l1a-039": "  Which one is More Important?\nYann LeCun: “Most of human and animal\nlearning is unsupervised learning. If\nintelligence was a cake, unsupervised\nlearning would be the cake, supervised\nlearning would be the icing on the cake, and\nreinforcement learning would be the cherry\non the cake.”", "l1a-040": "Is this AI? What is Deep Learning?", "l1a-041": "  AI, ML and DL\n• AI is about building machines that exhibit intelligence.\n• ML enables machines to learn from experience, a useful tool for AI.\n• Deep learning focuses on a family of learning algorithms loosely inspired by the brain.", "l1a-042": "  Let’s Go Deep?\n2017 Kaggle survey of data science and ML practitioners: what data\nscience methods do you use at work?", "l1a-043": "  Okay Let’s Just Code?\n• Yes indeed there is a lot of ready-made programming frameworks: PyTorch,\n  TensorFlow, Theano, Scikit-Learn, etc.\n   • Automatic differentiation\n   • compiling computation graphs\n   • libraries of algorithms and network primitives\n   • support for graphics processing units (GPUs)\n• Why take the theory if these frameworks do so much for you?\n  • So you know what to do if something goes wrong!\n  • Debugging learning algorithms requires sophisticated detective work, which\n    requires understanding what goes on beneath the hood.\n  • That is why we also derive things by hand in this class!", "l1a-044": "About this Course", "l1a-045": "Pre-requisite\n• Probability\n• Linear Algebra\n• Python Programming", "l1a-046": " Teaching Approach\n• We do both theory and practice side by side\n  • Mathematics and Programming are equally important\n  • We will cover a broad toolset of core algorithms from many different subfields of ML.\n  • We will emphasize applications and show how to implement and apply algorithms via\n     examples and exercises.\n• Why are we following this approach?\n  • Applying machine learning is among the most in demand industry skills right now.\n  • There can be a gap between theory and practice, especially in modern machine\n     learning.\n  • Often, the best way of understanding how an algorithm works is to implement it.\n• Warning: This is not a very difficult course, but it has a lot of content.\n  • To be successful, you need to work hard.\n  • For example, don't start working on your homework assignments just two days before\n     the deadline.", "l1a-047": "Main Topics\n• We cover almost all machine learning concepts and algorithms. Topics Include:\n  • Supervised Learning\n      • Linear and Logistic Regression\n      • Generative Models\n      • Kernel Methods\n      • Decision Trees and Ensemble Learning\n  • Unsupervised Learning\n      • Clustering\n      • Anomaly detection\n      • Dimensionality Reduction and PCA\n  • Overview of Reinforcement Learning", "l1a-048": "Course Grading Scheme\n      Lab Exercises                           15%\n      Quizzes                                 10%\n      Assignments                             20%\n      Midterm                                 15%\n      Project                                 15%\n      Final                                   25%\n      Total                                  100%\n        While attendance does not factor into your grade, an\n        attendance rate of less than 75% means that you will\n        automatically fail the course.", "l1a-049": "Course Logistics\n   Assignments\n     • You will have weekly assignments\n     • Assignments should reflect each student’s individual work\n     • Late submissions will receive a penalty of 10% per day, for\n       a maximum of 3 days after which submissions will not be\n       allowed\n   Project\n     • We start directly after the midterms. Probably two groups\n     • Start thinking already about an idea. Try to be creative!\n   The Final\n      •      Even though the final is worth 25% of your total grade,\n             you risk failing the course if you score below 40% on\n             the final\n   Lab Sheets\n     • Only problems solved during lab time will be graded", "l1a-050": "Course Instructors and References\nInstructors:\n• Dr. Laila Hesham– Associate Professor at the School of IT\n   Director of Applied and Computational Mathematics (laila.hesham@ngu.edu.eg)\nTextbooks:\n• The Elements of Statistical Learning, Trevor Hastie, 2nd edition.\n• Hands-On Machine Learning, Aurélien Géron, 2nd edition.\nOnline Courses:\n• DataX @ UC Berkeley\n• Applied Machine Learning, Cornell-Tech.\n• Machine Learning Specialization, Coursera.\n• Introduction to Machine Learning, Tübingen University.", "l1a-051": "What Comes Next?\n• We will deal with supervised learning for regression and classification\n  • predicting labels 𝑦 based on features 𝑦, using patterns that we learned\n    from labeled data.\n• First, we will go through fundamental concepts in supervised ML using Linear\n  Regression as a start:\n   • What kind of \"data\" do we learn from?\n   • How can we formalize the goal of learning?\n   • What is a \"prediction model\"?\n   • How can we quantify \"predictive performance\"?\n   • What is a \"learning algorithm\"\n   • How can we operationalize learning?", "l1b-001": "  CSAI 420: Machine Learning\n01b – Supervised Learning", "l1b-002": "Three Approaches to Machine Learning", "l1b-003": "Three Types of Learning", "l1b-004": "Supervised Learning: We Know The Truth\n1. First, we collect a dataset of labeled training examples.\n2. We train a model to output accurate predictions on this dataset.\n3. When the model sees new, similar data, it will also be accurate.", "l1b-005": "Supervised Learning: House Prices\nConsider a simple dataset for supervised learning: house prices in Boston.\n   • Each datapoint is a house.\n   • We know its price and the neighborhood’s education level", "l1b-006": "Supervised Learning: The Algorithm\nWe can use this dataset of examples to fit a supervised learning model.\n   • The model maps input 𝑥 (the education level) to output a 𝑦 (the house price).\n   • It learns the mapping from our dataset of examples (𝑥, 𝑦).", "l1b-007": "Supervised Learning", "l1b-008": "Predicting Diabetes Risk\n• Let’s start with a simple example of a supervised learning problem: predicting\n  diabetes risk.\n• Suppose we have a dataset of diabetes patients.\n   • For each patient we have access to measurements from their medical record\n      and an estimate of diabetes risk.\n   • We are interested in understanding how the measurements affect an\n      individual's diabetes risk.\n• At a high level, a supervised machine learning problem has the following structure:\n                      Dataset + Algorithm → Predictive Model\n   • The predictive model is chosen to model the relationship between inputs and\n     targets. For instance, it can predict future targets.                              8", "l1b-009": " UCI Diabetes Dataset\nWe will use the UCI Diabetes Dataset; it's a toy dataset that's often used to demonstrate\nmachine learning algorithms.\n• For each patient we have access to a measurement of their body mass index (BMI)\n  and a quantitative diabetes risk score (from 0-400).\n• We are interested in understanding how BMI affects an individual's diabetes risk.", "l1b-010": "Visualizing the Dataset in 2D", "l1b-011": " What is the Relationship?\nWhat is the relationship between BMI and diabetes risk?\n• We could assume that risk is a linear function of BMI.\n• In other words, for some unknown 𝜃0 , 𝜃1 ∈ 𝑅, we have 𝑦 = 𝜃1 ⋅ 𝑥 + 𝜃0 ,\n   • where 𝑥 is the BMI (also called the dependent variable),\n   • and 𝑦 is the diabetes risk score (the independent variable).\n• Note that 𝜃1 , 𝜃0 are the slope and the intercept of the line relates 𝑥 to 𝑦.\n   • We call them parameters.", "l1b-012": "Let’s try some linear models?", "l1b-013": " Can we find the best one?\n• Assuming that 𝑥 and 𝑦 follow the above linear relationship,\n   • the goal of the supervised learning algorithm is to find a good set of parameters\n     consistent with the data.\n   • We will see many algorithms for this task. For now, let's call\n     the 𝑠𝑘𝑙𝑒𝑎𝑟𝑛. 𝑙𝑖𝑛𝑒𝑎𝑟_𝑚𝑜𝑑𝑒𝑙 library to find a 𝜃1 𝑎𝑛𝑑 𝜃0 that fit the data well.", "l1b-014": "Our “best” linear model", "l1b-015": " Now Predictions\n• Given a new dataset of patients with a known BMI, we can use this model to\n  estimate their diabetes risk.\n   • Given a new 𝑥, ො we can output a predicted 𝑦ො as 𝑦ො = 𝑓 𝑥ො = 𝜃1 ⋅ 𝑥ො + 𝜃0\n   • Let's start by loading more data. We will load three new patients (shown in red\n      below) that we haven't seen before.\n   • Our linear model provides an estimate of the diabetes risk for these patients.", "l1b-016": "Okay, so how does it work?", "l1b-017": " Let’s first generalize\n• We are going to dive deeper into what's a supervised learning dataset. As an\n  example, consider the full version of the UCI Diabetes Dataset seen earlier.\n• Previously, we only looked at the patients' BMI, but this dataset actually records\n  many additional measurements.\n• The data we deal with in supervised learning usually consists of observations on\n  different aspects of objects\n   • The UCI dataset contains many additional data columns besides bmi, including\n      age, sex, and blood pressure.\n   • We can ask 𝑠𝑘𝑙𝑒𝑎𝑟𝑛 to give us more information about this dataset.", "l1b-018": "The Diabetes Dataset", "l1b-019": " The Diabetes Dataset\n• We say that a training dataset of size n (e.g., n patients) is a set\n               𝐷 = {(𝑥 𝑖 , 𝑦 (𝑖) ) ∣ 𝑖 = 1,2, … , 𝑛}\n   • Each 𝑥 𝑖 denotes an input (e.g., the measurements for patient 𝑖),\n   • and each 𝑦 𝑖 ∈ 𝑌 is a target (e.g., the diabetes risk).\n   • Together, (𝑥 𝑖 , 𝑦 𝑖 ) form a training example.", "l1b-020": " Dataset Inputs and Attributes\n• More precisely, an input 𝑥 (𝑖) ∈ 𝑋 is a 𝑑-dimensional vector of the form\n                                                           𝑇\n                                            𝑖  𝑖       𝑖\n                                𝑥 (𝑖) =   𝑥1 𝑥2    ⋯ 𝑥𝑑\n   • In our example, it is the measurements values of the 𝑑 features for patient 𝑖.\n   • The set 𝑋 is called the feature space. Often, we have, 𝑋 = ℝ𝑑 .\n• We refer to the numerical variables describing the patient as attributes. Examples of\n  attributes include:\n   • The age of a patient.\n   • The patient's gender.\n   • The patient's BMI.\n   • Note that these attributes in the above example have been mean-centered at\n      zero and re-scaled to have a variance of one.", "l1b-021": " Dataset Features\n• Often, an input object has many attributes, and we want to use these attributes to define\n  more complex descriptions of the input.\n   • Is the patient old and a man? (Useful if old men are at risk).\n   • Is the BMI above the obesity threshold?\n   • We call these custom attributes features.\n   • Let's create an \"old man\" feature.\n• In practice, the terms attribute and features are often used interchangeably.\n   • Most authors refer to 𝑥 (𝑖) as a vector of features (i.e., they've been precomputed).\n   • We will follow this convention and use attribute only when there is ambiguity between\n      features and attributes.", "l1b-022": " Attribute Types\n• Both features and attribute variables may be of different data types\n   • Numerical variables can have values in ℝ\n   • Integer variables can have values in ℤ\n   • Categorical variables can have values in {𝐶1 , ⋯ , 𝐶𝑔 }\n   • Binary variables can have values in 0,1\n• Most learning algorithms can only deal with numerical features\n  • although there are some exceptions (e.g., decision trees can use integers and\n    categoricals without problems).\n  • For other feature types, we usually have to pick or create an appropriate\n    encoding.\n  • If not stated otherwise, we assume numerical features.", "l1b-023": " Classification vs Regression\n• We distinguish between two broad types of supervised learning problems that differ\n  in the form of the target variable.\n   • Regression: The target variable 𝑦 is continuous. We are fitting a curve in a high-\n      dimensional feature space that approximates the shape of the dataset.\n   • Classification: The target variable 𝑦 is discrete. Each discrete value corresponds\n      to a class and we are looking for a hyperplane that separates the different\n      classes.", "l1b-024": " Why Learning?\n• Learning to predict\n   • In such a case we potentially do not care how our model is structured or whether we can\n      understand it.\n   • Example: predicting how a stock price will develop.\n   • Simply being able to use the predictor on new data is of direct benefit to us.\n• Learning to explain.\n   • Here, our model is only a means to a better understanding of the inherent relationship in\n      the data.\n   • Example: understanding which risk factors influence the probability to get a certain\n      disease.\n   • We might not use the learned model on new observations, but rather discuss its\n      implications, in a scientific or social context.\n• While ML was traditionally more interested in the former, classical statistics addressed the\n  latter. In many tasks nowadays both are relevant – to different degrees.", "l1b-025": " The Learning Algorithm\n• We can also define the high-level structure of a supervised learning algorithm as\n  consisting of three components:\n   • A model class: the set of possible models we consider.\n   • An objective function, which defines how good a model is.\n   • An optimizer, which finds the best predictive model in the model class according\n     to the objective function\n• We'll say that a model is a function\n              𝑓: 𝑋 → 𝑌 that maps inputs 𝑥 ∈ 𝑋 to targets 𝑦 ∈ 𝑌.\n  • Often, models have parameters 𝜃 ∈ Θ living in a set Θ.\n  • We will then write the model as\n              𝑓𝜃 : 𝑋 → 𝑌 to denote that it's parametrized by 𝜃.\n  • 𝑓𝜃 is meant to capture intrinsic patterns of the data\n      • the underlying assumption being that these hold true for all data", "l1b-026": " The Model\n• Formally, the model class is a set\n          𝑀 ⊆ {𝑓 ∣ 𝑓: 𝑋 → 𝑌} of possible models that map input features to targets.\n• When the models 𝑓𝜃 are parametrized by parameters 𝜃 ∈ Θ living in some set Θ.\n   • Thus, we can also write: 𝑀 = {𝑓𝜃 ∣ 𝑓: 𝑋 → 𝑌; 𝜃 ∈ Θ}.\n   • Models can range from super simple (e.g., linear, tree stumps) to very complex\n     (e.g., deep neural networks)\n   • and there are infinitely many choices how we can construct such functions.\n   • we have to determine the class of our model a priori, thereby narrowing down\n     our options considerably.\n• A good model will generalize well\n   • predict unseen examples correctly\n   • there is a tradeoff between expressiveness of a model class and the complexity of\n     finding a good model", "l1b-027": " The Model\n• There exists a wealth a machine learning models, some more complex and expressive\n  than others.\n   • What are the implications of model complexity?\n   • How do we pick one model rather than another?", "l1b-028": " The Learner\n• The algorithm for finding our 𝑓𝜃 is called the learner. It is also called learning\n  algorithm or inducer.\n   • The learner is our means of picking the best element from the model space for\n      our data set.\n   • Formally, it maps training data to a model.\n   • Optimal parameters 𝜽 or function 𝑓𝜃 is returned for later usage.\n• When training a learner, we optimize over our model space, to find the function\n  which matches our training data best.\n   • This means, we are looking for a function, where the predicted output per\n     training point is as close possible to the observed label.\n   • To make this precise, we need to define now how we measure the difference\n     between a prediction and a ground truth label pointwise.\n   • This is when objective functions come into play!", "l1b-029": " Objective Functions\n• Now to find the best model, we define an objective function (also called a loss\n  function)\n                        𝐽(𝑓): 𝑀 → [0, ∞),\n   • the extent to which 𝑓 \"fits\" the data 𝐷 = {(𝑥 𝑖 , 𝑦 (𝑖) ) ∣ 𝑖 = 1,2, … , 𝑛}.\n• When f is parametrized by 𝜃 ∈ Θ, the objective becomes a function\n                         𝐽(𝜃): Θ → [0, ∞).\n• Examples of some popular objective functions\n                                      1                         2\n   •   Mean squared error: 𝐽 𝜃 =        σ𝑛𝑖=1 𝑓𝜃 𝑥 𝑖 − 𝑦 𝑖\n                                     2𝑛\n                                   1 𝑛\n   •   Absolute (𝐿1 ) error: 𝐽(𝜃) = σ𝑖=1 |𝑓𝜃 𝑥 𝑖 − 𝑦 𝑖 |\n                                   𝑛", "l1b-030": " Optimization\n• At a high-level, an optimizer takes an objective 𝐽 and a model class 𝑀 and finds a\n  model 𝑓 ∈ 𝑀 with the smallest value of the objective 𝐽.\n                          min 𝐽(𝑓)\n                           𝑓∈𝑀\n   •  This is sometimes called empirical risk minimization (ERM).\n   •  To solve this numerically, it depends on the model and its parameters.\n   •  Intuitively, this is the function that bests \"fits\" the data on the training dataset.\n   •  When 𝑓 is parametrized by 𝜃 ∈ Θ,\n       • the optimizer minimizes a function 𝐽(𝜃) over all 𝜃 ∈ Θ.\n• We will see that the 𝑠𝑘𝑙𝑒𝑎𝑟𝑛. 𝑙𝑖𝑛𝑒𝑎𝑟_𝑚𝑜𝑑𝑒𝑙𝑠. 𝐿𝑖𝑛𝑒𝑎𝑟𝑅𝑒𝑔𝑟𝑒𝑠𝑠𝑖𝑜𝑛 algorithm\n  optimizes the MSE loss.\n                                        𝑛\n                                  1                          2\n                           𝐽 𝜃 =    ෍ 𝑓𝜃 𝑥 𝑖         −𝑦 𝑖\n                                 2𝑛\n                                       𝑖=1\n   • We can easily measure the quality of the fit on the training set and the test set.", "l1b-031": "Summary\n• At a high level, a supervised machine learning problem has the following structure:\n                       Dataset + Algorithm → Predictive Model\n   • The predictive model is chosen to model the relationship between inputs and\n     targets. For instance, it can predict future targets.\n• A supervised learner is a program or an algorithm which:\n   • receives a training set and,\n   • for a given class of models,\n   • uses a cost function to evaluate different models on the data,\n   • then uses an optimization procedure to find the best model that minimizes the\n      cost function.", "l1b-032": "Outlook\n• By decomposing learners into these building blocks:\n   • we have a framework to better understand how they work,\n   • we can more easily evaluate in which settings they may be more or less suitable,\n   • and we can tailor learners to specific problems by the clever choice of each of\n      the three components.\n   • Getting this right takes a considerable amount of experience.\n• Next: Linear Regression!", "l2-001": "   CSAI 420: Machine Learning\n02a – Linear Regression", "l2-002": "Recap", "l2-003": "Three Types of Learning", "l2-004": " Supervised Learning: We Know The Truth\n1. First, we collect a dataset of labeled training examples.\n2. We train a model to output accurate predictions on this dataset.\n3. When the model sees new, similar data, it will also be accurate.", "l2-005": " Supervised Learning: House Prices\nConsider a simple dataset for supervised learning: house prices in Boston.\n   • Each datapoint is a house.\n   • We know its price and the neighborhood’s education level", "l2-006": " Supervised Learning: The Algorithm\nWe can use this dataset of examples to fit a supervised learning model.\n   • The model maps input 𝑥 (the education level) to output a 𝑦 (the house price).\n   • It learns the mapping from our dataset of examples (𝑥, 𝑦).", "l2-007": " Summary\n• At a high level, a supervised machine learning problem has the following structure:\n                                      Dataset + Algorithm → Predictive Model\n      • The predictive model is chosen to model the relationship between inputs and\n        targets. For instance, it can predict future targets.\n• A supervised learner is a program or an algorithm which:\n   • receives a training set and,\n   • for a given class of models uses a cost function to evaluate different models on\n      the data,\n   • then uses an optimization procedure to find the best model that minimizes the\n      cost function.                                                                  7", "l2-008": "Linear Regression", "l2-009": "  Linear Regression\n• Linear Regression is a simple and powerful model for predicting a numeric response\n  from a set of one or more independent variables.\n• This lecture will focus mostly on how the method is used in machine learning, so we\n  won't cover common use cases like causal inference or experimental design.\n• And although it may seem like linear regression is overlooked in modern machine\n  learning's ever-increasing world of complex neural network architectures,\n   • the algorithm is still widely used across a large number of domains because it is\n      effective, easy to interpret, and easy to extend.\n   • The key ideas in linear regression are recycled everywhere, so understanding\n      the algorithm is a must-have for a strong foundation in machine learning.", "l2-010": "  Linear Regression\n• Linear regression is a supervised algorithm\n   • that learns to model a dependent variable, 𝑦,\n   • as a function of some independent variables (aka \"features\"), 𝑥𝑖\n   • by finding a line (or surface) that best \"fits\" the data.\n• It is also known as Least Squares Estimation\n• In general, we assume 𝑦 to be some number and each 𝑥𝑖 can be basically anything.\n   • For example: predicting the price of a house using the number of rooms in that\n      house (𝑦: price, 𝑥1 ​: number of rooms)\n   • or predicting weight from height and age (𝑦: weight, 𝑥1 ​: height, 𝑥2 ​: age).", "l2-011": "  Equation for Linear Regression\n• In general, the equation for linear regression is\n                                    𝑦 = 𝛽0 + 𝛽1 𝑥1 + 𝛽2 𝑥2 + … + 𝛽𝑝 𝑥𝑝 + 𝜖\nwhere:\n   • 𝑦: the dependent variable; the thing we are trying to predict.\n   • 𝑥𝑘 : the independent variables: the features our model uses to model 𝑦.\n   • 𝛽𝑘 : the coefficients (aka \"weights\") of our regression model.\n       • These are the foundations of our model.\n       • They are what our model \"learns\" during optimization.\n   • 𝜖: the irreducible error in our model.\n       • A term that collects together all the unmodeled parts of our data.", "l2-012": "  Equation for Linear Regression\n• In general, the equation for linear regression is\n                                    𝑦 = 𝛽0 + 𝛽1 𝑥1 + 𝛽2 𝑥2 + … + 𝛽𝑝 𝑥𝑝 + 𝜖\nThis model applies to each instant (sample) out of 𝑛 samples, that is\n                                                (𝑖)     (𝑖)          𝑖\n                                  𝑦𝑖 = 𝛽0 + 𝛽1 𝑥1 + 𝛽2 𝑥2 + … + 𝛽𝑝 𝑥𝑝                   +𝜖\n       (𝑖)\nWhere 𝑥𝑘 is the 𝑖𝑡ℎ sample of the 𝑘 𝑡ℎ feature (input)\n                                                             (𝑖) (𝑖)                     𝑛\n                                                                                𝑖\nSo, the training data set is denoted by                     𝑥1 , 𝑥2 , … . . , 𝑥𝑝 , 𝑦𝑖\n                                                                                         𝑖=1", "l2-013": "Illustration", "l2-014": "  Inference\n• In general, the equation for linear regression is\n                     𝑦 = 𝛽0 + 𝛽1 𝑥1 + 𝛽2 𝑥2 + … + 𝛽𝑝 𝑥𝑝 + 𝜖\n• Fitting a linear regression model is all about finding the set of coefficients 𝛽𝑘 ’s that\n  best model 𝑦 as a function of our features.\n   • We may never know the true parameters for our model, but we can estimate\n       them (more on this later).\n• Once we've estimated these coefficients, ෢\n                                           𝛽𝑘 ​, we predict future values, 𝑦​ො , as:\n                            ෢0 + 𝛽\n                       𝑦ො = 𝛽    ෢1 𝑥1 + 𝛽 ෢2 𝑥2 + … + 𝛽  ෢𝑝 𝑥𝑝\n      • So, predicting future values (often called inference), is as simple as plugging the\n        values of our features 𝑥𝑘 into our equation!", "l2-015": "House Prices: Missed Me?", "l2-016": " Bad Performance!\n• Of course, we know this\n  model is bad - the data\n  doesn't fit the data well at\n  all. But how can we quantify\n  exactly how bad?\n• To evaluate our model's\n  performance quantitatively,\n  we plot the error of each\n  observation directly.", "l2-017": " Best Performance!\n• The goal of linear regression is reducing this error such that we find a line/surface\n  that 'best' fits our data. For our simple regression problem, that involves estimating\n  the 𝑦-intercept and slope of our model, 𝛽  ෢0 and 𝛽෢1 .\n• For our specific problem,\n  the best fit line is shown.\n• There's still error, sure,\n  but the general pattern is\n  captured well.", "l2-018": " Prediction\n• Once we've fit our model, predicting future values is super easy!\n   • We just plug in any 𝑥𝑘 values into our equation!\n• For our simple model, that means plugging in a value for sqft into our model", "l2-019": "  Nice! But How does this work?\n• Now that we have a high-level idea of how linear regression works, let's dive a bit\n  deeper.\n• How to evaluate regression models?\n• How to find the \"best\" model?\n• How to interpret different forms of regression models?\n• So, Let’s dive in", "l2-020": "Finding the Best Fit", "l2-021": "  Loss Functions\n• To train an accurate linear regression model, we need a way to quantify how good (or\n  bad) our model performs.\n   • In machine learning, we call such performance-measuring functions loss\n      functions. Several popular loss functions exist for regression problems.\n• To measure our model's performance, we'll use one of the most popular: mean-\n  squared error (MSE).", "l2-022": "Loss Function: MSE\n    • MSE quantifies how close a predicted value is to the true value, so we'll use it to\n      quantify how close a regression line is to a set of points.\n    • MSE works by squaring the distance between each data point and the regression\n      line (the red residuals in the graphs above), summing the squared values, and\n      then dividing by the number of data points\n    • The cost is higher when the model is performing poorly on the training set. The\n      objective of the learning algorithm, then, is to find coefficients 𝛽0 𝑎𝑛𝑑 𝛽1 which\n      give the minimum possible cost.\n                                                              𝑛\n                             𝑀𝑆𝐸 = ℒ 𝛽0 , 𝛽1              = ෍ 𝑦𝑖 − 𝑦ෝ𝑖 2\n                                                           𝑛\n                                                             𝑖=1", "l2-023": "Illustration of MSE", "l2-024": "  The MSE Loss\n• To measure our model's performance, we'll use one of the most popular: mean-squared\n  error (MSE).\n   • MSE quantifies how close a predicted value is to the true value, so we'll use it to quantify\n      how close a regression line is to a set of points.\n                                                                𝑛\n                                𝑀𝑆𝐸 = ℒ 𝛽0 , 𝛽1             = ෍ 𝑦𝑖 − 𝑦ෝ𝑖 2\n                                                             𝑛\n                                                               𝑖=1\n• The name is quite literal: take the mean of the squared errors.\n   • The squaring of errors prevents negative and positive terms from canceling out in the\n      sum and gives more weight to points further from the regression line, punishing outliers.\n   • In practice, we'll fit our regression model to a training data set and evaluate its\n      performance using MSE on the test dataset.", "l2-025": "A Large MSE Loss", "l2-026": "Let’s Make it Smaller", "l2-027": "And Smaller..", "l2-028": "  Evaluation Metrics\n• Many methods exist for evaluating regression models, each with different concerns\n  around interpretability, theory, and usability.\n• The evaluation metric should reflect whatever it is you actually care about when\n  making predictions.\n• For example, when we use MSE, we are implicitly saying that we think the cost of our\n  prediction error should reflect the quadratic (squared) distance between what we\n  predicted and what is correct.\n• This may work well if we want to punish outliers or if our data is minimized by the\n  mean, but this comes at the cost of interpretability: we output our error in squared\n  units (though this may be fixed with Root MSE RMSE).", "l2-029": "  So, we do it by hand?\n• Let's recap what we've learned so far: Linear regression is all about finding a line (or\n  surface) that fits our data well.\n• And as we just saw, this involves selecting the coefficients for our model that minimize\n  our evaluation metric.\n• But how can we best estimate these coefficients? In practice, they're unknown, and\n  selecting them by hand quickly becomes infeasible for regression models with many\n  features. There must be a better way!\n• Luckily for us, several algorithms exist to do just this. We'll discuss two: an iterative\n  solution and a closed-form solution.", "l2-030": "The Iterative Method: Gradient Descent", "l2-031": "  The Magical Gradient Descent\n• Gradient descent is an iterative optimization algorithm that estimates some set of\n  coefficients to yield the minimum of a convex function. (What?!!)\n   • Put simply: it will find suitable coefficients for our regression model that minimize\n     prediction error (remember, lower MSE equals better model).\n   • It will iteratively identify the coefficients our model needs to fit the data.\n• Let's see an example directly.\n   • We'll fit data to our equation\n                                   ෢0 + 𝛽\n                              𝑦ො = 𝛽    ෢1 𝑥1 ,\n            • so gradient descent will learn two coefficients,\n               • 𝛽0 (the intercept) and 𝛽1 ​(the weight/slope).", "l2-032": "Some Magic!", "l2-033": "One Step", "l2-034": "7 More Steps", "l2-035": "25 More.. Voila!", "l2-036": "300 More Steps..", "l2-037": "Lines Versus Cost (For one variable ⇒ 1D)", "l2-038": "Cost Function in 2D", "l2-039": "Linear Regression with One Variable", "l2-040": "Getting Better", "l2-041": "And Better..", "l2-042": "And Bingo!", "l2-043": "But How Does It Really Work?", "l2-044": "Baby Gradient Descent\n                            𝐶𝑜𝑠𝑡\n          𝛽መ            𝛽          𝛽", "l2-045": "The Learning Rate", "l2-046": "Learning rates\n   https://towardsdatascience.com/gradient-descent-algorithm-a-deep-dive-cf04e8115f21", "l2-047": "Now Back to our 2D Linear Regression\n       Similarly, ℒ 𝛽0 , 𝛽1   = σ𝑛𝑖=1 𝑦𝑖 − 𝑦ො 2\n                               𝑛\n                               1                𝑖\n                              = σ𝑛𝑖=1 𝑦𝑖 − 𝑓 𝑥\n                               𝑛\n                               1                             2\n                                                         𝑖\n                              = σ𝑛𝑖=1   𝑦𝑖 − 𝛽0 + 𝛽1 𝑥\n                               𝑛", "l2-048": "Remember Partial Derivatives?", "l2-049": "Now 2D Gradient Descent", "l2-050": " Gradient Descent: The Algorithm\n• Our goal is to find the coefficients, 𝛽0 and 𝛽1 ​, to minimize the error function.\n• To do this, we'll use the gradient, which represents the direction that the function is\n  increasing, and the rate at which it is increasing.\n• Since we want to find the minimum of this function, we can go in the opposite\n  direction of where it's increasing.\n   • That’s it!. Take steps in the direction opposite of where our error function is\n      increasing, proportional to the rate of change.\n• To find the coefficients that minimize first, calculate the derivatives of our loss\n  function, MSE:\n• Repeat until converge:", "l2-051": " Gradient Descent: Implementation\n• Remember Gradient Descent:\n• For Linear Regression and using the MSE objective function, the gradient is given as", "l2-052": "Next: Multi-Linear Regression\nReferences:\n• Andrew NG’s ML Specialization\n• University of Tübingen's ML Course\n• Amazon’s Machine Learning University"};
