<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mariam's Machine Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study notebook — chapter rail on the left, one lecture open at a time, worked lines with handwritten "why" notes in the margin. */
:root{
  --bg:#F3F7FD; --paper:#FFFFFF; --ink:#18213F; --ink-2:#3A4569; --muted:#5F6A8C; --line:#D4DEF0;
  --accent:#3E63CC; --accent-soft:#E3EBFB; --powder:#D9E7F8; --butter:#FBE9A6; --butter-ink:#5E4700; --salmon:#F6D2C9; --salmon-ink:#8A3220;
  --good:#1E7A55; --good-soft:#DDF2E8; --bad:#B23A2C; --bad-soft:#FBE3DF; --note:#FFF7D6; --note-ink:#5B4A10;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162B; --paper:#18203A; --ink:#E9EEFB; --ink-2:#C4CDE8; --muted:#9AA5C7; --line:#2C3860;
  --accent:#93AEF5; --accent-soft:#25335E; --powder:#22355E; --butter:#5A4A14; --butter-ink:#FBE9A6; --salmon:#5B2C24; --salmon-ink:#F8C9BD;
  --good:#6FD3A5; --good-soft:#173A2F; --bad:#F2998C; --bad-soft:#41211D; --note:#2A2814; --note-ink:#F4E3A3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10162B; --paper:#18203A; --ink:#E9EEFB; --ink-2:#C4CDE8; --muted:#9AA5C7; --line:#2C3860;
  --accent:#93AEF5; --accent-soft:#25335E; --powder:#22355E; --butter:#5A4A14; --butter-ink:#FBE9A6; --salmon:#5B2C24; --salmon-ink:#F8C9BD;
  --good:#6FD3A5; --good-soft:#173A2F; --bad:#F2998C; --bad-soft:#41211D; --note:#2A2814; --note-ink:#F4E3A3; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:22px 14px 30px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.01em;margin:0 6px 4px}
.brand small{display:block;font-family:var(--f-hand);font-weight:500;font-size:20px;color:var(--accent);letter-spacing:0;margin-top:4px}
.prog{margin:14px 6px 16px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--powder);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent);width:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:44px 1fr 16px;align-items:center;gap:6px;padding:8px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.25}
.nav a:hover{background:var(--accent-soft)}
.nav a.cur{background:var(--accent-soft);font-weight:700}
.nav .ln{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav .ck{font-size:13px;color:var(--good)}
.nav .grp{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}
.topbar{display:none}
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.ch{max-width:900px;margin:0 auto;scroll-margin-top:80px}
.ch-head{margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;margin:44px 0 10px;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:28px 0 8px}
p,li{max-width:68ch}
.lead{font-size:19px;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)} .small{font-size:14px}
sup{font-size:.7em;line-height:0}
.eps{color:var(--muted)}
code,.k{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
/* boxes */
.box{border-radius:var(--r);padding:14px 18px;margin:18px 0;border:1px solid var(--line);background:var(--paper)}
.box>.bt{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.box.one{background:var(--accent-soft);border-color:transparent}.box.one .bt{color:var(--accent)}
.box.one p{font-size:19px;margin:0}
.box.story{background:var(--paper)}.box.story .bt{color:var(--salmon-ink)}
.box.recipe{background:var(--paper);border:2px solid var(--accent)}.box.recipe .bt{color:var(--accent)}
.box.recipe ol{margin:6px 0 0;padding-left:22px}.box.recipe li{margin:6px 0}
.box.warn{background:var(--bad-soft);border-color:transparent}.box.warn .bt{color:var(--bad)}
.box.words{background:var(--paper)}.box.words .bt{color:var(--muted)}
.box.exam{background:var(--butter);border-color:transparent;color:var(--butter-ink)}.box.exam .bt{color:var(--butter-ink)}
.box ul{margin:4px 0;padding-left:20px}
dl.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:6px 0}
dl.terms dt{font-family:var(--f-mono);font-weight:600}
dl.terms dd{margin:0}
/* worked lines with margin notes */
.wl-list{margin:12px 0;border-top:1px dashed var(--line)}
.wl{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.wl .n{display:none}
.wl.open .n,.whyall .wl .n{display:block}
.whyb{font:inherit;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);background:var(--note);color:var(--note-ink);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer;vertical-align:middle;white-space:nowrap}
.whyb:hover{border-color:var(--note-ink)}
.wl.open .whyb{background:var(--paper)}
.whyall .whyb{display:none}
.whytoggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:0 6px 12px;cursor:pointer}
.whytoggle input{accent-color:var(--accent)}
.wl .m{font-size:17px;min-width:0;overflow-wrap:anywhere}
.wl .n{font-family:var(--f-hand);font-size:21px;line-height:1.2;color:var(--note-ink);background:var(--note);padding:6px 10px;border-radius:8px;position:relative;min-width:0}
.wl .n::before{content:"why";display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
/* stepper */
.stepper{margin:16px 0}
.stepper>.step{animation:pop .25s ease}
.stepper>.step.latest .wl,.stepper>.step.latest.wl{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
@keyframes pop{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.step-count{font-size:13px;color:var(--muted)}
/* buttons */
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:14px;font-family:var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:4px 10px;border-radius:8px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chip.key{min-width:36px}
.txt{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.txt.wide{width:320px}
.sel{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.lbl{font-size:13px;color:var(--muted);font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
/* widgets */
.widget{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0;box-shadow:0 1px 0 var(--line)}
.w-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.w-title::before{content:"try it";font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--butter);color:var(--butter-ink);padding:2px 7px;border-radius:5px}
.sub{font-size:14px;font-weight:700;color:var(--ink-2);margin:14px 0 6px}
.diagram-wrap{overflow-x:auto;margin:6px 0}
svg.diagram{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
svg.diagram .edge path,svg.diagram .startarrow{fill:none;stroke:var(--muted);stroke-width:1.6}
svg.diagram .mk{fill:var(--muted)} svg.diagram .mk-active{fill:var(--accent)}
svg.diagram .edge.on path{stroke:var(--accent);stroke-width:2.6}
svg.diagram .elabel{font-family:var(--f-mono);font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
svg.diagram .state .outer{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.8}
svg.diagram .state .inner{fill:none;stroke:var(--ink-2);stroke-width:1.4}
svg.diagram .slabel{font-family:var(--f-mono);font-size:14px;fill:var(--ink)} svg.diagram .slabel.small{font-size:10.5px}
svg.diagram .state.on .outer{fill:var(--butter);stroke:var(--accent);stroke-width:3}
svg.diagram .state.on .slabel{fill:var(--butter-ink);font-weight:600}
svg.diagram .state.rep .outer{fill:var(--butter);stroke:var(--salmon-ink);stroke-width:3}
svg.diagram .state.hl .outer{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.tape{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0}
.cell{font-family:var(--f-mono);min-width:30px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:16px;padding:0 4px}
.cell.read{color:var(--muted);background:var(--paper)}
.cell.head{border:2px solid var(--accent);background:var(--butter);color:var(--butter-ink);font-weight:700}
.cell.x{text-decoration:line-through;color:var(--muted)}
.cell.empty{color:var(--muted)}
.status{font-size:15px;padding:8px 12px;background:var(--bg);border-radius:8px;min-height:40px}
.verdict{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:2px 8px;border-radius:5px;margin:0 4px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:collapse;font-size:15px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-size:13px;font-weight:700;color:var(--ink-2)}
.tbl td.hot{background:var(--butter);color:var(--butter-ink);font-weight:700}
.tbl tr.acc td{background:var(--good-soft)}
.tbl tr.surv td{background:var(--bad-soft)}
.tbl.splits td{font-variant-numeric:tabular-nums;white-space:nowrap}
.narr p{margin:6px 0;font-size:15px;max-width:none}
.narr p.latest{background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.newtag{font-family:var(--f-mono);font-size:11px;background:var(--butter);color:var(--butter-ink);padding:1px 6px;border-radius:4px}
.note{font-size:15px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0}
.aiout{margin-top:8px}.aitext{white-space:pre-wrap;background:var(--surface-2,rgba(127,127,127,.08));border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55}
.banner{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.banner.ok{background:var(--good-soft);color:var(--good)} .banner.no{background:var(--bad-soft);color:var(--bad)}
.okc{color:var(--good);font-weight:700}.noc{color:var(--bad);font-weight:700}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:4px 0}
.pp{font-family:var(--f-mono);padding:2px 3px;border-radius:4px}
.pp.px{background:var(--powder)} .pp.py{background:var(--butter);color:var(--butter-ink);font-weight:700} .pp.pz{background:var(--salmon);color:var(--salmon-ink)} .pp.pm{background:var(--accent-soft)}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
.move{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mv{font-family:var(--f-display);font-weight:700;font-size:14px;min-width:180px}
.hint{font-size:13px;color:var(--muted)}
.gameinfo{padding:8px 0}.sline{font-size:17px}.big{font-size:20px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:10px 0;font-size:14px}
.pst{padding:3px 7px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pst.rep{background:var(--butter);color:var(--butter-ink);border-color:var(--salmon-ink);font-weight:700}
.parr{color:var(--muted);padding:0 2px}.parr::before{content:"—";}.parr::after{content:"→"}
/* grammar */
.rules{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.7}
.form{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:40px}
.vchip{font:inherit;font-family:var(--f-mono);font-weight:700;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;cursor:pointer}
.vchip.leftmost{box-shadow:0 0 0 3px var(--butter)}
.tchip{font-family:var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block;margin:1px}
.tchip.bad{background:var(--bad-soft);color:var(--bad)}
.done-tag{font-size:13px;color:var(--good);font-weight:700;margin-left:6px}
.derivlog{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.treewrap{overflow-x:auto;background:var(--bg);border-radius:8px;padding:6px}
svg.tree{display:block;margin:0 auto}
svg.tree .tl{stroke:var(--muted);stroke-width:1.3}
svg.tree .tv{font-family:var(--f-mono);font-weight:700;fill:var(--accent);font-size:15px}
svg.tree .tt{font-family:var(--f-mono);fill:var(--ink);font-size:15px}
/* PDA threads */
.threads{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.thread{border:1px solid var(--line);border-radius:10px;padding:6px;min-width:62px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:4px}
.thread.acc{border-color:var(--good);background:var(--good-soft)}
.tq{font-size:13px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:2px;align-items:stretch;min-width:44px}
.plate{font-family:var(--f-mono);text-align:center;background:var(--powder);border-radius:4px;padding:1px 6px;font-size:14px}
.plate.top{background:var(--butter);color:var(--butter-ink);font-weight:700}
.plate.empty{background:transparent;color:var(--muted);font-size:11px}
.stackcol{white-space:nowrap}
.cfg{font-size:15px;background:var(--bg);padding:6px 10px;border-radius:8px;margin:6px 0;overflow-wrap:anywhere}
.qtag{background:var(--butter);color:var(--butter-ink);padding:0 4px;border-radius:4px;margin:0 2px}
.tmt td{white-space:nowrap;font-size:13px}
/* river */
.river{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.bank{background:var(--bg);border-radius:10px;padding:10px;min-height:70px}
.bank-n{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.water{font-family:var(--f-mono);color:var(--accent);font-size:13px;writing-mode:vertical-rl}
/* quiz */
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0}
.quiz-title{font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:8px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.qtext{margin-bottom:8px}
.qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:15px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:8px;font-size:15px;padding:8px 12px;border-radius:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.quiz-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-weight:700}
/* map */
.ladder{display:grid;gap:10px;margin:16px 0}
.rung{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rung .lv{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.rung .lv small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.rung .d{font-size:15px}
.nest{position:relative;margin:16px auto;max-width:520px}
.nest div{border:2px solid var(--accent);border-radius:16px;padding:10px 12px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent);background:color-mix(in srgb, var(--accent-soft) 40%, transparent)}
.nest div div{margin-top:6px}
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:50px;padding-top:18px;border-top:1px solid var(--line)}
.got{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.got input{width:20px;height:20px;accent-color:var(--good)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols2>*{min-width:0}
.cheat{columns:2 320px;column-gap:24px}
.cheat .box{break-inside:avoid;margin-top:0}
.editor{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin:10px 0}

  const fid = (storeKey || 'pp') + '-finger';
  const fin = h('input', { type: 'checkbox', id: fid });
  box.append(h('div', { class: 'edbar' }, bPen, bEr, bUndo, bClr, h('label', { class: 'small muted', for: fid, style: 'display:flex;gap:6px;align-items:center' }, fin, 'draw with finger too')), cv,
    h('div', { class: 'small muted' }, 'Write or draw your answer here with the pencil, like on paper. Then open the model answer and compare.'));
  host.append(box);
  let strokes = storeKey ? store.get(storeKey, []) : [], cur = null, mode = 'pen';
  const ctx = cv.getContext('2d');
  const H = host.dataset.h ? +host.dataset.h : 380;
  function size() { const w = box.clientWidth || 600; const d = window.devicePixelRatio || 1; cv.width = w * d; cv.height = H * d; cv.style.height = H + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); redraw(); }
  function ink() { return getComputedStyle(document.body).color || '#18213F'; }
  function drawStroke(s) {
    if (s.pts.length < 1) return;
    ctx.save(); ctx.globalCompositeOperation = s.er ? 'destination-out' : 'source-over';
    ctx.strokeStyle = ink(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < s.pts.length; i++) { const a = s.pts[i - 1], c = s.pts[i]; ctx.lineWidth = s.er ? 18 : 1.2 + 2.6 * (c[2] || 0.5); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke(); }
    if (s.pts.length === 1 && !s.er) { ctx.beginPath(); ctx.arc(s.pts[0][0], s.pts[0][1], 1.5, 0, 7); ctx.fillStyle = ink(); ctx.fill(); }

  const end = () => { if (!cur) return; cur = null; if (storeKey) { try { store.set(storeKey, strokes); } catch (x) {} } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

  cv.addEventListener('touchstart', e => { const t = e.touches[0]; if ((t && t.touchType === 'stylus') || fin.checked) e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchmove', e => { const t = e.touches[0]; if ((t && t.touchType === 'stylus') || fin.checked) e.preventDefault(); }, { passive: false });
  bPen.onclick = () => { mode = 'pen'; bPen.classList.add('sel'); bEr.classList.remove('sel'); };
  bEr.onclick = () => { mode = 'er'; bEr.classList.add('sel'); bPen.classList.remove('sel'); };
  bUndo.onclick = () => { strokes.pop(); redraw(); end(); if (storeKey) store.set(storeKey, strokes); };
  bClr.onclick = () => { strokes = []; redraw(); if (storeKey) store.set(storeKey, strokes); };
  fin.onchange = () => cv.classList.toggle('fingerdraw', fin.checked);
  new ResizeObserver(() => size()).observe(box);
  size();

}

  { title: 'Essay questions', items: [
   R(SRC.q25, W('Essay', 'What is the learning rate in Gradient descent, what happened if we choose large or small value?', 'The learning rate α (η) is a hyperparameter that controls the <b>size of each step</b> in the update β ← β − α ∂J/∂β.<br>• <b>Too small</b>: tiny steps → gradient descent is very slow (needs many iterations), but stable.<br>• <b>Too large</b>: it can <b>overshoot</b> the minimum, oscillate, never reach the minimum and fail to converge, or even <b>diverge</b>.<br>• A well-chosen (or adaptive) value reaches the minimum efficiently.', ['Definition: step size in the update rule (hyperparameter)', 'Small → slow convergence', 'Large → overshoot / oscillate / diverge', 'Good or adaptive value is best'])),
   R(SRC.q25, DIFF('the normal equation', 'the Gradient descent algorithm', [['Type', 'Direct closed-form solution β = (XᵀX)⁻¹Xᵀy', 'Iterative optimization'], ['Learning rate', 'Not needed', 'Needed (must be tuned)'], ['Iterations', 'None, one computation', 'Many, until convergence'], ['Feature scaling', 'Not needed', 'Needed'], ['Large data / many features', 'Slow: inverting XᵀX costs ≈ O(p³), lots of memory', 'Scales well, stores only the parameters'], ['Accuracy', 'Exact (if XᵀX is invertible)', 'Approximate, improves with iterations'], ['Problems', 'Fails if XᵀX is singular (multicollinearity)', 'Can diverge / get stuck if α is bad'], ['Use for', 'Only linear regression', 'Almost any model (logistic, neural nets …)']], 'Pros of the normal equation: exact, no α, no iterations, no scaling. Cons: expensive for many features, needs an invertible XᵀX. Pros of GD: scalable, general, low memory. Cons: needs α, many iterations, scaling.'), { q: 'Describe in details the difference between the normal equation and the Gradient descent algorithm (Pros vs cons)?', marks: 4 })] },
  { title: 'Numerical question', items: [
   R(SRC.q25, NUM(`Consider the following dataset: ${DATA_Q25} Initial parameters: β₀ = 0, β₁ = 0. Learning rate α = 0.1. We will show the parameter updates for the first 2 iterations.<br><span class="small muted">${GDNOTE}</span><br><b>(a)</b> What is β₀ after iteration 1?`, 0.28, 'Iteration 1: h = 0, 0, 0. Errors h − y = −2, −2.8, −3.6. ∂J/∂β₀ = (−2 − 2.8 − 3.6)/3 = −2.8. β₀ = 0 − 0.1(−2.8) = <b>0.28</b>.')),
   R(SRC.q25, NUM('(b) Same data. What is β₁ after iteration 1? (3 decimals)', 0.613, '∂J/∂β₁ = (−2·1 − 2.8·2 − 3.6·3)/3 = −18.4/3 = −6.133. β₁ = 0 + 0.1·6.133 = <b>0.613</b>.')),
   R(SRC.q25, NUM('(c) What is β₀ after iteration 2? (3 decimals)', 0.409, 'h = 0.28 + 0.613x = 0.893, 1.507, 2.120. Errors = −1.107, −1.293, −1.480. ∂J/∂β₀ = −3.88/3 = −1.293. β₀ = 0.28 + 0.1293 = <b>0.409</b>.')),
   R(SRC.q25, NUM('(d) What is β₁ after iteration 2? (3 decimals)', 0.884, '∂J/∂β₁ = (−1.107·1 − 1.293·2 − 1.480·3)/3 = −8.133/3 = −2.711. β₁ = 0.613 + 0.2711 = <b>0.884</b>. After 2 iterations: h(x) ≈ 0.409 + 0.884x (the true line is y = 1.2 + 0.8x; GD is getting closer).'))] }] },

 { id: 'rq24', ln: 'Q·24', title: 'Quiz · December 2024', sub: 'CSAI 420 – Machine Learning and Statistical Learning. Allowed time 30 minutes. (Lectures 5–6: regularization, logistic regression.)', minutes: 30, qs: [
  { title: 'Questions', items: [
   R(SRC.q24, MS('You train a classifier on 10,000 training points and obtain a training accuracy of 99%. However, when you submit to Kaggle, your accuracy is only 67%. Which of the following, done in isolation, has a good chance of improving your performance on Kaggle?', ['Set your regularization value (λ) to 0', 'Train on more data', 'Use validation to tune your hyperparameters', 'Train on less data'], [1, 2], '99% train vs 67% test = <b>overfitting</b> (high variance). More data reduces variance; tuning hyperparameters (e.g. λ, degree) on a validation set picks a model that generalizes. Setting λ = 0 removes regularization (worse); less data makes overfitting worse.'), { marks: 2 }),
   R(SRC.q24, MS('In least-squares linear regression, adding a regularization term can', ['increase training error.', 'decrease training error.', 'increase validation error.', 'decrease validation error.'], [0, 2, 3], 'Regularization moves β away from the least-squares solution, so the <b>training error can only go up</b> (never down). On validation data it can go either way: it decreases if we were overfitting, increases if λ is too big (underfitting).'), { marks: 2 }),
   R(SRC.q24, M('In sigmoid function g(z), if the z is large negative number, then:', ['g(z) is near 0', 'g(z) is near 1', 'g(z) is near −1', 'g(z) is near 0.5'], 0, 'g(z) = 1/(1 + e<sup>−z</sup>). For z → −∞, e<sup>−z</sup> → ∞, so g(z) → 0.')),
   R(SRC.q24, M('For the simplified loss function, if the label y<sub>i</sub> = 0, then what does the function will be:', ['−log(1 − f<sub>w,b</sub>(x<sup>(i)</sup>)) − log(1 − f<sub>w,b</sub>(x<sup>(i)</sup>))', 'log(f<sub>w,b</sub>(x<sup>(i)</sup>))', '−log(1 − f<sub>w,b</sub>(x<sup>(i)</sup>))', 'log(1 − f<sub>w,b</sub>(x<sup>(i)</sup>)) + log(1 − f<sub>w,b</sub>(x<sup>(i)</sup>))'], 2, 'Loss = −y log f − (1 − y) log(1 − f). With y = 0 the first term disappears: <b>−log(1 − f(x))</b>.')),
   R(SRC.q24, T('No matter what feature you use, the decision boundary in logistic regression will be linear decision.', false, 'The boundary is linear <b>in the features we give it</b>. If we add features like x₁², x₂², x₁x₂, the boundary in the original space can be non-linear (e.g. a circle: −1 + x₁² + x₂² = 0).'))] },
  { title: 'Essay questions', items: [
   R(SRC.q24, W('Essay', 'Why can\'t linear regression be used in place of logistic regression for binary classification?', '1. Linear regression outputs any real number (below 0 and above 1), so its output is <b>not a valid probability</b>.<br>2. Its squared-error loss <b>penalizes even correct predictions made with high confidence</b> (a point far on the correct side still adds a big error), so far points pull the line and move the decision threshold.<br>3. The relationship between x and a probability is not linear; logistic regression uses the sigmoid to map βᵀx to (0, 1).', ['Output not in [0, 1] / not a probability', 'Squared loss penalizes correct confident predictions / sensitive to far points', 'Sigmoid maps to (0, 1)'])),
   R(SRC.q24, W('Essay', 'What is (MLE) in logistic regression, and why can\'t we use (MSE) as a cost function?', '<b>MLE</b> (maximum likelihood estimation): each label is Bernoulli with p = σ(βᵀx); we choose the β that makes the observed labels <b>most likely</b>: maximize Π p̂ᵢ<sup>yᵢ</sup>(1 − p̂ᵢ)<sup>1−yᵢ</sup>. Taking the log and the negative gives the cross-entropy (log-loss) J = −(1/n) Σ [y log p̂ + (1 − y) log(1 − p̂)].<br><b>Not MSE</b> because: (1) with the sigmoid, MSE is <b>non-convex</b> (local minima, plateaus) so GD may get stuck; (2) the errors are Bernoulli, not Gaussian (MSE = MLE only for Gaussian noise); (3) MSE is bounded by 1 so very confident wrong predictions are hardly punished, while log-loss → ∞.', ['MLE: choose β making the data most likely', 'Bernoulli likelihood → log → cross-entropy', 'MSE non-convex with sigmoid', 'Errors not Gaussian / weak penalty'], { marks: 4 }))] },
  { title: 'Numerical question', items: [
   R(SRC.q24, NUM(`Consider the following dataset with a single feature x and a binary target y: ${DATA_Q24} We want to estimate the coefficients β₀ (intercept) and β₁ (slope) using Gradient Descent. Initial coefficients: β₀ = 0, β₁ = 0. Learning rate α = 0.1.<br><span class="small muted">h(x) = σ(β₀ + β₁x); ∂J/∂β₀ = (1/n)Σ(h − y), ∂J/∂β₁ = (1/n)Σ(h − y)x.</span><br><b>(a)</b> β₁ after iteration 1?`, 0.05, 'z = 0 → h = 0.5 for every point. Errors h − y = 0.5, 0.5, −0.5, −0.5. ∂J/∂β₀ = 0 → β₀ stays 0. ∂J/∂β₁ = (0.5 + 1 − 1.5 − 2)/4 = −0.5 → β₁ = 0 − 0.1(−0.5) = <b>0.05</b>.'), { tol: 0.002 }),
   R(SRC.q24, NUM('(b) β₀ after iteration 2? (4 decimals)', -0.0031, 'z = 0.05x → h = 0.5125, 0.52498, 0.53743, 0.54983. Errors = 0.5125, 0.52498, −0.46257, −0.45017. ∂J/∂β₀ = 0.12474/4 = 0.03119. β₀ = 0 − 0.1·0.03119 = <b>−0.0031</b>.'), { tol: 0.0006 }),
   R(SRC.q24, NUM('(c) β₁ after iteration 2? (4 decimals)', 0.0906, '∂J/∂β₁ = (0.5125·1 + 0.52498·2 − 0.46257·3 − 0.45017·4)/4 = −1.62593/4 = −0.40648. β₁ = 0.05 + 0.040648 = <b>0.0906</b>.'), { tol: 0.0006 })] }] },

 { id: 'rm22', ln: 'M·22', title: 'Midterm · Fall 2022 (Paper I)', sub: 'CSAI420: Introduction to Machine Learning. 70 marks. Model answers follow the official solutions (where the solution sheet is empty we wrote the answer from the lectures).', minutes: 90, qs: [
  { title: 'Question 1 · A. Classification or Regression? Explain your answer!', items: [
   R(SRC.m22, M('a. Stock Market Predictor', ['Regression', 'Classification', 'Both regression and classification'], 0, 'Predicts a <b>continuous</b> number (the price).')),
   R(SRC.m22, M('b. Spam Mail Detection', ['Regression', 'Classification', 'Both regression and classification'], 1, 'Output is a <b>class</b>: spam / not spam.')),
   R(SRC.m22, M('c. World Cup Winner Predictor', ['Regression', 'Classification', 'Both regression and classification'], 1, 'Output is one team out of a set of teams: a <b>class</b>.')),
   R(SRC.m22, M('d. Object Detection in Autonomous Cars', ['Regression', 'Classification', 'Both regression and classification'], 2, '<b>Both</b>: classification (what the object is: car, pedestrian …) + regression (where it is: the box coordinates).')),
   R(SRC.m22, M('e. Weather prediction', ['Regression', 'Classification', 'Both regression and classification'], 0, 'Predicting temperature etc. = continuous values → regression (official answer). (Predicting rain / no rain would be classification.)'))] },
  { title: 'Question 1 · B. Let\'s classify Cats and Dogs!', items: [
   R(SRC.m22, W('Essay', 'a. Can we write a traditional program to classify cats? b. How good would it be? Why?', 'a. <b>Yes</b>, in principle (hand-written rules: ears, whiskers …).<br>b. It would be <b>bad</b>: in practice it is almost impossible for a human to specify all the edge cases (poses, lighting, breeds, partial views), and we cannot even explain exactly how we recognize a cat.', ['Yes, possible', 'Poor: impossible to specify all edge cases'])),
   R(SRC.m22, W('Essay', 'c. How to use ML to make it better? Why does it usually work better? i. Is this problem supervised or unsupervised? Why? ii. Why is ML booming nowadays?', 'c. Show the computer <b>many labeled examples</b> of cats and dogs; a learning algorithm learns what defines a cat on its own, no manual programming. It works better because it learns from data the patterns we can\'t describe, and it improves with more data.<br>i. <b>Supervised</b>: the labels (cat / dog) are there.<br>ii. Computational power (GPUs), big data available and growing, powerful programming frameworks, money and people.', ['Learn from many labeled examples, no manual rules', 'Supervised because labels exist', 'Boom: compute, big data, frameworks, money/people'], { marks: 3 }))] },
  { title: 'Question 2 · A. House Pricing: linear regression', items: [
   R(SRC.m22, W('Essay', `Consider the House Pricing Prediction Problem: ${FIG.house()} a. Write the equation of the model. b. What is the best error function to use for such a linear regression model?`, 'a. y = β₀ + β₁x₁ (x₁ = % of adults without a high-school diploma, y = median house price).<br>b. <b>Mean Squared Error</b>: MSE = (1/n) Σ (yᵢ − ŷᵢ)².', ['y = β₀ + β₁x₁', 'MSE'])),
   R(SRC.m22, W('Essay', 'c. Explain the training process in 3-4 sentences. Be concise!', 'Choose the error function (MSE) and train the model to reduce that error. This can be done <b>analytically</b> (normal equation β = (XᵀX)⁻¹Xᵀy) or with <b>gradient descent</b>: start from random β, compute the gradient of the MSE, update β₀ ← β₀ − α ∂/∂β₀, β₁ ← β₁ − α ∂/∂β₁ simultaneously, and repeat until convergence.', ['Define the error (MSE)', 'Minimize it analytically or with GD', 'GD: gradient + update rule repeated until convergence'])),
   R(SRC.m22, W('Essay', 'd. Now how to use the trained model to make predictions? e. Is it better to use gradient descent or the analytical solution? Why?', 'd. Once we have fit our model, predicting is easy: plug any new x value into the equation ŷ = β̂₀ + β̂₁x.<br>e. Official answer: <b>Gradient descent, faster</b> (no matrix inversion, scales to big data). For a tiny dataset with one feature the analytical solution is also fine and exact.', ['Plug x into the fitted equation', 'GD: faster / scalable (no inversion)'])),
   R(SRC.m22, W('Essay', 'f. Is it better to use a large learning rate or a small one? Why?', 'Neither extreme: if η is too <b>small</b>, gradient descent may be <b>slow</b>. If η is too <b>large</b>, gradient descent may overshoot, never reach the minimum, fail to converge, or diverge. <b>Adaptive</b> is best.', ['Small → slow', 'Large → overshoot/diverge', 'Adaptive / moderate is best'])),
   R(SRC.m22, W('Essay', 'g. How do things change when we use more features i.e., the model, the training process and then predictions?', 'Model: f(x) = β₀ + β₁x₁ + … + β_px_p = βᵀx (with x₀ = 1), a plane / hyperplane. Training: same MSE, now in matrix form (1/n)‖y − Xβ‖²; the gradient is a vector −(2/n)Xᵀ(y − Xβ); all coefficients are updated together, or β = (XᵀX)⁻¹Xᵀy. Features should be scaled for GD. Predictions: ŷ = βᵀx for the new feature vector.', ['Model βᵀx with p features', 'Training: matrix form / vector gradient / normal equation', 'Prediction ŷ = βᵀx'], { marks: 3 })),
   R(SRC.m22, W('Essay', 'h. How would you choose the features to help the model as much as possible?', 'Choose features that are <b>related to the target</b> and <b>not strongly correlated with each other</b>: strong correlations between features ⇒ small singular values in XᵀX ⇒ numerical problems, coefficients blowing up, high estimation uncertainty. Remove or combine correlated features (or use Ridge / Lasso, which also selects features); ideally features close to orthogonal.', ['Relevant to the target', 'Avoid correlated features (multicollinearity)', 'Remove/combine or regularize'], { marks: 2 }))] },
  { title: 'Question 2 · B. Polynomial regression', items: [
   R(SRC.m22, W('Essay', 'a. Is this model still linear? Why?', 'Yes: f(x) = β₀ + β₁x + β₂x² + β₃x³ is <b>still linear regression</b>, because it is linear in the coefficients β; x², x³ are just extra features (columns of X).', ['Yes', 'Linear in β; powers are features'])),
   R(SRC.m22, W('Essay', 'b. Is it always better to use high order polynomials? Why?', 'No. As the degree increases towards the size of the dataset we can fit every point, but the curve becomes highly irregular: its behavior outside the training set is wildly inaccurate (<b>overfitting</b>).', ['No', 'Fits every point but wild outside → overfitting'])),
   R(SRC.m22, W('Essay', 'c. Why is it important to have validation and test data beside the training data?', 'Training set: used for model fitting. Validation set: used for hyper-parameter tuning (λ, degree). Test set: used for final model evaluation (once) – unseen data, so it measures generalization. If we tuned on the test set it would no longer represent unseen data. (Rule of thumb ≈ 90% training, 10% test.)', ['Training: fitting', 'Validation: tuning hyperparameters', 'Test: final evaluation on unseen data']))] },
  { title: 'Question 2 · C. Training / validation curve', items: [
   R(SRC.m22, W('Essay', `Consider the following training/validation curve for some polynomial model: ${FIG.loss()} a. Where is the model underfitting? Where is it overfitting? b. Where is the bias high? Where is the variance high?`, 'a. <b>Left</b> (green, early epochs, both losses high and falling): underfitting. <b>Right</b> (pink, training loss still falls while the test loss rises): overfitting. Best point = minimum of the test loss.<br>b. Bias is high on the <b>left</b> (underfitting); variance is high on the <b>right</b> (overfitting).', ['Left = underfitting', 'Right = overfitting', 'High bias left', 'High variance right'], { marks: 4 })),
   R(SRC.m22, W('Essay', 'c. How to solve underfitting? Mention at least 2 Techniques. d. How to solve overfitting? Mention at least 2 Techniques.', 'Underfitting: increase the model class to more expressive models (higher degree, more complex model); create richer features that make the data easier to fit.<br>Overfitting: reduce the complexity of the model; add more data; penalize complex models in the objective (<b>regularization</b>: Ridge, Lasso); early stopping.', ['Underfitting: more expressive model', 'Underfitting: richer features', 'Overfitting: simpler model / more data', 'Overfitting: regularization'], { marks: 4 })),
   R(SRC.m22, W('Essay', 'e. What does "Epoch" mean?', 'One epoch = <b>one full pass over the whole training dataset</b> during training (gradient descent sees every training example once).', ['One full pass over the training data']), { marks: 2 })] },
  { title: 'Question 3 · A. Logistic regression', items: [
   R(SRC.m22, W('Essay', `Now let's consider Logistic Regression: ${FIG.iris()} a. Can't we just use Linear Regression? Why?`, '<b>No.</b> The loss function penalizes you when you make correct predictions with high confidence; and the output is not between 0 and 1 (not a probability).', ['No', 'Penalizes correct confident predictions / output not a probability'])),
   R(SRC.m22, W('Essay', 'b. Write the equation of the Logistic Regression model for this case.', 'P(y = 1 | x) = σ(β₀ + β₁x₁ + β₂x₂) = 1 / (1 + e<sup>−(β₀ + β₁x₁ + β₂x₂)</sup>), with x₁ = sepal length, x₂ = sepal width. Predict class 1 if the probability ≥ 0.5.', ['σ(β₀ + β₁x₁ + β₂x₂)', 'Sigmoid formula / threshold'])),
   R(SRC.m22, W('Essay', 'c. Logistic regression is called a linear classifier. True or False? Why?', '<b>True</b>: with threshold 0.5 the decision boundary is βᵀx = 0, which is a line / plane / hyperplane (as in the figure).', ['True', 'Boundary βᵀx = 0 is linear'])),
   R(SRC.m22, W('Essay', 'd. Is it better to use gradient descent or the analytical solution? Why? e. How can one extend the model for multi classes?', 'd. <b>Gradient descent</b>: there is no analytical (closed-form) solution for logistic regression.<br>e. <b>One-vs-all</b> (one binary classifier per class) or <b>softmax regression</b>: P(y = k | x) = e<sup>β<sub>k</sub>ᵀx</sup> / Σᵢ e<sup>βᵢᵀx</sup>.', ['GD: no closed form', 'One-vs-all', 'Softmax'], { marks: 3 }))] },
  { title: 'Question 3 · B. Evaluating the output', items: [
   R(SRC.m22, W('Essay', 'a. Consider a Cats vs Dogs dataset with 1000 images, 500 images each. Can we just use the accuracy as an evaluation measure here? b. Now assume we only have 100 images of dogs and 900 of cats. Do we still use the accuracy measure? Is there a better measure? Explain.', 'a. <b>Yes</b>: the classes are balanced, so accuracy is meaningful.<br>b. <b>No</b>: the data is <b>imbalanced</b>. A model that always says "cat" gets 90% accuracy while never finding a dog. Use precision, recall, F1-score or ROC/AUC instead.', ['Balanced → yes', 'Imbalanced → no (always "cat" = 90%)', 'Use precision / recall / F1 / AUC'], { marks: 4 }))] },
  { title: 'Question 3 · C. Confusion matrix', items: [
   R(SRC.m22, NUM(`Consider the following confusion matrix of some binary classifier: ${FIG.cm(6, 2, 5, 21)} a. What is the precision? (3 decimals)`, 0.545, 'Precision = TP/(TP + FP) = 6/11 ≈ <b>0.545</b>.')),
   R(SRC.m22, NUM('b. What is the recall?', 0.75, 'Recall = TP/(TP + FN) = 6/8 = <b>0.75</b>.')),
   R(SRC.m22, NUM('c. What is the F1-Score? (3 decimals)', 0.632, 'F1 = 2PR/(P + R) = 2(0.545)(0.75)/(1.295) = 12/19 ≈ <b>0.632</b>.')),
   R(SRC.m22, W('Essay', 'd. Is it better to have a higher precision or a higher recall? Why?', 'It depends on the problem. For cancer: a model with high <b>recall</b> identifies most people that have cancer (saving their lives) but misdiagnoses some healthy people (false positives → expensive, dangerous treatments). A model with high <b>precision</b> gives confident diagnoses but fails to identify everyone who has the disease (false negatives → potentially fatal). In cancer detection, recall is usually preferred; in a spam filter, precision.', ['Depends on the cost of FP vs FN', 'High recall: fewer missed positives, more FP', 'High precision: fewer FP, more missed positives', 'Example (cancer → recall)'], { marks: 3 })),
   R(SRC.m22, W('Essay', 'e. Is it better to use the ROC or the AUC for classification\'s evaluation? Why?', 'Official answer: <b>ROC</b>. The curve lets us select classification thresholds that identify as many true positives as possible while minimizing false positives. (AUC is a single number, useful to compare models, but it hides the threshold choice.)', ['ROC', 'Lets us choose the threshold (TPR vs FPR)'])),
  ] },
  { title: 'Question 3 · D. Deep learning model (beyond our 6 lectures, but it was asked)', items: [
   R(SRC.m22, W('Essay', 'a. Using a neural network is better compared to the logistic regression model (or any machine learning model in general). True or False? Why?', '<b>False.</b> A neural network could overfit or be much more complex than needed. Start simple.', ['False', 'May overfit / too complex; start simple'])),
   R(SRC.m22, W('Essay', 'b. Applying traditional gradient descent, the training performance is poor. How can you make gradient descent better and faster? c. Now overfitting happens. Mention 3 types of regularization to reduce it.', 'b. <b>Momentum</b>, <b>Stochastic Gradient Descent</b> (SGD), <b>mini-batches</b> (also an adaptive learning rate, feature scaling).<br>c. <b>Lasso</b> (L1), <b>Ridge</b> (L2) and <b>Dropout</b> (also early stopping).', ['Momentum / SGD / mini-batches', 'Lasso, Ridge, Dropout'], { marks: 4 }))] }] },

 { id: 'rm24', ln: 'M·24', title: 'Midterm · Fall 2024 (Dr. Laila Afify)', sub: 'Time: 120 minutes · Marks: 60 · 14-Nov-2024. There is no official solution: the model answers are written from the lectures and the doctor\'s guide.', minutes: 120, qs: [
  { title: 'Question 1 (30 points) · y = Xβ + ε and β̂ = (XᵀX)⁻¹Xᵀy', items: [
   R(SRC.m24, W('Essay', '(a) Write the cost function of the linear regression model and explain how gradient descent can be used to minimize it.', 'J(β) = (1/n) ‖y − Xβ‖² = (1/n) Σ (yᵢ − βᵀx⁽ⁱ⁾)² (MSE).<br>Gradient descent: start from an initial β (e.g. random or 0); compute the gradient ∇J = −(2/n)Xᵀ(y − Xβ); update all coefficients simultaneously β ← β − η∇J; repeat until the change in β (or in the cost) is very small. The cost is convex (a bowl), so GD reaches the global minimum if η is well chosen (too small → slow, too large → diverges).', ['Cost function (MSE, matrix form)', 'Gradient −(2/n)Xᵀ(y − Xβ)', 'Update rule with learning rate, simultaneous', 'Repeat until convergence / role of η'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(b) Explain how the normal equations relate to the minimization of the error vector\'s length.', 'The error (residual) vector is e = y − Xβ. OLS minimizes its length ‖e‖² = (y − Xβ)ᵀ(y − Xβ). Setting the gradient to zero gives Xᵀ(y − Xβ) = 0, i.e. <b>Xᵀe = 0</b>: the shortest error vector is the one <b>perpendicular to every column of X</b>. Geometrically ŷ = Xβ̂ is the orthogonal projection of y onto the column space of X. Rearranging Xᵀe = 0 gives the normal equations XᵀXβ = Xᵀy.', ['e = y − Xβ, minimize ‖e‖²', 'Gradient = 0 → Xᵀe = 0', 'e ⟂ columns of X / projection onto column space', 'Gives XᵀXβ = Xᵀy'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(c) Describe what happens if two or more features in the design matrix X are perfectly correlated. How does this affect the normal equation solution? What are some commonly proposed methods to address or mitigate this issue in the model?', 'Perfect correlation = one column is a linear combination of others (e.g. x₂ = 2x₁) → <b>multicollinearity</b>: X is not full rank, so XᵀX is <b>singular</b> (det = 0) and cannot be inverted: the normal equation has <b>no unique solution</b> (infinitely many β). Near-perfect correlation → ill-conditioned XᵀX, unstable, huge coefficients, high uncertainty.<br>Remedies: remove one of the correlated features; combine them (e.g. average / PCA); <b>Ridge</b> regression β = (XᵀX + nλI)⁻¹Xᵀy (always invertible); Lasso (selects one); collect more data.', ['Columns linearly dependent → XᵀX singular', 'No unique β / unstable coefficients', 'Remove or combine features', 'Ridge (and/or Lasso)'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(d) If we have two features x₁ and x₂ that are uncorrelated, does this imply that they are independent? Provide an example where two features are uncorrelated but not independent.', '<b>No.</b> Uncorrelated only means no <b>linear</b> relationship (Cov = 0). Independent means no relationship of any kind (P(x₁, x₂) = P(x₁)P(x₂)). Independence ⇒ uncorrelated, but not the converse.<br>Example: x₁ uniform on [−1, 1] and x₂ = x₁². Cov(x₁, x₂) = E[x₁³] − E[x₁]E[x₁²] = 0, yet x₂ is completely determined by x₁.', ['No', 'Uncorrelated = no linear relation; independent = none at all', 'Example x₂ = x₁² with x₁ symmetric'], { marks: 3 })),
   R(SRC.m24, W('Essay', '(e) If a linear regression model fits the training data perfectly with no errors, what could be a potential issue with this model?', '<b>Overfitting</b>: the model has also fitted the noise (high variance), so it will probably perform badly on new data. A perfect fit can also mean too many features / parameters (n ≤ p + 1) or data leakage. Check on a validation/test set; use fewer features, regularization or more data.', ['Overfitting / fits the noise', 'Poor on unseen data (high variance)', 'Check on validation/test; fix'], { marks: 3 })),
   R(SRC.m24, W('Essay', '(f) Discuss the advantages of having orthonormal features when fitting a linear regression model. Specifically, consider how orthonormality affects interpretability, and computational efficiency.', 'Orthonormal: xᵢᵀxⱼ = 0 (i ≠ j) and ‖xᵢ‖ = 1, so <b>XᵀX = I</b>.<br>• Computation: β = Xᵀy, <b>no matrix inversion</b>; very cheap and numerically stable (no singularity, no multicollinearity).<br>• Interpretability: each coefficient βⱼ = xⱼᵀy is computed <b>independently</b> of the others, so it shows the direct effect of that feature; adding/removing a feature does not change the other coefficients.', ['XᵀX = I → β = Xᵀy', 'No inversion: fast and stable', 'Each coefficient independent → interpretable'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(g)(i) In simple linear regression β₁ = Cov(X, y)/Var(X). Explain intuitively why β₁ depends on both the covariance between X and Y and the variance of X.', 'Cov(X, y) measures how X and y <b>move together</b> (direction and strength). But the same co-movement means a different slope depending on how spread X is: dividing by Var(X) <b>scales</b> it to "change in y per one unit of X". Large spread in X with the same covariance → smaller slope.', ['Cov: how X and y move together (sign/direction)', 'Var(X): spread of X; dividing gives change per unit of X'], { marks: 2 })),
   R(SRC.m24, W('Essay', '(g)(ii) Suppose Cov(X, y) = 0. What does this imply about the estimated relationship between X and Y in the regression model?', 'β₁ = 0: the fitted line is <b>horizontal</b> (ŷ = ȳ). There is <b>no linear relationship</b>: X does not help predict y linearly (there may still be a non-linear one).', ['β₁ = 0, horizontal line', 'No linear relationship (non-linear still possible)'], { marks: 2 })),
   R(SRC.m24, W('Essay', '(g)(iii) Suppose that the error term ε has a large variance. What impact would this have on the quality of the model\'s predictions, and how could you address this while designing your model to mitigate this variance?', 'Large Var(ε) = σ² = large <b>irreducible error</b>: predictions will be noisy and uncertain, and the estimates of β are less precise; no model can go below σ² on new data. Mitigate: collect more data (more precise β); add relevant features that explain part of what is now in ε; reduce measurement noise / clean outliers; use regularization to avoid fitting the noise.', ['High irreducible error → noisy predictions, uncertain β', 'More data / better (relevant) features', 'Reduce noise / regularize'], { marks: 2 }))] },
  { title: 'Question 2 (22 points) · Model A vs Model B', items: [
   R(SRC.m24, W('Essay', `Consider a dataset that a data scientist uses to train two linear regression models, Model A and Model B, to predict housing prices. <b>Model A</b> is a simple linear regression model with only one feature, the square footage of the house. <b>Model B</b> is a complex polynomial regression model of degree 10, which includes various features, including square footage, number of rooms, and several interaction terms. ${FIG.tbl(['Model', 'Training Error', 'Test Error'], [['Model A', 'High', 'Moderate'], ['Model B', 'Low', 'High']])} (a) Identify whether each model (A and B) is likely overfitting, underfitting, or well-fitted, and explain your reasoning.`, 'Model A: <b>underfitting</b> – the training error is high, so it cannot even capture the pattern in the data it was trained on (too simple: one feature, a straight line).<br>Model B: <b>overfitting</b> – very low training error but high test error: it memorized the training data (noise included) and does not generalize.', ['A underfitting (high training error)', 'B overfitting (low train, high test)'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(b) Discuss how the concepts of bias and variance apply to each model in this context.', 'Model A: <b>high bias, low variance</b> – its simplifying assumption (linear in one feature) is far from the true relationship, but it would change little with another training set.<br>Model B: <b>low bias, high variance</b> – flexible enough to fit the truth, but very sensitive to the particular training sample. Total error = Bias² + Variance + σ²; both are far from the best balance.', ['A: high bias, low variance', 'B: low bias, high variance', 'Link to total error / tradeoff'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(c) Based on the table, explain what you might do to improve each model\'s performance. What type of changes would you make to the models, and why?', 'Model A (reduce bias): add more relevant features (rooms, location…), add polynomial / interaction terms, use a more expressive model.<br>Model B (reduce variance): lower the degree / remove features, add <b>regularization</b> (Ridge, Lasso, choose λ by cross-validation), get more training data, early stopping.', ['A: more features / more complex model', 'B: simpler model / fewer features', 'B: regularization (λ by CV) / more data'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(d) Explain what hyperparameters are and how they differ from model parameters. Discuss why they are essential for optimizing model performance.', '<b>Parameters</b> (β) are learned from the data during training (by OLS / GD). <b>Hyperparameters</b> are chosen <b>before</b> training and cannot be found by calculus / OLS / GD: polynomial degree, learning rate η, regularization λ, number of folds k. They control model complexity and how training behaves, so they decide underfitting vs overfitting and whether GD converges; they are tuned on a validation set / with cross-validation (e.g. grid search).', ['Parameters learned from data', 'Hyperparameters set before training (examples)', 'Control complexity / convergence', 'Tuned with validation / CV'], { marks: 4 })),
   R(SRC.m24, M('(e) Choose the correct answer: In Ridge regularization, if the value of λ, the regularization penalty, is set very high, what is the expected outcome?', ['The model will be identical to a simple linear regression.', 'The coefficients will be close to zero, resulting in a highly biased model.', 'The model will have low bias and high variance.', 'The coefficients will become very large.'], 1, 'A huge λ makes the penalty dominate: all coefficients shrink towards 0 → very simple model → underfitting (high bias, low variance).'), { marks: 3 }),
   R(SRC.m24, M('(f) Choose the correct answer: Suppose you are training a model with gradient descent and find that the cost function value oscillates and fails to converge. Which of the following is most likely the cause?', ['The learning rate is too high.', 'The model has too many parameters.', 'The learning rate is too small.', 'The initial parameter values are too small.'], 0, 'Steps too big → GD jumps over the minimum back and forth (oscillates) and may diverge.'), { marks: 3 })] },
  { title: 'Question 3 (8 points) · Bias and variance on the dart boards', items: [
   R(SRC.m24, M(`Characterize the bias and variance of the estimates of the following models on the data with respect to the true model as low or high: ${FIG.darts()} <b>Board A</b>`, ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 0, 'All shots tightly together <b>on</b> the centre.'), { marks: 2 }),
   R(SRC.m24, M('<b>Board B</b> (same figure)', ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 1, 'Shots tightly together (low variance) but <b>away</b> from the centre (high bias).'), { marks: 2 }),
   R(SRC.m24, M('<b>Board C</b> (same figure)', ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 2, 'Shots spread out (high variance) but centred on the truth on average (low bias).'), { marks: 2 }),
   R(SRC.m24, M('<b>Board D</b> (same figure)', ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 3, 'Shots spread out <b>and</b> away from the centre: high bias and high variance.'), { marks: 2 })] }] },

 { id: 'rnx', ln: 'Num', title: 'Numerical examples sheet (from the course)', sub: 'The worked numerical examples the doctor gave: linear regression GD + OLS, multiple linear regression GD, logistic regression GD and the logistic cost. ⚠ Two slips in the handout are corrected in the model answers.', minutes: 45, qs: [
  { title: '1) Single feature linear regression', items: [
   R(SRC.nx, NUM(`You are given a dataset with a single feature for linear regression: ${DATA_NX1} Initial parameters: β₀ = 0, β₁ = 0. Learning rate α = 0.1. What are the parameter updates for the first 2 iterations?<br><span class="small muted">${GDNOTE}</span><br>β₀ after iteration 1?`, 0.45, 'h = 0. Errors = −3, −4.5, −6. ∂J/∂β₀ = −13.5/3 = −4.5 → β₀ = 0 + 0.1·4.5 = <b>0.45</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 1?', 1, '∂J/∂β₁ = (−3·1 − 4.5·2 − 6·3)/3 = −30/3 = −10 → β₁ = 0 + 0.1·10 = <b>1.0</b>.')),
   R(SRC.nx, NUM('β₀ after iteration 2? (3 decimals)', 0.655, 'h = 0.45 + x = 1.45, 2.45, 3.45. Errors = −1.55, −2.05, −2.55. ∂J/∂β₀ = −6.15/3 = −2.05 → β₀ = 0.45 + 0.205 = <b>0.655</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 2? (3 decimals)', 1.443, '∂J/∂β₁ = (−1.55 − 4.10 − 7.65)/3 = −4.433 → β₁ = 1.0 + 0.4433 = <b>1.443</b>.')),
   R(SRC.nx, NUM('Using OLS (β = (XᵀX)⁻¹Xᵀy), what is the slope β₁?', 1.5, 'X has rows [1, x]: XᵀX = [[3, 6], [6, 14]], Xᵀy = [Σy, Σxy] = [13.5, <b>30</b>] (3 + 9 + 18 = 30). det = 6. β₀ = (14·13.5 − 6·30)/6 = 9/6 = 1.5; β₁ = (−6·13.5 + 3·30)/6 = 9/6 = <b>1.5</b>. So y = 1.5 + 1.5x, which passes exactly through all three points.<br>⚠ The handout wrote Xᵀy = [13.5, 31.5] and got y = −0.005 + 2.25x: that is an arithmetic slip (Σxy is 30, not 31.5).')),
   R(SRC.nx, NUM('Using OLS, what is the intercept β₀?', 1.5, 'β₀ = (14·13.5 − 6·30)/6 = (189 − 180)/6 = <b>1.5</b>.'))] },
  { title: '2) Two features: multiple linear regression', items: [
   R(SRC.nx, NUM(`You are given a dataset with two features for multiple linear regression: ${DATA_NX2} Initial parameters: β₀ = β₁ = β₂ = 0. Learning rate α = 0.1. Iteration 1 using gradient descent. β₀ after iteration 1? (3 decimals)`, 0.667, 'h = 0. Errors = −5, −6, −9. ∂J/∂β₀ = −20/3 = −6.667 → β₀ = <b>0.667</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 1? (3 decimals)', 1.467, '∂J/∂β₁ = (−5·1 − 6·2 − 9·3)/3 = −44/3 = −14.667 → β₁ = <b>1.467</b>.')),
   R(SRC.nx, NUM('β₂ after iteration 1? (3 decimals)', 1.433, '∂J/∂β₂ = (−5·2 − 6·1 − 9·3)/3 = −43/3 = −14.333 → β₂ = <b>1.433</b>.')),
   R(SRC.nx, NUM('Iteration 2: what is the prediction h for the third point (x₁ = 3, x₂ = 3)? (3 decimals)', 9.367, 'h = 0.667 + 1.467·3 + 1.433·3 = 0.667 + 4.400 + 4.300 = <b>9.367</b>.<br>⚠ The handout wrote 8.8 here; that is a slip, which changes the rest of its iteration 2.')),
   R(SRC.nx, NUM('β₀ after iteration 2 (with the corrected prediction)? (3 decimals)', 0.687, 'h = 5.0, 5.033, 9.367. Errors = 0, −0.967, 0.367. ∂J/∂β₀ = −0.6/3 = −0.2 → β₀ = 0.667 + 0.02 = <b>0.687</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 2? (3 decimals)', 1.494, '∂J/∂β₁ = (0·1 − 0.967·2 + 0.367·3)/3 = −0.833/3 = −0.278 → β₁ = 1.467 + 0.0278 = <b>1.494</b>.')),
   R(SRC.nx, NUM('β₂ after iteration 2? (3 decimals)', 1.429, '∂J/∂β₂ = (0·2 − 0.967·1 + 0.367·3)/3 = 0.133/3 = 0.044 → β₂ = 1.433 − 0.0044 = <b>1.429</b>.'))] },
  { title: '3) Logistic regression: cost with matrices', items: [
   R(SRC.lr, NUM(`Predict whether customers will purchase a product (y = 1) or not (y = 0) from age (x₁) and income (x₂). X = [[1, 25, 50000], [1, 30, 60000], [1, 35, 70000]], y = [0, 1, 1], β = [−5, 0.2, 0.00005]. Compute z = Xβ. What is z for the first customer?`, 4.5, 'z₁ = −5 + 0.2·25 + 0.00005·50000 = −5 + 5 + 2.5 = <b>4.5</b>. (z₂ = 5.5, z₃ = 6.5.)')),
   R(SRC.lr, NUM('ŷ₁ = σ(4.5)? (3 decimals)', 0.989, '1/(1 + e<sup>−4.5</sup>) = 1/1.0111 ≈ <b>0.989</b>. (ŷ₂ = σ(5.5) ≈ 0.996, ŷ₃ = σ(6.5) ≈ 0.998.) With threshold 0.5 all three are predicted 1.')),
   R(SRC.lr, NUM('Compute the cost J(β) = −(1/3) Σ [y log ŷ + (1 − y) log(1 − ŷ)] (natural log, 3 decimals).', 1.505, 'i = 1: y = 0 → log(1 − 0.989) = log(0.011) ≈ −4.51. i = 2: log(0.996) ≈ −0.004. i = 3: log(0.998) ≈ −0.002. Sum ≈ −4.516 → J = 4.516/3 ≈ <b>1.505</b>. Almost all of the cost comes from customer 1: a confident wrong prediction.'))] }] }
];

  T('Lower MSE on the test set means a better model.', true),
  E('Explain why we square the errors in MSE and what is the price of doing so.', 'Squaring stops positive and negative errors from cancelling and gives more weight to points far from the line (punishes outliers). The price: the error is in squared units, harder to interpret (use RMSE = √MSE), and the model is sensitive to outliers.', ['No cancelling', 'Big errors / outliers weigh more', 'Squared units → RMSE / sensitive to outliers']),
  E('Write the gradient descent algorithm for simple linear regression (equations of the update for β₀ and β₁).', 'Start β₀ = β₁ = 0 (or random). Repeat until convergence: h(xᵢ) = β₀ + β₁xᵢ; ∂J/∂β₀ = (1/n)Σ(h(xᵢ) − yᵢ); ∂J/∂β₁ = (1/n)Σ(h(xᵢ) − yᵢ)xᵢ; β₀ ← β₀ − α∂J/∂β₀ and β₁ ← β₁ − α∂J/∂β₁ simultaneously. (With J = (1/n)Σ the derivatives carry a factor 2.)', ['Initialize', 'Gradients for β₀ and β₁', 'Simultaneous update with α', 'Repeat until convergence']),
  E('What happens if the cost function has several local minima? Is this a problem for linear regression?', 'Gradient descent can get stuck in a local minimum, depending on the starting point. For linear regression with MSE it is not a problem: the cost is convex (a bowl) with a single global minimum.', ['GD can get stuck in a local minimum', 'Depends on the start', 'Not for linear regression: convex']),
  NUM(`Consider the dataset ${FIG.data(['x', 'y'], [[1, 2], [2, 4], [3, 5]])} and the line h(x) = 1 + 1.5x. Compute the MSE. (3 decimals)`, 0.167, 'h = 2.5, 4, 5.5 → errors −0.5, 0, −0.5 → (0.25 + 0 + 0.25)/3 = <b>0.167</b>.'),
  NUM(`Dataset ${FIG.data(['x', 'y'], [[1, 1], [2, 3], [3, 3]])} Initial parameters β₀ = β₁ = 0, α = 0.1. ${GDNOTE} What is β₀ after iteration 1? (3 decimals)`, 0.233, 'Errors h − y = −1, −3, −3. ∂J/∂β₀ = −7/3 = −2.333 → β₀ = <b>0.233</b>.'),
  NUM('Same dataset (1,1), (2,3), (3,3). β₁ after iteration 1? (3 decimals)', 0.533, '∂J/∂β₁ = (−1 − 6 − 9)/3 = −16/3 = −5.333 → β₁ = <b>0.533</b>.'),
  NUM('Same dataset. β₀ after iteration 2? (3 decimals)', 0.337, 'h = 0.233 + 0.533x = 0.767, 1.300, 1.833. Errors h − y = −0.233, −1.700, −1.167. ∂J/∂β₀ = −3.1/3 = −1.033 → β₀ = 0.233 + 0.103 = <b>0.337</b>.'),
  NUM('J(w) = w², start w = 4, α = 1.5. What is w after one step? (dJ/dw = 2w)', -8, 'w = 4 − 1.5·8 = <b>−8</b>: it jumped further from the minimum → the learning rate is too large and GD diverges.')
]};
LECT.l3 = { ln: 'L3', name: 'Multi-Linear Regression & Normal Equation', title: 'Week 3', covers: 'multiple predictors and the meaning of βᵢ, design matrix, normal equation and its derivation, OLS by hand, projection / orthogonality of the residual, multicollinearity and remedies, orthonormal features, SVD and why not invert, gradient descent vs normal equation',
items: [
  ...RPS('rq25', 0, [0, 1]), RP('rq25', 1, 1), ...RPS('rm22', 2, [4, 5]), ...RPS('rm24', 0, [1, 2, 5]),
  ...RPS('rnx', 0, [4, 5]), ...RPS('rnx', 1, [0, 1, 2, 3, 4, 5, 6]),
  M('Which of the following models is NOT linear regression?', ['y = β₀ + β₁x + ε', 'y = β₀ + β₁x² + β₂ log x + ε', 'y = β₀ β₁ˣ ε', 'y = β₀ + β₁eˣ + ε'], 2, '"Linear" means linear in the β\'s; x², log x, eˣ are just features.'),
  M('Why do we add a column of ones (x₀ = 1) to the design matrix?', ['To scale the features', 'So the intercept becomes a weight and f(x) = βᵀx', 'To make XᵀX singular', 'To remove noise'], 1),
  M('For n samples and p features, the design matrix X has size:', ['p × n', 'n × (p + 1)', '(p + 1) × (p + 1)', 'n × 1'], 1),
  M('The normal equations are obtained by:', ['Running gradient descent', 'Setting the gradient of the MSE to zero', 'Maximizing the MSE', 'Taking the log of y'], 1),
  M('In OLS, the residual vector e = y − Xβ̂ is:', ['Parallel to the columns of X', 'Orthogonal to every column of X (Xᵀe = 0)', 'Always zero', 'Equal to y'], 1),
  M('Which situation makes XᵀX non-invertible?', ['Features scaled to mean 0', 'One feature is a multiple of another (x₁ = 3x₂)', 'More samples than features', 'Orthonormal features'], 1),
  MS('Which of the following make the data collinear?', ['n < p + 1', 'One of the features is constant', 'Two features are proportional', 'All features have variance 1'], [0, 1, 2]),
  MS('Which are commonly used remedies for multicollinearity?', ['Remove one of the correlated features', 'Combine the correlated features', 'Ridge regression', 'Increase the learning rate'], [0, 1, 2]),
  M('If the features are orthonormal, then:', ['XᵀX = 0 and β = 0', 'XᵀX = I and β = Xᵀy', 'XᵀX is singular', 'GD always diverges'], 1),
  M('Why should we NOT program a solver as β = (XᵀX)⁻¹Xᵀy?', ['It gives the wrong answer', 'Inverting XᵀX is expensive (≈ O(p³)) and numerically unstable when near-singular', 'It needs a learning rate', 'It only works for logistic regression'], 1),
  M('Strong correlations between features lead to:', ['Large singular values and stable coefficients', 'Small singular values → coefficients blowing up, high uncertainty', 'Zero training error', 'Faster gradient descent'], 1),
  M('Which method is better for a dataset with 10 million samples and 100,000 features?', ['Normal equation', 'Gradient descent (SGD / mini-batches)', 'Inverting XᵀX by hand', 'Neither can be used'], 1),
  T('Y = β₀ + β₁X² is not a linear regression model because X is squared.', false, 'It <b>is</b> linear regression: linear in the coefficients.'),
  T('The normal equation needs feature scaling.', false, 'Feature scaling matters for <b>gradient descent</b>, not for the normal equation.'),
  T('With orthonormal features each coefficient can be computed independently of the others.', true),
  T('If all features have mean zero, the intercept β₀ equals the mean of y.', true),
  E('Derive the normal equation from the MSE cost in matrix form.', 'J(β) = (1/n)(y − Xβ)ᵀ(y − Xβ). ∇J = −(2/n)Xᵀ(y − Xβ). Set ∇J = 0: Xᵀy − XᵀXβ = 0 → XᵀXβ = Xᵀy → β̂ = (XᵀX)⁻¹Xᵀy (if XᵀX is invertible).', ['Cost in matrix form', 'Gradient', 'Set to zero → XᵀXβ = Xᵀy', 'β̂ = (XᵀX)⁻¹Xᵀy']),
  E('Why do we still use gradient descent for linear regression even though a closed-form solution exists?', 'GD applies to a much broader set of models (most models have no closed form), it can be easier to implement, it scales to very large data (no matrix inversion, stores only the parameters) and has stochastic / mini-batch versions.', ['Broader set of models', 'Scales: no inversion / low memory', 'Easier / SGD and mini-batch']),
  E('What does βᵢ represent in multiple linear regression, and why does "holding other variables constant" matter?', 'βᵢ is the change in y for a one-unit increase in xᵢ while all other features stay the same. Because features can move together, the effect of xᵢ alone is only meaningful when the others are fixed; with strongly correlated features this effect becomes hard to separate (multicollinearity).', ['Change in y per unit of xᵢ', 'Others fixed', 'Link to correlated features']),
  NUM(`Consider ${FIG.data(['x', 'y'], [[2, 1], [5, 2], [7, 3], [8, 3]])} Using β = (XᵀX)⁻¹Xᵀy, find the slope β₁. (3 decimals)`, 0.357, 'XᵀX = [[4, 22], [22, 142]], Xᵀy = [9, 57], det = 84. β₁ = (−22·9 + 4·57)/84 = 30/84 = <b>0.357</b>.'),
  NUM('Same points (2,1), (5,2), (7,3), (8,3): the intercept β₀? (3 decimals)', 0.286, 'β₀ = (142·9 − 22·57)/84 = 24/84 = <b>0.286</b>.'),
  NUM(`The doctor's example: X = [[1, 1], [2, 1], [3, 1]] (the 2nd column is the intercept), y = [2, 3, 4]. XᵀX = [[14, 6], [6, 3]], Xᵀy = [20, 9]. Solve for the slope (the coefficient of the first column).`, 1, 'det = 14·3 − 6·6 = 6. Inverse = (1/6)[[3, −6], [−6, 14]]. Slope = (3·20 − 6·9)/6 = 6/6 = <b>1</b>; intercept = (−6·20 + 14·9)/6 = 1. So y = 1 + x.'),
  NUM('X = [[1, 2], [2, 4], [3, 6]]. Compute det(XᵀX).', 0, 'XᵀX = [[14, 28], [28, 56]]; det = 14·56 − 28·28 = <b>0</b> → singular: the 2nd column is twice the 1st (perfectly correlated features).')
]};

LECT.l4 = { ln: 'L4', name: 'Probabilistic Linear Regression', title: 'Lecture 04 (03a)', covers: 'random variables, expectation, variance, covariance, correlation, independent vs uncorrelated vs orthogonal, X fixed and y random, Gaussian i.i.d. noise, likelihood and MLE = OLS, irreducible error σ², slope = Cov/Var',
items: [
  ...RPS('rm24', 0, [3, 6, 7, 8]),
  M('In the probabilistic view of linear regression y = Xβ + ε, which statement is correct?', ['X is random and y is fixed', 'X is known (not random) and y is random because of ε', 'Both are fixed', 'β is random noise'], 1),
  M('The noise is assumed to be:', ['Uniform and dependent', 'i.i.d. Gaussian, ε ~ N(0, σ²I)', 'Always positive', 'Bernoulli'], 1),
  M('Under Gaussian noise, maximum likelihood estimation of β gives:', ['The same solution as OLS', 'The Lasso solution', 'Logistic regression', 'A random β'], 0),
  M('Why do we maximize the log-likelihood instead of the likelihood?', ['It gives a different answer', 'The product becomes a sum and the exponent disappears; the maximum is at the same β', 'It is always negative', 'It removes the noise'], 1),
  M('Which statement is correct?', ['Uncorrelated ⇒ independent', 'Independent ⇒ uncorrelated', 'Correlation implies causation', 'Independent variables have correlation 1'], 1),
  M('X takes the values 3, 4, 6, 8 with probabilities 0.1, 0.2, 0.4, 0.3. E[X] =', ['5.25', '5.9', '6', '21'], 1),
  M('Cov(X, Y) = ', ['E[XY] − E[X]E[Y]', 'E[X] + E[Y]', 'Var(X)Var(Y)', 'E[X²]'], 0),
  M('σ² (the variance of ε) represents:', ['The bias of the model', 'The irreducible error: the minimum achievable expected MSE', 'The learning rate', 'The slope'], 1),
  M('If Cov(X, y) < 0 then the fitted slope β₁ is:', ['Positive', 'Negative', 'Zero', 'Undefined'], 1),
  MS('Which of the following are true for two independent random variables X and Y?', ['P(X, Y) = P(X)P(Y)', 'Cov(X, Y) = 0', 'Var(X + Y) = Var(X) + Var(Y)', 'Y = X²'], [0, 1, 2]),
  T('Two orthogonal features are always statistically independent.', false, 'Orthogonality (no linear dependence) does <b>not</b> imply independence; independence is stronger.'),
  T('The mean and the variance of a random variable are numbers, not random.', true),
  T('E[X] must be one of the values X can take.', false, 'E[X] = 5.9 for values 3, 4, 6, 8: it is an average.'),
  T('OLS is also an MMSE estimator: it minimizes the mean squared error.', true),
  E('Show (in steps) that maximum likelihood under Gaussian noise leads to least squares.', 'yᵢ ~ N(βᵀx⁽ⁱ⁾, σ²) i.i.d. Likelihood = Π (1/√(2πσ²)) exp(−(yᵢ − βᵀx⁽ⁱ⁾)²/(2σ²)). Log-likelihood = const − (1/(2σ²)) Σ (yᵢ − βᵀx⁽ⁱ⁾)². Maximizing it = minimizing Σ (yᵢ − βᵀx⁽ⁱ⁾)², i.e. OLS → same normal equations.', ['Gaussian i.i.d. model for y', 'Product of densities', 'Log turns it into a sum', 'Max likelihood = min squared error (OLS)']),
  DIFF('orthogonal', 'independent', [['Type of property', 'Geometric (linear algebra)', 'Probabilistic'], ['Definition', 'Dot product v₁ᵀv₂ = 0', 'P(X, Y) = P(X)P(Y)'], ['Rules out', 'Only linear dependence', 'Any dependence (linear or not)'], ['Relation', 'Does not imply independence', 'Implies uncorrelated / orthogonal (centered)'], ['Example', 'Residual e ⟂ columns of X', 'Two fair coins']]),
  DIFF('uncorrelated', 'independent', [['Meaning', 'No linear relationship (Cov = 0)', 'No relationship at all'], ['Implication', 'Does not imply independence', 'Implies uncorrelated'], ['Example', 'Y = X² with X symmetric', 'Two separate dice']]),
  E('Why is the prediction treated as a probability distribution in probabilistic linear regression, and what does σ² tell us?', 'Because y = Xβ + ε contains random noise, each yᵢ ~ N(βᵀx⁽ⁱ⁾, σ²): the prediction is a distribution centred on the line, which tells how confident we are. σ² is the noise variance: the irreducible error no model can go below.', ['y has a distribution N(βᵀx, σ²)', 'Shows confidence', 'σ² = irreducible error']),
  NUM('X takes 0 and 2 with probability 0.5 each. Compute Var[X].', 1, 'E[X] = 1, E[X²] = 2 → Var = 2 − 1 = <b>1</b>.'),
  NUM(`Points ${FIG.data(['x', 'y'], [[1, 2], [2, 4], [3, 5]])} Compute β₁ = Cov(x, y)/Var(x).`, 1.5, 'x̄ = 2, ȳ = 11/3. Cov = (2 + 8 + 15)/3 − 2·11/3 = 1. Var(x) = 14/3 − 4 = 2/3. β₁ = <b>1.5</b>.'),
  NUM('Same points: β₀ = ȳ − β₁x̄. (3 decimals)', 0.667, '11/3 − 3 = <b>0.667</b>.'),
  NUM('E[XY] = 10, E[X] = 2, E[Y] = 4. Cov(X, Y) = ?', 2, '10 − 8 = <b>2</b>.')
]};
LECT.l5 = { ln: 'L5', name: 'Polynomial Regression, Bias–Variance & Regularization', title: 'Lecture 05', covers: 'polynomial regression is linear, underfitting / overfitting and how to fix them, training vs test curves, model risk = bias² + variance + σ², dart boards, regularization (Ridge, Lasso, λ), validation / test sets, k-fold CV and LOOCV, hyperparameters',

  M('The test set should be used:', ['To tune λ', 'Only once, at the end, to evaluate the final model', 'At every epoch', 'To fit β'], 1),
  MS('Which of the following are hyperparameters?', ['Polynomial degree', 'Learning rate α', 'Regularization parameter λ', 'The fitted coefficient β₁'], [0, 1, 2]),

  T('Polynomial regression f(x) = β₀ + β₁x + β₂x² is still linear regression.', true),

  T('Regularization can decrease the training error.', false, 'Adding a penalty moves β away from the least-squares solution, so the training error can only <b>increase</b>.'),

  T('λ (penalty) and t (constraint size ‖β‖ ≤ t) act in the same direction.', false, 'Opposite: large λ ≈ small t.'),
  E('Explain the bias–variance tradeoff and draw / describe the training and test error as complexity grows.', 'More complexity → bias ↓, variance ↑. Training error keeps decreasing; test error decreases then increases (U-shape). Left: underfitting (high bias); right: overfitting (high variance); best complexity = minimum test error.', ['Bias ↓ variance ↑ with complexity', 'Training error keeps falling', 'Test error U-shape', 'Underfitting left / overfitting right']),
  E('What is regularization? Write the cost function of Ridge and of Lasso and explain the effect of λ.', 'Adding a penalty on large coefficients to the loss to prefer simpler models (Occam\'s razor) and reduce overfitting. Ridge: J = (1/n)‖y − Xβ‖² + λΣβⱼ². Lasso: J = (1/n)‖y − Xβ‖² + λΣ|βⱼ|. λ = 0 → OLS; larger λ → smaller coefficients, simpler model (more bias, less variance); very large λ → coefficients ≈ 0, underfitting.', ['Definition (penalty on large β)', 'Ridge cost', 'Lasso cost', 'Effect of λ']),

LECT.l6 = { ln: 'L6', name: 'Logistic Regression & Classification', title: 'Lecture 06', covers: 'why not linear regression, odds and log-odds, the sigmoid, decision boundary (linear and non-linear), cross-entropy and MLE, why not MSE, gradient and GD by hand, no closed form, confusion matrix, accuracy and imbalance, precision / recall / F1, ROC and AUC, one-vs-all and softmax',
items: [
  ...RPS('rq24', 0, [2, 3, 4]), ...RPS('rq24', 1, [0, 1]), ...RPS('rm22', 5, [0, 1, 2, 3]), RP('rm22', 6, 0), ...RPS('rm22', 7, [0, 1, 2, 3, 4]),
  ...RPS('rq24', 2, [0, 1, 2]), ...RPS('rnx', 2, [0, 1, 2]),
  M('In a classification problem, what does a Confusion Matrix help you understand?', ['The complexity of the model', 'The underlying distribution of classes', 'The performance of the model in terms of false positives and false negatives', 'The convergence rate of the algorithm'], 2, '', { src: SRC.rv }),
  M('Which metric would you use to evaluate the performance of a model on a regression task?', ['Accuracy', 'Precision', 'R-squared (or MSE)', 'Recall'], 2, 'Accuracy, precision and recall are classification metrics.', { src: SRC.rv }),
  M('If the probability of an event is 0.8, its odds are:', ['0.8', '4', '0.25', '1.25'], 1, '0.8/0.2 = 4: four times more likely to happen than not.'),
  M('The log-odds of an event with probability 0.5 is:', ['0', '0.5', '1', '−∞'], 0),
  M('In logistic regression the quantity that is modelled as a linear function of the features is:', ['The probability p', 'The log-odds log(p/(1 − p))', 'The odds squared', 'The label y'], 1),
  M('With log-odds = 1 + 2X, the probability for X = 1 is approximately:', ['0.731', '0.881', '0.953', '0.5'], 2, 'log-odds = 3 → p = 1/(1 + e⁻³) ≈ 0.953.', { src: SRC.lr }),
  M('With a threshold of 0.5, logistic regression predicts class 1 when:', ['βᵀx < 0', 'βᵀx ≥ 0', 'βᵀx = 1', 'Always'], 1),
  M('The derivative of the sigmoid is:', ['σ(z)²', 'σ(z)(1 − σ(z))', '1 − σ(z)', 'e^z'], 1),
  M('The gradient of the logistic cost with respect to β is:', ['(1/n)Xᵀ(ŷ − y)', '(XᵀX)⁻¹Xᵀy', '−2Xᵀy', 'σ(Xᵀy)'], 0),
  M('Recall = TP / (TP + FN) is also called:', ['Specificity', 'Sensitivity / true positive rate', 'Precision', 'False positive rate'], 1),
  M('An AUC of 0.5 means the classifier is:', ['Perfect', 'No better than random guessing', 'The worst possible', 'Overfitting'], 1),
  M('For more than two classes, which model gives probabilities that sum to 1?', ['One-vs-all', 'Softmax regression', 'Linear regression', 'Ridge'], 1),
  MS('Which of the following are true about logistic regression?', ['It predicts the probability of the positive class', 'It is trained by maximizing the likelihood (minimizing cross-entropy)', 'It has a closed-form solution like the normal equation', 'It can be regularized with L1 or L2'], [0, 1, 3]),
  MS('If a logistic regression model overfits, you can:', ['Apply regularization', 'Reduce the number of features', 'Use cross-validation to tune parameters', 'Add many interaction features'], [0, 1, 2], '', { src: SRC.lr }),
  T('The sigmoid output can be exactly 0 or exactly 1.', false, 'It is strictly between 0 and 1.'),
  T('Cross-entropy is convex for logistic regression, while MSE with a sigmoid is not.', true),
  T('For cancer detection, false negatives are usually more costly than false positives.', true),
  T('Accuracy is always a reliable metric, even for imbalanced data.', false, 'With 900 cats and 100 dogs, always saying "cat" gives 90% accuracy.'),
  E('What is the sigmoid function, what are its properties and why is it useful in logistic regression?', 'σ(z) = 1/(1 + e⁻ᶻ), z = β₀ + β₁x₁ + … Properties: output always in (0, 1); S-shaped; smooth and continuous; σ(0) = 0.5, z → +∞ gives 1, z → −∞ gives 0; σ\'(z) = σ(z)(1 − σ(z)). Useful because it converts the linear score (−∞ to +∞) into a probability, which with a threshold gives the class.', ['Formula', 'Range (0,1), S-shape, σ(0) = 0.5', 'Converts linear output into a probability'], { src: SRC.lr }),
  E('What are "odds" and "log-odds", and why does logistic regression use the log-odds?', 'Odds = p/(1 − p) ∈ (0, ∞). Log-odds = ln(p/(1 − p)) ∈ (−∞, +∞). A probability is bounded but a linear function βᵀx is not; the log-odds is unbounded, so it can be modelled linearly: ln(p/(1 − p)) = βᵀx → p = σ(βᵀx). Odds 1 → log-odds 0; odds > 1 → positive; odds < 1 → negative.', ['Odds definition', 'Log-odds definition and range', 'Why: unbounded → linear model', 'Back to p with the sigmoid'], { src: SRC.lr }),

const RND = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
