   R(SRC.m22, W('Essay', 'c. Logistic regression is called a linear classifier. True or False? Why?', '<b>True</b>: with threshold 0.5 the decision boundary is βᵀx = 0, which is a line / plane / hyperplane (as in the figure).', ['True', 'Boundary βᵀx = 0 is linear'])),
   R(SRC.m22, W('Essay', 'd. Is it better to use gradient descent or the analytical solution? Why? e. How can one extend the model for multi classes?', 'd. <b>Gradient descent</b>: there is no analytical (closed-form) solution for logistic regression.<br>e. <b>One-vs-all</b> (one binary classifier per class) or <b>softmax regression</b>: P(y = k | x) = e<sup>β<sub>k</sub>ᵀx</sup> / Σᵢ e<sup>βᵢᵀx</sup>.', ['GD: no closed form', 'One-vs-all', 'Softmax'], { marks: 3 }))] },
  { title: 'Question 3 · B. Evaluating the output', items: [
   R(SRC.m22, W('Essay', 'a. Consider a Cats vs Dogs dataset with 1000 images, 500 images each. Can we just use the accuracy as an evaluation measure here? b. Now assume we only have 100 images of dogs and 900 of cats. Do we still use the accuracy measure? Is there a better measure? Explain.', 'a. <b>Yes</b>: the classes are balanced, so accuracy is meaningful.<br>b. <b>No</b>: the data is <b>imbalanced</b>. A model that always says "cat" gets 90% accuracy while never finding a dog. Use precision, recall, F1-score or ROC/AUC instead.', ['Balanced → yes', 'Imbalanced → no (always "cat" = 90%)', 'Use precision / recall / F1 / AUC'], { marks: 4 }))] },
  { title: 'Question 3 · C. Confusion matrix', items: [
   R(SRC.m22, NUM(`Consider the following confusion matrix of some binary classifier: ${FIG.cm(6, 2, 5, 21)} a. What is the precision? (3 decimals)`, 0.545, 'Precision = TP/(TP + FP) = 6/11 ≈ <b>0.545</b>.')),
   R(SRC.m22, NUM('b. What is the recall?', 0.75, 'Recall = TP/(TP + FN) = 6/8 = <b>0.75</b>.')),
   R(SRC.m22, NUM('c. What is the F1-Score? (3 decimals)', 0.632, 'F1 = 2PR/(P + R) = 2(0.545)(0.75)/(1.295) = 12/19 ≈ <b>0.632</b>.')),
   R(SRC.m22, W('Essay', 'd. Is it better to have a higher precision or a higher recall? Why?', 'It depends on the problem. For cancer: a model with high <b>recall</b> identifies most people that have cancer (saving their lives) but misdiagnoses some healthy people (false positives → expensive, dangerous treatments). A model with high <b>precision</b> gives confident diagnoses but fails to identify everyone who has the disease (false negatives → potentially fatal). In cancer detection, recall is usually preferred; in a spam filter, precision.', ['Depends on the cost of FP vs FN', 'High recall: fewer missed positives, more FP', 'High precision: fewer FP, more missed positives', 'Example (cancer → recall)'], { marks: 3 })),
   R(SRC.m22, W('Essay', 'e. Is it better to use the ROC or the AUC for classification\'s evaluation? Why?', 'Official answer: <b>ROC</b>. The curve lets us select classification thresholds that identify as many true positives as possible while minimizing false positives. (AUC is a single number, useful to compare models, but it hides the threshold choice.)', ['ROC', 'Lets us choose the threshold (TPR vs FPR)'])),
  ] },
  { title: 'Question 3 · D. Deep learning model (beyond our 6 lectures, but it was asked)', items: [
   R(SRC.m22, W('Essay', 'a. Using a neural network is better compared to the logistic regression model (or any machine learning model in general). True or False? Why?', '<b>False.</b> A neural network could overfit or be much more complex than needed. Start simple.', ['False', 'May overfit / too complex; start simple'])),
   R(SRC.m22, W('Essay', 'b. Applying traditional gradient descent, the training performance is poor. How can you make gradient descent better and faster? c. Now overfitting happens. Mention 3 types of regularization to reduce it.', 'b. <b>Momentum</b>, <b>Stochastic Gradient Descent</b> (SGD), <b>mini-batches</b> (also an adaptive learning rate, feature scaling).<br>c. <b>Lasso</b> (L1), <b>Ridge</b> (L2) and <b>Dropout</b> (also early stopping).', ['Momentum / SGD / mini-batches', 'Lasso, Ridge, Dropout'], { marks: 4 }))] }] },

 { id: 'rm24', ln: 'M·24', title: 'Midterm · Fall 2024 (Dr. Laila Afify)', sub: 'Time: 120 minutes · Marks: 60 · 14-Nov-2024. There is no official solution: the model answers are written from the lectures and the doctor\'s guide.', minutes: 120, qs: [
  { title: 'Question 1 (30 points) · y = Xβ + ε and β̂ = (XᵀX)⁻¹Xᵀy', items: [
   R(SRC.m24, W('Essay', '(a) Write the cost function of the linear regression model and explain how gradient descent can be used to minimize it.', 'J(β) = (1/n) ‖y − Xβ‖² = (1/n) Σ (yᵢ − βᵀx⁽ⁱ⁾)² (MSE).<br>Gradient descent: start from an initial β (e.g. random or 0); compute the gradient ∇J = −(2/n)Xᵀ(y − Xβ); update all coefficients simultaneously β ← β − η∇J; repeat until the change in β (or in the cost) is very small. The cost is convex (a bowl), so GD reaches the global minimum if η is well chosen (too small → slow, too large → diverges).', ['Cost function (MSE, matrix form)', 'Gradient −(2/n)Xᵀ(y − Xβ)', 'Update rule with learning rate, simultaneous', 'Repeat until convergence / role of η'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(b) Explain how the normal equations relate to the minimization of the error vector\'s length.', 'The error (residual) vector is e = y − Xβ. OLS minimizes its length ‖e‖² = (y − Xβ)ᵀ(y − Xβ). Setting the gradient to zero gives Xᵀ(y − Xβ) = 0, i.e. <b>Xᵀe = 0</b>: the shortest error vector is the one <b>perpendicular to every column of X</b>. Geometrically ŷ = Xβ̂ is the orthogonal projection of y onto the column space of X. Rearranging Xᵀe = 0 gives the normal equations XᵀXβ = Xᵀy.', ['e = y − Xβ, minimize ‖e‖²', 'Gradient = 0 → Xᵀe = 0', 'e ⟂ columns of X / projection onto column space', 'Gives XᵀXβ = Xᵀy'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(c) Describe what happens if two or more features in the design matrix X are perfectly correlated. How does this affect the normal equation solution? What are some commonly proposed methods to address or mitigate this issue in the model?', 'Perfect correlation = one column is a linear combination of others (e.g. x₂ = 2x₁) → <b>multicollinearity</b>: X is not full rank, so XᵀX is <b>singular</b> (det = 0) and cannot be inverted: the normal equation has <b>no unique solution</b> (infinitely many β). Near-perfect correlation → ill-conditioned XᵀX, unstable, huge coefficients, high uncertainty.<br>Remedies: remove one of the correlated features; combine them (e.g. average / PCA); <b>Ridge</b> regression β = (XᵀX + nλI)⁻¹Xᵀy (always invertible); Lasso (selects one); collect more data.', ['Columns linearly dependent → XᵀX singular', 'No unique β / unstable coefficients', 'Remove or combine features', 'Ridge (and/or Lasso)'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(d) If we have two features x₁ and x₂ that are uncorrelated, does this imply that they are independent? Provide an example where two features are uncorrelated but not independent.', '<b>No.</b> Uncorrelated only means no <b>linear</b> relationship (Cov = 0). Independent means no relationship of any kind (P(x₁, x₂) = P(x₁)P(x₂)). Independence ⇒ uncorrelated, but not the converse.<br>Example: x₁ uniform on [−1, 1] and x₂ = x₁². Cov(x₁, x₂) = E[x₁³] − E[x₁]E[x₁²] = 0, yet x₂ is completely determined by x₁.', ['No', 'Uncorrelated = no linear relation; independent = none at all', 'Example x₂ = x₁² with x₁ symmetric'], { marks: 3 })),
   R(SRC.m24, W('Essay', '(e) If a linear regression model fits the training data perfectly with no errors, what could be a potential issue with this model?', '<b>Overfitting</b>: the model has also fitted the noise (high variance), so it will probably perform badly on new data. A perfect fit can also mean too many features / parameters (n ≤ p + 1) or data leakage. Check on a validation/test set; use fewer features, regularization or more data.', ['Overfitting / fits the noise', 'Poor on unseen data (high variance)', 'Check on validation/test; fix'], { marks: 3 })),
   R(SRC.m24, W('Essay', '(f) Discuss the advantages of having orthonormal features when fitting a linear regression model. Specifically, consider how orthonormality affects interpretability, and computational efficiency.', 'Orthonormal: xᵢᵀxⱼ = 0 (i ≠ j) and ‖xᵢ‖ = 1, so <b>XᵀX = I</b>.<br>• Computation: β = Xᵀy, <b>no matrix inversion</b>; very cheap and numerically stable (no singularity, no multicollinearity).<br>• Interpretability: each coefficient βⱼ = xⱼᵀy is computed <b>independently</b> of the others, so it shows the direct effect of that feature; adding/removing a feature does not change the other coefficients.', ['XᵀX = I → β = Xᵀy', 'No inversion: fast and stable', 'Each coefficient independent → interpretable'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(g)(i) In simple linear regression β₁ = Cov(X, y)/Var(X). Explain intuitively why β₁ depends on both the covariance between X and Y and the variance of X.', 'Cov(X, y) measures how X and y <b>move together</b> (direction and strength). But the same co-movement means a different slope depending on how spread X is: dividing by Var(X) <b>scales</b> it to "change in y per one unit of X". Large spread in X with the same covariance → smaller slope.', ['Cov: how X and y move together (sign/direction)', 'Var(X): spread of X; dividing gives change per unit of X'], { marks: 2 })),
   R(SRC.m24, W('Essay', '(g)(ii) Suppose Cov(X, y) = 0. What does this imply about the estimated relationship between X and Y in the regression model?', 'β₁ = 0: the fitted line is <b>horizontal</b> (ŷ = ȳ). There is <b>no linear relationship</b>: X does not help predict y linearly (there may still be a non-linear one).', ['β₁ = 0, horizontal line', 'No linear relationship (non-linear still possible)'], { marks: 2 })),
   R(SRC.m24, W('Essay', '(g)(iii) Suppose that the error term ε has a large variance. What impact would this have on the quality of the model\'s predictions, and how could you address this while designing your model to mitigate this variance?', 'Large Var(ε) = σ² = large <b>irreducible error</b>: predictions will be noisy and uncertain, and the estimates of β are less precise; no model can go below σ² on new data. Mitigate: collect more data (more precise β); add relevant features that explain part of what is now in ε; reduce measurement noise / clean outliers; use regularization to avoid fitting the noise.', ['High irreducible error → noisy predictions, uncertain β', 'More data / better (relevant) features', 'Reduce noise / regularize'], { marks: 2 }))] },
  { title: 'Question 2 (22 points) · Model A vs Model B', items: [
   R(SRC.m24, W('Essay', `Consider a dataset that a data scientist uses to train two linear regression models, Model A and Model B, to predict housing prices. <b>Model A</b> is a simple linear regression model with only one feature, the square footage of the house. <b>Model B</b> is a complex polynomial regression model of degree 10, which includes various features, including square footage, number of rooms, and several interaction terms. ${FIG.tbl(['Model', 'Training Error', 'Test Error'], [['Model A', 'High', 'Moderate'], ['Model B', 'Low', 'High']])} (a) Identify whether each model (A and B) is likely overfitting, underfitting, or well-fitted, and explain your reasoning.`, 'Model A: <b>underfitting</b> – the training error is high, so it cannot even capture the pattern in the data it was trained on (too simple: one feature, a straight line).<br>Model B: <b>overfitting</b> – very low training error but high test error: it memorized the training data (noise included) and does not generalize.', ['A underfitting (high training error)', 'B overfitting (low train, high test)'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(b) Discuss how the concepts of bias and variance apply to each model in this context.', 'Model A: <b>high bias, low variance</b> – its simplifying assumption (linear in one feature) is far from the true relationship, but it would change little with another training set.<br>Model B: <b>low bias, high variance</b> – flexible enough to fit the truth, but very sensitive to the particular training sample. Total error = Bias² + Variance + σ²; both are far from the best balance.', ['A: high bias, low variance', 'B: low bias, high variance', 'Link to total error / tradeoff'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(c) Based on the table, explain what you might do to improve each model\'s performance. What type of changes would you make to the models, and why?', 'Model A (reduce bias): add more relevant features (rooms, location…), add polynomial / interaction terms, use a more expressive model.<br>Model B (reduce variance): lower the degree / remove features, add <b>regularization</b> (Ridge, Lasso, choose λ by cross-validation), get more training data, early stopping.', ['A: more features / more complex model', 'B: simpler model / fewer features', 'B: regularization (λ by CV) / more data'], { marks: 4 })),
   R(SRC.m24, W('Essay', '(d) Explain what hyperparameters are and how they differ from model parameters. Discuss why they are essential for optimizing model performance.', '<b>Parameters</b> (β) are learned from the data during training (by OLS / GD). <b>Hyperparameters</b> are chosen <b>before</b> training and cannot be found by calculus / OLS / GD: polynomial degree, learning rate η, regularization λ, number of folds k. They control model complexity and how training behaves, so they decide underfitting vs overfitting and whether GD converges; they are tuned on a validation set / with cross-validation (e.g. grid search).', ['Parameters learned from data', 'Hyperparameters set before training (examples)', 'Control complexity / convergence', 'Tuned with validation / CV'], { marks: 4 })),
   R(SRC.m24, M('(e) Choose the correct answer: In Ridge regularization, if the value of λ, the regularization penalty, is set very high, what is the expected outcome?', ['The model will be identical to a simple linear regression.', 'The coefficients will be close to zero, resulting in a highly biased model.', 'The model will have low bias and high variance.', 'The coefficients will become very large.'], 1, 'A huge λ makes the penalty dominate: all coefficients shrink towards 0 → very simple model → underfitting (high bias, low variance).'), { marks: 3 }),
   R(SRC.m24, M('(f) Choose the correct answer: Suppose you are training a model with gradient descent and find that the cost function value oscillates and fails to converge. Which of the following is most likely the cause?', ['The learning rate is too high.', 'The model has too many parameters.', 'The learning rate is too small.', 'The initial parameter values are too small.'], 0, 'Steps too big → GD jumps over the minimum back and forth (oscillates) and may diverge.'), { marks: 3 })] },
  { title: 'Question 3 (8 points) · Bias and variance on the dart boards', items: [
   R(SRC.m24, M(`Characterize the bias and variance of the estimates of the following models on the data with respect to the true model as low or high: ${FIG.darts()} <b>Board A</b>`, ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 0, 'All shots tightly together <b>on</b> the centre.'), { marks: 2 }),
   R(SRC.m24, M('<b>Board B</b> (same figure)', ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 1, 'Shots tightly together (low variance) but <b>away</b> from the centre (high bias).'), { marks: 2 }),
   R(SRC.m24, M('<b>Board C</b> (same figure)', ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 2, 'Shots spread out (high variance) but centred on the truth on average (low bias).'), { marks: 2 }),
   R(SRC.m24, M('<b>Board D</b> (same figure)', ['Bias low, variance low', 'Bias high, variance low', 'Bias low, variance high', 'Bias high, variance high'], 3, 'Shots spread out <b>and</b> away from the centre: high bias and high variance.'), { marks: 2 })] }] },

 { id: 'rnx', ln: 'Num', title: 'Numerical examples sheet (from the course)', sub: 'The worked numerical examples the doctor gave: linear regression GD + OLS, multiple linear regression GD, logistic regression GD and the logistic cost. ⚠ Two slips in the handout are corrected in the model answers.', minutes: 45, qs: [
  { title: '1) Single feature linear regression', items: [
   R(SRC.nx, NUM(`You are given a dataset with a single feature for linear regression: ${DATA_NX1} Initial parameters: β₀ = 0, β₁ = 0. Learning rate α = 0.1. What are the parameter updates for the first 2 iterations?<br><span class="small muted">${GDNOTE}</span><br>β₀ after iteration 1?`, 0.45, 'h = 0. Errors = −3, −4.5, −6. ∂J/∂β₀ = −13.5/3 = −4.5 → β₀ = 0 + 0.1·4.5 = <b>0.45</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 1?', 1, '∂J/∂β₁ = (−3·1 − 4.5·2 − 6·3)/3 = −30/3 = −10 → β₁ = 0 + 0.1·10 = <b>1.0</b>.')),
   R(SRC.nx, NUM('β₀ after iteration 2? (3 decimals)', 0.655, 'h = 0.45 + x = 1.45, 2.45, 3.45. Errors = −1.55, −2.05, −2.55. ∂J/∂β₀ = −6.15/3 = −2.05 → β₀ = 0.45 + 0.205 = <b>0.655</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 2? (3 decimals)', 1.443, '∂J/∂β₁ = (−1.55 − 4.10 − 7.65)/3 = −4.433 → β₁ = 1.0 + 0.4433 = <b>1.443</b>.')),
   R(SRC.nx, NUM('Using OLS (β = (XᵀX)⁻¹Xᵀy), what is the slope β₁?', 1.5, 'X has rows [1, x]: XᵀX = [[3, 6], [6, 14]], Xᵀy = [Σy, Σxy] = [13.5, <b>30</b>] (3 + 9 + 18 = 30). det = 6. β₀ = (14·13.5 − 6·30)/6 = 9/6 = 1.5; β₁ = (−6·13.5 + 3·30)/6 = 9/6 = <b>1.5</b>. So y = 1.5 + 1.5x, which passes exactly through all three points.<br>⚠ The handout wrote Xᵀy = [13.5, 31.5] and got y = −0.005 + 2.25x: that is an arithmetic slip (Σxy is 30, not 31.5).')),
   R(SRC.nx, NUM('Using OLS, what is the intercept β₀?', 1.5, 'β₀ = (14·13.5 − 6·30)/6 = (189 − 180)/6 = <b>1.5</b>.'))] },
  { title: '2) Two features: multiple linear regression', items: [
   R(SRC.nx, NUM(`You are given a dataset with two features for multiple linear regression: ${DATA_NX2} Initial parameters: β₀ = β₁ = β₂ = 0. Learning rate α = 0.1. Iteration 1 using gradient descent. β₀ after iteration 1? (3 decimals)`, 0.667, 'h = 0. Errors = −5, −6, −9. ∂J/∂β₀ = −20/3 = −6.667 → β₀ = <b>0.667</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 1? (3 decimals)', 1.467, '∂J/∂β₁ = (−5·1 − 6·2 − 9·3)/3 = −44/3 = −14.667 → β₁ = <b>1.467</b>.')),
   R(SRC.nx, NUM('β₂ after iteration 1? (3 decimals)', 1.433, '∂J/∂β₂ = (−5·2 − 6·1 − 9·3)/3 = −43/3 = −14.333 → β₂ = <b>1.433</b>.')),
   R(SRC.nx, NUM('Iteration 2: what is the prediction h for the third point (x₁ = 3, x₂ = 3)? (3 decimals)', 9.367, 'h = 0.667 + 1.467·3 + 1.433·3 = 0.667 + 4.400 + 4.300 = <b>9.367</b>.<br>⚠ The handout wrote 8.8 here; that is a slip, which changes the rest of its iteration 2.')),
   R(SRC.nx, NUM('β₀ after iteration 2 (with the corrected prediction)? (3 decimals)', 0.687, 'h = 5.0, 5.033, 9.367. Errors = 0, −0.967, 0.367. ∂J/∂β₀ = −0.6/3 = −0.2 → β₀ = 0.667 + 0.02 = <b>0.687</b>.')),
   R(SRC.nx, NUM('β₁ after iteration 2? (3 decimals)', 1.494, '∂J/∂β₁ = (0·1 − 0.967·2 + 0.367·3)/3 = −0.833/3 = −0.278 → β₁ = 1.467 + 0.0278 = <b>1.494</b>.')),
   R(SRC.nx, NUM('β₂ after iteration 2? (3 decimals)', 1.429, '∂J/∂β₂ = (0·2 − 0.967·1 + 0.367·3)/3 = 0.133/3 = 0.044 → β₂ = 1.433 − 0.0044 = <b>1.429</b>.'))] },
  { title: '3) Logistic regression: cost with matrices', items: [
   R(SRC.lr, NUM(`Predict whether customers will purchase a product (y = 1) or not (y = 0) from age (x₁) and income (x₂). X = [[1, 25, 50000], [1, 30, 60000], [1, 35, 70000]], y = [0, 1, 1], β = [−5, 0.2, 0.00005]. Compute z = Xβ. What is z for the first customer?`, 4.5, 'z₁ = −5 + 0.2·25 + 0.00005·50000 = −5 + 5 + 2.5 = <b>4.5</b>. (z₂ = 5.5, z₃ = 6.5.)')),
   R(SRC.lr, NUM('ŷ₁ = σ(4.5)? (3 decimals)', 0.989, '1/(1 + e<sup>−4.5</sup>) = 1/1.0111 ≈ <b>0.989</b>. (ŷ₂ = σ(5.5) ≈ 0.996, ŷ₃ = σ(6.5) ≈ 0.998.) With threshold 0.5 all three are predicted 1.')),
   R(SRC.lr, NUM('Compute the cost J(β) = −(1/3) Σ [y log ŷ + (1 − y) log(1 − ŷ)] (natural log, 3 decimals).', 1.505, 'i = 1: y = 0 → log(1 − 0.989) = log(0.011) ≈ −4.51. i = 2: log(0.996) ≈ −0.004. i = 3: log(0.998) ≈ −0.002. Sum ≈ −4.516 → J = 4.516/3 ≈ <b>1.505</b>. Almost all of the cost comes from customer 1: a confident wrong prediction.'))] }] }
];
/* ===== exam-style question bank per lecture (same format as the university papers) ===== */
const RP = (pid, qi, ii) => Object.assign({}, PAPERS_REAL.find(p => p.id === pid).qs[qi].items[ii], { id: undefined });
const RPS = (pid, qi, list) => list.map(ii => RP(pid, qi, ii));
const E = (q, model, points, extra) => W('Essay', q, model, points, extra);
const LECT = {};

items: [
  ...RPS('rm22', 0, [0, 1, 2, 3, 4]), ...RPS('rm22', 1, [0, 1]),
  M('Which of the following best describes machine learning according to Arthur Samuel (1959)?', ['A field of study that gives computers the ability to learn without being explicitly programmed', 'Writing explicit rules for every possible case', 'A method to store large amounts of data', 'A branch of statistics focused only on inference'], 0),
  M('A hospital wants a system that recognizes speech of doctors dictating reports. Why is machine learning used here?', ['Human expertise does not exist', 'Humans cannot explain their expertise', 'The rule is a simple formula', 'There is no data'], 1),
  M('In which situation is learning NOT needed?', ['Navigating on Mars', 'Personalized medicine', 'Calculating payroll', 'Genomics'], 2, 'Payroll is a fixed formula: no need to learn.'),

  M('You have customer data with no labels and want to discover groups of similar customers. This is:', ['Supervised learning', 'Unsupervised learning', 'Reinforcement learning', 'Regression'], 1),
  M('A robot learns to walk by receiving a reward each time it moves forward without falling. This is:', ['Supervised learning', 'Unsupervised learning', 'Reinforcement learning', 'Classification'], 2),
  M('In Yann LeCun\'s "cake", which part is unsupervised learning?', ['The cherry', 'The icing', 'The cake (the bulk)', 'The plate'], 2),
  M('Which relation is correct?', ['ML ⊂ DL ⊂ AI', 'DL ⊂ ML ⊂ AI', 'AI ⊂ ML ⊂ DL', 'DL and ML are unrelated'], 1),
  M('The training set in supervised learning is written as:', ['D = {x⁽ⁱ⁾}', 'D = {(x⁽ⁱ⁾, y⁽ⁱ⁾) | i = 1 … n}', 'D = {y⁽ⁱ⁾}', 'D = {θ}'], 1),
  M('Which is NOT one of the three components of a supervised learning algorithm?', ['Model class', 'Objective (loss) function', 'Optimizer', 'Reward signal'], 3),
  M('Finding the model in the model class that minimizes the objective on the training data is called:', ['Maximum entropy', 'Empirical risk minimization', 'Reinforcement', 'Clustering'], 1),
  M('Predicting the type of residence (apartment / villa / house) is:', ['Regression', 'Classification', 'Clustering', 'Reinforcement learning'], 1),
  T('In y = θ₁x + θ₀, x is the dependent variable and y is the independent variable.', false, 'The opposite: <b>y is dependent</b> (target), <b>x is independent</b> (feature). (A slide in 01b swaps them.)'),
  T('A good model generalizes: it predicts unseen examples correctly, not only the training examples.', true),
  T('Most learning algorithms can only deal with numerical features; categorical features need an encoding.', true),

LECT.l2 = { ln: 'L2', name: 'Linear Regression & Gradient Descent', title: 'Lecture 02a', covers: 'the model and its terms, MSE and why squared, RMSE, evaluation on a test set, gradient descent, the learning rate, convexity and local minima, partial derivatives and the update rule, 2-iteration numerical problems, assumptions',

  T('With a very small learning rate gradient descent is stable but slow.', true),

  T('In practice we fit the model on the training set and evaluate the MSE on a test set.', true),
  T('Lower MSE on the test set means a better model.', true),
  E('Explain why we square the errors in MSE and what is the price of doing so.', 'Squaring stops positive and negative errors from cancelling and gives more weight to points far from the line (punishes outliers). The price: the error is in squared units, harder to interpret (use RMSE = √MSE), and the model is sensitive to outliers.', ['No cancelling', 'Big errors / outliers weigh more', 'Squared units → RMSE / sensitive to outliers']),
  E('Write the gradient descent algorithm for simple linear regression (equations of the update for β₀ and β₁).', 'Start β₀ = β₁ = 0 (or random). Repeat until convergence: h(xᵢ) = β₀ + β₁xᵢ; ∂J/∂β₀ = (1/n)Σ(h(xᵢ) − yᵢ); ∂J/∂β₁ = (1/n)Σ(h(xᵢ) − yᵢ)xᵢ; β₀ ← β₀ − α∂J/∂β₀ and β₁ ← β₁ − α∂J/∂β₁ simultaneously. (With J = (1/n)Σ the derivatives carry a factor 2.)', ['Initialize', 'Gradients for β₀ and β₁', 'Simultaneous update with α', 'Repeat until convergence']),

LECT.l3 = { ln: 'L3', name: 'Multi-Linear Regression & Normal Equation', title: 'Week 3', covers: 'multiple predictors and the meaning of βᵢ, design matrix, normal equation and its derivation, OLS by hand, projection / orthogonality of the residual, multicollinearity and remedies, orthonormal features, SVD and why not invert, gradient descent vs normal equation',
items: [

  ...RPS('rnx', 0, [4, 5]), ...RPS('rnx', 1, [0, 1, 2, 3, 4, 5, 6]),

  M('The normal equations are obtained by:', ['Running gradient descent', 'Setting the gradient of the MSE to zero', 'Maximizing the MSE', 'Taking the log of y'], 1),
  M('In OLS, the residual vector e = y − Xβ̂ is:', ['Parallel to the columns of X', 'Orthogonal to every column of X (Xᵀe = 0)', 'Always zero', 'Equal to y'], 1),
  M('Which situation makes XᵀX non-invertible?', ['Features scaled to mean 0', 'One feature is a multiple of another (x₁ = 3x₂)', 'More samples than features', 'Orthonormal features'], 1),

  M('If the features are orthonormal, then:', ['XᵀX = 0 and β = 0', 'XᵀX = I and β = Xᵀy', 'XᵀX is singular', 'GD always diverges'], 1),
  M('Why should we NOT program a solver as β = (XᵀX)⁻¹Xᵀy?', ['It gives the wrong answer', 'Inverting XᵀX is expensive (≈ O(p³)) and numerically unstable when near-singular', 'It needs a learning rate', 'It only works for logistic regression'], 1),
  M('Strong correlations between features lead to:', ['Large singular values and stable coefficients', 'Small singular values → coefficients blowing up, high uncertainty', 'Zero training error', 'Faster gradient descent'], 1),
  M('Which method is better for a dataset with 10 million samples and 100,000 features?', ['Normal equation', 'Gradient descent (SGD / mini-batches)', 'Inverting XᵀX by hand', 'Neither can be used'], 1),
  T('Y = β₀ + β₁X² is not a linear regression model because X is squared.', false, 'It <b>is</b> linear regression: linear in the coefficients.'),
  T('The normal equation needs feature scaling.', false, 'Feature scaling matters for <b>gradient descent</b>, not for the normal equation.'),
  T('With orthonormal features each coefficient can be computed independently of the others.', true),
  T('If all features have mean zero, the intercept β₀ equals the mean of y.', true),
  E('Derive the normal equation from the MSE cost in matrix form.', 'J(β) = (1/n)(y − Xβ)ᵀ(y − Xβ). ∇J = −(2/n)Xᵀ(y − Xβ). Set ∇J = 0: Xᵀy − XᵀXβ = 0 → XᵀXβ = Xᵀy → β̂ = (XᵀX)⁻¹Xᵀy (if XᵀX is invertible).', ['Cost in matrix form', 'Gradient', 'Set to zero → XᵀXβ = Xᵀy', 'β̂ = (XᵀX)⁻¹Xᵀy']),
  E('Why do we still use gradient descent for linear regression even though a closed-form solution exists?', 'GD applies to a much broader set of models (most models have no closed form), it can be easier to implement, it scales to very large data (no matrix inversion, stores only the parameters) and has stochastic / mini-batch versions.', ['Broader set of models', 'Scales: no inversion / low memory', 'Easier / SGD and mini-batch']),

LECT.l4 = { ln: 'L4', name: 'Probabilistic Linear Regression', title: 'Lecture 04 (03a)', covers: 'random variables, expectation, variance, covariance, correlation, independent vs uncorrelated vs orthogonal, X fixed and y random, Gaussian i.i.d. noise, likelihood and MLE = OLS, irreducible error σ², slope = Cov/Var',

  M('In the probabilistic view of linear regression y = Xβ + ε, which statement is correct?', ['X is random and y is fixed', 'X is known (not random) and y is random because of ε', 'Both are fixed', 'β is random noise'], 1),

  M('Under Gaussian noise, maximum likelihood estimation of β gives:', ['The same solution as OLS', 'The Lasso solution', 'Logistic regression', 'A random β'], 0),
  M('Why do we maximize the log-likelihood instead of the likelihood?', ['It gives a different answer', 'The product becomes a sum and the exponent disappears; the maximum is at the same β', 'It is always negative', 'It removes the noise'], 1),
  M('Which statement is correct?', ['Uncorrelated ⇒ independent', 'Independent ⇒ uncorrelated', 'Correlation implies causation', 'Independent variables have correlation 1'], 1),
  M('X takes the values 3, 4, 6, 8 with probabilities 0.1, 0.2, 0.4, 0.3. E[X] =', ['5.25', '5.9', '6', '21'], 1),
  M('Cov(X, Y) = ', ['E[XY] − E[X]E[Y]', 'E[X] + E[Y]', 'Var(X)Var(Y)', 'E[X²]'], 0),
  M('σ² (the variance of ε) represents:', ['The bias of the model', 'The irreducible error: the minimum achievable expected MSE', 'The learning rate', 'The slope'], 1),
  M('If Cov(X, y) < 0 then the fitted slope β₁ is:', ['Positive', 'Negative', 'Zero', 'Undefined'], 1),
  MS('Which of the following are true for two independent random variables X and Y?', ['P(X, Y) = P(X)P(Y)', 'Cov(X, Y) = 0', 'Var(X + Y) = Var(X) + Var(Y)', 'Y = X²'], [0, 1, 2]),
  T('Two orthogonal features are always statistically independent.', false, 'Orthogonality (no linear dependence) does <b>not</b> imply independence; independence is stronger.'),
  T('The mean and the variance of a random variable are numbers, not random.', true),
  T('E[X] must be one of the values X can take.', false, 'E[X] = 5.9 for values 3, 4, 6, 8: it is an average.'),
  T('OLS is also an MMSE estimator: it minimizes the mean squared error.', true),
  E('Show (in steps) that maximum likelihood under Gaussian noise leads to least squares.', 'yᵢ ~ N(βᵀx⁽ⁱ⁾, σ²) i.i.d. Likelihood = Π (1/√(2πσ²)) exp(−(yᵢ − βᵀx⁽ⁱ⁾)²/(2σ²)). Log-likelihood = const − (1/(2σ²)) Σ (yᵢ − βᵀx⁽ⁱ⁾)². Maximizing it = minimizing Σ (yᵢ − βᵀx⁽ⁱ⁾)², i.e. OLS → same normal equations.', ['Gaussian i.i.d. model for y', 'Product of densities', 'Log turns it into a sum', 'Max likelihood = min squared error (OLS)']),

  DIFF('uncorrelated', 'independent', [['Meaning', 'No linear relationship (Cov = 0)', 'No relationship at all'], ['Implication', 'Does not imply independence', 'Implies uncorrelated'], ['Example', 'Y = X² with X symmetric', 'Two separate dice']]),
  E('Why is the prediction treated as a probability distribution in probabilistic linear regression, and what does σ² tell us?', 'Because y = Xβ + ε contains random noise, each yᵢ ~ N(βᵀx⁽ⁱ⁾, σ²): the prediction is a distribution centred on the line, which tells how confident we are. σ² is the noise variance: the irreducible error no model can go below.', ['y has a distribution N(βᵀx, σ²)', 'Shows confidence', 'σ² = irreducible error']),
  NUM('X takes 0 and 2 with probability 0.5 each. Compute Var[X].', 1, 'E[X] = 1, E[X²] = 2 → Var = 2 − 1 = <b>1</b>.'),
  NUM(`Points ${FIG.data(['x', 'y'], [[1, 2], [2, 4], [3, 5]])} Compute β₁ = Cov(x, y)/Var(x).`, 1.5, 'x̄ = 2, ȳ = 11/3. Cov = (2 + 8 + 15)/3 − 2·11/3 = 1. Var(x) = 14/3 − 4 = 2/3. β₁ = <b>1.5</b>.'),
  NUM('Same points: β₀ = ȳ − β₁x̄. (3 decimals)', 0.667, '11/3 − 3 = <b>0.667</b>.'),

  ORD('Put the supervised learning process in order.', ['Collect a dataset of labeled training examples', 'Train a model to output accurate predictions on this dataset', 'Use the model on new, similar data', 'Evaluate on a separate test set']),

  DEF('machine learning (Arthur Samuel)', '"A field of study that gives computers the ability to <b>learn without being explicitly programmed</b>." The computer learns the rules from <b>examples</b> instead of a human writing them.', ['Learn without being explicitly programmed', 'Learns from examples / data']),
  DEF('supervised learning', 'Learning from a <b>labeled</b> dataset (each input has the correct output). The model learns the mapping x → y by minimizing a loss, then predicts y for <b>new, similar</b> data.', ['Labeled data', 'Learns mapping x → y', 'Predicts on new data']),
  DEF('unsupervised learning', 'Learning from data <b>without labels</b> to find its structure: <b>clusters</b>, <b>outliers</b>, signal hidden in noise.', ['No labels', 'Finds structure: clusters / outliers']),
  DEF('reinforcement learning', 'An <b>agent</b> interacts with the world over time and is taught good behavior through <b>rewards</b>: the better its behavior, the higher its rewards. E.g. chess, Go.', ['Agent interacting over time', 'Rewards for good behavior']),
  DEF('deep learning', 'A family of learning algorithms <b>loosely inspired by the brain</b> (neural networks); a subset of ML.', ['Inspired by the brain', 'Subset of ML']),
  DEF('feature space', 'The set X of all possible inputs; often X = ℝᵈ, where each input is a <b>d-dimensional vector</b> of features.', ['Set of all inputs', 'Often ℝᵈ']),
  DEF('training example', 'One pair (x⁽ⁱ⁾, y⁽ⁱ⁾): an input and its correct target, e.g. one patient\'s measurements and diabetes risk.', ['Pair of input and target']),
  DEF('objective (loss) function', 'A function J(θ) → [0, ∞) measuring how well a model with parameters θ <b>fits</b> the data. E.g. MSE, absolute (L1) error. The optimizer minimizes it.', ['Measures how well a model fits', 'Example MSE / L1', 'Minimized by optimizer']),
  DEF('learner', 'The algorithm that finds f_θ (also <b>learning algorithm</b> or <b>inducer</b>): it maps training data to a model and returns the optimal parameters.', ['Algorithm that finds the model', 'Maps data → model / optimal θ']),
  DEF('empirical risk minimization (ERM)', 'Finding the model f in the model class M with the <b>smallest value of the objective</b> J on the training data: min J(f).', ['Minimize the objective', 'Over the model class / training data']),
  DEF('generalization', 'A model generalizes well when it <b>predicts unseen examples correctly</b>, not only the training ones.', ['Correct on unseen data']),
  W('List', 'List the <b>four cases</b> in which ML is used (with an example each).', 'Human expertise does not exist (navigating on Mars); humans can\'t explain their expertise (speech recognition); models must be customized (personalized medicine); models are based on huge amounts of data (genomics).', ['Expertise does not exist + example', 'Can\'t explain expertise + example', 'Customized models + example', 'Huge data + example']),
  W('List', 'List the <b>reasons for the ML boom</b>.', 'Computational power; powerful programming frameworks; big data available and growing; money and people.', ['Computational power', 'Frameworks', 'Big data', 'Money and people']),
  W('List', 'List the <b>limitations</b> of ML mentioned in the lecture.', 'A model is as <b>biased as the data</b> (face recognition on minorities, CV rating learns socio-economic biases); it may <b>fail on slightly perturbed input</b>; so it is <b>non-robust</b>, hence maybe non-deployable (as of today).', ['Biased as the data', 'Fails on perturbed input', 'Non-robust / non-deployable']),
  W('List', 'List the tasks that are best solved by ML.', 'Recognizing patterns (faces, handwriting, medical images); generating patterns (images, motion); recognizing anomalies (credit card fraud, sensor readings); prediction (stock prices, exchange rates).', ['Recognizing patterns', 'Generating patterns', 'Recognizing anomalies', 'Prediction']),
  W('List', 'List the <b>key characteristics of supervised learning</b>.', '1. <b>Labeled data</b>: each example labeled with the correct answer. 2. <b>Training phase</b>: learns the mapping by minimizing a loss function (predicted vs actual). 3. <b>Evaluation</b>: performance measured on a separate <b>test set</b> to check generalization.', ['Labeled data', 'Training by minimizing a loss', 'Evaluation on a test set']),
  W('List', 'What are the three components of a supervised learning algorithm? Explain each.', 'Model class: the set of possible models. Objective function: defines how good a model is (how well it fits the data). Optimizer: finds the best model in the class according to the objective.', ['Model class', 'Objective function', 'Optimizer']),
  W('Explain', 'Why is it hard to write a program by hand for problems like recognizing objects, and what does ML do instead?', 'It is very hard to say what distinguishes a 2 from a 7 or a cycle from a motorcycle, and to specify all edge cases. Instead we <b>collect examples</b> with the correct output; a learning algorithm takes them and <b>produces a program</b> (possibly with millions of numbers) that does the job and works on new cases.', ['Rules / edge cases too hard', 'Collect examples with correct outputs', 'Algorithm produces the program']),
  W('Explain', 'Explain Yann LeCun\'s "cake" quote.', 'If intelligence were a cake, <b>unsupervised</b> learning would be the cake, <b>supervised</b> the icing, and <b>reinforcement</b> the cherry: most of human and animal learning is unsupervised.', ['Unsupervised = cake', 'Supervised = icing', 'Reinforcement = cherry']),

  DIFF('machine learning', 'statistics', [['Goal', 'Make useful predictions', 'Learn about the world (inference)'], ['Models', 'Complicated, competitive', 'Simple, interpretable'], ['Style', 'Large datasets, pragmatic, gives up on inference', 'Theoretical analysis, guarantees under assumptions'], ['Common', 'Detect patterns in data with predictive models', 'Detect patterns in data with predictive models']]),
  DIFF('supervised learning', 'unsupervised learning', [['Data', 'Labeled', 'Unlabeled'], ['Goal', 'Predict y from x', 'Find structure: clusters, outliers'], ['Example', 'House prices', 'Clusters hidden in a dataset'], ['Evaluation', 'Compare predictions with true labels', 'No true labels to compare']]),
  DIFF('supervised learning', 'reinforcement learning', [['Learns from', 'Labeled examples', 'Rewards from interacting with the world'], ['Who', 'A model', 'An agent acting over time'], ['Example', 'Diabetes risk', 'Chess, Go, cooling systems']]),
  DIFF('regression', 'classification', [['Target y', 'Continuous (y ∈ ℝ)', 'Discrete (a class)'], ['Goal', 'Fit a curve through the data', 'Find a hyperplane that separates the classes'], ['Example', 'Price prediction', 'Type of residence']]),
  DIFF('rule-based approach', 'machine learning approach', [['Who makes the rules', 'A human, explicitly', 'The computer learns them from examples'], ['Edge cases', 'Almost impossible to cover all', 'Learned from data'], ['Improves with', 'More hand-written rules', 'More experience / data']]),
  DIFF('AI', 'machine learning', [['Meaning', 'Building machines that exhibit intelligence', 'Machines that learn from experience'], ['Relation', 'The bigger field', 'A tool for AI (subset)']]),
  DIFF('machine learning', 'deep learning', [['Scope', 'Learning from experience in general', 'A family of algorithms inspired by the brain'], ['Relation', 'Contains DL', 'Subset of ML']]),
  DIFF('learning to predict', 'learning to explain', [['Goal', 'Good predictions on new data', 'Understand the relationship in the data'], ['Care about model structure', 'Not necessarily', 'Yes, it is the point'], ['Example', 'Stock price development', 'Risk factors of a disease'], ['Tradition', 'ML', 'Classical statistics']]),
  DIFF('attribute', 'feature', [['Meaning', 'A raw numerical variable describing the object', 'A custom description built from attributes'], ['Example', 'Age, BMI', '"Old man", "BMI above obesity threshold"'], ['In practice', 'Used interchangeably', 'Used interchangeably']]),
  DIFF('mean squared error', 'absolute (L1) error', [['Formula', '(1/2n) Σ (f(x) − y)²', '(1/n) Σ |f(x) − y|'], ['Big errors', 'Punished more (squared)', 'Punished linearly'], ['Units', 'Squared units', 'Same units as y']]),

  WHATIF('What happens if a model is trained on biased data?', 'The model becomes <b>as biased as the data</b>: e.g. face recognition working worse on minorities, CV rating systems learning socio-economic biases.', ['Model inherits the bias', 'Example']),
  WHATIF('What happens if a predictive model gets a slightly perturbed input?', 'It may <b>fail</b>: models can be <b>non-robust</b>, which makes them hard to deploy.', ['May fail', 'Non-robust / not deployable']),
  WHATIF('What happens if we choose a very simple model class?', 'It is easy to find the best model in it, but it may not be <b>expressive</b> enough to fit the data → poor predictions (tradeoff between expressiveness and difficulty of finding a good model).', ['Easy to optimize', 'Not expressive enough']),
  ADV('Give the advantages and limitations of machine learning compared with writing rules by hand.', 'Advantages: no manual rules, handles problems humans can\'t explain, improves with more data, can customize. Limitations: as biased as the data, may fail on perturbed input (non-robust), needs lots of data.', ['Advantage(s)', 'Limitation(s)']),
  EX('Give one example each of supervised, unsupervised and reinforcement learning.', 'Supervised: predicting house prices / diabetes risk. Unsupervised: finding clusters or outliers. Reinforcement: an agent playing chess or Go, controlling cooling systems.', ['Supervised example', 'Unsupervised example', 'Reinforcement example']),
  EX('Give an example of a regression problem and a classification problem.', 'Regression: predicting a house price or diabetes risk score. Classification: spam vs not spam, type of residence.', ['Regression example', 'Classification example']),
  EX('Give two everyday applications of ML.', 'Search engines, personal assistants (Siri), spam/fraud detection, games, recommender systems, medicine, self-driving cars.', ['Two correct examples']),
  FIX('A student wrote: "<i>In y = θ₁x + θ₀, x is the dependent variable and y is the independent variable.</i>" Correct it.', 'It is the opposite: <b>x is the independent</b> variable (input / feature) and <b>y is the dependent</b> variable (target). (One slide in 01b swaps them by mistake.)', ['x independent', 'y dependent']),
  FIX('A student wrote: "<i>Unsupervised learning is the icing on the cake.</i>" Correct it.', 'Unsupervised = the <b>cake</b>; supervised = the icing; reinforcement = the cherry.', ['Unsupervised = cake', 'Supervised = icing']),
  FIX('A student wrote: "<i>Classification fits a curve through the targets, regression separates the classes.</i>" Correct it.', 'Swapped: <b>regression</b> fits a curve; <b>classification</b> finds a hyperplane separating the classes.', ['Regression fits a curve', 'Classification separates classes'])
]};

LECT0.l2 = { ln: 'L2', name: 'Linear Regression & Gradient Descent', title: 'Lecture 02a', covers: 'linear regression, the equation and its terms, inference, MSE loss and why squared, residuals, RMSE, evaluation metrics, iterative vs closed form, gradient descent, convex cost, learning rate, local vs global minima, partial derivatives, update rule, convergence, LMS rule, assumptions',
items: [
  M('Linear regression is a ___ algorithm.', ['Unsupervised', 'Supervised', 'Reinforcement', 'Clustering'], 1),
  M('Linear regression is also known as ___.', ['Maximum entropy', 'Least squares estimation', 'Logistic estimation', 'K-means'], 1),
  M('In y = β₀ + β₁x₁ + … + β_px_p + ε, the β\'s are ___.', ['Features', 'Coefficients (weights) learned by the model', 'Errors', 'Labels'], 1),
  M('In the linear regression equation, ε is ___.', ['The learning rate', 'The irreducible error', 'The intercept', 'The slope'], 1),
  M('ε collects ___.', ['All the unmodeled parts of the data', 'The coefficients', 'The features', 'The predictions'], 0),
  M('Predicting future values with ŷ = β̂₀ + β̂₁x₁ + … is often called ___.', ['Training', 'Inference', 'Regularization', 'Clustering'], 1),
  M('β₀ is the ___.', ['Slope', 'Intercept (value of y when x = 0)', 'Learning rate', 'Error'], 1),
  M('β₁ in simple linear regression is the ___.', ['Intercept', 'Slope: change in y for a one-unit change in x', 'Noise', 'Loss'], 1),
  M('MSE = ___.', ['(1/n) Σ |yᵢ − ŷᵢ|', '(1/n) Σ (yᵢ − ŷᵢ)²', 'Σ (yᵢ − ŷᵢ)', '√Σ yᵢ'], 1),
  M('A residual is ___.', ['ŷ − β', 'The vertical distance yᵢ − ŷᵢ between a point and the line', 'The slope', 'The learning rate'], 1),
  M('Why are errors squared in MSE?', ['To make them negative', 'So positive and negative errors don\'t cancel, and far points get more weight', 'To make computation slower', 'To ignore outliers'], 1),
  M('MSE ___ outliers.', ['Ignores', 'Punishes (gives more weight to)', 'Removes', 'Labels'], 1),
  M('The disadvantage of MSE for interpretation is that ___.', ['It is always zero', 'The error is in squared units (fixed by RMSE)', 'It has no derivative', 'It is negative'], 1),
  M('RMSE = ___.', ['MSE²', '√MSE', 'MSE / n', '1 − MSE'], 1),
  M('A higher cost (MSE) means ___.', ['A better model', 'The model performs poorly on the training set', 'Lower error', 'The learning rate is good'], 1),
  M('The two ways to estimate coefficients discussed are ___.', ['Random and manual', 'An iterative solution and a closed-form solution', 'Clustering and voting', 'Rewards and penalties'], 1),
  M('Gradient descent is a(n) ___ algorithm.', ['Closed-form', 'Iterative optimization', 'Clustering', 'Classification'], 1),
  M('Gradient descent finds the minimum of a ___ function.', ['Linear', 'Convex', 'Random', 'Discrete'], 1),
  M('The gradient points in the direction where the function ___.', ['Decreases', 'Increases (and how fast)', 'Is zero', 'Is constant'], 1),
  M('Gradient descent takes steps ___ the gradient.', ['In the same direction as', 'Opposite to', 'Perpendicular to', 'Ignoring'], 1),
  M('The update rule of gradient descent is ___.', ['β ← β + η dL/dβ', 'β ← β − η dL/dβ', 'β ← dL/dβ', 'β ← η'], 1),
  M('η (or α) in gradient descent is the ___.', ['Intercept', 'Learning rate', 'Error', 'Number of features'], 1),
  M('If the learning rate is too small, gradient descent ___.', ['Diverges', 'May be slow', 'Overshoots', 'Never moves'], 1),
  M('If the learning rate is too large, gradient descent may ___.', ['Be slow', 'Overshoot, never reach the minimum, or diverge', 'Stop immediately', 'Find the exact answer in one step'], 1),
  M('A cost function with several valleys can trap gradient descent in a ___.', ['Global minimum', 'Local minimum', 'Saddle of rewards', 'Cluster'], 1),
  M('∂𝓛/∂β₀ for simple linear regression with MSE is ___.', ['−(2/n) Σ (yᵢ − ŷᵢ) xᵢ', '−(2/n) Σ (yᵢ − ŷᵢ)', '(1/n) Σ yᵢ', '2β₀'], 1),
  M('∂𝓛/∂β₁ for simple linear regression with MSE is ___.', ['−(2/n) Σ (yᵢ − ŷᵢ) xᵢ', '−(2/n) Σ (yᵢ − ŷᵢ)', 'Σ xᵢ', '−2β₁'], 0),
  M('In gradient descent, β₀ and β₁ are updated ___.', ['One after the other with new values', 'Simultaneously', 'Only β₁', 'Randomly'], 1),
  M('A typical stopping condition for gradient descent is ___.', ['After exactly one step', 'When ‖θᵢ − θᵢ₋₁‖ (or the change in cost) is small', 'When the learning rate is 0', 'Never'], 1),
  M('The gradient descent update rule for linear regression with MSE is also known as ___.', ['Newton\'s method', 'Least Mean Squares (LMS) or Widrow-Hoff rule', 'Softmax', 'Lasso'], 1),
  M('The cost function of linear regression with two parameters looks like ___.', ['A straight line', 'A bowl (convex surface)', 'A sine wave', 'A step'], 1),
  M('The learning rate is a ___.', ['Parameter learned by the model', 'Hyperparameter we choose', 'Feature', 'Label'], 1),
  M('Which is an assumption of linear regression?', ['Errors are uniformly distributed', 'Linearity between x and y', 'Features must be categorical', 'There is no noise'], 1),

  T('Linear regression predicts a numeric response from one or more independent variables.', true),
  T('Linear regression is rarely used today because of neural networks.', false, 'It is still <b>widely used</b>: effective, easy to interpret, easy to extend.'),
  T('The coefficients β are what the model learns during optimization.', true),
  T('We can always know the true parameters of the model.', false, 'We may <b>never know</b> the true parameters; we <b>estimate</b> them.'),
  T('Squaring errors lets positive and negative errors cancel out.', false, 'Squaring <b>prevents</b> them from cancelling.'),
  T('MSE gives more weight to points far from the line.', true),
  T('Lower MSE means a better model.', true),
  T('In practice, we fit the model on the training set and evaluate MSE on the test set.', true),
  T('The evaluation metric should reflect what you actually care about.', true),
  T('Selecting coefficients by hand is easy for models with many features.', false, 'It quickly becomes <b>infeasible</b>.'),
  T('Gradient descent moves in the direction where the error function increases.', false, 'It moves in the <b>opposite</b> direction.'),
  T('With a very small learning rate, gradient descent is slower but more stable.', true),
  T('With a very large learning rate, gradient descent always converges faster.', false, 'It may <b>overshoot</b> and <b>diverge</b>.'),
  T('Gradient descent starts from a random initial value.', true),
  T('Steps are proportional to the rate of change of the error.', true),
  T('In 2D, the update is β ← β − η∇𝓛 for the vector β = (β₀, β₁).', true),
  T('Partial derivative ∂𝓛/∂β₁ is computed with β₀ fixed.', true),
  T('The MSE cost of linear regression has many local minima.', false, 'It is <b>convex</b> (a bowl): one global minimum.'),
  T('The residuals of linear regression should be normally distributed (assumption, useful for inference).', true),

  C('MSE = (1/n) Σ (yᵢ − ___)².', ['ŷᵢ', 'yhat', 'y hat', 'ŷ', 'predicted']),
  C('The square root of the MSE is called ___.', ['RMSE', 'root mean squared error', 'root MSE']),
  C('In gradient descent, ___ is the learning rate.', ['η', 'eta', 'alpha', 'α']),
  C('Gradient descent is an ___ optimization algorithm that finds the minimum of a ___ function.', [['iterative'], ['convex']]),
  C('Update rule: β ← β − η · d𝓛/d___.', ['β', 'beta']),
  C('If the learning rate is too large, gradient descent may ___ the minimum.', ['overshoot', 'miss', 'skip']),
  C('The gradient descent update for linear regression is known as the LMS or ___-Hoff rule.', ['Widrow']),
  C('Linear regression is also known as Least ___ Estimation.', ['Squares']),
  C('The two estimation methods: an iterative solution and a ___-form solution.', ['closed']),
  C('ε is called the ___ error.', ['irreducible']),
  C('The three assumptions of linear regression: linearity, ___ and normality of errors.', ['independence']),

  MATCH('Match each symbol with its meaning.', [['y', 'Dependent variable (target)'], ['xₖ', 'Independent variable (feature)'], ['βₖ', 'Coefficient (weight)'], ['ε', 'Irreducible error'], ['η', 'Learning rate']]),
  MATCH('Match each learning rate with its effect.', [['Too small', 'Slow convergence'], ['Too large', 'Overshoots / may diverge'], ['Well chosen', 'Reaches the minimum efficiently']]),
  ORD('Put the gradient descent algorithm in order.', ['Initialize the coefficients randomly', 'Compute the predictions and the gradient of the loss', 'Update all coefficients: β ← β − η∇𝓛', 'Repeat until the change is small (convergence)']),
  ORD('Put the MSE computation in order.', ['Compute the prediction ŷᵢ for every point', 'Compute each residual yᵢ − ŷᵢ', 'Square each residual', 'Add them up and divide by n']),

  NUM('Points (1,2), (2,4), (3,5) and the line ŷ = 1 + 1.5x. Compute the <b>MSE</b>. (Round to 3 decimals.)', 0.167, 'ŷ = 2.5, 4, 5.5 → residuals −0.5, 0, −0.5 → (0.25 + 0 + 0.25)/3 = <b>0.167</b>.'),
  NUM('Points (0,1), (1,3), (2,5) and the line ŷ = 1 + x. Compute the <b>MSE</b>.', 1.667, 'ŷ = 1, 2, 3 → residuals 0, 1, 2 → (0 + 1 + 4)/3 = 5/3 ≈ <b>1.667</b>.'),
  NUM('The MSE of a model is 16. What is its <b>RMSE</b>?', 4, 'RMSE = √16 = <b>4</b>.'),
  NUM('One gradient descent step (exam convention ∂J/∂β₀ = (1/n)Σ(h − y), ∂J/∂β₁ = (1/n)Σ(h − y)x): data (1,2), (2,4); start β₀ = β₁ = 0; η = 0.1. What is the new <b>β₀</b>?', 0.3, 'Errors h − y = −2, −4. ∂J/∂β₀ = (−2 − 4)/2 = −3. β₀ = 0 − 0.1(−3) = <b>0.3</b>. (With the slide\'s MSE gradient −(2/n)Σ the step is twice as big: 0.6. In the exam use the (1/n) form, as in the official solutions.)'),
  NUM('Same step (exam convention): data (1,2), (2,4); β₀ = β₁ = 0; η = 0.1. What is the new <b>β₁</b>?', 0.5, '∂J/∂β₁ = (−2·1 − 4·2)/2 = −5. β₁ = 0 − 0.1(−5) = <b>0.5</b>.'),
  NUM('1D gradient descent on J(w) = w². Start w = 4, η = 0.25. What is w after <b>one</b> step? (dJ/dw = 2w)', 2, 'w = 4 − 0.25·(2·4) = 4 − 2 = <b>2</b>.'),
  NUM('J(w) = w², start w = 4, η = 1.5. What is w after one step? (Watch what happens.)', -8, 'w = 4 − 1.5·8 = <b>−8</b>: it jumped to the other side and got further away → learning rate too large, diverges.'),
  NUM('A model ŷ = 3 + 2x. Predict y for x = 4.', 11, 'ŷ = 3 + 2·4 = <b>11</b> (inference = plug x in).'),

  DEF('linear regression', 'A <b>supervised</b> algorithm that models a <b>dependent variable y</b> as a <b>linear</b> function of independent variables (features) by finding the line / surface that best fits the data (least squares).', ['Supervised', 'y as linear function of features', 'Best-fit line / surface (least squares)']),
  DEF('residual', 'The difference between the observed and predicted value, yᵢ − ŷᵢ: the vertical distance from a data point to the regression line.', ['y − ŷ', 'Distance from point to line']),
  DEF('mean squared error (MSE)', 'MSE = (1/n) Σ (yᵢ − ŷᵢ)²: the <b>average of the squared</b> residuals. Measures how close predictions are to the true values; lower is better.', ['Formula', 'Average squared error / lower is better']),
  DEF('gradient descent', 'An <b>iterative</b> optimization algorithm that finds the coefficients minimizing a (convex) cost function by repeatedly stepping <b>opposite to the gradient</b>: β ← β − η∇𝓛.', ['Iterative', 'Steps opposite to the gradient', 'Update rule with learning rate']),
  DEF('learning rate', 'The hyperparameter η (α) that controls the <b>size of each step</b> in gradient descent. Too small → slow; too large → overshoot / diverge.', ['Step size', 'Too small slow / too large diverge']),
  DEF('gradient', 'The vector of partial derivatives of the loss; it shows the <b>direction</b> in which the function <b>increases</b> and the <b>rate</b> at which it increases.', ['Vector of partial derivatives', 'Direction and rate of increase']),
  DEF('irreducible error (ε)', 'The error term that collects all the <b>unmodeled</b> parts of the data (noise). No model can remove it.', ['Unmodeled part / noise', 'Cannot be removed']),
  DEF('inference (in linear regression)', 'Predicting future values by <b>plugging the feature values</b> into the fitted equation ŷ = β̂₀ + β̂₁x₁ + ….', ['Predict with the fitted equation']),
  W('Explain', 'Explain <b>why we square</b> the errors in MSE, and the cost of doing so.', 'Squaring (1) stops positive and negative errors from <b>cancelling</b>, (2) gives <b>more weight</b> to points far from the line (punishes outliers). Cost: the error is in <b>squared units</b> → less interpretable (use RMSE).', ['No cancelling', 'Punishes outliers / far points', 'Squared units → RMSE']),
  W('Explain', 'Explain the effect of the <b>learning rate</b> on gradient descent.', 'Too small: tiny steps → slow (but stable) convergence. Too large: overshoots the minimum, may never reach it, may diverge. A good value reaches the minimum efficiently.', ['Too small → slow', 'Too large → overshoot/diverge', 'Good value']),
  W('Write', 'Write the gradient descent update equations for β₀ and β₁ in simple linear regression with MSE.', 'β₀ ← β₀ − η(−(2/n) Σ (yᵢ − ŷᵢ))<br>β₁ ← β₁ − η(−(2/n) Σ (yᵢ − ŷᵢ) xᵢ)<br>Repeat until convergence, updating both simultaneously.', ['β₀ update', 'β₁ update', 'Repeat / simultaneous']),
  W('Write', 'Write the gradient descent algorithm (pseudocode).', 'theta = random_initialization()<br>while norm(theta − theta_prev) &gt; threshold:<br>&nbsp;&nbsp;theta_prev = theta<br>&nbsp;&nbsp;theta = theta_prev − step_size × gradient(theta_prev)', ['Random initialization', 'Loop until small change', 'Step against the gradient']),
  W('List', 'List the <b>assumptions of linear regression</b>.', 'Linearity (x and y linearly related); Independence (observations independent); Normality (residuals normally distributed).', ['Linearity', 'Independence', 'Normality of errors']),
  W('Explain', 'Explain each term in y = β₀ + β₁x₁ + … + β_px_p + ε.', 'y: dependent variable (what we predict). xₖ: independent variables (features). βₖ: coefficients / weights learned by the model (β₀ intercept). ε: irreducible error (unmodeled part).', ['y', 'xₖ', 'βₖ', 'ε']),

  DIFF('gradient descent', 'closed-form (analytical) solution', [['Type', 'Iterative', 'Direct formula'], ['Hyperparameters', 'Needs a learning rate', 'None'], ['Result', 'Approximation that improves each step', 'Exact (if the inverse exists)'], ['Large data', 'Scales well', 'Expensive (matrix inversion)']]),
  DIFF('small learning rate', 'large learning rate', [['Steps', 'Small', 'Big'], ['Speed', 'Slow convergence', 'Fast at first'], ['Risk', 'Takes too long', 'Overshoots, may diverge'], ['Stability', 'Stable', 'Unstable']]),
  DIFF('local minimum', 'global minimum', [['Meaning', 'Lowest point in a neighborhood', 'Lowest point of the whole function'], ['Gradient descent', 'Can get stuck there', 'The goal'], ['Linear regression MSE', 'None besides the global', 'Exactly one (convex)']]),
  DIFF('MSE', 'RMSE', [['Formula', '(1/n) Σ (y − ŷ)²', '√MSE'], ['Units', 'Squared units', 'Same units as y'], ['Interpretation', 'Harder', 'Easier']]),
  DIFF('parameter', 'hyperparameter', [['Who sets it', 'Learned from data', 'Chosen by us before training'], ['Example', 'β₀, β₁', 'Learning rate η'], ['Found by', 'GD / OLS', 'Trying values / validation']]),
  DIFF('residual', 'irreducible error (ε)', [['Meaning', 'Observed − predicted for a fitted model', 'Noise in the true relationship'], ['Can be reduced', 'Yes, by a better model', 'No']]),

items: [

  M('Why do we define x₀ = 1?', ['To remove the intercept', 'So the intercept becomes a weight and f(x) = βᵀx', 'To scale the features', 'To make X square'], 1),
  M('The all-ones feature column is often called the ___.', ['Residual', 'Bias / intercept feature', 'Target', 'Noise'], 1),
  M('In the basketball example, the target is ___.', ['FG', 'AST', '3PA', 'PTS (average points per game)'], 3),
  M('In the basketball data table, each row corresponds to ___.', ['A feature', 'An individual player', 'A game', 'A coefficient'], 1),
  M('Which model is <b>not</b> linear (in the parameters)?', ['Y = β₀ + β₁X + ε', 'Y = β₀ + β₁X² + β₂log(X) + ε', 'Y = β₀β₁^X ε', 'Y = β₀ + β₁eˣ + ε'], 2, '"Linear" means linear in the β\'s. X², log X, eˣ are just transformed features.'),
  M('"Linear" in linear regression means linear in ___.', ['X', 'The coefficients β', 'y', 'Time'], 1),
  M('The design matrix X has size ___.', ['p × n', 'n × (p + 1)', '(p + 1) × (p + 1)', 'n × 1'], 1),
  M('Row i of the design matrix is ___.', ['[y⁽ⁱ⁾]', 'x⁽ⁱ⁾ᵀ = [1, x₁⁽ⁱ⁾, …, x_p⁽ⁱ⁾]', 'One feature for all samples', 'The coefficients'], 1),
  M('The model in matrix form is ___.', ['y = βX', 'y = Xβ + ε', 'y = XᵀX', 'y = X⁻¹β'], 1),
  M('The MSE in matrix form is ___.', ['(1/n)(y − Xβ)ᵀ(y − Xβ)', 'XᵀXβ', '(1/n)Xβ', 'yᵀy'], 0),
  M('aᵀa equals ___.', ['0', '‖a‖² (squared length)', '1', 'a²ᵀ'], 1),
  M('The gradient of the MSE in matrix form is ___.', ['−(2/n)Xᵀ(y − Xβ)', 'XᵀX', '(2/n)yᵀX', 'X(y − β)'], 0),
  M('The normal equations are ___.', ['Xβ = 0', 'XᵀXβ = Xᵀy', 'Xᵀy = 0', 'βᵀβ = 1'], 1),

  M('To get the normal equation we ___.', ['Run gradient descent', 'Set the gradient to zero and solve', 'Take the log', 'Add noise'], 1),
  M('"Baby" (one-feature, no intercept) linear regression gives β = ___.', ['Σxᵢyᵢ / Σxᵢ²', 'Σyᵢ / n', 'Σxᵢ / Σyᵢ', 'Σxᵢ²'], 0),
  M('For the points (2,1), (5,2), (7,3), (8,3), XᵀX = ___.', ['[[4, 22],[22, 142]]', '[[4, 9],[9, 57]]', '[[22, 4],[142, 22]]', '[[1, 2],[5, 7]]'], 0),
  M('For the same points, Xᵀy = ___.', ['[9, 57]', '[4, 22]', '[22, 142]', '[1, 3]'], 0),
  M('Ordinary Least Squares can be interpreted as minimizing ___.', ['The number of features', 'The length of the residual vector e = y − ŷ', 'The learning rate', 'The likelihood'], 1),
  M('The set of all linear combinations of the columns of X is the ___.', ['Null space', 'Span / column space of X', 'Residual space', 'Noise'], 1),
  M('If each column of X has length n, span(X) is a subspace of ___.', ['ℝᵖ', 'ℝⁿ', 'ℝ', 'ℝ²'], 1),
  M('ŷ = Xβ̂ is the ___ of y onto the column space of X.', ['Rotation', 'Orthogonal projection', 'Inverse', 'Gradient'], 1),

  M('Which makes the data collinear?', ['n > p + 1', 'One of the features is constant', 'Features have mean zero', 'Features are orthonormal'], 1),
  M('Which of these also makes the data collinear?', ['x₁ = 3x₂', 'x₁ and x₂ independent', 'Many samples', 'Scaled features'], 0),

  M('Which is a remedy for multicollinearity?', ['Add more correlated features', 'Remove or combine correlated features, or use Ridge', 'Increase the learning rate', 'Remove the intercept'], 1),
  M('Vectors are orthogonal when ___.', ['They have length 1', 'Their pairwise dot product is 0', 'They are equal', 'They are proportional'], 1),
  M('Orthonormal means ___.', ['Orthogonal and norm 1', 'Mean zero', 'Correlated', 'Proportional'], 0),
  M('If the features are orthonormal, XᵀX = ___ and β = ___.', ['0, 0', 'I, Xᵀy', 'X, y', 'I, (Xᵀy)⁻¹'], 1),
  M('If features have mean zero, are uncorrelated and have variance 1, then ___.', ['Each coefficient can be computed independently (p separate regressions)', 'The model cannot be trained', 'β₀ = 0 always', 'GD diverges'], 0),
  M('If all features have mean zero, β₀ = ___.', ['0', '(1/n) Σ yᵢ (the mean of y)', 'Σ xᵢ', '1'], 1),

  M('Why use gradient descent even when a direct solution exists?', ['GD is always exact', 'GD applies to a much broader set of models and can be easier to implement', 'GD needs no data', 'GD has no hyperparameters'], 1),
  M('Gradient descent will not work well if features are ___.', ['Scaled', 'Unscaled', 'Numerical', 'Centered'], 1),
  M('With unscaled features, the cost surface looks like ___.', ['A balanced bowl', 'A long, narrow valley', 'A flat plane', 'A cone'], 1),
  M('Which method stores only the current parameters?', ['Normal equation', 'Gradient descent', 'SVD', 'Matrix inversion'], 1),
  M('Which method gives an exact solution if the inverse exists?', ['Gradient descent', 'Normal equation', 'SGD', 'Mini-batch GD'], 1),
  M('Which method can use stochastic versions (SGD) and mini-batches?', ['Normal equation', 'Gradient descent', 'Both', 'Neither'], 1),
  M('Which method needs a learning rate?', ['Normal equation', 'Gradient descent', 'Both', 'Neither'], 1),
  M('Which method is not suitable for very large datasets?', ['Gradient descent', 'Normal equation', 'SGD', 'Mini-batch'], 1),

  C('Inverting a matrix costs approximately O(n^___) where n is the number of features.', ['3']),
  C('Any matrix can be decomposed as X = U S V^T: this is called the ___.', ['SVD', 'singular value decomposition']),
  C('GD can be applied to a much broader set of ___.', ['models']),
  C('GD needs feature scaling: with ___ features the cost looks like a long, narrow valley.', ['unscaled', 'not scaled']),
  C('The predictions ŷ = Xβ̂ are the orthogonal ___ of y onto the column space of X.', ['projection']),

  MATCH('Match each collinearity case with an example.', [['n < p + 1', 'Fewer samples than parameters'], ['A constant feature', 'x₂ = 5 for every sample'], ['Proportional features', 'x₁ = 3x₂'], ['Otherwise linearly related', 'x₃ = x₁ + x₂']]),
  MATCH('Match each object with its size (n samples, p features).', [['X', 'n × (p + 1)'], ['y', 'n × 1'], ['β', '(p + 1) × 1'], ['XᵀX', '(p + 1) × (p + 1)']]),
  MATCH('Match each property with the method.', [['Iterative optimization', 'Gradient descent'], ['Direct closed-form solution', 'Normal equation'], ['Needs a learning rate', 'Gradient descent'], ['Exact if the inverse exists', 'Normal equation']]),
  ORD('Put the derivation of the normal equation in order.', ['Write the loss as (1/n)(y − Xβ)ᵀ(y − Xβ)', 'Take the gradient: −(2/n)Xᵀ(y − Xβ)', 'Set the gradient to zero: Xᵀ(y − Xβ) = 0', 'Rearrange: XᵀXβ = Xᵀy', 'Solve: β = (XᵀX)⁻¹Xᵀy']),
  ORD('Put the steps of solving a least-squares problem by hand in order.', ['Build X (with a column of 1s) and y', 'Compute XᵀX and Xᵀy', 'Invert XᵀX', 'Multiply: β = (XᵀX)⁻¹Xᵀy', 'Write the line ŷ = β₀ + β₁x']),

  NUM('Points (2,1), (5,2), (7,3), (8,3). Use the normal equation. What is <b>β₁</b> (slope)? (3 decimals)', 0.357, 'XᵀX = [[4,22],[22,142]], Xᵀy = [9,57], det = 84. β = (1/84)[142·9 − 22·57, −22·9 + 4·57] = (1/84)[24, 30]. β₁ = 30/84 = 5/14 ≈ <b>0.357</b>.'),
  NUM('Same points (2,1), (5,2), (7,3), (8,3). What is <b>β₀</b> (intercept)? (3 decimals)', 0.286, 'β₀ = 24/84 = 2/7 ≈ <b>0.286</b>. Line: y = 2/7 + (5/14)x.'),

  DEF('design matrix', 'The n × (p + 1) matrix X that collects all the inputs: one <b>row per sample</b>, one <b>column per feature</b>, with a first column of 1s for the intercept.', ['n × (p+1)', 'Rows = samples, columns = features', 'Column of 1s']),
  DEF('normal equation', 'The closed-form solution of least squares obtained by setting the gradient to zero: <b>XᵀXβ = Xᵀy</b>, so <b>β = (XᵀX)⁻¹Xᵀy</b>.', ['XᵀXβ = Xᵀy', 'β = (XᵀX)⁻¹Xᵀy', 'Gradient = 0 / closed form']),

  DEF('column space (span) of X', 'The set of all linear combinations of the columns of X: all the vectors we can "reach" with Xβ. A subspace of ℝⁿ.', ['All linear combinations of columns', 'What Xβ can reach']),

  W('List', 'Give the <b>three interpretations</b> of OLS.', 'Minimizing the MSE for the linear model y = Xβ; minimizing the distance between true y and predicted ŷ; minimizing the length of the residual vector ‖e‖ = ‖y − ŷ‖.', ['Minimize MSE', 'Distance y and ŷ', 'Length of residual vector']),
  W('Explain', 'Derive the normal equation from the MSE loss in matrix form.', '𝓛 = (1/n)(y − Xβ)ᵀ(y − Xβ). ∇𝓛 = −(2/n)Xᵀ(y − Xβ). Set to 0: Xᵀy − XᵀXβ = 0 → XᵀXβ = Xᵀy → β = (XᵀX)⁻¹Xᵀy.', ['Matrix loss', 'Gradient', 'Set to zero', 'Final formula']),
  W('Explain', 'Why is β = (XᵀX)⁻¹Xᵀy "terrible for computations"?', 'Inverting XᵀX is very expensive in time (≈ O(p³) in the number of features) and memory, prohibitive for many features / big data; and it is numerically unstable when XᵀX is near-singular. Use SVD (or GD) instead.', ['Expensive O(p³) / memory', 'Unstable when near-singular', 'Use SVD / GD']),

  W('Explain', 'Explain the geometric interpretation of least squares.', 'Xβ can only reach vectors in the column space of X. y is usually outside it. OLS picks ŷ = Xβ̂ as the point in the column space closest to y: the orthogonal projection of y. The residual e = y − ŷ is perpendicular to every column of X (Xᵀe = 0).', ['Column space', 'Orthogonal projection', 'Residual ⟂ columns']),

  DIFF('simple linear regression', 'multiple linear regression', [['Number of predictors', 'One', 'More than one'], ['Model', 'y = β₀ + β₁x', 'y = β₀ + β₁x₁ + … + β_px_p = βᵀx'], ['Fit', 'A line', 'A plane / hyperplane'], ['Closed form', 'β₁ = Cov/Var, β₀ = ȳ − β₁x̄', 'β = (XᵀX)⁻¹Xᵀy']]),

  DIFF('linear in the features', 'linear in the parameters', [['Meaning', 'Straight line in x', 'Each β only multiplies a (possibly transformed) feature'], ['Y = β₀ + β₁X²', 'No', 'Yes → it is a linear model'], ['What "linear regression" requires', 'Not required', 'Required']]),

  W('List', 'Give the reasons why MSE is not used for logistic regression.', '1. The model is non-linear (sigmoid). 2. The errors follow a Bernoulli distribution, not Gaussian (MSE came from the Gaussian assumption). 3. The squared loss is bounded by 1, so very wrong predictions are not punished strongly. 4. MSE with a sigmoid is non-convex: local minima / plateaus.', ['Non-linear model', 'Bernoulli not Gaussian', 'Bounded penalty', 'Non-convex']),
  W('Explain', 'Explain why we model the log-odds instead of the probability.', 'A probability is in (0, 1), but a linear function βᵀx takes any real value. The odds p/(1−p) are in (0, ∞), and the log-odds in (−∞, ∞), so it can be modelled linearly: log(p/(1−p)) = βᵀx → p = σ(βᵀx).', ['p in (0,1) vs βᵀx real', 'Odds then log-odds', 'Inverse = sigmoid']),
  W('Explain', 'Derive the cross-entropy loss from the Bernoulli likelihood.', 'P(Y = y) = p^y(1 − p)^(1−y). For independent points, likelihood = Π p̂ᵢ^yᵢ(1 − p̂ᵢ)^(1−yᵢ). Log → Σ [yᵢ log p̂ᵢ + (1 − yᵢ) log(1 − p̂ᵢ)]. Maximizing it = minimizing its negative = the log-loss.', ['Bernoulli pmf', 'Product', 'Log → sum', 'Negative = log-loss']),

 { id: 'mm1', ln: 'MM1', title: 'Mock Midterm A (Fall 2024 format)', sub: '120 minutes · 60 marks · same structure as Dr. Laila\'s Fall 2024 paper: a long theory question on linear regression, a model-comparison scenario with two choice questions, and a figure question.', minutes: 120, qs: [
