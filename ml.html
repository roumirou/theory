”!"}, {"k": "pic", "w": 1200, "h": 417, "wide": 0.8366249958674113, "a": "mlp-l1-7.webp", "x": 0, "y": 0, "sw": 1425, "sh": 3996}]}, {"id": "l1a-016", "n": 16, "title": "Rule Based Approach", "blocks": [{"k": "li", "lvl": 0, "t": "We need object detection systems for the cars to ”see”!"}, {"k": "pic", "w": 1200, "h": 704, "wide": 0.6458333015441895, "a": "mlp-l1-3.webp", "x": 0, "y": 0, "sw": 1202, "sh": 4029}]}, {"id": "l1a-017", "n": 17, "title": "Object Detection with Rules", "blocks": [{"k": "li", "lvl": 0, "t": "Let’s Write Some Rules?"}, {"k": "pic", "w": 1200, "h": 416, "wide": 0.8028229395548503, "a": "mlp-l1-7.webp", "x": 0, "y": 419, "sw": 1425, "sh": 3996}, {"k": "li", "lvl": 0, "t": "In practice, it's almost impossible for a human to specify all the edge cases."}, {"k": "li", "lvl": 0, "t": "Disappointment in expert systems (late 80s / early 90s) led to an “AI Winter”."}]}, {"id": "l1a-018", "n": 18, "title": "Object Detection with ML", "blocks": [{"k": "li", "lvl": 0, "t": "The machine learning approach is to teach a computer how to do detection by showing it many examples of different objects."}, {"k": "li", "lvl": 0, "t": "No manual programming is needed: the computer learns what defines a pedestrian or a car on its own!"}, {"k": "pic", "w": 1200, "h": 345, "wide": 0.9616978923479717, "a": "mlp-l1-7.webp", "x": 0, "y": 1564, "sw": 1425, "sh": 3996}]}, {"id": "l1a-019", "n": 19, "title": "Improve with Experience", "blocks": [{"k": "pic", "w": 1200, "h": 649, "wide": 0.824843696753184, "a": "mlp-l1-3.webp", "x": 0, "y": 2746, "sw": 1202, "sh": 4029}]}, {"id": "l1a-020", "n": 20, "title": "Interesting.. But why?", "blocks": [{"k": "li", "lvl": 0, "t": "It is very hard to write programs that solve problems like recognizing an object or a handwritten digit"}, {"k": "li", "lvl": 1, "t": "What distinguishes a 2 from a 7? A cycle from a motor-cycle?"}, {"k": "li", "lvl": 1, "t": "How does our brain do it?"}, {"k": "li", "lvl": 0, "t": "Instead of writing a program by hand, we collect examples that specify the correct output for a given input"}, {"k": "li", "lvl": 1, "t": "A machine learning algorithm then takes these examples and produces a program that does the job"}, {"k": "li", "lvl": 0, "t": "The program produced by the learning algorithm may look very different from a typical hand-written program."}, {"k": "li", "lvl": 1, "t": "It may contain millions of numbers."}, {"k": "li", "lvl": 1, "t": "If we do it right, the program works for new cases as well as the ones we trained it on.20"}]}, {"id": "l1a-021", "n": 21, "title": "When to use?", "blocks": [{"k": "li", "lvl": 0, "t": "ML is used when:"}, {"k": "li", "lvl": 1, "t": "Human expertise does not exist (navigating on Mars)"}, {"k": "li", "lvl": 1, "t": "Humans can’t explain their expertise (speech recognition)"}, {"k": "li", "lvl": 1, "t": "Models must be customized (personalized medicine)"}, {"k": "li", "lvl": 1, "t": "Models are based on huge amounts of data (genomics)"}, {"k": "pic", "w": 1200, "h": 277, "wide": 0.6458333333333334, "a": "mlp-l1-7.webp", "x": 0, "y": 2917, "sw": 1425, "sh": 3996}, {"k": "li", "lvl": 0, "t": "Learning isn’t always useful:"}, {"k": "li", "lvl": 1, "t": "There is no need to “learn” to calculate payroll"}]}, {"id": "l1a-022", "n": 22, "title": "More Tasks that are best solved by ML", "blocks": [{"k": "li", "lvl": 0, "t": "Recognizing patterns:"}, {"k": "li", "lvl": 1, "t": "Facial identities or facial expressions"}, {"k": "li", "lvl": 1, "t": "Handwritten or spoken words"}, {"k": "li", "lvl": 1, "t": "Medical images"}, {"k": "li", "lvl": 0, "t": "Generating patterns:"}, {"k": "li", "lvl": 1, "t": "Generating images or motion sequences"}, {"k": "li", "lvl": 0, "t": "Recognizing anomalies:"}, {"k": "li", "lvl": 1, "t": "Unusual credit card transactions"}, {"k": "li", "lvl": 1, "t": "Unusual patterns of sensor readings in a nuclear power plant"}, {"k": "li", "lvl": 0, "t": "Prediction:"}, {"k": "li", "lvl": 1, "t": "Future stock prices or currency exchange rates"}]}, {"id": "l1a-023", "n": 23, "title": "ML vs Statistics", "blocks": [{"k": "side", "text": [{"k": "li", "lvl": 0, "t": "Both statistics and machine learning aim to “detect patterns in data” by building predictive models."}, {"k": "li", "lvl": 0, "t": "Statistics: use this as a tool to learn something about the world (statistical inference)."}, {"k": "li", "lvl": 1, "t": "Focus on simple, interpretable models."}, {"k": "li", "lvl": 1, "t": "Develop theoretical analysis, work out statistical guarantees under some assumptions."}, {"k": "li", "lvl": 0, "t": "Machine learning: use this as a tool to actually make useful predictions."}, {"k": "li", "lvl": 1, "t": "Focus on complicated, competitive models."}, {"k": "li", "lvl": 1, "t": "Use large datasets. Be pragmatic. Give up on inference."}], "pics": [{"k": "pic", "w": 762, "h": 862, "a": "mlp-l1-1.webp", "x": 758, "y": 1803, "sw": 1522, "sh": 3518}]}]}, {"id": "l1a-024", "n": 24, "title": "Why the boom?", "blocks": [{"k": "side", "text": [{"k": "li", "lvl": 0, "t": "Three main reasons:"}, {"k": "li", "lvl": 1, "t": "Computational Power"}, {"k": "li", "lvl": 1, "t": "Powerful Programming Frameworks"}, {"k": "li", "lvl": 1, "t": "Big Data available and growing"}, {"k": "li", "lvl": 1, "t": "Money and People"}], "pics": [{"k": "pic", "w": 756, "h": 864, "a": "mlp-l1-1.webp", "x": 0, "y": 1803, "sw": 1522, "sh": 3518}]}]}, {"id": "l1a-025", "n": 25, "title": "But also, with Limitations", "blocks": [{"k": "li", "lvl": 0, "t": "Model trained from data: as biased as the data itself"}, {"k": "li", "lvl": 1, "t": "Facial recognition systems works less well on minorities"}, {"k": "li", "lvl": 1, "t": "CV rating systems learn socio-economic biases"}, {"k": "li", "lvl": 0, "t": "Predictive model may fail on slightly perturbated input"}, {"k": "li", "lvl": 0, "t": "Non robust, hence non deployable"}, {"k": "li", "lvl": 0, "t": "As of today!"}]}, {"id": "l1a-026", "n": 26, "title": "Three Approaches to Machine Learning", "blocks": []}, {"id": "l1a-027", "n": 27, "title": "Three Types of Learning", "blocks": [{"k": "pic", "w": 1200, "h": 849, "wide": 0.653947909673055, "a": "mlp-l1-1.webp", "x": 0, "y": 2669, "sw": 1522, "sh": 3518}]}, {"id": "l1a-028", "n": 28, "title": "Supervised Learning: We Know The Truth", "blocks": [{"k": "p", "t": "1. First, we collect a dataset of labeled training examples."}, {"k": "p", "t": "2. We train a model to output accurate predictions on this dataset."}, {"k": "p", "t": "3. When the model sees new, similar data, it will also be accurate."}, {"k": "pic", "w": 1200, "h": 332, "wide": 0.9613749980926514, "a": "mlp-l1-7.webp", "x": 0, "y": 2249, "sw": 1425, "sh": 3996}]}, {"id": "l1a-029", "n": 29, "title": "Supervised Learning: House Prices", "blocks": [{"k": "p", "t": "Consider a simple dataset for supervised learning: house prices in Boston."}, {"k": "li", "lvl": 0, "t": "Each datapoint is a house."}, {"k": "li", "lvl": 0, "t": "We know its price and the neighborhood’s education level"}, {"k": "pic", "w": 1200, "h": 471, "wide": 0.7993750015894572, "a": "mlp-l1-6.webp", "x": 0, "y": 0, "sw": 1202, "sh": 4126}]}, {"id": "l1a-030", "n": 30, "title": "Supervised Learning: The Algorithm", "blocks": [{"k": "p", "t": "We can use this dataset of examples to fit a supervised learning model."}, {"k": "li", "lvl": 0, "t": "The model maps input 𝑥(the education level) to output a 𝑦 (the house price)."}, {"k": "li", "lvl": 0, "t": "It learns the mapping from our dataset of examples (𝑥, 𝑦)."}, {"k": "pic", "w": 1200, "h": 446, "wide": 0.834343691666921, "a": "mlp-l1-6.webp", "x": 0, "y": 2339, "sw": 1202, "sh": 4126}]}, {"id": "l1a-031", "n": 31, "title": "More Features? Better but More Complex", "blocks": [{"k": "pic", "w": 1200, "h": 624, "wide": 0.8110937754313151, "a": "mlp-l1-4.webp", "x": 0, "y": 630, "sw": 1202, "sh": 3668}]}, {"id": "l1a-032", "n": 32, "title": "Key Characteristics of Supervised Learning:", "blocks": [{"k": "p", "t": "1. Labeled Data: Supervised learning requires a dataset where each example is labeled with the correct answer."}, {"k": "p", "t": "2. Training Phase: During training, the algorithm learns the mapping from input features to the desired output by minimizing a loss function that measures the difference between predicted and actual outputs."}, {"k": "p", "t": "3. Evaluation: The model's performance is evaluated on a separate test set to assess its ability to generalize to new, unseen data."}]}, {"id": "l1a-033", "n": 33, "title": "Supervised ML: Regression vs Classification", "blocks": [{"k": "p", "t": "Sometimes we are interested in classification"}, {"k": "li", "lvl": 0, "t": "Regression: if y ∈ ℝ is a continuous variable, e.g., price prediction."}, {"k": "li", "lvl": 0, "t": "Classification: the label is a discrete variable, e.g., predicting the types of residence"}, {"k": "pic", "w": 1200, "h": 479, "wide": 0.7269792238871257, "a": "mlp-l1-5.webp", "x": 0, "y": 2122, "sw": 1202, "sh": 4029}]}, {"id": "l1a-034", "n": 34, "title": "", "blocks": [{"k": "pic", "w": 1200, "h": 684, "wide": 0.6553021272023519, "a": "mlp-l1-3.webp", "x": 0, "y": 1404, "sw": 1202, "sh": 4029}, {"k": "p", "t": "https://www.javatpoint.com/regression-vs-classification-in-machine-learning"}]}, {"id": "l1a-035", "n": 35, "title": "Unsupervised Learning", "blocks": [{"k": "p", "t": "Here, we have a dataset without labels. Our goal is to learn something interesting about the structure of the data:"}, {"k": "li", "lvl": 0, "t": "Clusters hidden in the dataset."}, {"k": "li", "lvl": 0, "t": "Outliers: particularly unusual and/or interesting datapoints."}, {"k": "li", "lvl": 0, "t": "Useful signal hidden in noise, e.g., human speech over a noisy phone."}, {"k": "pic", "w": 1200, "h": 446, "wide": 0.6458333015441895, "a": "mlp-l1-6.webp", "x": 0, "y": 2787, "sw": 1202, "sh": 4126}]}, {"id": "l1a-036", "n": 36, "title": "Unsupervised Learning", "blocks": [{"k": "p", "t": "We can use this dataset of examples to fit an unsupervised learning model."}, {"k": "li", "lvl": 0, "t": "The model defines a probability distribution over the inputs."}, {"k": "li", "lvl": 0, "t": "The probability distribution identifies multiple components (multiple peaks)."}, {"k": "li", "lvl": 0, "t": "The components indicate structure in the data."}, {"k": "pic", "w": 1200, "h": 462, "wide": 0.831781276067098, "a": "mlp-l1-6.webp", "x": 0, "y": 1415, "sw": 1202, "sh": 4126}]}, {"id": "l1a-037", "n": 37, "title": "Reinforcement Learning", "blocks": [{"k": "li", "lvl": 0, "t": "In reinforcement learning, an agent is interacting with the world over time."}, {"k": "li", "lvl": 1, "t": "The agent is taught good behavior through rewards"}, {"k": "li", "lvl": 2, "t": "the better its behavior, the higher its rewards."}, {"k": "pic", "w": 1094, "h": 591, "wide": 0.5696249961853027, "a": "mlp-l1-4.webp", "x": 0, "y": 2489, "sw": 1202, "sh": 3668}, {"k": "li", "lvl": 0, "t": "Applications include:"}, {"k": "li", "lvl": 1, "t": "Play games such as Chess or Go."}, {"k": "li", "lvl": 1, "t": "Control the cooling systems."}, {"k": "li", "lvl": 1, "t": "Designing new drug compounds."}]}, {"id": "l1a-038", "n": 38, "title": "Many Applications in all Three Tracks", "blocks": [{"k": "pic", "w": 1200, "h": 788, "wide": 0.7071770826975504, "a": "mlp-l1-2.webp", "x": 0, "y": 2504, "sw": 1202, "sh": 4063}]}, {"id": "l1a-039", "n": 39, "title": "Which one is More Important?", "blocks": [{"k": "side", "text": [{"k": "big", "t": "Yann LeCun: “Most of human and animal"}, {"k": "big", "t": "learning is unsupervised learning. If"}, {"k": "big", "t": "intelligence was a cake, unsupervised"}, {"k": "big", "t": "learning would be the cake, supervised"}, {"k": "big", "t": "learning would be the icing on the cake, and"}, {"k": "big", "t": "reinforcement learning would be the cherry"}, {"k": "big", "t": "on the cake.”"}], "pics": [{"k": "pic", "w": 504, "h": 478, "a": "mlp-l1-5.webp", "x": 0, "y": 2603, "sw": 1202, "sh": 4029}]}]}, {"id": "l1a-040", "n": 40, "title": "Is this AI? What is Deep Learning?", "blocks": []}, {"id": "l1a-041", "n": 41, "title": "AI, ML and DL", "blocks": [{"k": "li", "lvl": 0, "t": "AI is about building machines that exhibit intelligence."}, {"k": "li", "lvl": 0, "t": "ML enables machines to learn from experience, a useful tool for AI."}, {"k": "li", "lvl": 0, "t": "Deep learning focuses on a family of learning algorithms loosely inspired by the brain."}, {"k": "pic", "w": 1200, "h": 654, "wide": 0.638031276067098, "a": "mlp-l1-3.webp", "x": 0, "y": 2090, "sw": 1202, "sh": 4029}]}, {"id": "l1a-042", "n": 42, "title": "Let’s Go Deep?", "blocks": [{"k": "p", "t": "2017 Kaggle survey of data science and ML practitioners: what data science methods do you use at work?"}, {"k": "pic", "w": 1186, "h": 769, "wide": 0.6178749402364095, "a": "mlp-l1-2.webp", "x": 0, "y": 3294, "sw": 1202, "sh": 4063}]}, {"id": "l1a-043", "n": 43, "title": "Okay Let’s Just Code?", "blocks": [{"k": "li", "lvl": 0, "t": "Yes indeed there is a lot of ready-made programming frameworks: PyTorch, TensorFlow, Theano, Scikit-Learn, etc."}, {"k": "li", "lvl": 1, "t": "Automatic differentiation"}, {"k": "li", "lvl": 1, "t": "compiling computation graphs"}, {"k": "li", "lvl": 1, "t": "libraries of algorithms and network primitives"}, {"k": "li", "lvl": 1, "t": "support for graphics processing units (GPUs)"}, {"k": "li", "lvl": 0, "t": "Why take the theory if these frameworks do so much for you?"}, {"k": "li", "lvl": 1, "t": "So you know what to do if something goes wrong!"}, {"k": "li", "lvl": 1, "t": "Debugging learning algorithms requires sophisticated detective work, which requires understanding what goes on beneath the hood."}, {"k": "li", "lvl": 1, "t": "That is why we also derive things by hand in this class!"}]}, {"id": "l1a-044", "n": 44, "title": "About this Course", "blocks": []}, {"id": "l1a-045", "n": 45, "title": "Pre-requisite", "blocks": [{"k": "li", "lvl": 0, "t": "Probability"}, {"k": "li", "lvl": 0, "t": "Linear Algebra"}, {"k": "li", "lvl": 0, "t": "Python Programming"}, {"k": "pic", "w": 1200, "h": 252, "wide": 0.7809582869211833, "a": "mlp-l1-7.webp", "x": 0, "y": 3744, "sw": 1425, "sh": 3996}]}, {"id": "l1a-046", "n": 46, "title": "Teaching Approach", "blocks": [{"k": "li", "lvl": 0, "t": "We do both theory and practice side by side"}, {"k": "li", "lvl": 1, "t": "Mathematics and Programming are equally important"}, {"k": "li", "lvl": 1, "t": "We will cover a broad toolset of core algorithms from many different subfields of ML."}, {"k": "li", "lvl": 1, "t": "We will emphasize applications and show how to implement and apply algorithms via examples and exercises."}, {"k": "li", "lvl": 0, "t": "Why are we following this approach?"}, {"k": "li", "lvl": 1, "t": "Applying machine learning is among the most in demand industry skills right now."}, {"k": "li", "lvl": 1, "t": "There can be a gap between theory and practice, especially in modern machine learning."}, {"k": "li", "lvl": 1, "t": "Often, the best way of understanding how an algorithm works is to implement it."}, {"k": "li", "lvl": 0, "t": "Warning: This is not a very difficult course, but it has a lot of content."}, {"k": "li", "lvl": 1, "t": "To be successful, you need to work hard."}, {"k": "li", "lvl": 1, "t": "For example, don't start working on your homework assignments just two days before the deadline."}]}, {"id": "l1a-047", "n": 47, "title": "Main Topics", "blocks": [{"k": "li", "lvl": 0, "t": "We cover almost all machine learning concepts and algorithms. Topics Include:"}, {"k": "li", "lvl": 1, "t": "Supervised Learning"}, {"k": "li", "lvl": 2, "t": "Linear and Logistic Regression"}, {"k": "li", "lvl": 2, "t": "Generative Models"}, {"k": "li", "lvl": 2, "t": "Kernel Methods"}, {"k": "li", "lvl": 2, "t": "Decision Trees and Ensemble Learning"}, {"k": "li", "lvl": 1, "t": "Unsupervised Learning"}, {"k": "li", "lvl": 2, "t": "Clustering"}, {"k": "li", "lvl": 2, "t": "Anomaly detection"}, {"k": "li", "lvl": 2, "t": "Dimensionality Reduction and PCA"}, {"k": "li", "lvl": 1, "t": "Overview of Reinforcement Learning"}]}, {"id": "l1a-048", "n": 48, "title": "Course Grading Scheme", "blocks": [{"k": "pic", "w": 1200, "h": 586, "wide": 0.6300625006357828, "a": "mlp-l1-4.webp", "x": 0, "y": 3082, "sw": 1202, "sh": 3668}, {"k": "p", "t": "While attendance does not factor into your grade, an attendance rate of less than 75% means that you will automatically fail the course."}]}, {"id": "l1a-049", "n": 49, "title": "Course Logistics", "blocks": [{"k": "p", "t": "Assignments"}, {"k": "li", "lvl": 0, "t": "You will have weekly assignments"}, {"k": "li", "lvl": 0, "t": "Assignments should reflect each student’s individual work"}, {"k": "li", "lvl": 0, "t": "Late submissions will receive a penalty of 10% per day, for a maximum of 3 days after which submissions will not be allowed"}, {"k": "p", "t": "Project"}, {"k": "li", "lvl": 0, "t": "We start directly after the midterms. Probably two groups"}, {"k": "li", "lvl": 0, "t": "Start thinking already about an idea. Try to be creative!"}, {"k": "p", "t": "The Final"}, {"k": "li", "lvl": 1, "t": "Even though the final is worth 25% of your total grade, you risk failing the course if you score below 40% on the final"}, {"k": "p", "t": "Lab Sheets"}, {"k": "li", "lvl": 0, "t": "Only problems solved during lab time will be graded"}]}, {"id": "l1a-050", "n": 50, "title": "Course Instructors and References", "blocks": [{"k": "p", "t": "Instructors:"}, {"k": "li", "lvl": 0, "t": "Dr. Laila Hesham– Associate Professor at the School of IT Director of Applied and Computational Mathematics (laila.hesham@ngu.edu.eg)"}, {"k": "p", "t": "Textbooks:"}, {"k": "li", "lvl": 0, "t": "The Elements of Statistical Learning, Trevor Hastie, 2nd edition."}, {"k": "li", "lvl": 0, "t": "Hands-On Machine Learning, Aurélien Géron, 2nd edition. Online Courses:"}, {"k": "li", "lvl": 0, "t": "DataX @ UC Berkeley"}, {"k": "li", "lvl": 0, "t": "Applied Machine Learning, Cornell-Tech."}, {"k": "li", "lvl": 0, "t": "Machine Learning Specialization, Coursera."}, {"k": "li", "lvl": 0, "t": "Introduction to Machine Learning, Tübingen University."}]}, {"id": "l1a-051", "n": 51, "title": "What Comes Next?", "blocks": [{"k": "li", "lvl": 0, "t": "We will deal with supervised learning for regression and classification"}, {"k": "li", "lvl": 1, "t": "predicting labels 𝑦 based on features 𝑦, using patterns that we learned from labeled data."}, {"k": "li", "lvl": 0, "t": "First, we will go through fundamental concepts in supervised ML using Linear Regression as a start:"}, {"k": "li", "lvl": 1, "t": "What kind of \"data\" do we learn from?"}, {"k": "li", "lvl": 1, "t": "How can we formalize the goal of learning?"}, {"k": "li", "lvl": 1, "t": "What is a \"prediction model\"?"}, {"k": "li", "lvl": 1, "t": "How can we quantify \"predictive performance\"?"}, {"k": "li", "lvl": 1, "t": "What is a \"learning algorithm\""}, {"k": "li", "lvl": 1, "t": "How can we operationalize learning?"}]}, {"id": "l1a-052", "n": 52, "title": "", "blocks": [{"k": "pic", "w": 1200, "h": 472, "wide": 0.9716444666186969, "a": "mlp-l1-5.webp", "x": 0, "y": 3083, "sw": 1202, "sh": 4029}]}, {"id": "l1b-001", "n": 1, "title": "CSAI 420: Machine Learning", "blocks": [{"k": "pics", "items": [{"k": "pic", "w": 208, "h": 176, "wide": 0.10833333532015482, "_y": 55.04998779296875, "a": "mlp-l1-8.webp", "x": 869, "y": 227, "sw": 1370, "sh": 649}, {"k": "pic", "w": 221, "h": 225, "wide": 0.11489696502685547, "a": "mlp-l1-8.webp", "x": 0, "y": 0, "sw": 1370, "sh": 649}]}, {"k": "p", "t": "01b – Supervised Learning"}]}, {"id": "l1b-002", "n": 2, "title": "Three Approaches to Machine Learning", "blocks": []}, {"id": "l1b-003", "n": 3, "title": "Three Types of Learning", "blocks": [{"k": "pic", "w": 1200, "h": 849, "wide": 0.653947909673055, "a": "mlp-l1-2.webp", "x": 0, "y": 0, "sw": 1202, "sh": 4063}]}, {"id": "l1b-004", "n": 4, "title": "Supervised Learning: We Know The Truth", "blocks": [{"k": "p", "t": "1. First, we collect a dataset of labeled training examples."}, {"k": "p", "t": "2. We train a model to output accurate predictions on this dataset."}, {"k": "p", "t": "3. When the model sees new, similar data, it will also be accurate."}, {"k": "pic", "w": 1200, "h": 332, "wide": 0.9613749980926514, "a": "mlp-l1-7.webp", "x": 0, "y": 2583, "sw": 1425, "sh": 3996}]}, {"id": "l1b-005", "n": 5, "title": "Supervised Learning: House Prices", "blocks": [{"k": "p", "t": "Consider a simple dataset for supervised learning: house prices in Boston."}, {"k": "li", "lvl": 0, "t": "Each datapoint is a house."}, {"k": "li", "lvl": 0, "t": "We know its price and the neighborhood’s education level"}, {"k": "pic", "w": 1200, "h": 471, "wide": 0.7993750015894572, "a": "mlp-l1-6.webp", "x": 0, "y": 473, "sw": 1202, "sh": 4126}]}, {"id": "l1b-006", "n": 6, "title": "Supervised Learning: The Algorithm", "blocks": [{"k": "p", "t": "We can use this dataset of examples to fit a supervised learning model."}, {"k": "li", "lvl": 0, "t": "The model maps input 𝑥(the education level) to output a 𝑦 (the house price)."}, {"k": "li", "lvl": 0, "t": "It learns the mapping from our dataset of examples (𝑥, 𝑦)."}, {"k": "pic", "w": 1200, "h": 446, "wide": 0.834343691666921, "a": "mlp-l1-6.webp", "x": 0, "y": 3235, "sw": 1202, "sh": 4126}]}, {"id": "l1b-007", "n": 7, "title": "Supervised Learning", "blocks": []}, {"id": "l1b-008", "n": 8, "title": "Predicting Diabetes Risk", "blocks": [{"k": "li", "lvl": 0, "t": "Let’s start with a simple example of a supervised learning problem: predicting diabetes risk."}, {"k": "li", "lvl": 0, "t": "Suppose we have a dataset of diabetes patients."}, {"k": "li", "lvl": 1, "t": "For each patient we have access to measurements from their medical record and an estimate of diabetes risk."}, {"k": "li", "lvl": 1, "t": "We are interested in understanding how the measurements affect an individual's diabetes risk."}, {"k": "li", "lvl": 0, "t": "At a high level, a supervised machine learning problem has the following structure:"}, {"k": "pic", "w": 859, "h": 117, "wide": 0.44770833651224773, "a": "mlp-l1-8.webp", "x": 0, "y": 413, "sw": 1370, "sh": 649}, {"k": "li", "lvl": 1, "t": "The predictive model is chosen to model the relationship between inputs and targets. For instance, it can predict future targets."}]}, {"id": "l1b-009", "n": 9, "title": "UCI Diabetes Dataset", "blocks": [{"k": "p", "t": "We will use the UCI Diabetes Dataset; it's a toy dataset that's often used to demonstrate machine learning algorithms."}, {"k": "li", "lvl": 0, "t": "For each patient we have access to a measurement of their body mass index (BMI) and a quantitative diabetes risk score (from 0-400)."}, {"k": "li", "lvl": 0, "t": "We are interested in understanding how BMI affects an individual's diabetes risk."}, {"k": "pics", "items": [{"k": "pic", "w": 477, "h": 458, "wide": 0.24877084096272786, "_y": 252.15899658203125, "a": "mlp-l1-6.webp", "x": 0, "y": 1879, "sw": 1202, "sh": 4126}, {"k": "pic", "w": 1136, "h": 562, "wide": 0.5918125152587891, "a": "mlp-l1-5.webp", "x": 0, "y": 0, "sw": 1202, "sh": 4029}]}]}, {"id": "l1b-010", "n": 10, "title": "Visualizing the Dataset in 2D", "blocks": [{"k": "pic", "w": 1200, "h": 696, "wide": 0.8002916812896729, "a": "mlp-l1-3.webp", "x": 0, "y": 706, "sw": 1202, "sh": 4029}]}, {"id": "l1b-011", "n": 11, "title": "What is the Relationship?", "blocks": [{"k": "p", "t": "What is the relationship between BMI and diabetes risk?"}, {"k": "li", "lvl": 0, "t": "We could assume that risk is a linear function of BMI."}, {"k": "li", "lvl": 0, "t": "In other words, for some unknown 𝜃0, 𝜃1 ∈𝑅, we have 𝑦= 𝜃1 ⋅𝑥+ 𝜃0,"}, {"k": "li", "lvl": 1, "t": "where 𝑥 is the BMI (also called the dependent variable),"}, {"k": "li", "lvl": 1, "t": "and 𝑦 is the diabetes risk score (the independent variable)."}, {"k": "li", "lvl": 0, "t": "Note that 𝜃1, 𝜃0 are the slope and the intercept of the line relates 𝑥 to 𝑦."}, {"k": "li", "lvl": 1, "t": "We call them parameters."}]}, {"id": "l1b-012", "n": 12, "title": "Let’s try some linear models?", "blocks": [{"k": "pic", "w": 1200, "h": 618, "wide": 0.901906297604243, "a": "mlp-l1-4.webp", "x": 0, "y": 1256, "sw": 1202, "sh": 3668}]}, {"id": "l1b-013", "n": 13, "title": "Can we find the best one?", "blocks": [{"k": "li", "lvl": 0, "t": "Assuming that 𝑥 and 𝑦 follow the above linear relationship,"}, {"k": "li", "lvl": 1, "t": "the goal of the supervised learning algorithm is to find a good set of parameters consistent with the data."}, {"k": "li", "lvl": 1, "t": "We will see many algorithms for this task. For now, let's call the 𝑠𝑘𝑙𝑒𝑎𝑟𝑛. 𝑙𝑖𝑛𝑒𝑎𝑟_𝑚𝑜𝑑𝑒𝑙 library to find a 𝜃1 𝑎𝑛𝑑 𝜃0 that fit the data well."}, {"k": "pic", "w": 1200, "h": 277, "wide": 0.9442208329836528, "a": "mlp-l1-7.webp", "x": 0, "y": 3196, "sw": 1425, "sh": 3996}]}, {"id": "l1b-014", "n": 14, "title": "Our “best” linear model", "blocks": [{"k": "pic", "w": 1200, "h": 611, "wide": 0.9003645817438761, "a": "mlp-l1-4.webp", "x": 0, "y": 1876, "sw": 1202, "sh": 3668}]}, {"id": "l1b-015", "n": 15, "title": "Now Predictions", "blocks": [{"k": "li", "lvl": 0, "t": "Given a new dataset of patients with a known BMI, we can use this model to estimate their diabetes risk."}, {"k": "li", "lvl": 1, "t": "Given a new 𝑥̂, we can output a predicted 𝑦̂ as 𝑦̂= 𝑓𝑥̂= 𝜃1 ⋅𝑥̂+ 𝜃0"}, {"k": "li", "lvl": 1, "t": "Let's start by loading more data. We will load three new patients (shown in red below) that we haven't seen before."}, {"k": "li", "lvl": 1, "t": "Our linear model provides an estimate of the diabetes risk for these patients."}, {"k": "pic", "w": 1200, "h": 443, "wide": 0.7273332913716634, "a": "mlp-l1-6.webp", "x": 0, "y": 3683, "sw": 1202, "sh": 4126}]}, {"id": "l1b-016", "n": 16, "title": "Okay, so how does it work?", "blocks": []}, {"id": "l1b-017", "n": 17, "title": "Let’s first generalize", "blocks": [{"k": "li", "lvl": 0, "t": "We are going to dive deeper into what's a supervised learning dataset. As an example, consider the full version of the UCI Diabetes Dataset seen earlier."}, {"k": "li", "lvl": 0, "t": "Previously, we only looked at the patients' BMI, but this dataset actually records many additional measurements."}, {"k": "li", "lvl": 0, "t": "The data we deal with in supervised learning usually consists of observations on different aspects of objects"}, {"k": "li", "lvl": 1, "t": "The UCI dataset contains many additional data columns besides bmi, including age, sex, and blood pressure."}, {"k": "li", "lvl": 1, "t": "We can ask 𝑠𝑘𝑙𝑒𝑎𝑟𝑛 to give us more information about this dataset."}]}, {"id": "l1b-018", "n": 18, "title": "The Diabetes Dataset", "blocks": [{"k": "pic", "w": 1200, "h": 541, "wide": 0.9833331987261772, "a": "mlp-l1-5.webp", "x": 0, "y": 564, "sw": 1202, "sh": 4029}]}, {"id": "l1b-019", "n": 19, "title": "The Diabetes Dataset", "blocks": [{"k": "li", "lvl": 0, "t": "We say that a training dataset of size n (e.g., n patients) is a set 𝐷= {(𝑥𝑖, 𝑦(𝑖)) ∣𝑖= 1,2, … , 𝑛}"}, {"k": "li", "lvl": 1, "t": "Each 𝑥𝑖 denotes an input (e.g., the measurements for patient 𝑖),"}, {"k": "li", "lvl": 1, "t": "and each 𝑦𝑖∈𝑌 is a target (e.g., the diabetes risk)."}, {"k": "li", "lvl": 1, "t": "Together, (𝑥𝑖, 𝑦𝑖) form a training example."}, {"k": "pic", "w": 1200, "h": 267, "wide": 0.9637916862964631, "a": "mlp-l1-7.webp", "x": 0, "y": 3475, "sw": 1425, "sh": 3996}]}, {"id": "l1b-020", "n": 20, "title": "Dataset Inputs and Attributes", "blocks": [{"k": "li", "lvl": 0, "t": "More precisely, an input 𝑥(𝑖) ∈𝑋 is a 𝑑-dimensional vector of the form"}, {"k": "pic", "w": 482, "h": 111, "wide": 0.2514346440633138, "a": "mlp-l1-8.webp", "x": 862, "y": 532, "sw": 1370, "sh": 649}, {"k": "li", "lvl": 1, "t": "In our example, it is the measurements values of the 𝑑 features for patient 𝑖."}, {"k": "li", "lvl": 1, "t": "The set 𝑋 is called the feature space. Often, we have, 𝑋= ℝ𝑑."}, {"k": "li", "lvl": 0, "t": "We refer to the numerical variables describing the patient as attributes. Examples of attributes include:"}, {"k": "li", "lvl": 1, "t": "The age of a patient."}, {"k": "li", "lvl": 1, "t": "The patient's gender."}, {"k": "li", "lvl": 1, "t": "The patient's BMI."}, {"k": "li", "lvl": 1, "t": "Note that these attributes in the above example have been mean-centered at zero and re-scaled to have a variance of one."}]}, {"id": "l1b-021", "n": 21, "title": "Dataset Features", "blocks": [{"k": "li", "lvl": 0, "t": "Often, an input object has many attributes, and we want to use these attributes to define more complex descriptions of the input."}, {"k": "li", "lvl": 1, "t": "Is the patient old and a man? (Useful if old men are at risk)."}, {"k": "li", "lvl": 1, "t": "Is the BMI above the obesity threshold?"}, {"k": "li", "lvl": 1, "t": "We call these custom attributes features."}, {"k": "li", "lvl": 1, "t": "Let's create an \"old man\" feature."}, {"k": "li", "lvl": 0, "t": "In practice, the terms attribute and features are often used interchangeably. Most authors refer to 𝑥(𝑖) as a vector of features (i.e., they've been precomputed)."}, {"k": "li", "lvl": 1, "t": ""}, {"k": "li", "lvl": 1, "t": "We will follow this convention and use attribute only when there is ambiguity between features and attributes."}, {"k": "pic", "w": 1200, "h": 336, "wide": 0.7762072324752808, "a": "mlp-l1-7.webp", "x": 0, "y": 1911, "sw": 1425, "sh": 3996}]}, {"id": "l1b-022", "n": 22, "title": "Attribute Types", "blocks": [{"k": "li", "lvl": 0, "t": "Both features and attribute variables may be of different data types"}, {"k": "li", "lvl": 1, "t": "Numerical variables can have values in ℝ"}, {"k": "li", "lvl": 1, "t": "Integer variables can have values in ℤ"}, {"k": "li", "lvl": 1, "t": "Categorical variables can have values in {𝐶1, ⋯, 𝐶𝑔}"}, {"k": "li", "lvl": 1, "t": "Binary variables can have values in 0,1"}, {"k": "li", "lvl": 0, "t": "Most learning algorithms can only deal with numerical features"}, {"k": "li", "lvl": 1, "t": "although there are some exceptions (e.g., decision trees can use integers and categoricals without problems)."}, {"k": "li", "lvl": 1, "t": "For other feature types, we usually have to pick or create an appropriate encoding."}, {"k": "li", "lvl": 1, "t": "If not stated otherwise, we assume numerical features."}]}, {"id": "l1b-023", "n": 23, "title": "Classification vs Regression", "blocks": [{"k": "li", "lvl": 0, "t": "We distinguish between two broad types of supervised learning problems that differ in the form of the target variable."}, {"k": "li", "lvl": 1, "t": "Regression: The target variable 𝑦 is continuous. We are fitting a curve in a high- dimensional feature space that approximates the shape of the dataset."}, {"k": "li", "lvl": 1, "t": "Classification: The target variable 𝑦 is discrete. Each discrete value corresponds to a class and we are looking for a hyperplane that separates the different classes."}, {"k": "pic", "w": 1155, "h": 519, "wide": 0.6013854503631592, "a": "mlp-l1-5.webp", "x": 0, "y": 1107, "sw": 1202, "sh": 4029}]}, {"id": "l1b-024", "n": 24, "title": "Why Learning?", "blocks": [{"k": "li", "lvl": 0, "t": "Learning to predict"}, {"k": "li", "lvl": 1, "t": "In such a case we potentially do not care how our model is structured or whether we can understand it."}, {"k": "li", "lvl": 1, "t": "Example: predicting how a stock price will develop."}, {"k": "li", "lvl": 1, "t": "Simply being able to use the predictor on new data is of direct benefit to us."}, {"k": "li", "lvl": 0, "t": "Learning to explain."}, {"k": "li", "lvl": 1, "t": "Here, our model is only a means to a better understanding of the inherent relationship in the data."}, {"k": "li", "lvl": 1, "t": "Example: understanding which risk factors influence the probability to get a certain disease."}, {"k": "li", "lvl": 1, "t": "We might not use the learned model on new observations, but rather discuss its implications, in a scientific or social context."}, {"k": "li", "lvl": 0, "t": "While ML was traditionally more interested in the former, classical statistics addressed the latter. In many tasks nowadays both are relevant – to different degrees."}]}, {"id": "l1b-025", "n": 25, "title": "The Learning Algorithm", "blocks": [{"k": "li", "lvl": 0, "t": "We can also define the high-level structure of a supervised learning algorithm as consisting of three components:"}, {"k": "li", "lvl": 1, "t": "A model class: the set of possible models we consider."}, {"k": "li", "lvl": 1, "t": "An objective function, which defines how good a model is."}, {"k": "li", "lvl": 1, "t": "An optimizer, which finds the best predictive model in the model class according to the objective function"}, {"k": "li", "lvl": 0, "t": "We'll say that a model is a function 𝑓: 𝑋→𝑌 that maps inputs 𝑥∈𝑋 to targets 𝑦∈𝑌."}, {"k": "li", "lvl": 1, "t": "Often, models have parameters 𝜃∈Θ living in a set Θ."}, {"k": "li", "lvl": 1, "t": "We will then write the model as 𝑓𝜃: 𝑋→𝑌 to denote that it's parametrized by 𝜃."}, {"k": "li", "lvl": 1, "t": "𝑓𝜃 is meant to capture intrinsic patterns of the data"}, {"k": "li", "lvl": 2, "t": "the underlying assumption being that these hold true for all data"}]}, {"id": "l1b-026", "n": 26, "title": "The Model", "blocks": [{"k": "li", "lvl": 0, "t": "Formally, the model class is a set 𝑀⊆{𝑓∣𝑓: 𝑋→𝑌} of possible models that map input features to targets."}, {"k": "li", "lvl": 0, "t": "When the models 𝑓𝜃 are parametrized by parameters 𝜃∈Θ living in some set Θ."}, {"k": "li", "lvl": 1, "t": "Thus, we can also write: 𝑀= {𝑓𝜃∣𝑓: 𝑋→𝑌; 𝜃∈Θ}."}, {"k": "li", "lvl": 1, "t": "Models can range from super simple (e.g., linear, tree stumps) to very complex (e.g., deep neural networks)"}, {"k": "li", "lvl": 1, "t": "and there are infinitely many choices how we can construct such functions."}, {"k": "li", "lvl": 1, "t": "we have to determine the class of our model a priori, thereby narrowing down our options considerably."}, {"k": "li", "lvl": 0, "t": "A good model will generalize well"}, {"k": "li", "lvl": 1, "t": "predict unseen examples correctly"}, {"k": "li", "lvl": 1, "t": "there is a tradeoff between expressiveness of a model class and the complexity of finding a good model"}]}, {"id": "l1b-027", "n": 27, "title": "The Model", "blocks": [{"k": "li", "lvl": 0, "t": "There exists a wealth a machine learning models, some more complex and expressive than others."}, {"k": "li", "lvl": 1, "t": "What are the implications of model complexity?"}, {"k": "li", "lvl": 1, "t": "How do we pick one model rather than another?"}, {"k": "pic", "w": 1200, "h": 492, "wide": 0.7602604230244955, "a": "mlp-l1-5.webp", "x": 0, "y": 1628, "sw": 1202, "sh": 4029}]}, {"id": "l1b-028", "n": 28, "title": "The Learner", "blocks": [{"k": "li", "lvl": 0, "t": "The algorithm for finding our 𝑓𝜃 is called the learner. It is also called learning algorithm or inducer."}, {"k": "li", "lvl": 1, "t": "The learner is our means of picking the best element from the model space for our data set."}, {"k": "li", "lvl": 1, "t": "Formally, it maps training data to a model."}, {"k": "li", "lvl": 1, "t": "Optimal parameters 𝜽 or function 𝑓𝜃 is returned for later usage."}, {"k": "li", "lvl": 0, "t": "When training a learner, we optimize over our model space, to find the function which matches our training data best."}, {"k": "li", "lvl": 1, "t": "This means, we are looking for a function, where the predicted output per training point is as close possible to the observed label."}, {"k": "li", "lvl": 1, "t": "To make this precise, we need to define now how we measure the difference between a prediction and a ground truth label pointwise."}, {"k": "li", "lvl": 1, "t": "This is when objective functions come into play!"}]}, {"id": "l1b-029", "n": 29, "title": "Objective Functions", "blocks": [{"k": "li", "lvl": 0, "t": "Now to find the best model, we define an objective function (also called a loss function) 𝐽(𝑓): 𝑀→[0, ∞),"}, {"k": "li", "lvl": 1, "t": "the extent to which 𝑓\"fits\" the data 𝐷= {(𝑥𝑖, 𝑦(𝑖)) ∣𝑖= 1,2, … , 𝑛}."}, {"k": "li", "lvl": 0, "t": "When f is parametrized by 𝜃∈Θ, the objective becomes a function 𝐽(𝜃): Θ →[0, ∞)."}, {"k": "li", "lvl": 0, "t": "Examples of some popular objective functions"}, {"k": "pic", "w": 1145, "h": 206, "wide": 0.5959730227788289, "a": "mlp-l1-8.webp", "x": 223, "y": 0, "sw": 1370, "sh": 649}]}, {"id": "l1b-030", "n": 30, "title": "Optimization", "blocks": [{"k": "li", "lvl": 0, "t": "At a high-level, an optimizer takes an objective 𝐽 and a model class 𝑀 and finds a model 𝑓∈𝑀 with the smallest value of the objective 𝐽. min 𝑓∈𝑀𝐽(𝑓)"}, {"k": "li", "lvl": 1, "t": "This is sometimes called empirical risk minimization (ERM)."}, {"k": "li", "lvl": 1, "t": "To solve this numerically, it depends on the model and its parameters."}, {"k": "li", "lvl": 1, "t": "Intuitively, this is the function that bests \"fits\" the data on the training dataset."}, {"k": "li", "lvl": 1, "t": "When 𝑓 is parametrized by 𝜃∈Θ,"}, {"k": "li", "lvl": 2, "t": "the optimizer minimizes a function 𝐽(𝜃) over all 𝜃∈Θ."}, {"k": "li", "lvl": 0, "t": "We will see that the 𝑠𝑘𝑙𝑒𝑎𝑟𝑛. 𝑙𝑖𝑛𝑒𝑎𝑟_𝑚𝑜𝑑𝑒𝑙𝑠. 𝐿𝑖𝑛𝑒𝑎𝑟𝑅𝑒𝑔𝑟𝑒𝑠𝑠𝑖𝑜𝑛 algorithm optimizes the MSE loss."}, {"k": "pic", "w": 657, "h": 184, "wide": 0.34229596455891925, "a": "mlp-l1-8.webp", "x": 0, "y": 227, "sw": 1370, "sh": 649}, {"k": "li", "lvl": 1, "t": "We can easily measure the quality of the fit on the training set and the test set."}]}, {"id": "l1b-031", "n": 31, "title": "Summary", "blocks": [{"k": "li", "lvl": 0, "t": "At a high level, a supervised machine learning problem has the following structure:"}, {"k": "pic", "w": 860, "h": 117, "wide": 0.4478333314259847, "a": "mlp-l1-8.webp", "x": 0, "y": 532, "sw": 1370, "sh": 649}, {"k": "li", "lvl": 1, "t": "The predictive model is chosen to model the relationship between inputs and targets. For instance, it can predict future targets."}, {"k": "li", "lvl": 0, "t": "A supervised learner is a program or an algorithm which:"}, {"k": "li", "lvl": 1, "t": "receives a training set and,"}, {"k": "li", "lvl": 1, "t": "for a given class of models,"}, {"k": "li", "lvl": 1, "t": "uses a cost function to evaluate different models on the data,"}, {"k": "li", "lvl": 1, "t": "then uses an optimization procedure to find the best model that minimizes the cost function."}]}, {"id": "l1b-032", "n": 32, "title": "Outlook", "blocks": [{"k": "li", "lvl": 0, "t": "By decomposing learners into these building blocks:"}, {"k": "li", "lvl": 1, "t": "we have a framework to better understand how they work,"}, {"k": "li", "lvl": 1, "t": "we can more easily evaluate in which settings they may be more or less suitable,"}, {"k": "li", "lvl": 1, "t": "and we can tailor learners to specific problems by the clever choice of each of the three components."}, {"k": "li", "lvl": 1, "t": "Getting this right takes a considerable amount of experience."}, {"k": "li", "lvl": 0, "t": "Next: Linear Regression!"}]}, {"id": "l1b-033", "n": 33, "title": "", "blocks": [{"k": "pic", "w": 1200, "h": 472, "wide": 0.9716444666186969, "a": "mlp-l1-5.webp", "x": 0, "y": 3557, "sw": 1202, "sh": 4029}]}];
LDATA.l2 = [{"id": "l2-001", "n": 1, "title": "CSAI 420: Machine Learning", "blocks": [{"k": "pics", "items": [{"k": "pic", "w": 208, "h": 176, "wide": 0.10833333532015482, "_y": 55.04998779296875, "a": "mlp-l2-5.webp", "x": 0, "y": 2396, "sw": 1425, "sh": 3168}, {"k": "pic", "w": 221, "h": 225, "wide": 0.11489696502685547, "a": "mlp-l2-5.webp", "x": 1202, "y": 2164, "sw": 1425, "sh": 3168}]}, {"k": "p", "t": "02a – Linear Regression"}]}, {"id": "l2-002", "n": 2, "title": "Recap", "blocks": []}, {"id": "l2-003", "n": 3, "title": "Three Types of Learning", "blocks": [{"k": "pic", "w": 1200, "h": 849, "wide": 0.653947909673055, "a": "mlp-l2-1.webp", "x": 0, "y": 1769, "sw": 1202, "sh": 3954}]}, {"id": "l2-004", "n": 4, "title": "Supervised Learning: We Know The Truth", "blocks": [{"k": "p", "t": "1. First, we collect a dataset of labeled training examples."}, {"k": "p", "t": "2. We train a model to output accurate predictions on this dataset."}, {"k": "p", "t": "3. When the model sees new, similar data, it will also be accurate."}, {"k": "pic", "w": 1200, "h": 332, "wide": 0.9613749980926514, "a": "mlp-l2-5.webp", "x": 0, "y": 702, "sw": 1425, "sh": 3168}]}, {"id": "l2-005", "n": 5, "title": "Supervised Learning: House Prices", "blocks": [{"k": "p", "t": "Consider a simple dataset for supervised learning: house prices in Boston."}, {"k": "li", "lvl": 0, "t": "Each datapoint is a house."}, {"k": "li", "lvl": 0, "t": "We know its price and the neighborhood’s education level"}, {"k": "pic", "w": 1200, "h": 471, "wide": 0.7993750015894572, "a": "mlp-l2-4.webp", "x": 0, "y": 2405, "sw": 1202, "sh": 4175}]}, {"id": "l2-006", "n": 6, "title": "Supervised Learning: The Algorithm", "blocks": [{"k": "p", "t": "We can use this dataset of examples to fit a supervised learning model."}, {"k": "li", "lvl": 0, "t": "The model maps input 𝑥(the education level) to output a 𝑦 (the house price)."}, {"k": "li", "lvl": 0, "t": "It learns the mapping from our dataset of examples (𝑥, 𝑦)."}, {"k": "pic", "w": 1200, "h": 446, "wide": 0.834343691666921, "a": "mlp-l2-4.webp", "x": 0, "y": 2878, "sw": 1202, "sh": 4175}]}, {"id": "l2-007", "n": 7, "title": "Summary", "blocks": [{"k": "li", "lvl": 0, "t": "At a high level, a supervised machine learning problem has the following structure:"}, {"k": "pic", "w": 860, "h": 117, "wide": 0.4478333314259847, "a": "mlp-l2-5.webp", "x": 0, "y": 2746, "sw": 1425, "sh": 3168}, {"k": "li", "lvl": 1, "t": "The predictive model is chosen to model the relationship between inputs and targets. For instance, it can predict future targets."}, {"k": "li", "lvl": 0, "t": "A supervised learner is a program or an algorithm which:"}, {"k": "li", "lvl": 1, "t": "receives a training set and,"}, {"k": "li", "lvl": 1, "t": "for a given class of models uses a cost function to evaluate different models on the data,"}, {"k": "li", "lvl": 1, "t": "then uses an optimization procedure to find the best model that minimizes the cost function."}]}, {"id": "l2-008", "n": 8, "title": "Linear Regression", "blocks": []}, {"id": "l2-009", "n": 9, "title": "Linear Regression", "blocks": [{"k": "li", "lvl": 0, "t": "Linear Regression is a simple and powerful model for predicting a numeric response from a set of one or more independent variables."}, {"k": "li", "lvl": 0, "t": "This lecture will focus mostly on how the method is used in machine learning, so we won't cover common use cases like causal inference or experimental design."}, {"k": "li", "lvl": 0, "t": "And although it may seem like linear regression is overlooked in modern machine learning's ever-increasing world of complex neural network architectures,"}, {"k": "li", "lvl": 1, "t": "the algorithm is still widely used across a large number of domains because it is effective, easy to interpret, and easy to extend."}, {"k": "li", "lvl": 1, "t": "The key ideas in linear regression are recycled everywhere, so understanding the algorithm is a must-have for a strong foundation in machine learning."}]}, {"id": "l2-010", "n": 10, "title": "Linear Regression", "blocks": [{"k": "li", "lvl": 0, "t": "Linear regression is a supervised algorithm"}, {"k": "li", "lvl": 1, "t": "that learns to model a dependent variable, 𝑦,"}, {"k": "li", "lvl": 1, "t": "as a function of some independent variables (aka \"features\"), 𝑥𝑖"}, {"k": "li", "lvl": 1, "t": "by finding a line (or surface) that best \"fits\" the data."}, {"k": "li", "lvl": 0, "t": "It is also known as Least Squares Estimation"}, {"k": "li", "lvl": 0, "t": "In general, we assume 𝑦 to be some number and each 𝑥𝑖 can be basically anything."}, {"k": "li", "lvl": 1, "t": "For example: predicting the price of a house using the number of rooms in that house (𝑦: price, 𝑥1​: number of rooms)"}, {"k": "li", "lvl": 1, "t": "or predicting weight from height and age (𝑦: weight, 𝑥1​: height, 𝑥2​: age)."}]}, {"id": "l2-011", "n": 11, "title": "Equation for Linear Regression", "blocks": [{"k": "li", "lvl": 0, "t": "In general, the equation for linear regression is"}, {"k": "p", "t": "𝑦= 𝛽0 + 𝛽1𝑥1 + 𝛽2𝑥2 + … + 𝛽𝑝𝑥𝑝+ 𝜖"}, {"k": "p", "t": "where:"}, {"k": "li", "lvl": 1, "t": "𝑦: the dependent variable; the thing we are trying to predict."}, {"k": "li", "lvl": 1, "t": "𝑥𝑘: the independent variables: the features our model uses to model 𝑦."}, {"k": "li", "lvl": 1, "t": "𝛽𝑘: the coefficients (aka \"weights\") of our regression model."}, {"k": "li", "lvl": 2, "t": "These are the foundations of our model."}, {"k": "li", "lvl": 2, "t": "They are what our model \"learns\" during optimization."}, {"k": "li", "lvl": 1, "t": "𝜖: the irreducible error in our model."}, {"k": "li", "lvl": 2, "t": "A term that collects together all the unmodeled parts of our data."}]}, {"id": "l2-012", "n": 12, "title": "Equation for Linear Regression", "blocks": [{"k": "li", "lvl": 0, "t": "In general, the equation for linear regression is"}, {"k": "p", "t": "𝑦= 𝛽0 + 𝛽1𝑥1 + 𝛽2𝑥2 + … + 𝛽𝑝𝑥𝑝+ 𝜖"}, {"k": "p", "t": "This model applies to each instant (sample) out of 𝑛 samples, that is"}, {"k": "pic", "w": 904, "h": 102, "wide": 0.47054166793823243, "a": "mlp-l2-5.webp", "x": 0, "y": 2979, "sw": 1425, "sh": 3168}, {"k": "p", "t": "Where 𝑥𝑘(𝑖) is the 𝑖th sample of the 𝑘th feature (input)"}, {"k": "pic", "w": 1200, "h": 112, "wide": 0.7000042637189229, "a": "mlp-l2-5.webp", "x": 0, "y": 2865, "sw": 1425, "sh": 3168}]}, {"id": "l2-013", "n": 13, "title": "Illustration", "blocks": [{"k": "pic", "w": 1200, "h": 872, "wide": 0.6381458282470703, "a": "mlp-l2-1.webp", "x": 0, "y": 895, "sw": 1202, "sh": 3954}]}, {"id": "l2-014", "n": 14, "title": "Inference", "blocks": [{"k": "li", "lvl": 0, "t": "In general, the equation for linear regression is 𝑦= 𝛽0 + 𝛽1𝑥1 + 𝛽2𝑥2 + … + 𝛽𝑝𝑥𝑝+ 𝜖"}, {"k": "li", "lvl": 0, "t": "Fitting a linear regression model is all about finding the set of coefficients 𝛽𝑘’s that best model 𝑦 as a function of our features."}, {"k": "li", "lvl": 1, "t": "We may never know the true parameters for our model, but we can estimate them (more on this later)."}, {"k": "li", "lvl": 0, "t": "Once we've estimated these coefficients,෢ 𝛽𝑘​, we predict future values, 𝑦̂​, as:"}, {"k": "pic", "w": 744, "h": 85, "wide": 0.38750537236531574, "a": "mlp-l2-5.webp", "x": 0, "y": 3083, "sw": 1425, "sh": 3168}, {"k": "li", "lvl": 1, "t": "So, predicting future values (often called inference), is as simple as plugging the values of our features 𝑥𝑘 into our equation!"}]}, {"id": "l2-015", "n": 15, "title": "House Prices: Missed Me?", "blocks": [{"k": "pic", "w": 1200, "h": 893, "wide": 0.6458333492279053, "a": "mlp-l2-1.webp", "x": 0, "y": 0, "sw": 1202, "sh": 3954}]}, {"id": "l2-016", "n": 16, "title": "Bad Performance!", "blocks": [{"k": "pic", "w": 1200, "h": 683, "wide": 0.6266979217529297, "a": "mlp-l2-1.webp", "x": 0, "y": 2620, "sw": 1202, "sh": 3954}, {"k": "li", "lvl": 0, "t": "Of course, we know this model is bad - the data doesn't fit the data well at all. But how can we quantify exactly how bad?"}, {"k": "li", "lvl": 0, "t": "To evaluate our model's performance quantitatively, we plot the error of each observation directly."}]}, {"id": "l2-017", "n": 17, "title": "Best Performance!", "blocks": [{"k": "li", "lvl": 0, "t": "The goal of linear regression is reducing this error such that we find a line/surface that 'best' fits our data. For our simple regression problem, that involves estimating"}, {"k": "pic", "w": 1200, "h": 532, "wide": 0.918541669845581, "a": "mlp-l2-3.webp", "x": 0, "y": 3268, "sw": 1202, "sh": 3800}, {"k": "li", "lvl": 0, "t": "For our specific problem, the best fit line is shown."}, {"k": "li", "lvl": 0, "t": "There's still error, sure, but the general pattern is captured well."}]}, {"id": "l2-018", "n": 18, "title": "Prediction", "blocks": [{"k": "li", "lvl": 0, "t": "Once we've fit our model, predicting future values is super easy!"}, {"k": "li", "lvl": 1, "t": "We just plug in any 𝑥𝑘 values into our equation!"}, {"k": "li", "lvl": 0, "t": "For our simple model, that means plugging in a value for sqft into our model"}, {"k": "pic", "w": 1200, "h": 431, "wide": 1.0, "a": "mlp-l2-4.webp", "x": 0, "y": 3326, "sw": 1202, "sh": 4175}]}, {"id": "l2-019", "n": 19, "title": "Nice! But How does this work?", "blocks": [{"k": "li", "lvl": 0, "t": "Now that we have a high-level idea of how linear regression works, let's dive a bit deeper."}, {"k": "li", "lvl": 0, "t": "How to evaluate regression models?"}, {"k": "li", "lvl": 0, "t": "How to find the \"best\" model?"}, {"k": "li", "lvl": 0, "t": "How to interpret different forms of regression models?"}, {"k": "li", "lvl": 0, "t": "So, Let’s dive in"}]}, {"id": "l2-020", "n": 20, "title": "Finding the Best Fit", "blocks": []}, {"id": "l2-021", "n": 21, "title": "Loss Functions", "blocks": [{"k": "li", "lvl": 0, "t": "To train an accurate linear regression model, we need a way to quantify how good (or bad) our model performs."}, {"k": "li", "lvl": 1, "t": "In machine learning, we call such performance-measuring functions loss functions. Several popular loss functions exist for regression problems."}, {"k": "li", "lvl": 0, "t": "To measure our model's performance, we'll use one of the most popular: mean- squared error (MSE)."}]}, {"id": "l2-022", "n": 22, "title": "Loss Function: MSE", "blocks": [{"k": "li", "lvl": 0, "t": "MSE quantifies how close a predicted value is to the true value, so we'll use it to quantify how close a regression line is to a set of points."}, {"k": "li", "lvl": 0, "t": "MSE works by squaring the distance between each data point and the regression line (the red residuals in the graphs above), summing the squared values, and then dividing by the number of data points"}, {"k": "li", "lvl": 0, "t": "The cost is higher when the model is performing poorly on the training set. The objective of the learning algorithm, then, is to find coefficients 𝛽0 𝑎𝑛𝑑 𝛽1 which give the minimum possible cost."}, {"k": "pic", "w": 1200, "h": 251, "wide": 0.6256978988647461, "a": "mlp-l2-5.webp", "x": 0, "y": 1911, "sw": 1425, "sh": 3168}]}, {"id": "l2-023", "n": 23, "title": "Illustration of MSE", "blocks": [{"k": "pic", "w": 1200, "h": 569, "wide": 0.7831354260444641, "a": "mlp-l2-2.webp", "x": 0, "y": 2475, "sw": 1202, "sh": 4167}]}, {"id": "l2-024", "n": 24, "title": "The MSE Loss", "blocks": [{"k": "li", "lvl": 0, "t": "To measure our model's performance, we'll use one of the most popular: mean-squared error (MSE)."}, {"k": "li", "lvl": 1, "t": "MSE quantifies how close a predicted value is to the true value, so we'll use it to quantify how close a regression line is to a set of points."}, {"k": "pic", "w": 1200, "h": 252, "wide": 0.62569793065389, "a": "mlp-l2-5.webp", "x": 0, "y": 1657, "sw": 1425, "sh": 3168}, {"k": "li", "lvl": 0, "t": "The name is quite literal: take the mean of the squared errors."}, {"k": "li", "lvl": 1, "t": "The squaring of errors prevents negative and positive terms from canceling out in the sum and gives more weight to points further from the regression line, punishing outliers."}, {"k": "li", "lvl": 1, "t": "In practice, we'll fit our regression model to a training data set and evaluate its performance using MSE on the test dataset."}]}, {"id": "l2-025", "n": 25, "title": "A Large MSE Loss", "blocks": [{"k": "pic", "w": 1200, "h": 542, "wide": 0.9636874596277872, "a": "mlp-l2-3.webp", "x": 0, "y": 1647, "sw": 1202, "sh": 3800}]}, {"id": "l2-026", "n": 26, "title": "Let’s Make it Smaller", "blocks": [{"k": "pic", "w": 1200, "h": 535, "wide": 0.9805833260218303, "a": "mlp-l2-3.webp", "x": 0, "y": 2731, "sw": 1202, "sh": 3800}]}, {"id": "l2-027", "n": 27, "title": "And Smaller..", "blocks": [{"k": "pic", "w": 1200, "h": 500, "wide": 0.9995656251907349, "a": "mlp-l2-4.webp", "x": 0, "y": 0, "sw": 1202, "sh": 4175}]}, {"id": "l2-028", "n": 28, "title": "Evaluation Metrics", "blocks": [{"k": "li", "lvl": 0, "t": "Many methods exist for evaluating regression models, each with different concerns around interpretability, theory, and usability."}, {"k": "li", "lvl": 0, "t": "The evaluation metric should reflect whatever it is you actually care about when making predictions."}, {"k": "li", "lvl": 0, "t": "For example, when we use MSE, we are implicitly saying that we think the cost of our prediction error should reflect the quadratic (squared) distance between what we predicted and what is correct."}, {"k": "li", "lvl": 0, "t": "This may work well if we want to punish outliers or if our data is minimized by the mean, but this comes at the cost of interpretability: we output our error in squared units (though this may be fixed with Root MSE RMSE)."}]}, {"id": "l2-029", "n": 29, "title": "So, we do it by hand?", "blocks": [{"k": "li", "lvl": 0, "t": "Let's recap what we've learned so far: Linear regression is all about finding a line (or surface) that fits our data well."}, {"k": "li", "lvl": 0, "t": "And as we just saw, this involves selecting the coefficients for our model that minimize our evaluation metric."}, {"k": "li", "lvl": 0, "t": "But how can we best estimate these coefficients? In practice, they're unknown, and selecting them by hand quickly becomes infeasible for regression models with many features. There must be a better way!"}, {"k": "li", "lvl": 0, "t": "Luckily for us, several algorithms exist to do just this. We'll discuss two: an iterative solution and a closed-form solution."}]}, {"id": "l2-030", "n": 30, "title": "The Iterative Method: Gradient Descent", "blocks": []}, {"id": "l2-031", "n": 31, "title": "The Magical Gradient Descent", "blocks": [{"k": "li", "lvl": 0, "t": "Gradient descent is an iterative optimization algorithm that estimates some set of coefficients to yield the minimum of a convex function. (What?!!)"}, {"k": "li", "lvl": 1, "t": "Put simply: it will find suitable coefficients for our regression model that minimize prediction error (remember, lower MSE equals better model)."}, {"k": "li", "lvl": 1, "t": "It will iteratively identify the coefficients our model needs to fit the data."}, {"k": "li", "lvl": 0, "t": "Let's see an example directly."}, {"k": "li", "lvl": 1, "t": "We'll fit data to our equation"}, {"k": "pic", "w": 325, "h": 85, "wide": 0.16922915776570638, "a": "mlp-l2-5.webp", "x": 746, "y": 3083, "sw": 1425, "sh": 3168}, {"k": "li", "lvl": 2, "t": "so gradient descent will learn two coefficients,"}, {"k": "li", "lvl": 3, "t": "𝛽0 (the intercept) and 𝛽1 ​(the weight/slope)."}]}, {"id": "l2-032", "n": 32, "title": "Some Magic!", "blocks": [{"k": "pic", "w": 1200, "h": 558, "wide": 1.0, "a": "mlp-l2-2.webp", "x": 0, "y": 3609, "sw": 1202, "sh": 4167}]}, {"id": "l2-033", "n": 33, "title": "One Step", "blocks": [{"k": "pic", "w": 1200, "h": 551, "wide": 0.9817708333333334, "a": "mlp-l2-3.webp", "x": 0, "y": 0, "sw": 1202, "sh": 3800}]}, {"id": "l2-034", "n": 34, "title": "7 More Steps", "blocks": [{"k": "pic", "w": 1200, "h": 544, "wide": 1.0, "a": "mlp-l2-3.webp", "x": 0, "y": 1101, "sw": 1202, "sh": 3800}]}, {"id": "l2-035", "n": 35, "title": "25 More.. Voila!", "blocks": [{"k": "pic", "w": 1200, "h": 538, "wide": 1.0, "a": "mlp-l2-3.webp", "x": 0, "y": 2191, "sw": 1202, "sh": 3800}]}, {"id": "l2-036", "n": 36, "title": "300 More Steps..", "blocks": [{"k": "pic", "w": 1200, "h": 546, "wide": 1.0, "a": "mlp-l2-3.webp", "x": 0, "y": 553, "sw": 1202, "sh": 3800}]}, {"id": "l2-037", "n": 37, "title": "Lines Versus Cost (For one variable ⇒ 1D)", "blocks": [{"k": "pic", "w": 1200, "h": 621, "wide": 0.8308645606040954, "a": "mlp-l2-2.webp", "x": 0, "y": 1278, "sw": 1202, "sh": 4167}]}, {"id": "l2-038", "n": 38, "title": "Cost Function in 2D", "blocks": [{"k": "pic", "w": 1200, "h": 647, "wide": 0.8525208075841267, "a": "mlp-l2-2.webp", "x": 0, "y": 0, "sw": 1202, "sh": 4167}]}, {"id": "l2-039", "n": 39, "title": "Linear Regression with One Variable", "blocks": [{"k": "pic", "w": 1200, "h": 473, "wide": 0.9493333299954733, "a": "mlp-l2-4.webp", "x": 0, "y": 981, "sw": 1202, "sh": 4175}]}, {"id": "l2-040", "n": 40, "title": "Getting Better", "blocks": [{"k": "pic", "w": 1200, "h": 473, "wide": 0.9689687530199687, "a": "mlp-l2-4.webp", "x": 0, "y": 1456, "sw": 1202, "sh": 4175}]}, {"id": "l2-041", "n": 41, "title": "And Better..", "blocks": [{"k": "pic", "w": 1200, "h": 477, "wide": 0.9360938012599945, "a": "mlp-l2-4.webp", "x": 0, "y": 502, "sw": 1202, "sh": 4175}]}, {"id": "l2-042", "n": 42, "title": "And Bingo!", "blocks": [{"k": "pic", "w": 1200, "h": 416, "wide": 0.9748437017202377, "a": "mlp-l2-4.webp", "x": 0, "y": 3759, "sw": 1202, "sh": 4175}]}, {"id": "l2-043", "n": 43, "title": "But How Does It Really Work?", "blocks": []}, {"id": "l2-044", "n": 44, "title": "Baby Gradient Descent", "blocks": [{"k": "pic", "w": 1200, "h": 649, "wide": 0.920199966430664, "a": "mlp-l2-1.webp", "x": 0, "y": 3305, "sw": 1202, "sh": 3954}]}, {"id": "l2-045", "n": 45, "title": "The Learning Rate", "blocks": [{"k": "pic", "w": 1200, "h": 627, "wide": 0.8682187676429749, "a": "mlp-l2-2.webp", "x": 0, "y": 649, "sw": 1202, "sh": 4167}]}, {"id": "l2-046", "n": 46, "title": "Learning rates", "blocks": [{"k": "pic", "w": 1200, "h": 359, "wide": 1.0, "a": "mlp-l2-5.webp", "x": 0, "y": 0, "sw": 1425, "sh": 3168}, {"k": "p", "t": "https://towardsdatascience.com/gradient-descent-algorithm-a-deep-dive-cf04e8115f21"}]}, {"id": "l2-047", "n": 47, "title": "Now Back to our 2D Linear Regression", "blocks": [{"k": "pic", "w": 985, "h": 312, "wide": 0.5133272012074789, "a": "mlp-l2-5.webp", "x": 0, "y": 1036, "sw": 1425, "sh": 3168}, {"k": "pic", "w": 1200, "h": 339, "wide": 0.8195416450500488, "a": "mlp-l2-5.webp", "x": 0, "y": 361, "sw": 1425, "sh": 3168}]}, {"id": "l2-048", "n": 48, "title": "Remember Partial Derivatives?", "blocks": [{"k": "pic", "w": 1200, "h": 561, "wide": 0.91730109055837, "a": "mlp-l2-2.webp", "x": 0, "y": 3046, "sw": 1202, "sh": 4167}]}, {"id": "l2-049", "n": 49, "title": "Now 2D Gradient Descent", "blocks": [{"k": "pic", "w": 1200, "h": 572, "wide": 0.9978229522705078, "a": "mlp-l2-2.webp", "x": 0, "y": 1901, "sw": 1202, "sh": 4167}]}, {"id": "l2-050", "n": 50, "title": "Gradient Descent: The Algorithm", "blocks": [{"k": "li", "lvl": 0, "t": "Our goal is to find the coefficients, 𝛽0 and 𝛽1​, to minimize the error function."}, {"k": "li", "lvl": 0, "t": "To do this, we'll use the gradient, which represents the direction that the function is increasing, and the rate at which it is increasing."}, {"k": "li", "lvl": 0, "t": "Since we want to find the minimum of this function, we can go in the opposite direction of where it's increasing."}, {"k": "li", "lvl": 1, "t": "That’s it!. Take steps in the direction opposite of where our error function is increasing, proportional to the rate of change."}, {"k": "li", "lvl": 0, "t": "To find the coefficients that minimize first, calculate the derivatives of our loss function, MSE:"}, {"k": "pic", "w": 768, "h": 170, "wide": 0.4000000317891439, "a": "mlp-l2-5.webp", "x": 0, "y": 2574, "sw": 1425, "sh": 3168}, {"k": "li", "lvl": 0, "t": "Repeat until converge:"}, {"k": "pic", "w": 644, "h": 172, "wide": 0.33541666666666664, "a": "mlp-l2-5.webp", "x": 210, "y": 2396, "sw": 1425, "sh": 3168}]}, {"id": "l2-051", "n": 51, "title": "Gradient Descent: Implementation", "blocks": [{"k": "li", "lvl": 0, "t": "Remember Gradient Descent:"}, {"k": "pic", "w": 1200, "h": 305, "wide": 0.6868021011352539, "a": "mlp-l2-5.webp", "x": 0, "y": 1350, "sw": 1425, "sh": 3168}, {"k": "li", "lvl": 0, "t": "For Linear Regression and using the MSE objective function, the gradient is given as"}, {"k": "pic", "w": 1200, "h": 230, "wide": 0.840749963124593, "a": "mlp-l2-5.webp", "x": 0, "y": 2164, "sw": 1425, "sh": 3168}]}, {"id": "l2-052", "n": 52, "title": "Next: Multi-Linear Regression", "blocks": [{"k": "p", "t": "References:"}, {"k": "li", "lvl": 0, "t": "Andrew NG’s ML Specialization"}, {"k": "li", "lvl": 0, "t": "University of Tübingen's ML Course"}, {"k": "li", "lvl": 0, "t": "Amazon’s Machine Learning University"}]}, {"id": "l2-053", "n": 53, "title": "", "blocks": [{"k": "pic", "w": 1200, "h": 472, "wide": 0.9716444666186969, "a": "mlp-l2-4.webp", "x": 0, "y": 1931, "sw": 1202, "sh": 4175}]}];
/* ===== why? notes for Lecture 1 — keyed by slide, matched to the line that starts with the given words ===== */
const WHY = {};
WHY['l1a-003'] = [['Machine learning is one of', 'This is the welcome slide: no exam point here, just what the course is about.']];
WHY['l1a-006'] = [['Machine learning also powers', 'Siri has to <b>understand speech</b> and <b>answer questions</b>. Nobody can write rules for every voice and every question, so it learns from examples. It is the "humans can\'t explain their expertise" case (slide 21).']];
WHY['l1a-007'] = [['We use it in Spam', 'A spam filter learns from emails people marked as spam; fraud detection learns what normal card use looks like and flags what is unusual (= "recognizing anomalies", slide 22).']];
WHY['l1a-010'] = [['Recommender Systems', 'Netflix / YouTube / Amazon learn from what you and similar people watched or bought to suggest the next thing.']];
WHY['l1a-014'] = [['“Machine learning is a field', 'The key words: <b>learn</b> = get better from examples (data); <b>explicitly programmed</b> = a human writes every rule by hand. ML = the computer finds the rules itself. Learn this sentence by heart: it is a classic exam definition.'], ['What does "learn"', 'The next slides answer this with the self-driving car example: rules (by hand) vs ML (from examples).']];
WHY['l1a-017'] = [['In practice, it\'s almost impossible', 'A pedestrian can be tall, short, sitting, half hidden, in the dark, holding an umbrella… you can never write rules for every case. That is the weakness of the rule-based approach.'], ['Disappointment in expert systems', 'Expert systems = programs made of hand-written rules. When they failed on real-world cases, money and interest in AI dropped: the "AI winter".']];
WHY['l1a-018'] = [['The machine learning approach', 'Instead of rules, we <b>show examples</b> (many pictures labeled "pedestrian", "car"…).'], ['No manual programming', 'This is exactly Samuel\'s "without being explicitly programmed".']];
WHY['l1a-020'] = [['It is very hard to write programs', 'We recognize a "2" instantly, but we can\'t explain the exact rule our brain uses, so we can\'t write it as code.'], ['Instead of writing a program by hand', 'This is the whole idea of supervised learning: examples of (input → correct output).'], ['A machine learning algorithm then takes', 'Learning algorithm + examples ⇒ a program (the model).'], ['It may contain millions of numbers.', 'Those numbers are the model\'s <b>parameters</b> (weights), found during training.'], ['If we do it right', '= the model <b>generalizes</b>: it works on new data, not only on the training examples.']];
WHY['l1a-021'] = [['Human expertise does not exist', 'No human has driven on Mars, so there is no expert to copy rules from: the robot must learn from data.'], ['Humans can’t explain their expertise', 'We all understand speech, but nobody can write down how.'], ['Models must be customized', 'Each patient is different: one model per person, learned from that person\'s data.'], ['Models are based on huge amounts of data', 'Genomics has far too much data for a human to analyse by hand.'], ['There is no need to “learn” to calculate payroll', 'Payroll is a fixed, known formula (salary − tax …). If the rule is known and simple, just program it: ML adds nothing.']];
WHY['l1a-022'] = [['Recognizing anomalies:', 'Anomaly = something that does not fit the usual pattern. The model learns what "normal" looks like and flags the rest.'], ['Prediction:', 'Predicting a future number from past data → this is regression (lecture 2).']];
WHY['l1a-023'] = [['Both statistics and machine learning', 'Same tool (a model built from data), different purpose.'], ['Statistics: use this as a tool to learn', 'Inference = draw conclusions about the world ("does smoking increase risk?"). So you need simple models you can interpret and guarantees.'], ['Machine learning: use this as a tool to actually make', 'ML only cares that the predictions are good, so it accepts complicated models that nobody can interpret.'], ['Use large datasets. Be pragmatic. Give up on inference.', '"Give up on inference" = ML doesn\'t try to explain why; it just predicts well.']];
WHY['l1a-024'] = [['Computational Power', 'GPUs made it possible to train huge models fast.'], ['Powerful Programming Frameworks', 'PyTorch, TensorFlow, Scikit-Learn: you don\'t write everything from zero (slide 43).'], ['Big Data available and growing', 'The internet, phones, sensors produce enormous amounts of data, and ML learns from data.']];
WHY['l1a-025'] = [['Model trained from data: as biased as the data itself', 'The model only knows what is in its data. If the data has few faces of minorities, it recognizes them less well. "Garbage in, garbage out".'], ['Predictive model may fail on slightly perturbated input', 'A tiny change (a sticker on a stop sign, a little noise) can make the model completely wrong.'], ['Non robust, hence non deployable', 'Robust = keeps working under small changes. If it is not robust, it is risky to use in real life.']];
WHY['l1a-028'] = [['1. First, we collect a dataset of labeled', 'Labeled = each example comes with the correct answer (the "truth"). That is why it is called supervised: the labels supervise the learning.'], ['2. We train a model', 'Training = adjusting the model\'s parameters so its predictions match the labels.'], ['3. When the model sees new', 'The goal is the new data, not the training data (generalization).']];
WHY['l1a-029'] = [['Each datapoint is a house.', 'One row of the data = one house = one example.'], ['We know its price and the neighborhood’s education level', 'Education level = the input x (feature). Price = the output y (label) we want to predict.']];
WHY['l1a-030'] = [['The model maps input', 'Map = a function: give it x, it returns a prediction of y.']];
WHY['l1a-032'] = [['1. Labeled Data:', 'Without labels you cannot do supervised learning (that would be unsupervised).'], ['2. Training Phase:', 'Loss function = a number that says how wrong the predictions are. Training makes it as small as possible.'], ['3. Evaluation:', 'We test on a <b>separate test set</b> the model never saw, to know if it generalizes (not just memorized).']];
WHY['l1a-033'] = [['Regression: if y ∈ ℝ', 'ℝ = real numbers: any value (price 1,234,567.8). Continuous output → regression.'], ['Classification: the label is a discrete', 'Discrete = one of a few categories (apartment / villa / house). Category output → classification.']];
WHY['l1a-035'] = [['Here, we have a dataset without labels.', 'No y at all: only inputs x. Nobody tells the model the right answer.'], ['Clusters hidden in the dataset.', 'Groups of similar points, e.g. types of customers.'], ['Outliers:', 'Points very different from the rest.'], ['Useful signal hidden in noise', 'Separate the voice (signal) from background noise without being told which is which.']];
WHY['l1a-036'] = [['The model defines a probability distribution', 'It estimates where points are likely to be. Several peaks = several groups (clusters) in the data.']];
WHY['l1a-037'] = [['In reinforcement learning, an agent', 'Agent = the learner that takes actions (a game player, a robot).'], ['The agent is taught good behavior through rewards', 'No labels: it tries actions and gets a reward (or penalty), and learns to choose actions that give more reward.']];
WHY['l1a-039'] = [['Yann LeCun: “Most of human and animal', 'Babies learn mostly by observing (no labels) → unsupervised = the big part (the cake). Some learning with labels → supervised = the icing. Learning by reward → reinforcement = just the cherry. Know which part is which!']];
WHY['l1a-041'] = [['AI is about building machines', 'AI = the big goal (intelligent machines).'], ['ML enables machines to learn from experience', 'ML = one way to reach AI: learning from data. So ML ⊂ AI.'], ['Deep learning focuses on a family', 'DL = neural networks with many layers. So DL ⊂ ML ⊂ AI.']];
WHY['l1a-042'] = [['2017 Kaggle survey', 'The chart shows that simple methods (logistic regression, decision trees) are still the most used at work, more than deep neural networks. Don\'t jump to deep learning first.']];
WHY['l1a-043'] = [['Automatic differentiation', 'The framework computes the derivatives (gradients) for you, which gradient descent needs (lecture 2).'], ['So you know what to do if something goes wrong!', 'If the model does not learn or gives nonsense, only someone who understands the theory can find the reason. That is why the course derives things by hand.']];
WHY['l1a-048'] = [['While attendance does not factor', 'Attendance is not graded, but below 75% = automatic fail.']];
WHY['l1a-051'] = [['predicting labels 𝑦 based on features 𝑦', 'Small typo in the slide: it means "predicting labels y based on <b>features x</b>".']];
WHY['l1b-008'] = [['For each patient we have access to measurements', 'Measurements = inputs x (features). Risk estimate = target y.'], ['At a high level, a supervised machine learning problem', 'Dataset + learning algorithm → predictive model. Memorize this picture: it is the structure of every supervised problem.']];
WHY['l1b-009'] = [['For each patient we have access to a measurement', 'Here we use only one feature: x = BMI, and y = the risk score (0–400).']];
WHY['l1b-011'] = [['We could assume that risk is a linear function', 'Linear = a straight line: y = θ₁x + θ₀.'], ['where 𝑥 is the BMI (also called the dependent variable)', '⚠ The slide swaps the names! x (BMI) is the <b>independent</b> variable (input); y (risk) is the <b>dependent</b> variable (it depends on x). Write it the correct way in the exam.'], ['Note that 𝜃1, 𝜃0 are the slope', 'θ₁ = slope (how much y changes when x increases by 1). θ₀ = intercept (y when x = 0). The model learns these two numbers: they are the parameters.']];
WHY['l1b-013'] = [['the goal of the supervised learning algorithm', 'Many lines are possible (previous slide). Learning = choosing the θ₀, θ₁ that fit the data best.']];
WHY['l1b-015'] = [['Given a new 𝑥̂', 'The hat ^ means "a new / predicted value". Plug the new BMI x̂ into the line to get the predicted risk ŷ.']];
WHY['l1b-019'] = [['We say that a training dataset of size n', 'n = number of examples (patients). Each example is a pair (input, target).'], ['Together, (𝑥𝑖, 𝑦𝑖) form a training example.', 'One patient\'s measurements + his risk = one training example.']];
WHY['l1b-020'] = [['In our example, it is the measurements', 'd = number of features (age, sex, BMI, blood pressure …). Each patient is a vector of d numbers.'], ['The set 𝑋 is called the feature space.', 'All possible inputs. With d real-valued features it is ℝᵈ.'], ['Note that these attributes in the above example', 'Mean-centered at zero and variance one = the data was standardized (that is why the ages look like small numbers around 0).']];
WHY['l1b-021'] = [['We call these custom attributes features.', 'Attribute = a raw measurement (age). Feature = something we build from attributes ("old man" = age high AND male).']];
WHY['l1b-022'] = [['Most learning algorithms can only deal with numerical features', 'They multiply and add numbers, so a category like "blood type A" must first be encoded as numbers.'], ['decision trees can use integers', 'A tree only asks yes/no questions ("is type = A?"), so it can use categories directly.']];
WHY['l1b-023'] = [['Regression: The target variable 𝑦 is continuous.', 'Fit a curve that follows the data.'], ['Classification: The target variable 𝑦 is discrete.', 'Find a boundary (hyperplane) that separates the classes.']];
WHY['l1b-024'] = [['Learning to predict', 'We only want good predictions (stock price), the model can be a black box.'], ['Learning to explain.', 'We want to understand the relationship (which risk factors matter), so the model must be interpretable.'], ['While ML was traditionally more interested in the former', 'Former = predicting (ML). Latter = explaining (statistics). Links to slide 23 of 01a.']];
WHY['l1b-025'] = [['A model class:', 'Which family of functions? e.g. all straight lines.'], ['An objective function', 'How do we measure good/bad? e.g. mean squared error.'], ['An optimizer', 'How do we find the best one? e.g. gradient descent (lecture 2).'], ['𝑓𝜃 is meant to capture intrinsic patterns', 'We assume the pattern in the training data also holds for new data; otherwise learning is useless.']];
WHY['l1b-026'] = [['we have to determine the class of our model a priori', 'A priori = before training. We choose "lines" or "polynomials" ourselves; the algorithm only picks the best one inside that family.'], ['there is a tradeoff between expressiveness', 'A richer class (complex models) can fit more shapes but the best model is harder to find and may overfit (lecture 5).']];
WHY['l1b-028'] = [['The algorithm for finding our 𝑓𝜃 is called the learner', 'Learner = learning algorithm = inducer: three names, same thing.'], ['To make this precise, we need to define now how we measure', 'Pointwise = for each training point, how far is the prediction from the true label. Adding these up gives the objective function.']];
WHY['l1b-029'] = [['Now to find the best model, we define an objective function', 'J(f) gives one number ≥ 0 for each model: the smaller, the better the fit.'], ['Examples of some popular objective functions', 'MSE squares each error (big errors count a lot). L1 takes the absolute error. The ½ in front of MSE just makes the derivative cleaner.']];
WHY['l1b-030'] = [['This is sometimes called empirical risk minimization', '"Empirical" = measured on our data; "risk" = the error. ERM = choose the model with the smallest error on the training data.']];
WHY['l1b-031'] = [['receives a training set and,', 'These four lines are the summary of the whole lecture: data → model class → cost function → optimizer. Typical essay question: "What does a supervised learner do?"']];
/* ===== why? notes for Lecture 2 ===== */
WHY['l2-009'] = [['Linear Regression is a simple and powerful model', 'Numeric response = the output y is a number (price, weight), so this is regression.'], ['the algorithm is still widely used', 'Exam point: it is still used because it is <b>effective, easy to interpret, and easy to extend</b>.']];
WHY['l2-010'] = [['Linear regression is a supervised algorithm', 'Supervised because every training example comes with its true y (label).'], ['that learns to model a dependent variable', 'Dependent = y depends on the inputs. Independent = the features xᵢ.'], ['by finding a line (or surface)', 'One feature → a line; two features → a plane; more → a hyperplane ("surface").'], ['It is also known as Least Squares Estimation', 'Because the "best" line is the one with the least sum of squared errors.']];
WHY['l2-011'] = [['𝑦: the dependent variable', 'The target we predict (e.g. house price).'], ['𝑥𝑘: the independent variables', 'The features (e.g. number of rooms, size).'], ['𝛽𝑘: the coefficients', 'Each βₖ says how much y changes when xₖ increases by 1 (others fixed). β₀ is the intercept.'], ['They are what our model "learns"', 'Training = finding the values of the β\'s.'], ['𝜖: the irreducible error', 'Noise: everything the features cannot explain. No model can remove it.']];
WHY['l2-012'] = [['This model applies to each instant', 'The same equation is written for every row (sample) i = 1 … n of the data.']];

      groups.forEach(([t, its0]) => { const its = its0.filter(pick); if (!its.length) return; sec.append(h('h2', {}, t)); its.forEach((it, i) => Item(sec, it, i + 1, 'practice')); });
    } else if (id === 'lab') {
      sec.append(headEl('All lectures together', 'Numerical problems', 'Every calculation that can come in the exam, with new numbers each time and the full step-by-step solution after you answer.'));
      sec.append(h('div', { class: 'box' }, h('div', { class: 'bt' }, 'The formulas you need'), h('p', { html: 'MSE = (1/n)Σ(y − ŷ)² · GD (exam convention): ∂J/∂β₀ = (1/n)Σ(h − y), ∂J/∂β₁ = (1/n)Σ(h − y)x, β ← β − α·∂J/∂β · Normal equation: β = (XᵀX)⁻¹Xᵀy, 2×2 inverse = (1/(ad − bc))[[d, −b],[−c, a]] · β₁ = Cov(x,y)/Var(x), β₀ = ȳ − β₁x̄ · Total error = Bias² + Var + σ² · σ(z) = 1/(1 + e^(−z)) · odds = p/(1 − p) · log-loss = −ln p̂ (y = 1), −ln(1 − p̂) (y = 0) · Precision = TP/(TP+FP), Recall = TP/(TP+FN), F1 = 2TP/(2TP+FP+FN).' })));
      CalcLab(sec);
    } else if (P) {
      sec.append(headEl(isReal ? 'Real NGU exam · CSAI 420' : 'Mock exam · same format as the real ones', P.title, P.sub));
      Paper(sec, P);
    } else if (id === 'mistakes') {
      sec.append(headEl('Review', 'Mistakes notebook', 'Every question you got wrong, in one place. A question leaves after you answer it right twice.'));
      const ids = store.get('mistakes', []).filter(x => REG[x]);
      if (!ids.length) sec.append(h('div', { class: 'banner ok' }, 'Empty. Nothing to redo right now.'));
      else { sec.append(h('p', {}, `${ids.length} question(s).`)); ids.forEach((x, i) => Item(sec, REG[x], i + 1, 'practice')); }
    }
    if (!lk) document.body.classList.remove('whyall');
    $$('#nav a').forEach(a => a.classList.toggle('cur', a.dataset.id === id)); sel.value = id; badge();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  const show = () => { const id = (location.hash || '#start').slice(1); render(secs.some(s => s.id === id) ? id : 'start'); };
  window.addEventListener('hashchange', show); show();
}

if(/github\.io$/.test(location.hostname))document.querySelectorAll(".backlink").forEach(a=>a.hidden=false);
bootML();

</script>
