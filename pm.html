items: [
  M('Traditional / waterfall project management is best described as:', ['Iterative and flexible', 'Linear, sequential, clear and predictable, completed in clear phases following a clear plan', 'Without any plan', 'Based on sprints'], 1),
  MS('Which are advantages of waterfall PM? (choose ALL the correct answers)', ['Clear and well structured', 'Usually on time and fast implementation', 'Easy to track', 'Big teams can use it', 'Changes are cheap'], [0, 1, 2, 3]),
  MS('Which are disadvantages of waterfall PM? (choose ALL the correct answers)', ['Requires very extensive planning', 'Changes are costly', 'Requires a professional team', 'Less flexibility to changes', 'More difficult for new projects', 'Cannot be tracked'], [0, 1, 2, 3, 4]),
  T('In waterfall project management, changes are easy and cheap to make at any stage.', false, 'False. Changes are costly and there is less flexibility to changes.'),
  T('Waterfall PM is easier for completely new projects that were never done before.', false, 'False. It is more difficult for new projects because it requires very extensive planning up front.'),
  // manifesto
  M('Which is a value of the Agile Manifesto?', ['Processes and tools over individuals and interactions', 'Individuals and interactions over processes and tools', 'Comprehensive documentation over working software', 'Following a plan over responding to change'], 1),
  MS('Which are the four values of the Manifesto for Agile Software Development? (choose ALL the correct answers)', ['Individuals and interactions over processes and tools', 'Working software over comprehensive documentation', 'Customer collaboration over contract negotiation', 'Responding to change over following a plan', 'Finishing on time over keeping within the budget'], [0, 1, 2, 3]),
  M('Which of the following is not one of the values from the Manifesto for Agile Software Development?', ['Individuals and interactions over processes and tools', 'Working software over comprehensive documentation', 'Customer collaboration over contract negotiation', 'Finishing on time over keeping within the budget', 'Responding to change over following a plan'], 3, 'Only four values exist; "finishing on time over keeping within the budget" is not one of them.', EXS),
  T('According to the Agile Manifesto, the items on the right (processes, documentation, contracts, plans) have no value at all.', false, 'False. "While there is value in the items on the right, we value the items on the left more."'),
  M('Agile Manifesto: "Customer collaboration over ___".', ['Following a plan', 'Contract negotiation', 'Comprehensive documentation', 'Processes and tools'], 1),
  M('Agile Manifesto: "Responding to change over ___".', ['Following a plan', 'Contract negotiation', 'Working software', 'Individuals and interactions'], 0),
  // 12 principles
  M('According to the 12 Agile principles, the highest priority is to:', ['Finish exactly on the planned date', 'Satisfy the customer through early and continuous delivery of valuable software', 'Write complete documentation', 'Minimize meetings'], 1),
  T('One of the 12 Agile principles: avoiding changing requirements so that the project can be completed on time and within budget.', false, 'False. The principle is the opposite: "Welcome changing requirements, even late in development. Agile processes harness change for the customer\'s competitive advantage."', EXS),
  T('One of the 12 Agile principles: Simplicity—the art of maximizing the amount of work not done—is essential.', true, 'True. That is principle 10.', EXS),
  M('Which of the following is not one of the 12 Agile principles?', ['Build projects around motivated individuals.', 'The most efficient and effective method of conveying information to and within a development team is a detailed email.', 'Working software is the primary measure of progress.', 'Agile processes promote sustainable development.', 'Business people and developers must work together daily throughout the project.'], 1, 'The principle says face-to-face conversation is the most efficient and effective method, not a detailed email.', EXS),
  M('According to the Agile principles, working software should be delivered:', ['Once at the end of the project', 'Frequently, from a couple of weeks to a couple of months, with a preference for the shorter timescale', 'Every year', 'Only after full documentation'], 1),
  M('According to the Agile principles, the primary measure of progress is:', ['The number of documents written', 'Working software', 'The money spent', 'The number of meetings'], 1),
  M('According to the Agile principles, the best architectures, requirements and designs emerge from:', ['The senior management', 'Self-organizing teams', 'External consultants', 'The contract'], 1),
  MS('Which of these are among the 12 Agile principles? (choose ALL the correct answers)', ['Business people and developers must work together daily throughout the project', 'Build projects around motivated individuals; give them the environment and support, and trust them', 'Agile processes promote sustainable development: a constant pace indefinitely', 'Continuous attention to technical excellence and good design enhances agility', 'At regular intervals, the team reflects on how to become more effective and adjusts', 'Requirements are frozen after the first month'], [0, 1, 2, 3, 4]),
  T('Agile processes promote sustainable development: sponsors, developers and users should be able to maintain a constant pace indefinitely.', true, 'True. Principle 8.'),
  // focus / characteristics
  MS('What is the focus of Agile? (choose ALL the correct answers)', ['Customer & output orientation', 'Flexibility & adaptability', 'Simplicity & efficiency', 'Results focused', 'People empowerment', 'Review & continuous improvement', 'Strict contracts'], [0, 1, 2, 3, 4, 5]),
  MS('Which are general characteristics of Agile approaches? (choose ALL the correct answers)', ['Project divided into sprints (parts, chunks, functionalities)', 'Emphasis on simplicity', 'Self-managing project teams', 'Progress measured in terms of working functionality', 'Progress measured by documents produced'], [0, 1, 2, 3]),
  T('In Agile, progress is measured in terms of working functionality.', true, 'True.'),
  // benefits / disadvantages
  MS('Which are benefits of Agile? (choose ALL the correct answers)', ['Higher customer satisfaction', 'Increased flexibility', 'Less waste on nonproductive work', 'Faster delivery of products', 'Higher quality and higher team morale', 'Easy to estimate time and cost exactly'], [0, 1, 2, 3, 4], 'Also: enhanced performance visibility and improved predictability of key project outcomes. Estimating time and cost is a disadvantage of Agile.'),
  MS('Which are disadvantages of Agile PM? (choose ALL the correct answers)', ['Difficulty to estimate time and cost', 'Flexibility to change scope will result in delays', 'Difficult with large teams', 'Requires organizational flexibility (culture)', 'Customer requirements can become unrealistic (need contractual limits)', 'Lower customer satisfaction'], [0, 1, 2, 3, 4]),
  T('Agile is easier to use with very large teams than waterfall.', false, 'False. Agile is difficult with large teams; big teams can use waterfall.'),
  T('Agile requires organizational flexibility (culture).', true, 'True. A rigid, time-restricted culture suits waterfall better.'),
  E('Describe in detail the difference between waterfall and Agile project management (pros vs cons).', '<b>Waterfall:</b> linear, sequential, clear phases following a clear plan. Pros: clear, well structured, usually on time, easy to track, suits big teams. Cons: very extensive planning, changes are costly, less flexible, needs a professional team, harder for new projects.<br><b>Agile:</b> project divided into sprints, self-managing teams, progress measured by working functionality, welcomes change. Pros: higher customer satisfaction, flexibility, faster delivery, higher quality and morale, less waste. Cons: hard to estimate time and cost, scope changes cause delays, difficult with large teams, needs a flexible culture, customer requirements may become unrealistic.', ['Waterfall: linear, clear plan and phases', 'Waterfall pros (structured, easy to track) and cons (changes costly, rigid)', 'Agile: sprints, flexibility, working functionality', 'Agile pros (satisfaction, speed) and cons (estimation, large teams, culture)']),
  E('List the four values of the Agile Manifesto.', '1. <b>Individuals and interactions</b> over processes and tools. 2. <b>Working software</b> over comprehensive documentation. 3. <b>Customer collaboration</b> over contract negotiation. 4. <b>Responding to change</b> over following a plan. While there is value in the items on the right, we value the items on the left more.', ['Individuals & interactions over processes & tools', 'Working software over documentation', 'Customer collaboration over contract negotiation', 'Responding to change over following a plan']),
  E('List the benefits of Agile.', 'Higher customer satisfaction; increased flexibility; less waste on nonproductive work; faster delivery of products; higher quality; higher team morale; enhanced performance visibility; improved predictability of key project outcomes.', ['Customer satisfaction & flexibility', 'Less waste & faster delivery', 'Higher quality & team morale', 'Performance visibility & predictability']),
  // when to use
  M('Which approach would you select for a new project you never did before?', ['Waterfall', 'Agile'], 1, 'New, unclear projects need flexibility: Agile. Waterfall is more difficult for new projects.'),
  M('Which approach would you select when requirements are clear and repetitive?', ['Waterfall', 'Agile'], 0),
  M('Which approach would you select when the client wants a standard implementation?', ['Waterfall', 'Agile'], 0),
  M('Which approach would you select for a project that is multi-functional and involves a high number of stakeholders (big teams)?', ['Waterfall', 'Agile'], 0, 'Agile is difficult with large teams; waterfall is well structured and big teams can use it.'),
  M('Which approach suits a rigid, time-restricted culture?', ['Waterfall', 'Agile'], 0, 'Agile requires organizational flexibility.'),
  M('Which approach suits a project that is strictly restricted in time and cost?', ['Waterfall', 'Agile'], 0, 'With Agile it is difficult to estimate time and cost, and changing scope causes delays.'),
  M('Developing a new generative AI tool is best managed with:', ['Waterfall', 'Agile'], 1, 'New, uncertain requirements → Agile.'),
  E('When is waterfall PM used and when is Agile used? Give examples.', '<b>Waterfall</b> when requirements are clear, repetitive or standard, the project is time- and cost-restricted, the team is big or multi-functional with many stakeholders, or the culture is rigid. Examples: implementing an ERP system by a standard method, an airline reservation system for a known process. <b>Agile</b> when the project is new or uncertain, requirements will change and the customer wants early, continuous delivery, with a small flexible team. Examples: a new application, a new generative AI tool, new software.', ['Waterfall: clear/standard requirements, fixed time & cost', 'Waterfall: big teams, rigid culture', 'Agile: new/uncertain projects, changing requirements', 'Correct example for each']),
]};
/* ---------- Week 2 · Managing Uncertainty & Risk ---------- */
LECT.p3 = { ln: 'W2U', name: 'Managing Uncertainty & Risk', covers: 'projects under uncertainty, types of uncertainty, can uncertainty be eliminated, the two major roles of the PM, eliminate / trade-off / minimize / accept, risk analysis, modelling risk, conditions for selecting projects, nonnumeric vs numeric methods',
items: [
  T('Projects are always carried out under conditions of uncertainty.', true, 'True. All projects are carried out under uncertainty, so effective PM requires an ability to deal with it.', EXS),
  T('Projects are complex and include interfaces, interdependencies, and many assumptions, any or all of which may turn out to be wrong.', true, 'True. This is why uncertainty is always present.', EXS),
  T('Uncertainty can be completely eliminated with good planning.', false, 'False. Uncertainty cannot be eliminated; if managed properly it can be managed and minimized.'),
  M('Can uncertainty be eliminated in projects?', ['Yes, with enough planning', 'No, but if managed properly it can be managed and minimized', 'Yes, by buying insurance', 'Only in Agile projects'], 1),
  MS('Which are uncertainties encountered in project management? (choose ALL the correct answers)', ['Time required to complete the project', 'Availability and cost of key resources', 'Timing of solutions to technological problems', 'Macroeconomic variables', 'The whims of clients', 'Actions taken by competitors'], [0, 1, 2, 3, 4, 5], 'All six are on the slide.'),
  M('"The whims of clients" is an example of:', ['A project goal', 'An uncertainty encountered in project management', 'A selection method', 'A budgeting method'], 1),
  M('One primary role of the project manager is to:', ['Do all the technical work', 'Effectively manage the trade-offs between cost, time, and scope', 'Approve the company\'s yearly budget', 'Hire all the employees'], 1),
  M('The second major role of the project manager is:', ['Writing code', 'Managing uncertainty', 'Selling the product', 'Accounting'], 1, 'Because projects are about uncertainty, managing uncertainty is the second major role.'),
  E('What are the two major roles of the project manager? Explain.', '1. <b>Managing the trade-offs between cost, time and scope</b>: the three goals are linked, so the PM balances them. 2. <b>Managing uncertainty</b>: projects are always carried out under uncertainty (time, resources, technology, economy, clients, competitors), so the PM identifies uncertainties and eliminates, trades off, minimizes or accepts them as risk.', ['Manage trade-offs between cost, time, scope', 'Manage uncertainty', 'Why: projects always uncertain / goals linked']),
  MS('When managing a list of uncertainties, each one can be: (choose ALL the correct answers)', ['Eliminated', 'Traded-off', 'Minimized', 'Accepted as risk', 'Ignored completely'], [0, 1, 2, 3]),
  M('The first step in managing risk is to:', ['Buy insurance', 'Identify potentially uncertain events and their likelihood of occurrence (risk analysis)', 'Cancel the project', 'Increase the budget'], 1),
  M('What is "risk analysis"?', ['Identifying potentially uncertain events and their likelihood of occurrence', 'Counting the project staff', 'Choosing the cheapest supplier', 'Writing the project charter'], 0),
  T('All organizations approach risk analysis in exactly the same way.', false, 'False. Different organizations approach this differently.'),
  M('The essence of risk analysis is to:', ['Avoid all risky projects', 'Make assumptions about key risk parameters and use models to evaluate the desirability of certain managerial decisions', 'Let the client decide', 'Reduce the team size'], 1),
  MS('Modelling risk involves: (choose ALL the correct answers)', ['Estimates/assumptions about the probability distributions of key parameters and variables', 'A mathematical model of the relationship between variables and outcomes of interest', 'Using the model to generate a distribution of outcomes for the decision maker', 'Guessing one fixed number without any model'], [0, 1, 2]),
  M('What do we get from risk modelling?', ['A guaranteed profit', 'Limits of variations, worst and best case scenarios for the project', 'The project charter', 'The WBS'], 1, 'Parameters such as variations in time, inflation and revenues (financial risk) are modelled.'),
  M('Which is an example of a risk parameter for financial risk?', ['Variations in time, inflation and revenues', 'The project name', 'The team\'s favorite tools', 'The number of meetings'], 0),
  MS('Which conditions should be considered when selecting projects to meet organizational objectives? (choose ALL the correct answers)', ['Is the project potentially profitable?', 'Is the project required?', 'Does the firm have the skills to complete it?', 'Does it involve building strategic competencies?', 'Does the firm have the capacity to carry it out?', 'Can it be economically successful?'], [0, 1, 2, 3, 4, 5]),
  M('Project selection methods are grouped into two types:', ['Short and long', 'Nonnumeric and numeric', 'Internal and external', 'Agile and waterfall'], 1, 'Nonnumeric: does not use numbers for evaluation. Numeric: uses numbers.'),
  E('What are the types of uncertainty in projects, and how can a PM deal with them?', 'Types: time required to complete the project; availability and cost of key resources; timing of solutions to technological problems; macroeconomic variables; the whims of clients; actions of competitors. Uncertainty cannot be eliminated completely, but it can be managed and minimized: for each uncertainty decide whether it can be <b>eliminated</b>, <b>traded-off</b>, <b>minimized</b> or <b>accepted as risk</b>. Start with risk analysis (identify uncertain events and their likelihood) and model the risk to get best/worst cases.', ['At least 4 types listed', 'Cannot be eliminated, only managed/minimized', 'Eliminate / trade-off / minimize / accept', 'Risk analysis & modelling']),
]};

/* ---------- Week 2B · The Manager, the Organization and the Team ---------- */
LECT.p4 = { ln: 'W2B', name: 'The Manager, the Organization & the Team', covers: 'PM as a profession (PMI, PMBOK), career path, fitting projects into the parent organization, pure project, functional project and matrix organizations (advantages and disadvantages, Figures 2-5 to 2-8), structure selection, PMO, selecting the project team, Tuckman ladder, intrateam conflict, conflict strategies (Figure 2-4), stress signs and control, understanding check',
items: [
  M('PMI stands for:', ['Project Management Institute', 'Project Monitoring Index', 'Planning Management International', 'Project Manager Interface'], 0, 'PMI has more than 447,000 members worldwide.'),
  M('PMI publishes:', ['The Agile Manifesto', 'The Project Management Body of Knowledge (PMBOK)', 'The Tuckman Ladder', 'Microsoft Project'], 1),
  T('Project management is a demanding job, and mastering its tools requires specialized knowledge.', true, 'True.'),
  M('What is the usual career path of a project manager?', ['Starts directly as manager of a megaproject', 'Works (not as manager) on a small project → larger projects → project engineer / deputy PM → PM of a small project → larger projects → may manage a megaproject', 'Starts as CEO', 'Starts as functional manager and never changes'], 1),
  T('Project managers usually decide how the project interfaces with the parent organization.', false, 'False. PMs rarely have any influence over it: it is company policy decided by senior management, but it has a major impact on the PM.'),
  // pure
  M('In which structure is the project a self-contained unit with its own manager and its own staff (marketing, R&D, finance … under each project manager)?', ['Functional', 'Pure project', 'Matrix', 'Mixed'], 1, 'Figure 2-5: Manager Project A and Project B each have their own departments.'),
  MS('Which are advantages of the pure project organization? (choose ALL the correct answers)', ['Effective and efficient for large projects', 'Resources available as needed', 'Broad range of specialists', 'Short lines of communication', 'Cheap for small projects'], [0, 1, 2, 3]),
  MS('Which are disadvantages of the pure project organization? (choose ALL the correct answers)', ['Expensive for small projects', 'Specialists may have limited technological depth (may lead to hiring consultants)', 'May require high duplication of certain specialties', 'Projectitis: if too long, the team becomes too attached', 'Slow communication outside the department'], [0, 1, 2, 3]),
  M('"Projectitis" means:', ['A disease of the budget', 'When a project lasts too long it takes on a life of its own and the team becomes too attached to it', 'Too many projects in the company', 'Conflicts between two bosses'], 1),
  // functional
  M('In which structure is the project placed inside one functional department (e.g. manufacturing)?', ['Pure project', 'Functional project', 'Matrix', 'PMO'], 1, 'Figure 2-6.'),
  MS('Which are advantages of the functional project organization? (choose ALL the correct answers)', ['Immediate, direct and complete contact with the most important technologies', 'Fractional resource problem minimized (people assigned part-time)', 'Projectitis minimal (always part of the parent organization)', 'Project always gets the highest priority'], [0, 1, 2]),
  MS('Which are disadvantages of the functional project organization? (choose ALL the correct answers)', ['Lines of communication outside the functional department can be slow', 'Technological breadth can be missing', 'Project rarely given high priority', 'Projectitis is very high'], [0, 1, 2]),
  T('In a functional project organization, projectitis is usually severe.', false, 'False. Projectitis is minimal because the project always stays part of the parent organization.'),
  // matrix
  M('In which structure do project managers share people from the functional departments (e.g. PM1 uses 3 people from manufacturing, 1½ from marketing)?', ['Pure project', 'Functional', 'Matrix', 'Mixed'], 2, 'Figure 2-7.'),
  MS('Which are advantages of the matrix organization? (choose ALL the correct answers)', ['Flexibility to access all of the parent organization\'s technology', 'Can tap resources from all functional areas', 'Less duplication of expertise', 'Strong focus on the project', 'Resources maximized and cost optimized', 'Team members have one boss only'], [0, 1, 2, 3, 4]),
  MS('Which are problems of the matrix organization? (choose ALL the correct answers)', ['Team members have 2 bosses / 2 lines of command', 'The PM may have no direct reports', 'Team loyalty may be limited, so morale must be maintained', 'Intrateam conflicts are higher', 'There is no contact with functional groups'], [0, 1, 2, 3]),
  T('The smaller the project, the more likely it is to be organized as a weak (functional) matrix.', true, 'True. This structure is also often selected for lack of resources.'),
  T('Intrateam conflicts are minimal in a matrix organization.', false, 'False. Matrix projects have lots of conflict: team members have two bosses (conflict on time and activities).', { src: 'Understanding check (Week 2B / 4A)' }),
  T('Contact with functional groups in a matrix organization minimizes projectitis.', true, 'True. The team is not detached from the parent organization.'),
  // selection of structure
  M('Which project structure is the best?', ['Pure project', 'Functional', 'Matrix', 'There is no best structure that fits all; it depends on many variables'], 3, 'Matrix structures are the most used, but there is NO best structure.'),
  MS('Which variables does the choice of project structure depend on? (choose ALL the correct answers)', ['Project complexity & size', 'Budget', 'Nature of the business', 'Size of the organization', 'Number of projects', 'Resources availability'], [0, 1, 2, 3, 4, 5]),
  M('Which structure is the most used?', ['Pure project', 'Functional', 'Matrix', 'None'], 2),
  T('Matrix, pure project, and functional project organizations may exist in the same company.', true, 'True. This is a mixed organizational system (Figure 2-8: Project M and Project Z next to Finance, Engineering, Manufacturing, Legal).', { src: 'Understanding check (Week 2B / 4A)' }),
  E('Describe in detail the difference between the pure project, functional and matrix organizations (pros vs cons).', '<b>Pure project:</b> self-contained unit with its own staff. Pros: efficient for large projects, resources available, broad specialists, short communication lines. Cons: expensive for small projects, limited technological depth, duplication, projectitis.<br><b>Functional:</b> project inside a functional department. Pros: direct contact with technologies, part-time people (fractional resources), minimal projectitis. Cons: slow communication outside the department, missing breadth, low priority.<br><b>Matrix:</b> PM uses people from functional departments. Pros: flexibility, access to all resources, less duplication, strong project focus, cost optimized. Cons: 2 bosses, PM has no direct reports, low loyalty, more intrateam conflict.', ['Pure: definition + pros + cons', 'Functional: definition + pros + cons', 'Matrix: definition + pros + cons', 'No best structure; depends on size, budget, resources…']),
  // PMO
  M('What is a Project Management Office (PMO)?', ['A functional group set up by the parent organization to handle budgeting, scheduling, reporting, scope, governance compliance and risk management for projects', 'The project manager\'s private room', 'A software tool', 'The client\'s office'], 0, 'The functional units supply the technical work; the PMO is also a repository for project documents and histories.'),
  T('The PMO often serves as a repository for project documents and histories.', true, 'True. Strategic management offices may also be set up to track strategic initiatives.'),
  // team
  MS('Which characteristics should project team members have? (choose ALL the correct answers)', ['Technically competent', 'Senior members politically sensitive', 'Strong problem-solving orientation', 'Strong goal orientation', 'High self-esteem', 'Avoid any risk'], [0, 1, 2, 3, 4]),
  M('The correct order of the Tuckman ladder is:', ['Forming → Norming → Storming → Performing', 'Forming → Storming → Norming → Performing', 'Storming → Forming → Performing → Norming', 'Norming → Forming → Storming → Performing'], 1),
  T('Most human resources come to the project on temporary assignment from the functional departments of the organization.', true, 'True.', { src: 'Understanding check (Week 2B / 4A)' }),
  T('The functional manager has expertise in the function he or she manages, but the project manager rarely has expertise in many of the project\'s technical areas.', true, 'True. The PM is a generalist who coordinates specialists.', { src: 'Understanding check (Week 2B / 4A)' }),
  T('Project managers rarely need to deal with conflict.', false, 'False. Projects are characterized by conflict, especially matrix projects.', { src: 'Understanding check (Week 2B / 4A)' }),
  T('The sources of conflict are the same in every stage of the project life cycle.', false, 'False. Sources of conflict differ when the project is in different stages of its life cycle.'),
  MS('Which are the four common threads for reducing or preventing intrateam conflict? (choose ALL the correct answers)', ['Careful project planning', 'Participative management', 'Interaction and negotiation between the PM and the functional manager', 'Communication between the PM and all stakeholders', 'Removing the functional managers'], [0, 1, 2, 3]),
  M('In Figure 2-4, the strategy that is both assertive and cooperative is:', ['Competing', 'Avoiding', 'Collaborating', 'Accommodating'], 2),
  M('In Figure 2-4, "assertive but uncooperative" is:', ['Competing', 'Accommodating', 'Avoiding', 'Collaborating'], 0),
  M('In Figure 2-4, "unassertive and uncooperative" is:', ['Avoiding', 'Compromising', 'Collaborating', 'Competing'], 0),
  M('In Figure 2-4, "unassertive but cooperative" is:', ['Accommodating', 'Competing', 'Avoiding', 'Collaborating'], 0),
  M('Which conflict strategy sits in the middle of Figure 2-4?', ['Compromising', 'Avoiding', 'Competing', 'Collaborating'], 0),
  MS('Which are signs of excessive stress in the workplace? (choose ALL the correct answers)', ['Inability to switch off work issues', 'Disturbed sleep', 'Lack of pleasure in non-work leisure activities', 'Difficulty concentrating or making decisions', 'Tendency to anger quickly', 'Lack of energy'], [0, 1, 2, 3, 4, 5]),
  MS('Which are ways to keep stress under control? (choose ALL the correct answers)', ['Keep a journal', 'Prioritize all tasks', 'Give yourself time to unwind', 'After-work physical activities', 'Improve your physical surroundings', 'Become aware of the control you have', 'Work longer hours without breaks'], [0, 1, 2, 3, 4, 5]),
  E('How would you select your project team? What characteristics should members have?', '1. <b>Technically competent</b>. 2. Senior members <b>politically sensitive</b>. 3. A strong <b>problem-solving orientation</b>. 4. A strong <b>goal orientation</b>. 5. <b>High self-esteem</b>.', ['Technically competent', 'Politically sensitive (senior)', 'Problem-solving orientation', 'Goal orientation & high self-esteem']),
  E('Explain the strategies for dealing with conflict (Figure 2-4).', 'The figure has two axes: <b>assertive ↔ unassertive</b> (concern for own goals) and <b>uncooperative ↔ cooperative</b> (concern for the other side). <b>Competing</b> = assertive, uncooperative (I win, you lose). <b>Collaborating</b> = assertive, cooperative (win-win, find the 3rd alternative). <b>Avoiding</b> = unassertive, uncooperative (withdraw). <b>Accommodating</b> = unassertive, cooperative (give in). <b>Compromising</b> = the middle (both give up something).', ['Two axes: assertive & cooperative', 'Competing & collaborating', 'Avoiding & accommodating', 'Compromising in the middle']),
]};
/* ---------- Week 3A · Categories of Projects & Selection Methods ---------- */
LECT.p5 = { ln: 'W3', name: 'Categories of Projects & Selection Methods', covers: 'derivative, platform, breakthrough and R&D projects, conditions for selecting projects, nonnumeric methods (sacred cow, operating/competitive necessity, comparative benefits, Q-sort), numeric methods (payback, discounted cash flow, options and opportunity costs, unweighted 0-1 and weighted scoring), sorting by elimination, plus the selection questions of Exercise Sheet I',
items: [
  M('Projects that are only incrementally different from existing offerings are:', ['Derivative projects', 'Platform projects', 'Breakthrough projects', 'R&D projects'], 0),
  M('Projects that are major departures from existing offerings ("the next generation") are:', ['Derivative projects', 'Platform projects', 'Breakthrough projects', 'R&D projects'], 1),
  M('Projects involving a newer technology, possibly a "disruptive" technology, are:', ['Derivative projects', 'Platform projects', 'Breakthrough projects', 'R&D projects'], 2),
  M('"Blue sky" or visionary endeavors are:', ['Derivative projects', 'Platform projects', 'Breakthrough projects', 'R&D projects'], 3),
  M('"Improve what we have → build the next generation → use a new technology → explore the unknown" corresponds to:', ['Derivative → Platform → Breakthrough → R&D', 'Platform → Derivative → R&D → Breakthrough', 'R&D → Breakthrough → Platform → Derivative', 'Derivative → Breakthrough → Platform → R&D'], 0),
  T('Projects with deliverables that are incrementally different from existing offerings are classified as platform projects.', false, 'False. These are derivative projects. Platform projects are major departures from existing offerings.', EXS),
  T('R&D projects are oriented toward using newly developed technologies or existing technologies in a new manner.', false, 'False. That describes breakthrough projects. R&D projects are "blue sky", visionary endeavors that explore the unknown.', EXS),
  T('The main distinction between platform and breakthrough projects is that the former usually depend on existing technology.', true, 'True. Platform projects are major departures (next generation) using existing technology; breakthrough projects involve a newer (possibly disruptive) technology.', EXS),
  M('Rebus Inc. had success with its game a year ago. The publisher wants to revitalize sales by updating the graphics and releasing it for a new platform. This project is a(n):', ['Derivative project', 'R&D project', 'Platform project', 'Breakthrough project', 'Sacred cow project'], 0, 'Updating an existing product = incrementally different from the existing offering.', EXS),
  M('Ultor creates print advertisements for local businesses. Lately it has been undertaking multimedia projects that are new to it. Ultor is most likely accepting:', ['Derivative projects', 'R&D projects', 'Platform projects', 'Breakthrough projects', 'Sacred cow projects'], 3, 'Multimedia is a newer technology for a print company → breakthrough. (Not R&D: it is not a visionary "blue sky" exploration.)', EXS),
  M('"The planned outputs of these projects represent major departures from existing offerings in terms of the product/service itself or the process used to make and deliver it, or both."', ['Derivative project', 'R&D project', 'Blue-sky project', 'Breakthrough project', 'Platform project'], 4, 'Major departures from existing offerings = platform projects.', EXS),
  T('Projects success is not determined by the portfolio of projects in an organization.', false, 'False. Projects must be selected and balanced as a portfolio that meets the organization\'s objectives; the portfolio affects success.', EXS),
  // nonnumeric
  MS('Which are nonnumeric selection methods? (choose ALL the correct answers)', ['The sacred cow', 'The operating/competitive necessity', 'Comparative benefits', 'Q-sort', 'Payback period', 'Weighted factor scoring'], [0, 1, 2, 3]),
  M('Which of the following is a numeric project selection method?', ['Comparative benefits', 'Payback period', 'Q-sort method', 'Operating/competitive necessity', 'Sacred cow'], 1, 'Payback period is a financial (numeric) method; the others are nonnumeric.', EXS),
  M('A project suggested by a senior and powerful official, which is selected because of who proposed it, is a:', ['Sacred cow', 'Operating necessity', 'Breakthrough project', 'Derivative project'], 0),
  M('A project that must be done to keep the system running (e.g. repairing a flooded plant) is selected as:', ['Sacred cow', 'Operating necessity', 'Comparative benefits', 'Q-sort'], 1),
  M('A project needed to keep the firm\'s competitive position in the market is selected as:', ['Competitive necessity', 'Sacred cow', 'R&D', 'Payback'], 0),
  T('A project that is selected because it is necessary for continued operations exemplifies a sacred cow.', false, 'False. That is an operating necessity. A sacred cow is selected because a powerful senior official wants it.', EXS),
  T('The comparative benefits method is considered a nonnumeric project selection method.', true, 'True.', EXS),
  T('Rank-ordering the benefits of projects is easy even with 30 projects.', false, 'False. It is not difficult for a small number, but when the number exceeds 15 or 20 the difficulty rises rapidly; a Q-sort is a convenient way to handle it.'),
  M('When does rank-ordering projects become difficult, so a Q-sort is used?', ['With 2 or 3 projects', 'When the number of projects exceeds 15 or 20', 'Only with numeric data', 'Never'], 1),
  M('In a Q-sort, projects are first separated into:', ['Two groups: yes and no', 'Three subsets: good, fair and poor', 'Five groups by budget', 'Groups by department'], 1, 'If a set has more than 7–8 projects, divide it again (good plus / good minus). Then a committee ranks them and projects are approved by composite rank.'),
  E('Explain the steps of the Q-sort method.', '1. Separate the projects into <b>three subsets: good, fair and poor</b>, using the chosen (or instructed) criteria. 2. If there are <b>more than 7–8 projects in one set</b>, divide it into subsets (e.g. good plus and good minus). 3. The list is shared with a <b>committee</b> of judges for ranking, and projects are approved <b>in the order of their composite rank</b>.', ['Good / fair / poor', 'Divide sets larger than 7–8', 'Committee of judges ranks', 'Approve by composite rank']),
  // numeric
  MS('Which are financial assessment (numeric) methods? (choose ALL the correct answers)', ['Payback period', 'Discounted cash flow', 'Financial options and opportunity costs', 'Sacred cow'], [0, 1, 2]),
  MS('Which are scoring (numeric) methods? (choose ALL the correct answers)', ['Unweighted 0-1 factor method', 'Weighted factor scoring method', 'Q-sort', 'Comparative benefits'], [0, 1]),
  T('When using financial methods for selecting projects, the payback period is the simplest and best method to use.', false, 'False. Payback is the simplest, but not the best: it ignores the time value of money and the cash flows after the payback point.', EXS),
  T('A disadvantage of using scoring models rather than financial models for selecting projects is that they cannot include the project\'s profitability.', false, 'False. Profitability can be one of the factors in a scoring model, along with non-financial factors.', EXS),
  M('Which of the following criteria can be included in scoring models for selecting projects?', ['Potential profitability of the project', 'Potential impact on the firm\'s competitive position', 'The organization\'s ability to market the output of a project', 'All of the above can be included'], 3, 'Scoring models can include any factor, financial or not.', EXS),
  T('When using the weighted scoring model, the categories for each scale must be in equal intervals.', false, 'False. The scale categories do not have to be equal intervals.', EXS),
  T('As a rule of thumb, the number of factors included in a scoring model should be at least 10.', false, 'False. Keep the number of factors small; adding many more factors adds little to the decision.', EXS),
  M('In the unweighted 0-1 scoring model on the slide, projects A, B and C each got a count of 5. What does this show?', ['Project A is best', 'The 0-1 model cannot separate them: every factor counts the same, so a weighted model is needed', 'All projects must be rejected', 'Project C is best'], 1),
  M('Weighted scoring (weights: cost 20, timely completion 20, service quality 10, contractor relations 10, affordability 10, citizen satisfaction 25, county relations 5). Scores A = 1,2,2,3,2,1,2. What is A\'s weighted score?', ['145', '165', '210', '225'], 1, '20(1) + 20(2) + 10(2) + 10(3) + 10(2) + 25(1) + 5(2) = 20 + 40 + 20 + 30 + 20 + 25 + 10 = 165.'),
  M('Same weights. B = 2,3,1,3,1,2,2 and C = 3,1,3,2,1,3,2. Which option should be chosen?', ['A (165)', 'B (210)', 'C (225)', 'B and C tie'], 2, 'B = 40 + 60 + 10 + 30 + 10 + 50 + 10 = 210. C = 60 + 20 + 30 + 20 + 10 + 75 + 10 = 225 → choose C.'),
  E('Compare the unweighted 0-1 factor method and the weighted factor scoring method.', '<b>Unweighted 0-1:</b> list the factors; each project gets 1 (x) if it qualifies on a factor and 0 if not; count the x\'s. Simple, but every factor counts the same, so projects often tie (A, B, C all scored 5). <b>Weighted scoring:</b> each factor gets a weight that reflects its importance, each project is scored on a scale per factor, and the score × weight are summed; the highest total wins. It reflects priorities better and separates the options (C = 225 > B = 210 > A = 165).', ['0-1: qualify or not, count', '0-1: all factors equal → ties', 'Weighted: weight × score, sum', 'Weighted reflects importance / better ranking']),
  M('Before using selection methods, it helps to eliminate non-viable options using:', ['KPIs (not meeting key objectives), budget constraint and time limitation', 'The Tuckman ladder', 'Mind mapping', 'The RACI matrix'], 0, 'Sorting tip: eliminating non-viable options before the exercise helps in selecting.'),
  E('Describe in detail the difference between nonnumeric and numeric selection methods, with examples.', '<b>Nonnumeric</b> methods do not use numbers for evaluation: the sacred cow, operating/competitive necessity, comparative benefits (rank-ordering, Q-sort). They are simple and fast but subjective. <b>Numeric</b> methods use numbers: financial methods (payback period, discounted cash flow, financial options & opportunity costs) and scoring methods (unweighted 0-1, weighted factor scoring). They are more objective and comparable but need data and assumptions.', ['Nonnumeric: no numbers', 'Nonnumeric examples', 'Numeric: financial methods', 'Numeric: scoring methods']),
  // exercise sheet extras on the front end
  T('Recent research has found that the most effective support from top management during the project front end is adding resources to the project.', false, 'False. The most effective front-end support from top management is their involvement and commitment (e.g. setting clear goals and priorities and backing the project), not simply adding resources.', EXS),
]};
/* ---------- Week 4 · Project Planning ---------- */
LECT.p6 = { ln: 'W4', name: 'Project Planning', covers: 'the two extremes ("ready, fire, aim" vs "paralysis by analysis"), the 4D model, planning tools, project charter elements, elements of a proper project plan, the launch meeting and its results, WBS (purpose, levels, notes, extensions, template, predecessors), RACI matrix, mind mapping, Design Structure Matrix and rework, planning with Scrum (roles, artifacts, events), plus life-cycle questions of Exercise Sheet I',
items: [
  M('"Ready, fire, aim" (Tom Peters) and "paralysis by analysis" describe:', ['Two agile values', 'The two extremes of approaches to planning', 'Two budgeting methods', 'Two project structures'], 1, 'Too little planning vs too much analysis. We need the medium: "Ready, steady, go".'),
  M('The target approach to planning, the 4D model, is:', ['Define it, Design it, Do it, Develop it', 'Draw, Decide, Deliver, Discuss', 'Define, Delay, Do, Deliver', 'Design, Decide, Do, Document'], 0),
  MS('Which are planning tools in the slides? (choose ALL the correct answers)', ['Project charter', 'Project plan', 'Mind mapping', 'WBS', 'RACI matrix', 'Payback period'], [0, 1, 2, 3, 4]),
  MS('Which are elements of the project charter? (choose ALL the correct answers)', ['The statement of work', 'The business case / need', 'Key assumptions and key constraints', 'Customer requirements and high-level risks', 'Key milestones, a high-level budget and key stakeholders', 'The boundaries of the project (in/out of scope)', 'Daily scrum notes'], [0, 1, 2, 3, 4, 5], 'And approvals & signatures.'),
  T('The project charter should include approvals and signatures.', true, 'True ("Approvals & Signatures?" slide).'),
  M('Which document defines the boundaries of the project (what is in and out of scope) at a high level?', ['The project charter', 'The sprint backlog', 'The burndown chart', 'The DSM'], 0),
  MS('Which are elements of a proper project plan? (choose ALL the correct answers)', ['Change management process', 'Communication plan with stakeholders (meetings, reports)', 'Process for setting key characteristics of the deliverable (KPI)', 'Cost baseline', 'Human resources management plan', 'Plan for monitoring and improving work processes', 'Procurement guidelines, scope management, WBS, quality, risk, schedule baseline'], [0, 1, 2, 3, 4, 5, 6]),
  T('Establishing the cost baseline and the schedule baseline are elements of a proper project plan.', true, 'True.'),
  T('The first duty of the project owner and project manager after project approval is to prepare a business case.', false, 'False. The business case (the need) is prepared before approval as part of the charter. After approval the project should have a launch meeting and develop the project plan.', EXS),
  M('Once a project is approved, it should have:', ['A launch meeting', 'A retrospective', 'A Q-sort', 'An audit'], 0),
  MS('Before the launch meeting, the new PM should review the project objectives to: (choose ALL the correct answers)', ['Make sure he understands them', 'Identify important senior managers', 'Determine if anything is atypical', 'Fire the functional managers'], [0, 1, 2]),
  M('At the launch meeting, who introduces the project and who chairs the meeting?', ['The PM introduces it; the senior manager chairs', 'A senior manager introduces it; the PM chairs', 'The client does both', 'The scrum master does both'], 1),
  MS('What are the results of the launch meeting? (choose ALL the correct answers)', ['The project\'s scope is understood', 'Functional managers understand their responsibilities and commit to an initial task and resource plan', 'Potential benefits/risks to the organization outside the scope are noted', 'The final budget is spent'], [0, 1, 2]),
  T('As the project goes further into the execution stage, the PM\'s job becomes that of keeping the project on budget and schedule.', true, 'True. After planning, the PM\'s focus moves to monitoring and controlling cost and time.', EXS),
  T('There are three different life cycles along which projects progress from start to completion.', false, 'False. The textbook describes two life cycles: the common stretched-S shape (slow start, fast middle, slow end) and the J-shape (exponential, most progress at the end).', EXS),
  // WBS
  M('A primary purpose of the WBS is:', ['To choose the best project', 'To ensure that no task is overlooked', 'To calculate payback', 'To resolve conflicts'], 1, 'Inadequate up-front planning is a primary contributor to project failure; every task, however small, should be listed with its material and human resources.'),
  T('Inadequate up-front planning is a primary contributor to the failure of a project.', true, 'True.'),
  T('In a WBS, only the large tasks are listed; small tasks are left out to save time.', false, 'False. Every task, no matter how small, should be listed along with material and human resources.'),
  M('In the "Develop Website" WBS, "Project Planning", "Design Phase", "Content & Website Development", "Testing" and "Launching" are:', ['Level 1 tasks', 'Level 3 tasks', 'Sprint backlog items', 'RACI roles'], 0, 'Level 2 under Project Planning: consolidate requirements, prepare budget, develop & approve charter, develop project plan.'),
  M('At any given level of the WBS, the degree of detail of tasks should be:', ['Different for each task', 'Roughly at the same level', 'As detailed as possible only for the first task', 'Decided by the client'], 1),
  T('The breakdown of level 1 tasks can be delegated to someone who will carry out the level 2 tasks.', true, 'True.'),
  MS('The everyday WBS (deliverable oriented) can be extended with: (choose ALL the correct answers)', ['Estimates of resources for each task', 'Estimates of time for each task', 'Who has responsibility for each task', 'Sequence information for each task', 'The company\'s yearly profit'], [0, 1, 2, 3], 'This increases its orientation toward planning and administration.'),
  MS('Which columns appear in the WBS template? (choose ALL the correct answers)', ['Task #', 'Tasks', 'Immediate predecessor', 'Start and end', 'Estimated resources', 'Assigned to'], [0, 1, 2, 3, 4, 5]),
  M('Why is setting the right predecessors so important?', ['They decide the project name', 'They have a direct implication on the project duration', 'They decide the budget method', 'They replace the RACI matrix'], 1),
  T('The more predecessors you put, the shorter the project duration.', false, 'False. Duration is optimized the fewer predecessors you put: plan tasks in parallel rather than in series as much as possible.'),
  M('Why do team members sometimes add unnecessary predecessors?', ['To finish earlier', 'To give themselves more time, since they also work on other projects and responsibilities', 'Because Microsoft Project requires it', 'To reduce cost'], 1),
  // RACI
  M('The RACI matrix lists:', ['Projects in rows and budgets in columns', 'Project tasks from the WBS in rows and departments/individuals in columns', 'Risks in rows and probabilities in columns', 'Sprints in rows and days in columns'], 1, 'It helps organize the project team and manage resources.'),
  M('In the RACI matrix, the letters stand for:', ['Risk, Action, Cost, Impact', 'Responsible, Accountable, Consult, Inform', 'Review, Approve, Control, Implement', 'Resource, Activity, Constraint, Input'], 1),
  T('The RACI matrix helps organize the project team and manage resources.', true, 'True.'),
  // mind mapping
  M('Mind mapping is described as:', ['A financial selection method', 'A whole-brain, visual approach to planning that mirrors how the brain records and stores information', 'A budgeting tool', 'A conflict strategy'], 1),
  MS('Advantages of mind mapping: (choose ALL the correct answers)', ['Taps into the creative potential of multiple team members', 'Helps generate enthusiasm and involvement', 'Visual, mirrors how the brain stores information', 'Gives exact costs'], [0, 1, 2]),
  E('Explain how mind mapping works.', 'Start with a statement of the project goal/objectives. Tape a large sheet of paper on the wall or floor and write the goal in the center. Team members brainstorm the tasks needed to achieve the goal; major tasks branch off from the goal. Components are then broken down into more detailed tasks. Use pictures and images more than words.', ['Start with the project goal in the center', 'Team brainstorms tasks branching off', 'Break components into detailed tasks', 'Use pictures more than words']),
  // DSM
  M('The Design Structure Matrix (DSM) addresses:', ['Only the budget', 'Information flow as well as precedence relationships of tasks', 'Team stress', 'Project selection'], 1),
  M('In the DSM, an "X" marks ___ and an "O" marks ___.', ['Cost / time', 'Information flow / a potential rework situation', 'Risk / opportunity', 'A predecessor / a sprint'], 1, 'Shaded blocks = tasks to be completed concurrently.'),
  MS('Options to minimize or eliminate potential rework situations: (choose ALL the correct answers)', ['Change the sequence so potential rework situations move below the diagonal', 'Complete additional activities concurrently', 'Remove the PM', 'Ignore the information flow'], [0, 1], 'Doing activities concurrently is more complex and may require changing the physical location of the tasks.'),
  // Scrum
  T('With Agile, less planning is done than with traditional approaches.', false, 'False. No less planning is done with Agile; the emphasis is on the Agile Manifesto & principles (people, flexibility) instead of upfront planning that discourages changes.'),
  T('Scrum is the most popular Agile approach.', true, 'True. Scrum is a popular agile framework that started in software and spread to other fields.', EXS),
  M('Scrum is very good for managing:', ['Small one-day tasks', 'Large projects of "incremental" type', 'Only construction projects', 'Projects without customers'], 1, 'It breaks large complex projects into smaller ones, reviewing and adapting along the way (iterative incremental approach).'),
  MS('Which are advantages of Scrum? (choose ALL the correct answers)', ['Product delivered in sprints', 'Team works in unity and collaboration', 'Constantly delivers functioning products', 'Continuous feedback from the client', 'Review and adapt along the way; flexible in a changing environment', 'Feedback only at the end of the project'], [0, 1, 2, 3, 4]),
  M('Who represents the stakeholders (the voice of the customer) and is responsible for the product backlog?', ['The Scrum Master', 'The Product Owner', 'The Development Team', 'The functional manager'], 1),
  M('Who is the team facilitator (sometimes coach) who keeps reminding the team of Scrum rules?', ['The Product Owner', 'The Scrum Master', 'The client', 'The PMO'], 1),
  M('Who is responsible for developing the product in Scrum?', ['The Development Team', 'The Product Owner', 'The Scrum Master', 'Senior management'], 0),
  M('Which Scrum artifact contains the complete list of requirements, is a high-level plan with a roadmap and is evolving, almost never complete?', ['Sprint backlog', 'Product backlog', 'Product increment', 'Burndown chart'], 1),
  M('Which Scrum artifact is the part of the product backlog for the sprint in action, the real-time picture of the team\'s work?', ['Sprint backlog', 'Product backlog', 'Product increment', 'Project charter'], 0),
  M('The sum of the work completed during all the sprints completed to date is the:', ['Product increment', 'Sprint backlog', 'Product backlog', 'Burndown chart'], 0),
  M('A graphical representation of the amount of estimated remaining work is a:', ['Gantt chart', 'Burndown chart', 'Mind map', 'RACI matrix'], 1),
  MS('Which are Scrum events for project planning? (choose ALL the correct answers)', ['Sprint (with a goal)', 'Sprint planning meeting', 'Daily scrum', 'Sprint review', 'Sprint retrospective', 'Launch meeting'], [0, 1, 2, 3, 4]),
  M('The correct sequence of Scrum planning events (Fig. 3.12) is:', ['Daily scrum → Sprint planning → Sprint review → Retrospective', 'Sprint planning meeting → Daily scrum → Sprint review → Sprint retrospective', 'Sprint review → Daily scrum → Planning → Retrospective', 'Retrospective → Review → Planning → Daily scrum'], 1),
  E('Compare the product backlog and the sprint backlog.', '<b>Product backlog:</b> the complete list of requirements for the product; a high-level plan with a roadmap of all tasks and work items; evolving and almost never complete; owned by the product owner and updated as the team moves forward. <b>Sprint backlog:</b> the part of the product backlog for the sprint in action; the real-time picture of the work the team is doing and plans to complete in that sprint; each task has more detail.', ['Product backlog: complete list / roadmap', 'Product backlog: evolving, never complete', 'Sprint backlog: part for the current sprint', 'Sprint backlog: real-time, more detail']),
  E('List the elements of a project charter.', 'Statement of work; business case/need; key assumptions; key constraints; customer requirements; high-level risks; key milestones; a high-level budget; key stakeholders; boundaries of the project (in/out of scope); approvals & signatures.', ['Statement of work & business case', 'Assumptions & constraints', 'Requirements, risks, milestones, budget', 'Stakeholders, scope boundaries, approvals']),
  E('What is the WBS and why is it important? Give notes on building it.', 'The WBS breaks the project down into all its tasks (levels: level 1 major tasks, level 2 sub-tasks…). Its primary purpose is to ensure that no task is overlooked; inadequate up-front planning is a primary cause of failure. Every task, however small, is listed with its material and human resources. Notes: tasks at the same level should have about the same degree of detail; level 1 tasks can be delegated to whoever does level 2; it can be extended with resources, time, responsibility and sequence (predecessors). Fewer predecessors and parallel tasks shorten the duration.', ['Definition: breakdown of all tasks in levels', 'Purpose: no task overlooked', 'Same detail per level / delegation', 'Extensions: resources, time, responsibility, predecessors']),
]};

/* ---------- Week 6 · Budgeting the Project ---------- */
LECT.p7 = { ln: 'W6', name: 'Budgeting the Project', covers: 'why a budget, budgeting as forecasting, why project budgeting is difficult, top-down vs bottom-up budgeting, work element costing, overheads, impact of budget cuts, budgeting with Agile, basic budget forecasting (actual, zero, activity based), improving estimates (forms, learning curves), budget uncertainty and risk, revising budgets, budget tracking and variance, handling budget changes, factors and causes of change, risk simulation (Crystal Ball)',
items: [
  MS('Why do we need a project budget? (choose ALL the correct answers)', ['To obtain the needed resources', 'It is a plan for allocating organizational resources to project activities', 'It ties the project to the organization\'s aims and objectives', 'It is a tool to monitor and guide the project', 'It replaces the schedule'], [0, 1, 2, 3]),
  M('Budgeting is forecasting:', ['Only the total cost', 'What resources the project will require, what quantities, when they will be needed, and how much they will cost', 'The profit of the company', 'The number of sprints'], 1),
  T('Budgeting a project is easier than budgeting routine activities.', false, 'False. It is more difficult: projects are unique, often with no history, may be multi-year with cost escalations, etc.'),
  MS('Why is project budgeting difficult? (choose ALL the correct answers)', ['Projects are unique activities', 'No history to aid estimators (in many cases)', 'Multi-year projects with cost escalations (technology, materials, prices)', 'Organization tradition (overheads, legal issues, accounting idiosyncrasies)', 'Project managers see costs differently than accountants', 'Projects never use money'], [0, 1, 2, 3, 4]),
  M('Accountants treat costs ___, while project managers see costs differently.', ['Linearly', 'Randomly', 'Exponentially', 'In sprints'], 0),
  MS('Which are the budgeting methods in the slides? (choose ALL the correct answers)', ['Top-down budgeting', 'Bottom-up budgeting', 'Budgeting with Agile', 'Q-sort budgeting'], [0, 1, 2]),
  M('Top-down budgeting is based on:', ['Estimates from the people doing each task', 'The collective judgments and experiences of top and middle managers', 'The burndown chart', 'Random guesses'], 1, 'The overall cost is estimated by estimating the costs of major tasks.'),
  M('An advantage of top-down budgeting is:', ['More accurate detailed tasks', 'Accuracy of estimating the overall budget; errors in funding small tasks need not be individually identified', 'No risk of overlooking tasks', 'It involves all workers'], 1),
  M('A disadvantage of top-down budgeting is:', ['Risk of overlooking tasks', 'It allows the budget to be controlled by people who play little role in designing and doing the work', 'It is too detailed', 'It cannot estimate the total'], 1),
  M('In bottom-up budgeting:', ['Top managers set the total', 'The WBS identifies elemental tasks and those responsible for them estimate the resources', 'The client sets the budget', 'Only overheads are estimated'], 1),
  M('The advantage and disadvantage of bottom-up budgeting are:', ['Accurate overall total / no detail', 'More accurate in the detailed tasks / risk of overlooking tasks', 'Cheap / slow', 'Flexible / rigid'], 1),
  E('Describe in detail the difference between top-down and bottom-up budgeting (pros vs cons).', '<b>Top-down:</b> based on the collective judgments and experience of top and middle managers; the overall cost is estimated from the costs of major tasks. Pro: accurate overall budget, and errors in small tasks need not be identified one by one. Con: the budget is controlled by people who play little role in designing and doing the work. <b>Bottom-up:</b> the WBS identifies elemental tasks and the people responsible for them estimate the resources. Pro: more accurate in the detailed tasks. Con: risk of overlooking tasks. Top-down budgets are usually lower (managers optimistic, subordinates pessimistic).', ['Top-down: managers estimate major tasks', 'Top-down pros & cons', 'Bottom-up: WBS + task owners estimate', 'Bottom-up pros & cons (+ top-down usually lower)']),
  MS('Work element costing includes: (choose ALL the correct answers)', ['Fixed costs', 'Labor time and labor rate', 'Equipment time and equipment rate', 'Facilities and/or capital expenses', 'The CEO\'s salary bonus'], [0, 1, 2, 3]),
  M('Why does the PM construct a budget of direct costs?', ['Because indirect costs do not exist', 'It gives the information needed to manage the project without being confounded with costs over which he has no control', 'Because the law requires it', 'To hide overheads'], 1),
  T('Every firm charges overheads/indirect costs to project budgets with the same universal rule.', false, 'False. Every firm has its own rules; indirect costs may differ by type of project, usually by criteria from finance teams or laws.'),
  M('Which budget is usually higher: top-down or bottom-up?', ['Top-down', 'Bottom-up', 'They are always equal', 'It depends only on the client'], 1, 'Top-down budgets are usually lower: the job always looks easier, faster and cheaper to the manager. Managers are optimistic, subordinates pessimistic.'),
  MS('How is the difference between top-down and bottom-up budgets resolved? (choose ALL the correct answers)', ['The subordinate explains the reality of the task', 'Both parties search for efficiencies', 'The remaining difference is resolved depending on the type of project', 'The manager\'s number is always accepted'], [0, 1, 2]),
  M('With traditional PM, the budget is based on ___; with Agile it is based on ___.', ['Velocity / fixed scope', 'A fixed scope defined at the beginning / cost of the scrum team per sprint, duration from the product backlog and team velocity, plus extra resources', 'Profit / loss', 'Last year\'s actuals / guesses'], 1),
  MS('Basic budget forecasting methods: (choose ALL the correct answers)', ['Actual-based budgeting', 'Zero-based budgeting', 'Activity/task-based budgeting', 'Sacred cow budgeting'], [0, 1, 2], 'For projects it is best to combine methods.'),
  T('For projects, it is best to combine budgeting methods and use each appropriately to get the best estimate.', true, 'True.'),
  MS('How can estimates and forecasts be improved? (choose ALL the correct answers)', ['Forms', 'Learning curves', 'Seek and re-apply knowledge from similar past projects', 'Remove the WBS'], [0, 1, 2]),
  MS('A form for project resource needs might include: (choose ALL the correct answers)', ['People: managers, technical and non-technical', 'Materials: facilities, equipment, tools, space', 'Special services: travel, training, others', 'Fixed expenses: contracts, licenses'], [0, 1, 2, 3]),
  MS('A resource-needs form might identify: (choose ALL the correct answers)', ['Person to contact', 'When needed', 'How many/much needed', 'Whether available'], [0, 1, 2, 3]),
  M('According to the learning curve, each time the total output doubles:', ['The hours per unit double', 'The worker hours per unit decrease by a fixed percentage of their previous value (the learning rate)', 'The cost stays the same', 'The team size halves'], 1),
  M('The learning curve formula is:', ['Tn = T1 · n^r, with r = log(learning rate) / log 2', 'Tn = T1 + r·n', 'Tn = T1 / n', 'Tn = n^T1'], 0),
  M('The first unit takes 100 hours and the learning rate is 80%. How long does the 4th unit take?', ['80 hours', '64 hours', '51.2 hours', '40 hours'], 1, 'Doubling: unit 2 = 80, unit 4 = 0.8 × 80 = 64 hours. (Formula: r = log 0.8 / log 2 = −0.322; 100 × 4^−0.322 = 64.)'),
  M('The first unit takes 100 hours, learning rate 80%. How long does the 8th unit take?', ['64 hours', '51.2 hours', '60 hours', '40.96 hours'], 1, '100 → 80 (2nd) → 64 (4th) → 51.2 (8th).'),
  M('The first unit takes 50 hours, learning rate 90%. How long does the 2nd unit take?', ['40 hours', '45 hours', '50 hours', '55 hours'], 1),
  MS('Budget uncertainty and project risk management — which are true? (choose ALL the correct answers)', ['The budget is an estimate made under uncertainty', 'Risk pervades all elements of a project', 'Risk is particularly an issue with performance, schedule and budgets', 'The budget is always certain'], [0, 1, 2]),
  M('In Figures 4-3 and 4-4, as the project progresses (t0 → t1 → t2), the uncertainty band around the estimated project cost:', ['Gets wider', 'Gets narrower, because more actual costs are known', 'Stays the same', 'Disappears at t0'], 1),
  M('If a change is confined to early elements of the project and will not impact the rest, the new budget is:', ['Old budget + changes', 'Actual costs to date + expected remaining costs', 'Accumulated costs × correction factor', 'Zero-based'], 0),
  M('For a change that impacts the rest of the project (a systemic change), the new budget is:', ['Old budget + changes', 'Accumulated costs to date + previous estimates of the rest × a correction factor for the systemic change', 'Actual costs to date only', 'The top-down estimate'], 1),
  M('For a change that impacts specific elements of the remaining tasks, the new budget is:', ['Actual costs to date + the expected costs for the remaining project tasks', 'Old budget + changes', 'Old budget × 2', 'Zero'], 0),
  M('In the budget table, direct costs are 3,000,000 + 750,000 + 500,000 + 150,000 = 4,300,000 EGP. Indirect costs are 30% of direct costs. They equal:', ['900,000', '1,290,000', '1,500,000', '430,000'], 1, '0.30 × 4,300,000 = 1,290,000.'),
  M('Contingency is 10% of salaries (3,000,000). Total budget = 4,300,000 + 1,290,000 + contingency =', ['5,590,000', '5,890,000', '6,190,000', '4,600,000'], 1, 'Contingency = 300,000 → 4,300,000 + 1,290,000 + 300,000 = 5,890,000.'),
  M('Total budget 5,890,000; actuals after 2 months 2,480,000. The remaining variance is:', ['3,410,000', '3,510,000', '2,480,000', '8,370,000'], 1),
  MS('Budget tracking should cover: (choose ALL the correct answers)', ['Commitments', 'Actual expenditures', 'Monthly variance analysis', 'Only the final total at the end'], [0, 1, 2], 'Budget & cash tracking may be required as the 3rd perspective; work closely with finance.'),
  M('The three perspectives on cost are:', ['Commitment, actual payment (expenditure) and cash', 'Fixed, variable and sunk', 'Top-down, bottom-up and Agile', 'Labor, equipment and facilities'], 0),
  M('The least preferred way to handle a negative budget change is:', ['Include provisions in the contract', 'Accept the change and take a loss', 'State assumptions', 'Divide the project into segments'], 1),
  M('The best approach to handling budget changes is:', ['Accept a loss', 'Prepare ahead of time by including provisions for such changes in the contract', 'Ignore them', 'Cut the scope silently'], 1),
